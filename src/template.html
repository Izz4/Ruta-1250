"hpe:Perú antiguo":{
  fuente:"Preguntas reales del banco (2023-I a 2026-I). Teoría redactada para Ruta 1250 con la periodificación de John Rowe que usa el CEPRE (horizontes e intermedios).",
  lee:[["Puro DECO · Historia del Perú (Drive)","https://drive.google.com/file/d/1tFcJZANH0FhRHh_lEo6-boYhnc_kFr4M/view"],["Apuntes digitales · Historia (Drive)","https://drive.google.com/drive/folders/1CPNjyGl4kCjNrirNOASabUXc-_dsInsF"]],
  bloques:[
  {id:"preinca",t:"Culturas preincas",ts:["Cultura recuay","Cultura recuay - cultura mochica","Culturas preincas"],
   obj:["Ordenar las culturas en la periodificación de Rowe.","Asociar cada cultura con su región, su centro y su rasgo distintivo.","Explicar las influencias entre culturas (Moche-Recuay, Nasca-Tiahuanaco-Wari)."],
   concepto:"Antes de los incas, los Andes vivieron una sucesión de culturas que se ordenan en horizontes (cuando una cultura se expande y unifica) e intermedios (cuando florecen culturas regionales): Chavín, los Desarrollos Regionales, Wari y los Estados regionales tardíos.",
   explica:[
    "Horizonte Temprano: Chavín (sierra de Áncash, aprox. 1200-200 a. C.). Para Julio C. Tello, «cultura matriz»: primera gran síntesis religiosa (templo de Chavín de Huántar, Lanzón, cabezas clavas, felino).",
    "Intermedio Temprano o Desarrollos Regionales (aprox. 200 a. C.-600 d. C.). Moche o Mochica (costa norte, La Libertad y Lambayeque): Huacas del Sol y de la Luna, Señor de Sipán, cerámica escultórica y pictórica, huaco retrato y botella de asa estribo; sociedad de sacerdotes guerreros. Nasca (costa sur, Ica): cerámica polícroma, líneas, acueductos subterráneos (puquios), centro ceremonial de Cahuachi. Recuay (Callejón de Huaylas, Áncash): heredera de Chavín, con centros como Wilkawaín y Pashash; galerías subterráneas; cerámica de caolín con decoración negativa; gobernada por sacerdotes guerreros, en guerra con los mochicas; adoptó la botella de asa estribo moche. Lima (Maranga, Pachacámac temprano).",
    "Horizonte Medio (aprox. 600-1000 d. C.): Wari (Ayacucho), considerado el primer imperio andino o segunda síntesis cultural. Se formó con aportes de Huarpa (local), Nasca (costa) y Tiahuanaco (altiplano). Ciudades planificadas y centros administrativos (Pikillacta en Cusco, Viracochapampa en La Libertad), caminos y depósitos.",
    "Intermedio Tardío o Estados regionales (aprox. 1000-1470): Chimú (costa norte; capital Chan Chan, la mayor ciudad de barro de América; orfebrería), Lambayeque o Sicán, Chancay (costa central; telares y cerámica negro sobre blanco), Chincha (comercio marítimo), Chachapoyas (fortaleza de Kuélap), Ichma (Pachacámac), chancas y collas.",
    "Clave de examen: te dan pistas de lugar y rasgos y debes identificar la cultura o su relación con otra. Asocia cada cultura con su región, su ícono y con quién se relacionó."],
   tabla:{t:"Periodificación de Rowe",cab:["Periodo","Culturas","Para recordar"],filas:[
    ["Horizonte Temprano","Chavín","Cultura matriz (Tello)"],["Intermedio Temprano","Moche, Nasca, Recuay, Lima","Desarrollos regionales"],["Horizonte Medio","Wari (y Tiahuanaco)","Primer imperio andino"],["Intermedio Tardío","Chimú, Chancay, Chincha, Chachapoyas","Estados regionales"],["Horizonte Tardío","Incas","Tahuantinsuyo"]]},
   claves:[["Chavín","Horizonte Temprano; «cultura matriz» según Tello; templo de Chavín de Huántar."],
     ["Moche o Mochica","Costa norte; Huacas del Sol y de la Luna, Señor de Sipán, huaco retrato y botella de asa estribo."],
     ["Recuay","Callejón de Huaylas; centro Wilkawaín; galerías subterráneas; guerra con los mochicas; adoptó el asa estribo."],
     ["Nasca","Costa sur; cerámica polícroma, líneas y puquios; influyó en Wari."],
     ["Wari","Horizonte Medio; primer imperio andino; aportes de Huarpa, Nasca y Tiahuanaco."],
     ["Chimú","Intermedio Tardío; capital Chan Chan, ciudad de barro."]],
   errores:["Ubicar a Wari en los Desarrollos Regionales: es Horizonte Medio.","Atribuir el asa estribo solo a Moche: Recuay la adoptó.","Confundir Kalasasaya (Tiahuanaco) con centros de la costa."],
   ejemplo:{id:"25I-65",pasos:[
     "Recuay se desarrolló en el Callejón de Huaylas (Áncash): su centro es Wilkawaín, no Chan Chan (Chimú) ni Pacopampa.",
     "Su cerámica muestra guerreros con cabezas trofeo: estuvo en conflicto con sus vecinos de la costa norte, los mochicas.",
     "Respuesta: Wilkawaín – mochicas (C)."],
     idea:"Ubica la cultura en el mapa y busca a sus vecinos: con ellos comercia o guerrea."},
   guiada:[
    {id:"26I-65",pistas:["¿Qué forma de cerámica es emblema de los mochicas?","Los keros son incas; Kalasasaya es de Tiahuanaco."],
     pasos:["Recuay tuvo contacto con Moche, su vecino de la costa.","La forma más típica de la cerámica moche es la botella de asa estribo, y Recuay la adaptó.","Respuesta E."],
     mal:{0:"Los incensarios no son el rasgo moche que Recuay adaptó.",1:"Kalasasaya es un templo de Tiahuanaco, no un diseño moche.",2:"Las galerías subterráneas son propias de Recuay, no las tomó de Moche.",3:"Los keros son vasos de madera incas."}},
    {id:"23I-65",pistas:["Wari está en Ayacucho. ¿Qué cultura de los Desarrollos Regionales estaba más cerca, en la costa sur?","Las otras opciones son de otro periodo o de otra región."],
     pasos:["Wari se formó con aportes de Huarpa, Tiahuanaco y Nasca.","Entre las opciones, la única de los Desarrollos Regionales cercana e influyente es Nasca (D)."],
     mal:{0:"Los yaros no son de los Desarrollos Regionales.",1:"Moche es de la costa norte, lejos de Ayacucho.",2:"Chavín es del Horizonte Temprano, no de los Desarrollos Regionales.",4:"Chimú es posterior (Intermedio Tardío)."}}],
   chequeo:[
    {q:"La capital del reino Chimú fue",o:["Pachacámac","Chan Chan","Kuélap","Cahuachi","Pikillacta"],a:1,e:"La mayor ciudad de barro de América."},
    {q:"Cultura del Horizonte Medio considerada el primer imperio andino",o:["Chavín","Wari","Moche","Chimú","Nasca"],a:1,e:"Se expandió desde Ayacucho."},
    {q:"El Señor de Sipán pertenece a la cultura",o:["Nasca","Moche","Chimú","Chavín","Lima"],a:1,e:"Tumba descubierta en Lambayeque en 1987."}],
   prac:[
    {q:"Los puquios o acueductos subterráneos son de la cultura",o:["Nasca","Chavín","Recuay","Chancay","Chachapoyas"],a:0,e:"Siguen funcionando en Ica."},
    {q:"La fortaleza de Kuélap pertenece a",o:["los chimú","los chachapoyas","los wari","los moche","los chancas"],a:1,e:"Amazonas, Intermedio Tardío."},
    {q:"Para Julio C. Tello, la «cultura matriz» andina fue",o:["Chavín","Caral","Wari","Tiahuanaco","Paracas"],a:0,e:"Horizonte Temprano."}]},
  {id:"inca",t:"El Tahuantinsuyo",ts:["El tahuantinsuyo"],
   obj:["Conocer la organización territorial y política del Tahuantinsuyo.","Distinguir mita, minka, ayni, mitimaes, yanaconas y acllas.","Explicar reciprocidad y redistribución."],
   concepto:"El Tahuantinsuyo fue el Estado inca, con capital en el Cusco y cuatro suyos. Su economía se basó en el ayllu, la reciprocidad entre familias y la redistribución que hacía el Estado con lo que producía el trabajo por turnos (mita).",
   explica:[
    "Territorio: cuatro suyos: Chinchaysuyo (norte), Collasuyo (sur), Antisuyo (selva, este) y Contisuyo (oeste, costa sur). Capital: el Cusco, «ombligo del mundo».",
    "Expansión: tras vencer a los chancas (hacia 1438), Pachacútec reorganizó el Estado e inició la expansión; la continuaron Túpac Yupanqui y Huayna Cápac. Luego vino la guerra civil entre Huáscar y Atahualpa, justo antes de la llegada de los españoles (1532).",
    "Sociedad: el Inca (Sapa Inca), la nobleza de sangre y de privilegio (los «orejones»), los curacas (jefes étnicos locales) y los hatun runa (población del común, organizada en ayllus). El ayllu era un grupo de familias unidas por parentesco y un territorio común.",
    "Trabajo y servidores: ayni (ayuda mutua entre familias), minka (trabajo colectivo para la comunidad), mita (trabajo por turnos para el Estado: caminos, ejército, cultivos estatales). Mitimaes o mitmaqkuna: grupos trasladados a otras regiones para colonizar o controlar. Yanaconas: servidores permanentes, desligados de su ayllu, al servicio de la élite. Acllas: mujeres escogidas que tejían y preparaban chicha para el Estado.",
    "El Estado almacenaba en colcas y redistribuía a cambio del trabajo recibido. Tierras: del Inca (Estado), del Sol (culto) y del ayllu. Infraestructura: el Qhapaq Ñan (red de caminos), tambos, chasquis y quipus (cuerdas para registrar datos, a cargo de los quipucamayoc)."],
   tabla:{t:"Formas de trabajo y servidores",cab:["Término","Qué es"],filas:[
    ["Ayni","Ayuda mutua entre familias del ayllu"],["Minka","Trabajo colectivo para la comunidad"],["Mita","Trabajo por turnos para el Estado"],["Mitimaes","Pueblos trasladados para colonizar o controlar"],["Yanaconas","Servidores permanentes de la élite, sin ayllu"],["Acllas","Mujeres escogidas al servicio del Estado"]]},
   claves:[["Mita","Trabajo por turnos para el Estado inca."],
     ["Mitimaes","Grupos trasladados a otras regiones para colonizar o controlar."],
     ["Yanaconas","Servidores permanentes de la élite, desligados de su ayllu."],
     ["Ayni y minka","Ayni: ayuda mutua entre familias. Minka: trabajo colectivo para la comunidad."],
     ["Reciprocidad y redistribución","Las familias dan trabajo; el Estado almacena en colcas y redistribuye."],
     ["Pachacútec","Venció a los chancas e inició la expansión del Tahuantinsuyo."]],
   errores:["Confundir mitimaes (trasladados) con mitayos (los que cumplen la mita).","Creer que los yanaconas tenían tierras en su ayllu: estaban desligados.","Pensar que la mita inca era igual a la mita colonial minera: la colonial fue explotación forzada para las minas."],
   ejemplo:{id:"24I-67",pasos:[
     "La pista: «criados privilegiados» reclutados de las provincias para servir a la élite.",
     "Mitayos cumplían turnos y volvían a su ayllu; mitimaes eran pueblos trasladados; orejones, la nobleza.",
     "Los servidores permanentes de la élite, desligados de su ayllu, eran los yanaconas (D)."],
     idea:"Servidor permanente = yanacona; trabajo por turnos = mita; pueblo trasladado = mitimae."},
   guiada:[],
   chequeo:[
    {q:"El trabajo obligatorio por turnos a favor del Estado inca era la",o:["minka","mita","ayni","yanaconaje","encomienda"],a:1,e:"Construcción de caminos, ejército, tierras del Estado."},
    {q:"Los grupos trasladados a otras regiones para colonizar y controlar eran los",o:["yanaconas","mitimaes","curacas","orejones","acllas"],a:1,e:"Mitmaqkuna."},
    {q:"La ayuda mutua entre familias del ayllu se llamaba",o:["ayni","mita","minka","quipu","tambo"],a:0,e:"Hoy por ti, mañana por mí."}],
   prac:[
    {q:"Los depósitos estatales donde se guardaban alimentos eran las",o:["colcas","huacas","tambos","acllahuasis","pucaras"],a:0,e:"Permitían redistribuir y prevenir hambrunas."},
    {q:"Inca que venció a los chancas e inició la expansión",o:["Manco Cápac","Pachacútec","Huáscar","Atahualpa","Huayna Cápac"],a:1,e:"Hacia 1438."},
    {q:"El jefe étnico local que servía de intermediario era el",o:["curaca","quipucamayoc","chasqui","tucuyricuc","aclla"],a:0,e:"Siguió existiendo en la Colonia como cacique."}]}
  ]},
"hpe:Virreinato y rebeliones":{
  fuente:"Preguntas reales del banco (2023-II a 2027-I). Teoría redactada para Ruta 1250 a partir del temario CEPRE 2026-II (Conquista y Virreinato).",
  lee:[["Puro DECO · Historia del Perú (Drive)","https://drive.google.com/file/d/1tFcJZANH0FhRHh_lEo6-boYhnc_kFr4M/view"],["Apuntes digitales · Historia (Drive)","https://drive.google.com/drive/folders/1CPNjyGl4kCjNrirNOASabUXc-_dsInsF"]],
  bloques:[
  {id:"virr",t:"Instituciones y economía del Virreinato",ts:["Virreinato","Virreinato del perú","Virreinato, organización política","Virreinato: instituciones","Virreinato: tierras"],
   obj:["Asociar cada institución colonial con su función.","Explicar las reformas del virrey Toledo.","Distinguir los impuestos coloniales y la composición de tierras."],
   concepto:"El Virreinato del Perú (creado en 1542) organizó el dominio español con instituciones en España y en América. Su economía giró en torno a la minería de plata, sostenida por el trabajo indígena (mita) y el tributo.",
   explica:[
    "En España: el Consejo de Indias (gobierno, leyes y justicia para América) y la Casa de Contratación de Sevilla (controlaba el comercio y la navegación).",
    "En el Perú: el virrey, alter ego del rey (gobernador, capitán general, presidente de la Real Audiencia). La Real Audiencia de Lima (1542), máximo tribunal de justicia. Los corregimientos: el corregidor de indios cobraba el tributo y abusaba del reparto forzoso de mercancías; fueron reemplazados por las intendencias en 1784 (reformas borbónicas). Los cabildos, gobierno municipal. El Tribunal del Consulado (1613) para el comercio y el Santo Oficio (1570).",
    "Caciques o curacas: autoridades indígenas al servicio del orden colonial; cobraban el tributo a su gente y aseguraban el envío de mitayos a las minas. No impartían justicia en nombre del rey.",
    "Francisco de Toledo (1569-1581), el gran organizador: reducciones de indios (pueblos al estilo español para controlar, cobrar y evangelizar), organización de la mita minera (Potosí, plata; Huancavelica, mercurio), tributo en dinero, cajas de comunidad (fondos para cubrir el tributo de quienes no podían pagar) y la Casa de la Moneda de Potosí para acuñar la plata. Ejecutó a Túpac Amaru I en 1572.",
    "Tierras e impuestos: la encomienda daba a un español el derecho a recibir tributo de un grupo de indios a cambio de evangelizarlos. La composición de tierras (desde 1591) legalizaba, mediante un pago a la Corona, las tierras usurpadas. Impuestos: alcabala (ventas), almojarifazgo (aduanas), quinto real (minería) y diezmo (para la Iglesia). Sociedad estamental: peninsulares, criollos, mestizos, indios, negros esclavizados y castas."],
   tabla:{t:"Instituciones coloniales",cab:["Institución","Función"],filas:[
    ["Consejo de Indias","Gobierno y leyes para América (en España)"],["Casa de Contratación","Comercio con América (Sevilla)"],["Virrey","Representante del rey"],["Real Audiencia","Máximo tribunal de justicia"],["Corregimiento → Intendencia (1784)","Gobierno provincial y cobro del tributo"],["Cabildo","Gobierno municipal"],["Cacique","Cobro del tributo indígena y envío de mitayos"]]},
   claves:[["Real Audiencia de Lima","Máximo tribunal de justicia del virreinato."],
     ["Francisco de Toledo","Reducciones, mita minera, tributo en dinero, cajas de comunidad y Casa de la Moneda de Potosí."],
     ["Intendencias","Reemplazaron a los corregimientos en 1784 (reformas borbónicas)."],
     ["Composición de tierras","Pago a la Corona para legalizar tierras usurpadas (desde 1591)."],
     ["Alcabala","Impuesto a las compraventas; el almojarifazgo era aduanero."],
     ["Cajas de comunidad","Fondos indígenas que cubrían las cuotas de tributo faltantes."]],
   errores:["Confundir la Real Audiencia (justicia) con el cabildo (gobierno municipal).","Atribuir la creación de las intendencias a Toledo: son borbónicas (1784).","Confundir alcabala (ventas) con almojarifazgo (aduanas) y diezmo (Iglesia)."],
   ejemplo:{id:"25II-66",pasos:[
     "I. V: el virrey era la máxima autoridad y representaba al rey.",
     "II. V: las intendencias reemplazaron a los corregimientos en 1784.",
     "III. V: la Real Audiencia de Lima era el máximo tribunal.",
     "IV. F: la sociedad colonial era estamental, con fuertes diferencias étnicas. Respuesta: VVVF (E)."],
     idea:"Las instituciones coloniales casi siempre son V; lo que suele ser F son las afirmaciones de igualdad o de autonomía indígena."},
   guiada:[
    {id:"25I-67",pistas:["Toledo quiere acuñar la plata de Potosí. ¿Qué institución acuña monedas?","El quinto real ya existía; la mita de faltriquera no se eliminó."],
     pasos:["Para impulsar la acuñación, se necesita una casa de moneda.","Toledo estableció la Casa de la Moneda de Potosí. Respuesta D."],
     mal:{0:"Un gremio de plateros no controla la acuñación estatal.",1:"El Banco de Rescate es posterior (siglo XVIII).",2:"La mita de faltriquera (pagar para no ir a la mina) no fue eliminada por Toledo.",4:"El quinto real ya existía antes; no fue creado por Toledo."}},
    {id:"27I-67",pistas:["El rey no castigó: cobró por reconocer la propiedad. ¿Cómo se llamaba ese pago?","Alcabala, diezmo y almojarifazgo son impuestos de otro tipo; el mayorazgo es una forma de herencia."],
     pasos:["Los españoles usurparon tierras comunales.","La Corona legalizó esa posesión a cambio de un pago: la composición de tierras (desde 1591). Respuesta D."],
     mal:{0:"La alcabala era el impuesto a las ventas.",1:"El diezmo era un impuesto para la Iglesia.",2:"El almojarifazgo era el impuesto aduanero.",4:"El mayorazgo era una forma de heredar bienes sin dividirlos."}}],
   chequeo:[
    {q:"El máximo tribunal de justicia del Virreinato del Perú era",o:["el cabildo","la Real Audiencia","el Consejo de Indias","el consulado","el corregimiento"],a:1,e:"Real Audiencia de Lima, creada en 1542."},
    {q:"El virrey que organizó las reducciones y la mita minera fue",o:["Blasco Núñez Vela","Francisco de Toledo","Amat","Abascal","Pedro de la Gasca"],a:1,e:"Gobernó de 1569 a 1581."},
    {q:"El impuesto a las compraventas era",o:["el diezmo","la alcabala","el almojarifazgo","el quinto real","la composición"],a:1,e:"Gravaba el comercio interno."}],
   prac:[
    {q:"Institución de Sevilla que controlaba el comercio con América",o:["Consejo de Indias","Casa de Contratación","Tribunal del Consulado","Real Audiencia","Cabildo"],a:1,e:"Creada en 1503."},
    {q:"En 1784 los corregimientos fueron reemplazados por",o:["las reducciones","las intendencias","las encomiendas","los cabildos","las audiencias"],a:1,e:"Parte de las reformas borbónicas."},
    {q:"La mina de mercurio, clave para refinar la plata, estaba en",o:["Potosí","Huancavelica","Cerro de Pasco","Castrovirreyna","Hualgayoc"],a:1,e:"El mercurio se usaba en la amalgama de la plata."}]}
  ]},
"gfa:Cartografía y fronteras":{
  fuente:"Preguntas reales del banco (2023-II a 2027-I). Teoría redactada para Ruta 1250 a partir del temario CEPRE 2026-II (semana 2: cartografía).",
  lee:[["Puro DECO · Geografía (Drive)","https://drive.google.com/file/d/1XBy7dsLMAXI05opaBpdV81ZClTlanqOQ/view"],["Apuntes digitales · Geografía (Drive)","https://drive.google.com/drive/folders/1B8uqtmjQSlv1YuFhwPIa1-66VrBsEoEw"]],
  bloques:[
  {id:"carto",t:"Mapas, escalas, coordenadas y fronteras",ts:["Cartografía","Fronteras","Líneas imaginarias"],
   obj:["Calcular con escalas numéricas y comparar escalas.","Resolver diferencias de latitud, longitud y hora.","Relacionar cada frontera del Perú con su tratado y sus ríos."],
   concepto:"La cartografía representa la Tierra en mapas: dibujos planos, reducidos y con signos convencionales. La escala dice cuánto se redujo la realidad; las coordenadas ubican cualquier punto; las fronteras delimitan el territorio.",
   explica:[
    "Elementos del mapa: título, escala, orientación (norte), leyenda con signos convencionales (el «lenguaje» del mapa), coordenadas y fuente. El detalle de los signos depende de la escala.",
    "Escala numérica 1:100 000 → 1 cm del mapa = 100 000 cm = 1 km real. Escala grande = denominador pequeño (1:10 000): más detalle, menos territorio (planos). Escala pequeña = denominador grande (1:50 000 000): menos detalle (mapamundi). Si la escala lineal se duplica (de 1:100 000 a 1:50 000), cada hoja cubre la cuarta parte del área: se necesitan 4 veces más hojas.",
    "La Carta Nacional del Perú (IGN) es un mapa topográfico de unas 500 hojas a escala 1:100 000: muestra el relieve con curvas de nivel (altimetría), profundidades (batimetría), ríos, vías y poblados (planimetría), nombres de lugares (topónimos) y una cuadrícula de coordenadas.",
    "Proyecciones: cilíndrica (Mercator; deforma las altas latitudes, útil para navegar), cónica (latitudes medias) y azimutal o plana (polos).",
    "Coordenadas: latitud, distancia en grados al Ecuador (0° a 90° N o S, se mide sobre meridianos y la marcan los paralelos); longitud, distancia al meridiano de Greenwich (0° a 180° E u O). Para diferencias: mismo hemisferio, se restan; hemisferios distintos, se suman. Husos horarios: 360° ÷ 24 h = 15° por hora; al este la hora está adelantada. El Perú usa UTC −5 (meridiano 75° O).",
    "Fronteras del Perú: Ecuador (Protocolo de Río de Janeiro, 1942; Acta de Brasilia, 1998), Colombia (Salomón-Lozano, 1922; río Putumayo), Brasil (Velarde-Río Branco, 1909; río Yavarí; es la frontera más larga), Bolivia (lago Titicaca y río Suches) y Chile (Tratado de Lima, 1929; el límite marítimo lo fijó la Corte de La Haya en 2014). Hoy se habla de espacios fronterizos: área (escala local: pasos y controles), zona y región de frontera, orientados al desarrollo y la integración."],
   tabla:{t:"Fronteras del Perú",cab:["País","Tratado","Río o hito"],filas:[
    ["Ecuador","Protocolo de Río (1942); Acta de Brasilia (1998)","Cordillera del Cóndor"],["Colombia","Salomón-Lozano (1922)","Putumayo"],["Brasil","Velarde-Río Branco (1909)","Yavarí"],["Bolivia","Tratados de 1902-1909","Lago Titicaca, río Suches"],["Chile","Tratado de Lima (1929)","Hito Concordia"]]},
   claves:[["Escala 1:100 000","1 cm del mapa equivale a 1 km en la realidad."],
     ["Escala grande y pequeña","Grande: denominador pequeño, más detalle. Pequeña: denominador grande, menos detalle."],
     ["Cambio de escala y número de hojas","Si la escala lineal se duplica, el número de hojas se multiplica por 4."],
     ["Diferencia de longitud y hora","Mismo hemisferio se restan, distinto se suman; 15° = 1 hora."],
     ["Carta Nacional","IGN, unas 500 hojas a 1:100 000; topográfica: curvas de nivel, batimetría, topónimos."],
     ["Ríos de frontera","Putumayo: Colombia. Yavarí: Brasil. Suches: Bolivia."]],
   errores:["Pensar que 1:1 000 000 es una escala grande: es pequeña.","Duplicar (no cuadruplicar) las hojas al duplicar la escala.","Restar longitudes de hemisferios distintos.","Confundir los ríos de frontera con Colombia y Brasil."],
   ejemplo:{id:"24II-72",pasos:[
     "Al pasar de 1:100 000 a 1:50 000, cada centímetro representa la mitad de distancia: la escala lineal se duplica.",
     "El área que cubre cada hoja se reduce a la cuarta parte (1/2 × 1/2).",
     "Se necesitan 4 veces más hojas: 500 × 4 = 2000 (A)."],
     idea:"Las escalas son lineales, pero las hojas cubren áreas: el factor se eleva al cuadrado."},
   guiada:[
    {id:"27I-70",pistas:["¿Cómo se llaman los íconos que reemplazan elementos de la realidad en un mapa?","¿Qué elemento del mapa permite calcular distancias reales?"],
     pasos:["Los íconos que representan ríos, ciudades o carreteras son los signos convencionales.","El detalle de esos signos depende de la escala, que además sirve para calcular distancias reales.","Respuesta: signos convencionales – escala (A)."],
     mal:{1:"La proyección no sirve para calcular distancias: es la forma de pasar la esfera al plano.",2:"La curva de nivel representa altitud, no permite calcular distancias por sí sola.",3:"La leyenda explica los signos y la línea geodésica no calcula distancias en el mapa.",4:"Las líneas imaginarias ubican puntos; no sirven para medir distancias en el mapa."}},
    {id:"26II-73",pistas:["El Putumayo separa al Perú de Colombia (tratado Salomón-Lozano).","El Yavarí está en la frontera amazónica con Brasil."],
     pasos:["Suches: río en la frontera con Bolivia → Ib.","Putumayo: frontera con Colombia → IIc.","Yavarí: frontera con Brasil → IIIa.","Respuesta: Ib, IIc, IIIa (C)."],
     mal:{0:"El Suches no es colombiano: está en la frontera con Bolivia.",1:"El Suches está en la frontera con Bolivia, no con Brasil.",3:"El Suches es boliviano y el Yavarí, brasileño.",4:"El Putumayo es frontera con Colombia y el Yavarí, con Brasil."}},
    {id:"23II-70",pistas:["A está al norte y B al sur; A al este y B al oeste: ¿se suman o se restan los grados?","Divide la diferencia de longitud entre 15 para obtener las horas."],
     pasos:["Latitud: 49° N y 1° S están en hemisferios distintos → 49 + 1 = 50°.","Longitud: 90° E y 60° O, hemisferios distintos → 90 + 60 = 150°.","Hora: 150 ÷ 15 = 10 horas. Respuesta C."],
     mal:{0:"Las longitudes de hemisferios distintos se suman: 90 + 60 = 150°, no 30°.",1:"La latitud también se suma: 49 + 1 = 50°, no 48°.",3:"No confundas latitud con longitud: la diferencia de longitud es 150°.",4:"Las longitudes se suman: 150°; y la latitud es 50°."}}],
   chequeo:[
    {q:"En un mapa a escala 1:250 000, 4 cm equivalen a",o:["1 km","4 km","10 km","25 km","40 km"],a:2,e:"1 cm = 2,5 km; 4 × 2,5 = 10 km."},
    {q:"¿Cuál es la escala más grande?",o:["1:1 000 000","1:250 000","1:100 000","1:50 000","1:10 000"],a:4,e:"Escala grande = denominador más pequeño."},
    {q:"El río Yavarí marca la frontera del Perú con",o:["Colombia","Brasil","Bolivia","Ecuador","Chile"],a:1,e:"Tratado Velarde-Río Branco (1909)."}],
   prac:[
    {q:"Si en Lima (75° O) son las 12:00, en Greenwich (0°) son las",o:["07:00","12:00","15:00","17:00","19:00"],a:3,e:"75 ÷ 15 = 5 horas; al este la hora está adelantada."},
    {q:"Las curvas de nivel de un mapa representan",o:["la temperatura","la altitud del relieve","la población","las lluvias","los límites"],a:1,e:"Unen puntos de igual altitud."},
    {q:"El tratado de límites con Colombia es el",o:["Salomón-Lozano","Velarde-Río Branco","Protocolo de Río","Tratado de Lima","Tratado de Ancón"],a:0,e:"1922."}]}
  ]},
"gfa:Geología y relieve":{
  fuente:"Preguntas reales del banco (2023-I a 2025-II). Teoría redactada para Ruta 1250 a partir del temario CEPRE 2026-II (semanas 3 a 5).",
  lee:[["Puro DECO · Geografía (Drive)","https://drive.google.com/file/d/1XBy7dsLMAXI05opaBpdV81ZClTlanqOQ/view"],["Apuntes digitales · Geografía (Drive)","https://drive.google.com/drive/folders/1B8uqtmjQSlv1YuFhwPIa1-66VrBsEoEw"]],
  bloques:[
  {id:"relieve",t:"Origen y formas del relieve peruano",ts:["Geomorfología peruana","Relieve peruano","Geodinámica interna","Geodinámica externa","Deriva continental"],
   obj:["Explicar la subducción y el origen de los Andes.","Reconocer las formas de relieve de cada región (submarino, costa, sierra, selva).","Distinguir procesos internos y externos del modelado."],
   concepto:"El relieve peruano nace de la subducción: la placa de Nazca, oceánica y más densa, se hunde bajo la Sudamericana. Ese choque levantó los Andes y causa sismos y volcanes; después, el agua, el viento y el hielo modelan las formas.",
   explica:[
    "Geodinámica interna: la placa de Nazca converge con la Sudamericana (borde convergente) y se hunde bajo ella (subducción). Resultado: la cordillera de los Andes, la fosa marina frente a la costa, sismos frecuentes y volcanes en el sur (Misti, Ubinas, Sabancaya).",
    "Relieve submarino: zócalo o plataforma continental (de 0 a 200 m de profundidad), talud continental (declive brusco y pronunciado, de 200 a 3000-4000 m, con cañones submarinos), fosa marina (de Lima, de Arica: más de 6000 m), dorsales y llanura abisal.",
    "Costa: desiertos (Sechura, el más extenso), tablazos (antiguas plataformas marinas levantadas: Talara, Máncora), pampas (Majes, La Joya), lomas (vegetación que vive de la neblina invernal: Lachay), dunas (arena acumulada por el viento), depresiones bajo el nivel del mar (Bayóvar, la más profunda) y albuferas (lagunas costeras separadas del mar por un cordón de arena, refugio de aves migratorias: Medio Mundo, Puerto Viejo).",
    "Sierra: cordilleras Occidental (Blanca, con el Huascarán, 6768 m, el punto más alto del Perú), Central y Oriental; mesetas como la del Collao; valles interandinos; cañones (Colca, Cotahuasi); abras o pasos (Ticlio). Selva alta: pongos (Manseriche). Selva baja: llanura amazónica, restingas (terrenos que no se inundan), tahuampas (zonas inundables), cochas (lagunas formadas por meandros abandonados de los ríos) y aguajales.",
    "Geodinámica externa: meteorización y erosión por agua (huaicos en quebradas sin vegetación), viento (formas eólicas: dunas, médanos) y hielo (morrenas y valles glaciares en U)."],
   tabla:{t:"Formas de relieve por región",cab:["Región","Formas clave"],filas:[
    ["Submarino","Zócalo, talud, fosa"],["Costa","Tablazos, pampas, lomas, dunas, depresiones, albuferas"],["Sierra","Cordilleras, mesetas, cañones, abras"],["Selva","Pongos, restingas, tahuampas, cochas"]]},
   claves:[["Subducción","La placa de Nazca (oceánica, más densa) se hunde bajo la Sudamericana: origina los Andes, sismos y volcanes."],
     ["Talud continental","Declive brusco del fondo marino, de 200 a 3000-4000 m de profundidad."],
     ["Albuferas","Lagunas costeras separadas del mar por un cordón de arena; refugio de aves migratorias."],
     ["Tablazos","Antiguas plataformas marinas levantadas en la costa norte (Talara, Máncora)."],
     ["Cochas","Lagunas de la selva baja formadas por meandros abandonados."],
     ["Restingas y tahuampas","Restinga: terreno de selva que no se inunda. Tahuampa: zona que sí se inunda."]],
   errores:["Llamar divergente al borde Nazca-Sudamericana: es convergente.","Confundir albufera (laguna costera) con bofedal (humedal altoandino).","Confundir cocha (selva) con depresión (costa)."],
   ejemplo:{id:"24I-71",pasos:[
     "Cocha: laguna fluvial de la selva baja formada por meandros → Id.",
     "Depresión: superficie hundida de la costa bajo el nivel del mar → IIc.",
     "Talud: declive brusco del fondo marino entre 200 y 3000 m → IIIb.",
     "Duna: arena transportada por el viento en el desierto → IVa. Respuesta: Id, IIc, IIIb, IVa (C)."],
     idea:"Ubica primero la región (selva, costa, mar) y el agente que la forma (río, viento)."},
   guiada:[
    {id:"23I-72",pistas:["Son lagunas costeras separadas del mar por un cordón de arena.","Los bofedales y occonales son humedales de la puna."],
     pasos:["Agua permanente o temporal, ligeramente salada, separada del mar por un cordón de arena, con aves migratorias.","Eso define a las albuferas (D)."],
     mal:{0:"Los manantiales son afloramientos de agua subterránea, no lagunas costeras.",1:"Los bofedales son humedales altoandinos.",2:"Los occonales son humedales de la puna, no costeros.",4:"«Lagunas» es demasiado general; la definición corresponde a un tipo específico: la albufera."}},
    {id:"24I-70",pistas:["Las placas chocan: ¿convergen o se separan?","¿Qué cordillera se formó en el borde occidental de Sudamérica?"],
     pasos:["Nazca y Sudamericana chocan: movimiento convergente.","La placa oceánica se hunde (subducción) y levanta el borde continental.","Así se originó la cordillera de los Andes. Respuesta A."],
     mal:{1:"No es divergente: las placas chocan, no se separan.",2:"«Ascendente» no es un tipo de movimiento de placas y las cuencas exorreicas no se forman así.",3:"La llanura amazónica no es producto directo del choque.",4:"Los Apalaches están en Norteamérica."}}],
   chequeo:[
    {q:"Las lagunas costeras separadas del mar por un cordón de arena son",o:["cochas","albuferas","bofedales","tahuampas","oasis"],a:1,e:"Ej.: Medio Mundo, Puerto Viejo."},
    {q:"El origen principal de la cordillera de los Andes es",o:["la erosión glaciar","la subducción de la placa de Nazca bajo la Sudamericana","la sedimentación del Amazonas","el vulcanismo submarino","la deriva divergente"],a:1,e:"Borde convergente."},
    {q:"Los terrenos de la selva baja que no se inundan son las",o:["restingas","tahuampas","cochas","aguajales","pampas"],a:0,e:"Las tahuampas sí se inundan."}],
   prac:[
    {q:"Antiguas plataformas marinas levantadas en la costa norte (Talara, Máncora)",o:["tablazos","pampas","lomas","dunas","albuferas"],a:0,e:"Hoy son mesetas costeras."},
    {q:"Vegetación costera que vive de la humedad de las neblinas invernales",o:["lomas","manglares","bofedales","pajonales","aguajales"],a:0,e:"Lomas de Lachay, por ejemplo."},
    {q:"La depresión más profunda del Perú es la de",o:["Bayóvar","Sechura","Majes","Ica","Paracas"],a:0,e:"En Piura, bajo el nivel del mar."}]}
  ]},
"gfa:Mar, aguas y clima":{
  fuente:"Preguntas reales del banco (2025-II y 2026-I). Teoría redactada para Ruta 1250 a partir del temario CEPRE 2026-II (semana 7: clima).",
  lee:[["Puro DECO · Geografía (Drive)","https://drive.google.com/file/d/1XBy7dsLMAXI05opaBpdV81ZClTlanqOQ/view"],["Apuntes digitales · Geografía (Drive)","https://drive.google.com/drive/folders/1B8uqtmjQSlv1YuFhwPIa1-66VrBsEoEw"]],
  bloques:[
  {id:"clima",t:"Clima del Perú y El Niño",ts:["Presión atmosférica","Fenómeno El Niño"],
   obj:["Distinguir tiempo y clima, elementos y factores.","Explicar la presión atmosférica y los vientos.","Describir causas y efectos del fenómeno El Niño en el Perú."],
   concepto:"El clima es el estado promedio de la atmósfera en un lugar durante muchos años; el tiempo es su estado en un momento. En el Perú, la corriente de Humboldt, los Andes y el anticiclón del Pacífico explican por qué la costa casi no tiene lluvias y por qué El Niño la altera tanto.",
   explica:[
    "Elementos del clima: temperatura, presión, humedad, precipitación, vientos y nubosidad. Factores que los modifican: latitud, altitud, corrientes marinas, relieve, continentalidad y vegetación.",
    "Presión atmosférica: peso de la columna de aire. Disminuye con la altitud (hay menos aire encima). El aire frío es más denso: da alta presión (anticiclón); el aire caliente asciende y deja baja presión (ciclón o borrasca). El viento va de la alta a la baja presión. Isobaras: líneas de igual presión; isotermas, de igual temperatura; isoyetas, de igual lluvia.",
    "Corriente Peruana o de Humboldt: fría, de sur a norte; el afloramiento de aguas profundas trae nutrientes (plancton, anchoveta). Enfría el aire de la costa y forma una inversión térmica: hay neblinas y garúas, pero no lluvias. Los Andes funcionan como barrera.",
    "Climas: costa árida y semicálida (en el norte, tropical seco); sierra templada a fría y gélida en las altas cumbres, con heladas en la puna; selva tropical húmeda, con friajes (masas de aire frío del sur que entran en invierno).",
    "El Niño: calentamiento anómalo del mar frente al Perú. Empieza con el debilitamiento de los vientos alisios del sureste, que deja pasar aguas cálidas ecuatoriales. Efectos: lluvias intensas, huaicos e inundaciones en la costa norte; sequías en el sur andino y el altiplano; las especies de aguas frías, como la anchoveta, migran al sur o a mayor profundidad y la pesca cae; llegan especies tropicales; daños en cultivos como el algodón y aumento de enfermedades como el dengue. La Niña es el enfriamiento opuesto. El ENFEN vigila el fenómeno."],
   claves:[["Presión y altitud","A mayor altitud, menor presión."],
     ["Presión y temperatura","Aire frío y denso: alta presión. Aire caliente que asciende: baja presión."],
     ["Isobaras","Líneas que unen puntos de igual presión atmosférica."],
     ["Corriente de Humboldt","Fría, de sur a norte; causa la inversión térmica y la falta de lluvias en la costa."],
     ["Fenómeno El Niño","Calentamiento del mar por debilitamiento de los alisios: lluvias en la costa norte y sequía en el sur andino."],
     ["Friaje","Masas de aire frío del sur que llegan a la Amazonía en invierno."]],
   errores:["Creer que al bajar la temperatura la presión baja: sube, porque el aire frío es más denso.","Pensar que durante El Niño los peces de aguas frías van hacia el Ecuador: se van al sur o a profundidad.","Creer que El Niño trae lluvias a todo el Perú: en el altiplano suele haber sequía."],
   ejemplo:{id:"25II-71",pasos:[
     "I: a mayor altitud hay menos columna de aire encima → la presión disminuye → V.",
     "II: el aire frío es más denso → al bajar la temperatura la presión aumenta → F.",
     "III: el mapa de isobaras muestra cómo se distribuye la presión → V.",
     "Respuesta: VFV (A)."],
     idea:"Presión = peso del aire: menos aire encima o aire más caliente → menos presión."},
   guiada:[
    {id:"26I-73",pistas:["¿Qué vientos se debilitan y dejan pasar el agua cálida?","Si el mar se calienta, ¿adónde se van los peces de agua fría? ¿Y qué pasa con las lluvias en el altiplano?"],
     pasos:["I. V: El Niño empieza con el debilitamiento de los alisios del sureste.","II. V: el clima tropicalizado afecta cultivos como el algodón, y con ello la producción textil.","III. F: los peces de aguas frías se van al sur o a profundidad, no a latitudes bajas (más cálidas).","IV. F: en el altiplano llueve menos; la erosión crece en la costa norte.","Respuesta: VVFF (B)."],
     mal:{0:"La II es verdadera (afecta al algodón) y la III falsa.",2:"La I es verdadera: el debilitamiento de los alisios es el origen.",3:"La I y la II son verdaderas; la III y la IV, falsas.",4:"La III es falsa: los peces de aguas frías huyen hacia el sur o a profundidad."}}],
   chequeo:[
    {q:"Al subir una montaña, la presión atmosférica",o:["aumenta","disminuye","no cambia","se duplica","depende solo del viento"],a:1,e:"Hay menos aire encima."},
    {q:"La escasez de lluvias en la costa peruana se debe principalmente a",o:["la corriente de Humboldt y la inversión térmica","el friaje","El Niño","la latitud ecuatorial","la selva"],a:0,e:"El aire frío en superficie no asciende para formar lluvias."},
    {q:"Durante El Niño, en la costa norte se producen",o:["sequías","lluvias intensas e inundaciones","heladas","friajes","nevadas"],a:1,e:"Con huaicos e inundaciones."}],
   prac:[
    {q:"Las líneas que unen puntos de igual temperatura son las",o:["isobaras","isotermas","isoyetas","curvas de nivel","isohietas de presión"],a:1,e:"Isobaras = presión; isoyetas = lluvia."},
    {q:"La llegada de masas de aire frío del sur a la Amazonía se llama",o:["helada","friaje","garúa","El Niño","inversión térmica"],a:1,e:"Ocurre en invierno."},
    {q:"El viento sopla desde zonas de",o:["baja a alta presión","alta a baja presión","igual presión","mayor a menor altitud siempre","este a oeste siempre"],a:1,e:"Del anticiclón a la borrasca."}]}
  ]},
"gfa:Ambiente y desastres":{
  fuente:"Preguntas reales del banco (2023-I a 2027-I). Teoría redactada para Ruta 1250 a partir de la Ley 29664 (SINAGERD) y del temario CEPRE 2026-II (semana 6).",
  lee:[["Puro DECO · Geografía (Drive)","https://drive.google.com/file/d/1XBy7dsLMAXI05opaBpdV81ZClTlanqOQ/view"],["Apuntes digitales · Geografía (Drive)","https://drive.google.com/drive/folders/1B8uqtmjQSlv1YuFhwPIa1-66VrBsEoEw"]],
  bloques:[
  {id:"riesgo",t:"Gestión del riesgo de desastres",ts:["Gestión de riesgos","Gestión de riesgo de desastre","Gestión de riesgos de desastres","Climas del perú y desastres climáticos"],
   obj:["Distinguir peligro, vulnerabilidad, riesgo, desastre y resiliencia.","Reconocer las dimensiones de la vulnerabilidad.","Asignar procesos y componentes de la gestión del riesgo a CENEPRED e INDECI."],
   concepto:"El riesgo de desastre resulta de un peligro (un fenómeno que puede ocurrir) actuando sobre una población vulnerable. Gestionar el riesgo es prevenir y reducir esos factores antes del desastre y prepararse para responder.",
   explica:[
    "Peligro o amenaza: probabilidad de que un fenómeno natural o causado por el ser humano ocurra con cierta intensidad, en un lugar y un tiempo. Vulnerabilidad: condición que hace a una población más susceptible de sufrir daños; depende de la exposición, la fragilidad y la resiliencia. Riesgo: probabilidad de daños, resultado de peligro y vulnerabilidad. Desastre: daños y pérdidas cuando el riesgo se concreta y supera la capacidad de respuesta. Resiliencia: capacidad de resistir y recuperarse.",
    "Dimensiones de la vulnerabilidad: física (viviendas en laderas o en cauces, materiales precarios), económica, social, educativa, cultural, institucional o política (débil organización del Estado; no «se consolida» con los fenómenos), ecológica o ambiental (pérdida de bosques, degradación de suelos) y técnica.",
    "La Ley 29664 creó el SINAGERD (2011), con la PCM como ente rector. Componentes: gestión prospectiva (evitar riesgos futuros: ordenamiento territorial, no construir en zonas peligrosas), correctiva (reducir el riesgo que ya existe: reforzar, reubicar) y reactiva (responder a los desastres).",
    "Procesos: estimación, prevención y reducción del riesgo (a cargo del CENEPRED); preparación, respuesta y rehabilitación (a cargo del INDECI); y reconstrucción. Un análisis de riesgo en una cuenca combina una mirada histórica (desastres pasados), descriptiva (peligros actuales) y prospectiva (para prevenir y reducir).",
    "Fenómenos frecuentes: sismos y tsunamis; movimientos en masa como deslizamientos (una masa de suelo y roca desciende por gravedad, a menudo por filtración de agua), huaicos (flujos de lodo y piedras por quebradas tras lluvias intensas), derrumbes y aludes; inundaciones, heladas, friajes y sequías."],
   tabla:{t:"Quién hace qué en el SINAGERD",cab:["Componente","Procesos","Entidad"],filas:[
    ["Prospectiva y correctiva","Estimación, prevención, reducción","CENEPRED"],["Reactiva","Preparación, respuesta, rehabilitación","INDECI"],["Rectoría","Conducción del sistema","PCM"]]},
   claves:[["Riesgo","Resulta de un peligro que actúa sobre una población vulnerable."],
     ["Vulnerabilidad","Condición que hace a una comunidad más susceptible de sufrir daños ante un peligro."],
     ["Resiliencia","Capacidad de resistir un desastre y recuperarse."],
     ["Gestión prospectiva","Evitar riesgos futuros: ordenamiento territorial, no construir en zonas peligrosas."],
     ["CENEPRED e INDECI","CENEPRED: estimación, prevención y reducción. INDECI: preparación, respuesta y rehabilitación."],
     ["Deslizamiento","Masa de suelo y roca que desciende por gravedad, a menudo por filtración de agua."]],
   errores:["Llamar «desastre natural» a cualquier fenómeno: el desastre ocurre cuando hay vulnerabilidad.","Confundir vulnerabilidad con resiliencia (capacidad de recuperarse).","Atribuir la prevención al INDECI: es del CENEPRED."],
   ejemplo:{id:"25II-72",pasos:[
     "La vulnerabilidad es una condición de la comunidad, no el fenómeno ni su efecto (descarta A y E).",
     "C describe la resiliencia (capacidad de recuperación) y D la gestión del riesgo (planificar, prevenir, mitigar).",
     "Vulnerabilidad = condición que hace a una comunidad más susceptible a los impactos. Respuesta B."],
     idea:"Peligro es el fenómeno; vulnerabilidad, la debilidad de la población; riesgo, la combinación de ambos."},
   guiada:[
    {id:"25I-72",pistas:["Piensa en cada dimensión: ¿dónde viven las personas?, ¿cómo está organizado el Estado?, ¿qué pasa con el ambiente?","¿Los fenómenos naturales fortalecen las instituciones?"],
     pasos:["I. V: vivir en laderas aumenta la vulnerabilidad física.","II. F: la vulnerabilidad institucional depende de la organización del Estado; los fenómenos no la «consolidan».","III. V: perder bosques genera vulnerabilidad ecológica.","Respuesta: VFV (E)."],
     mal:{0:"La I es verdadera: las laderas pobladas aumentan la vulnerabilidad física.",1:"La I es verdadera.",2:"La II es falsa: los fenómenos no consolidan la vulnerabilidad institucional.",3:"La I y la III son verdaderas; la II, falsa."}},
    {id:"27I-71",pistas:["Suelo y roca que descienden por gravedad y por filtración de agua: ¿qué movimiento en masa es?","Ya hubo casas destruidas y muertos: ¿es un peligro, un riesgo o un desastre? ¿Y qué gestión faltó?"],
     pasos:["El descenso de suelo y roca por gravedad y filtración de agua es un deslizamiento.","Con pérdidas ya ocurridas, se trata de un desastre.","Faltó estimar pérdidas y prevenir: la gestión de riesgos. Respuesta E."],
     mal:{0:"El volcamiento es la rotación de bloques; además, ya hay daños: es un desastre, no solo un riesgo.",1:"El flujo de lodo es más fluido; y con daños ocurridos ya no hablamos solo de peligro.",2:"La reptación es lentísima y no destruye cien casas de golpe.",3:"El flujo de detritos baja por quebradas; aquí desciende suelo y roca por filtración: deslizamiento."}}],
   chequeo:[
    {q:"El riesgo de desastre resulta de combinar",o:["peligro y vulnerabilidad","resiliencia y peligro","clima y relieve","población y economía","sismo y tsunami"],a:0,e:"Sin vulnerabilidad, un peligro no se convierte en desastre."},
    {q:"La preparación, la respuesta y la rehabilitación están a cargo del",o:["CENEPRED","INDECI","SENAMHI","MINAM","IGN"],a:1,e:"El CENEPRED se ocupa de estimar, prevenir y reducir."},
    {q:"Prohibir construir en el cauce de un río al planificar una ciudad es gestión",o:["reactiva","correctiva","prospectiva","de respuesta","de rehabilitación"],a:2,e:"Evita un riesgo futuro."}],
   prac:[
    {q:"Flujo de lodo y piedras que baja por una quebrada tras lluvias intensas",o:["huaico","alud","reptación","tsunami","friaje"],a:0,e:"Muy común en la costa y la sierra."},
    {q:"Viviendas de adobe sin refuerzo en zona sísmica muestran vulnerabilidad",o:["física","ecológica","educativa","institucional","cultural"],a:0,e:"Tiene que ver con la estructura y la ubicación."},
    {q:"Reforzar un puente que ya existe y está en riesgo de colapsar es gestión",o:["prospectiva","correctiva","reactiva","de respuesta","de reconstrucción"],a:1,e:"Reduce un riesgo que ya existe."}]}
  ]},
"eco:Mercado, oferta y demanda":{
  fuente:"Preguntas reales del banco (2023-II a 2027-I). Teoría redactada para Ruta 1250 a partir del temario CEPRE 2026-II (semanas 3 y 5).",
  lee:[["Puro DECO · Economía (Drive)","https://drive.google.com/file/d/1uahCb4DNuIv8PwQwYlaatULC3Y5TD-WN/view"],["Apuntes digitales · Economía (Drive)","https://drive.google.com/drive/folders/1IDxva6QkFmeLH4ILDfuWl7a4-w1nIT5r"]],
  bloques:[
  {id:"dyo",t:"Demanda, oferta y equilibrio",ts:["Oferta y demanda","Teoría de la demanda"],
   obj:["Distinguir un movimiento a lo largo de la curva de un desplazamiento de la curva.","Predecir qué pasa con el precio y la cantidad ante un cambio.","Reconocer bienes normales, inferiores, sustitutos y complementarios."],
   concepto:"El precio de mercado sale del encuentro entre la demanda (lo que los compradores quieren y pueden comprar) y la oferta (lo que los vendedores quieren vender). Si cambia algo distinto del precio, la curva se desplaza y el equilibrio se mueve.",
   explica:[
    "Ley de la demanda: si el precio sube, la cantidad demandada baja (relación inversa). Un cambio en el precio del propio bien produce un movimiento a lo largo de la curva. Desplazan la curva de demanda: el ingreso, el precio de bienes relacionados, los gustos, las expectativas y el número de compradores.",
    "Ingreso: bien normal, si el ingreso sube se compra más (la curva de Engel sube); bien inferior, si el ingreso sube se compra menos (la curva de Engel baja: menudencia en vez de carne). Bienes relacionados: sustitutos (si sube el precio del té, sube la demanda de café) y complementarios (si sube el precio del café, baja la demanda de azúcar).",
    "Ley de la oferta: si el precio sube, la cantidad ofrecida sube (relación directa). Desplazan la curva de oferta: costos de los insumos, tecnología, número de vendedores, clima, impuestos o subsidios y restricciones como prohibir importaciones (reduce la oferta interna).",
    "Equilibrio: cantidad demandada = cantidad ofrecida. Si hay exceso de demanda (escasez), el precio sube; si hay exceso de oferta (excedente), baja. Menos oferta con la misma demanda → precio sube y cantidad baja. Más demanda con la misma oferta → precio y cantidad suben.",
    "Elasticidad precio: elástica si la cantidad reacciona mucho al precio (bienes con muchos sustitutos o de lujo); inelástica si reacciona poco (sal, medicinas). Controles: un precio máximo bajo el equilibrio genera escasez; un precio mínimo sobre el equilibrio, excedente."],
   tabla:{t:"Qué pasa en el mercado",cab:["Cambio","Curva","Precio","Cantidad"],filas:[
    ["Sube el ingreso (bien normal)","Demanda → derecha","Sube","Sube"],["Sube el precio de un sustituto","Demanda → derecha","Sube","Sube"],["Mejora la tecnología","Oferta → derecha","Baja","Sube"],["Se prohíben importaciones","Oferta → izquierda","Sube","Baja"],["Sube el costo de un insumo","Oferta → izquierda","Sube","Baja"]]},
   claves:[["Ley de la demanda","Precio y cantidad demandada van en sentido inverso."],
     ["Movimiento vs. desplazamiento","Si cambia el precio del bien, te mueves sobre la curva; si cambia otro factor, la curva se desplaza."],
     ["Bien inferior","Si el ingreso sube, se compra menos (menudencia, transporte informal)."],
     ["Complementarios","Se usan juntos: si sube el precio de uno, baja la demanda del otro."],
     ["Menos oferta","Con la misma demanda: el precio sube y la cantidad baja."],
     ["Precio máximo","Fijado bajo el equilibrio, provoca escasez."]],
   errores:["Desplazar la demanda cuando lo que cambió fue la oferta (por ejemplo, una prohibición de importar).","Creer que si sube el precio «baja la demanda»: baja la cantidad demandada, la curva no se mueve.","Confundir sustitutos con complementarios."],
   ejemplo:{id:"27I-77",pasos:[
     "Prohibir importar derivados de cerdo reduce cuánto se vende en el país: cambia la oferta, no la demanda.",
     "La demanda no se desplaza: no cambian ni el ingreso ni los gustos de los compradores.",
     "Con menos oferta y la misma demanda, el precio de mercado sube. Respuesta C."],
     idea:"Pregúntate primero quién cambia: compradores (demanda) o vendedores (oferta)."},
   guiada:[
    {id:"27I-75",pistas:["En una curva de Engel, el ingreso (R) está en un eje y la cantidad (Q) en el otro. ¿Cómo es la pendiente para un bien normal?","Bien normal: más ingreso, más cantidad. Bien inferior: más ingreso, menos cantidad."],
     pasos:["La carne de res es un bien normal: su curva de Engel tiene pendiente positiva → figura I.","La menudencia es un bien inferior: a más ingreso, menos cantidad; pendiente negativa → figura II.","Respuesta: I y II (E)."],
     mal:{0:"Revisa las pendientes: el bien normal sube con el ingreso y el inferior baja.",1:"Revisa las pendientes: el bien normal sube con el ingreso y el inferior baja.",2:"Revisa las pendientes: el bien normal sube con el ingreso y el inferior baja.",3:"Revisa las pendientes: el bien normal sube con el ingreso y el inferior baja."}}],
   chequeo:[
    {q:"Si sube el precio del café, la demanda de azúcar (complementario)",o:["aumenta","disminuye","no cambia","se vuelve elástica","se iguala a la oferta"],a:1,e:"Se usan juntos: si se compra menos café, se necesita menos azúcar."},
    {q:"Si al subir el ingreso baja la demanda de un bien, ese bien es",o:["normal","inferior","de lujo","complementario","sustituto"],a:1,e:"Ej.: se deja la menudencia y se compra carne."},
    {q:"Un precio máximo fijado por debajo del equilibrio provoca",o:["excedente","escasez","equilibrio","inflación de oferta","más productores"],a:1,e:"A ese precio se quiere comprar más de lo que se ofrece."}],
   prac:[
    {q:"Una mejora tecnológica en la producción de papa",o:["desplaza la oferta a la derecha y baja el precio","desplaza la demanda a la izquierda","sube el precio","no cambia nada","reduce la cantidad"],a:0,e:"Producir cuesta menos: hay más oferta."},
    {q:"Un movimiento a lo largo de la curva de demanda se debe a",o:["un cambio en el ingreso","un cambio en el precio del propio bien","un cambio en los gustos","más compradores","el precio de un sustituto"],a:1,e:"Todo lo demás desplaza la curva."},
    {q:"¿Qué bien tiene demanda más inelástica?",o:["la sal","un auto de lujo","un viaje al extranjero","un helado de marca","ropa de diseñador"],a:0,e:"Es necesaria y no tiene sustitutos cercanos."}]},
  {id:"merc",t:"Estructuras y fallas de mercado",ts:["Modelos de mercado","Monopolio","Monopolio natural","Fallas de mercado"],
   obj:["Clasificar mercados por número de agentes y tipo de producto.","Explicar por qué el monopolio genera pérdida de eficiencia.","Reconocer fallas de mercado: externalidades, bienes públicos, información asimétrica."],
   concepto:"Los mercados se clasifican según cuántos venden, cuántos compran y si el producto es igual o diferenciado. Cuando hay poder de mercado, efectos sobre terceros o bienes que nadie puede excluir, el mercado falla y se justifica la regulación.",
   explica:[
    "Competencia perfecta: muchos compradores y vendedores, producto homogéneo, información completa, libre entrada y salida; todos son precio-aceptantes. Ej.: medicamentos genéricos tras vencer la patente.",
    "Competencia imperfecta. Monopolio: un solo vendedor sin sustitutos cercanos y con barreras de entrada; fija un precio mayor al costo marginal y produce menos, lo que genera una pérdida irrecuperable de eficiencia (peso muerto). Barreras legales (patentes, concesiones) dan monopolio legal; las economías de escala (el costo medio cae al producir más, como en el agua o la electricidad) dan monopolio natural. Oligopolio: pocos vendedores interdependientes; pueden coludirse (cártel). Competencia monopolística: muchos vendedores con productos diferenciados por marca.",
    "Del lado de la demanda: monopsonio (un solo comprador) y oligopsonio (pocos compradores). Monopolio bilateral: un solo vendedor frente a un solo comprador.",
    "Fallas de mercado: poder de mercado; externalidades negativas (contaminación) o positivas (vacunación, educación); bienes públicos, no rivales y no excluibles (puros: defensa nacional, alumbrado; impuros, que pueden congestionarse o excluir: carreteras, hospitales públicos); información asimétrica.",
    "En el Perú regulan la competencia y los servicios: INDECOPI (libre competencia y consumidor), OSIPTEL (telecomunicaciones), OSINERGMIN (energía y minería), SUNASS (agua) y OSITRAN (infraestructura de transporte)."],
   tabla:{t:"Estructuras de mercado",cab:["Mercado","Vendedores","Producto","Ejemplo"],filas:[
    ["Competencia perfecta","Muchos","Homogéneo","Genéricos, papa"],["Competencia monopolística","Muchos","Diferenciado","Restaurantes, ropa de marca"],["Oligopolio","Pocos","Homogéneo o diferenciado","Telefonía, cemento"],["Monopolio","Uno","Sin sustitutos","Agua potable local"],["Monopsonio","Muchos vendedores, un comprador","—","Única fábrica que compra leche en una zona"]]},
   claves:[["Competencia perfecta","Muchos agentes, producto homogéneo, precio-aceptantes, libre entrada y salida."],
     ["Monopolio","Un vendedor; precio mayor al costo marginal y menos producción: pérdida irrecuperable de eficiencia."],
     ["Monopolio natural","Economías de escala: el costo medio cae al producir más (agua, electricidad)."],
     ["Monopsonio","Un solo comprador frente a muchos vendedores."],
     ["Bien público puro","No rival y no excluible: defensa nacional."],
     ["Externalidad","Efecto sobre terceros que el precio no refleja (contaminación)."]],
   errores:["Confundir monopolio natural (economías de escala) con monopolio legal (barrera puesta por el Gobierno).","Creer que el monopolista maximiza el excedente del consumidor.","Llamar bien público puro a un hospital público: es impuro."],
   ejemplo:{id:"26II-77",pasos:[
     "La farmacéutica tiene una patente exclusiva: es un monopolio legal.",
     "Fija un precio muy superior al costo marginal y restringe la producción.",
     "Se producen menos unidades de las que la sociedad valora por encima de su costo: se pierde excedente para todos. Respuesta: pérdida irrecuperable de eficiencia (C)."],
     idea:"Monopolio = menos cantidad y más precio que en competencia → peso muerto."},
   guiada:[
    {id:"27I-74",pistas:["¿Un monopolista produce mucho o restringe lo que ofrece?","¿Qué diferencia un monopolio natural de uno legal? Piensa en quién pone la barrera."],
     pasos:["I. V: el monopolista restringe la oferta para cobrar más.","II. F: si la barrera la crea el Gobierno, sería monopolio legal; en el natural la barrera son las economías de escala.","III. V: en un monopolio natural el costo total medio cae al aumentar la producción.","Respuesta: VFV (A)."],
     mal:{1:"La I es verdadera: el monopolista restringe el servicio.",2:"La III es verdadera: economías de escala.",3:"La I es verdadera y la II falsa.",4:"La II es falsa: barrera del Gobierno = monopolio legal."}},
    {id:"23II-77",pistas:["¿Se puede excluir a alguien de la defensa nacional? ¿Se congestiona?","Un hospital o una carretera pública pueden saturarse: ya no son puramente no rivales."],
     pasos:["Defensa nacional: no rival y no excluible → bien público puro (Ia).","Hospital público: puede saturarse y atiende con turnos → impuro (IIb).","Carretera pública: puede congestionarse o cobrar peaje → impuro (IIIb).","Respuesta: Ia, IIb, IIIb (E)."],
     mal:{0:"La defensa nacional es el ejemplo clásico de bien público puro.",1:"El hospital se puede saturar: es impuro.",2:"La carretera se congestiona y puede tener peaje: es impura.",3:"La defensa nacional es pura y el hospital, impuro."}}],
   chequeo:[
    {q:"Muchos vendedores con productos diferenciados por su marca forman",o:["competencia perfecta","competencia monopolística","monopolio","oligopsonio","monopolio bilateral"],a:1,e:"Ej.: restaurantes o ropa de marca."},
    {q:"Un solo comprador frente a muchos vendedores es un",o:["monopolio","monopsonio","oligopolio","duopolio","cártel"],a:1,e:"«Opsonio» se refiere a compradores."},
    {q:"Un bien no rival y no excluible es",o:["un bien privado","un bien público puro","un bien inferior","un bien complementario","un bien de lujo"],a:1,e:"Ej.: defensa nacional, alumbrado público."}],
   prac:[
    {q:"Pocas empresas que acuerdan fijar precios forman",o:["un cártel en un oligopolio","competencia perfecta","un monopsonio","competencia monopolística","un bien público"],a:0,e:"La colusión es ilegal y la sanciona INDECOPI."},
    {q:"El humo de una fábrica que enferma a los vecinos es",o:["externalidad positiva","externalidad negativa","bien público","monopolio natural","información asimétrica"],a:1,e:"Un costo para terceros que la fábrica no paga."},
    {q:"El organismo que defiende la libre competencia y al consumidor es",o:["SUNAT","INDECOPI","BCRP","SBS","OSIPTEL"],a:1,e:"OSIPTEL regula solo telecomunicaciones."}]}
  ]},
"eco:Comercio internacional y divisas":{
  fuente:"Preguntas reales del banco (2024-I a 2026-II). Teoría redactada para Ruta 1250 a partir del temario CEPRE 2026-II (semanas 10 y 11).",
  lee:[["Puro DECO · Economía (Drive)","https://drive.google.com/file/d/1uahCb4DNuIv8PwQwYlaatULC3Y5TD-WN/view"],["Apuntes digitales · Economía (Drive)","https://drive.google.com/drive/folders/1IDxva6QkFmeLH4ILDfuWl7a4-w1nIT5r"]],
  bloques:[
  {id:"com",t:"Comercio exterior, balanza de pagos y tipo de cambio",ts:["Comercio internacional","Mercado de divisas","Balanza de pagos"],
   obj:["Explicar ventaja absoluta y comparativa.","Ubicar cada operación en la cuenta correcta de la balanza de pagos.","Predecir los efectos de una apreciación o depreciación del sol."],
   concepto:"Los países comercian porque les conviene especializarse en lo que producen con menor costo de oportunidad. Todas esas operaciones con el resto del mundo se registran en la balanza de pagos, y el tipo de cambio decide si exportar o importar resulta más barato.",
   explica:[
    "Ventaja absoluta (Adam Smith): un país produce un bien con menos recursos que otro. Ventaja comparativa (David Ricardo): lo produce con menor costo de oportunidad; conviene especializarse aunque no se tenga ventaja absoluta. Política comercial: librecambio frente a proteccionismo (aranceles, cuotas, subsidios). Un arancel encarece la importación, reduce el consumo y genera una pérdida irrecuperable de eficiencia.",
    "Integración: zona de libre comercio (sin aranceles entre socios), unión aduanera (además, arancel externo común), mercado común (libre movimiento de capital y trabajo), unión económica y monetaria. El Perú integra la CAN, la Alianza del Pacífico y APEC, y tiene muchos TLC.",
    "Balanza de pagos. Cuenta corriente: balanza comercial (bienes: exportaciones menos importaciones), servicios (fletes, turismo, seguros), renta de factores o ingreso primario (utilidades, intereses) y transferencias corrientes (remesas y donaciones, sin contrapartida). Cuenta financiera: inversión directa, de cartera y préstamos, de corto y largo plazo. El resultado global se refleja en las Reservas Internacionales Netas (RIN) del BCRP.",
    "Tipo de cambio: precio de una moneda en otra (soles por dólar). En el Perú es flexible, con intervención del BCRP para reducir la volatilidad (flotación administrada). Si el sol gana valor (el dólar baja de 3,80 a 3,40), el sol se aprecia y el dólar se deprecia; con tipo de cambio fijo, los cambios oficiales se llaman revaluación y devaluación.",
    "Efectos: con el sol apreciado, importar es más barato, las importaciones aumentan y el saldo comercial empeora; con el sol depreciado, exportar es más competitivo y el saldo mejora."],
   tabla:{t:"Dónde se registra",cab:["Operación","Cuenta"],filas:[
    ["Exportación de cobre","Cuenta corriente: balanza comercial"],["Turistas extranjeros en Cusco","Cuenta corriente: servicios"],["Utilidades que una minera envía a su matriz","Cuenta corriente: renta de factores"],["Remesas, donaciones","Cuenta corriente: transferencias corrientes"],["Inversión extranjera en una planta","Cuenta financiera"]]},
   claves:[["Ventaja comparativa","Ricardo: especializarse en lo que se produce con menor costo de oportunidad."],
     ["Balanza comercial","Exportaciones menos importaciones de bienes; es parte de la cuenta corriente."],
     ["Transferencias corrientes","Remesas y donaciones: no tienen contrapartida."],
     ["Apreciación del sol","El sol gana valor: importar se abarata, las importaciones suben y el saldo comercial empeora."],
     ["Depreciación vs. devaluación","Depreciación: por el mercado (tipo flexible). Devaluación: decisión oficial (tipo fijo)."],
     ["Unión aduanera","Libre comercio entre socios más un arancel externo común."]],
   errores:["Confundir ventaja comparativa con producir más (eso es absoluta).","Poner las remesas en la cuenta financiera: son transferencias corrientes.","Usar «devaluación» en un tipo de cambio flexible."],
   ejemplo:{id:"24I-74",pasos:[
     "Si el sol gana valor frente al dólar, se aprecia.",
     "Con un sol más fuerte, los productos importados cuestan menos en soles: las importaciones aumentan.",
     "Más importaciones (y exportaciones menos competitivas) empeoran el saldo de la balanza comercial. Respuesta A."],
     idea:"Sol fuerte = importar barato, exportar caro."},
   guiada:[
    {id:"26I-76",pistas:["En un tipo de cambio flexible, ¿se dice «devaluar» o «depreciar»?","Si el dólar pierde valor, ¿qué le pasa al sol?"],
     pasos:["En un tipo de cambio flexible se habla de depreciación y apreciación (devaluar y revaluar son decisiones oficiales).","El dólar pierde valor frente al sol: el dólar se deprecia.","A la vez, el sol gana valor: se aprecia. Respuesta A."],
     mal:{1:"Devaluar y revaluar son decisiones oficiales con tipo de cambio fijo; el Perú tiene tipo flexible.",2:"«Subvaluado» y «fortalecido» no son los términos técnicos.",3:"Devaluar es una decisión oficial; además, el sol no se «estabilizó», se apreció.",4:"Si el dólar se deprecia, el sol no puede devaluarse al mismo tiempo: se aprecia."}},
    {id:"26II-76",pistas:["La pérdida irrecuperable es un triángulo: base = caída de la cantidad, altura = subida del precio.","El pollo importado es un bien: ¿en qué balanza y en qué cuenta va?"],
     pasos:["Base: 1000 − 800 = 200 unidades. Altura: 14 − 10 = 4 soles.","Área: (200 × 4) ÷ 2 = 400 soles.","La importación de bienes va en la balanza comercial, que es parte de la cuenta corriente. Respuesta C."],
     mal:{0:"El cálculo da 400 y la importación de bienes no va en la cuenta financiera.",1:"No olvides dividir entre 2: el triángulo da 400. Y no son servicios, son bienes.",3:"El cálculo da 400, y el pollo es un bien, no un servicio ni renta.",4:"El cálculo da 400, y la importación de bienes va en la cuenta corriente."}}],

    {q:"Si el tipo de cambio sube de 3,40 a 3,80 soles por dólar, el sol se",o:["aprecia","deprecia","revalúa","estabiliza","fortalece"],a:1,e:"Se necesitan más soles por dólar: el sol pierde valor."},
    {q:"La ventaja comparativa se basa en",o:["producir más que todos","el menor costo de oportunidad","tener mejor suelo","la mayor demanda interna","los aranceles altos"],a:1,e:"David Ricardo."}],
   prac:[
