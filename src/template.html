"fil:Historia de la filosofía":{
  fuente:"Preguntas reales del banco (2024-I). Teoría redactada para Ruta 1250 a partir del temario CEPRE 2026-II (semana 3: filosofía moderna).",
  lee:[["Puro DECO · Filosofía (Drive)","https://drive.google.com/file/d/1IREV2eaty25BHTsH3YaK1JpNPjEV6CzP/view"],["Apuntes digitales · Filosofía (Drive)","https://drive.google.com/drive/folders/1Zg5l5I3tXRxj2w4MHXxRTTwkSpcFVAo1"]],
  bloques:[
  {id:"mod",t:"Filosofía moderna: racionalismo, empirismo y Kant",ts:["Filosofía moderna"],excl:["24II-80","24II-81","23II-81"],
   obj:["Ubicar el contexto de la modernidad (ciencia, Reforma, Estado moderno).","Distinguir racionalismo y empirismo con sus autores.","Explicar cómo Kant intenta unirlos."],
   concepto:"La filosofía moderna (siglos XVII y XVIII) pone en el centro al sujeto que conoce. Su gran pregunta es de dónde viene el conocimiento verdadero: de la razón (racionalismo), de la experiencia (empirismo) o de la unión de ambas (Kant).",
   explica:[
    "Contexto: la revolución científica (Copérnico y el heliocentrismo, Galileo, Kepler, Newton) cuestiona el saber medieval; la Reforma de Lutero, con el libre examen de la Biblia, impulsa la individualidad y la conciencia personal; nace el Estado moderno (Maquiavelo, Hobbes). Se busca un método seguro para fundar las ciencias.",
    "Racionalismo: la razón es la fuente del conocimiento verdadero; hay ideas innatas y el método ideal es deductivo, como el de la matemática. Descartes (Discurso del método, 1637): duda metódica, «pienso, luego existo», las ideas «claras y distintas» como criterio de verdad, y el dualismo entre la sustancia pensante y la extensa. Spinoza: una sola sustancia, Dios o la Naturaleza. Leibniz: las mónadas.",
    "Empirismo: todo conocimiento viene de la experiencia sensible. Bacon (Novum Organum): método inductivo y crítica de los «ídolos» que deforman el conocimiento. Locke: la mente es una tabula rasa. Berkeley: «ser es ser percibido». Hume: las ideas copian impresiones; la causalidad no se percibe, es un hábito mental; desemboca en el escepticismo.",
    "Kant (Crítica de la razón pura, 1781): el conocimiento empieza con la experiencia, pero la mente le impone sus formas. Une ambos: sin experiencia los conceptos están vacíos; sin conceptos la experiencia es ciega. Solo conocemos el fenómeno, no la cosa en sí. La Ilustración confía en la razón y el progreso («atrévete a saber»).",
    "Newton expresa el espíritu empirista de la ciencia con su «no invento hipótesis»: describir leyes a partir de los fenómenos sin especular sobre causas ocultas."],
   tabla:{t:"Dos respuestas y una síntesis",cab:["Corriente","Fuente del conocimiento","Autores","Método"],filas:[
    ["Racionalismo","La razón (ideas innatas)","Descartes, Spinoza, Leibniz","Deductivo"],["Empirismo","La experiencia sensible","Bacon, Locke, Berkeley, Hume","Inductivo"],["Criticismo","Experiencia + formas de la razón","Kant","Crítica de la razón"]]},
   claves:[["Racionalismo","La razón es la fuente del conocimiento; ideas innatas y método deductivo (Descartes)."],
     ["Empirismo","Todo conocimiento viene de la experiencia; la mente es una tabula rasa (Locke)."],
     ["Descartes","Duda metódica, «pienso, luego existo», ideas claras y distintas."],
     ["Hume","La causalidad es un hábito mental; lleva al escepticismo."],
     ["Kant","Une razón y experiencia: solo conocemos fenómenos, no la cosa en sí."],
     ["Lutero y el libre examen","Cada creyente interpreta la Biblia: impulsa la individualidad moderna."]],
   errores:["Poner a Locke o a Hume entre los racionalistas.","Creer que Kant es empirista: es criticista, une ambas fuentes.","Atribuir el «ser es ser percibido» a Hume: es de Berkeley."],
   ejemplo:{id:"24I-79",pasos:[
     "I: la modernidad busca el conocimiento con un método (Descartes, Bacon) → correcta.",
     "II: limitar la tecnología a ciertos grupos no caracteriza el periodo → incorrecta.",
     "III: no se trata de reinterpretar la Biblia desde las ciencias; la ciencia se independiza de la teología → incorrecta.",
     "IV: fundamentar las ciencias en ideas claras y distintas es el programa de Descartes → correcta. Respuesta: I y IV (C)."],
     idea:"La modernidad = método + razón + sujeto. Las afirmaciones teológicas o elitistas suelen sobrar."},
   guiada:[
    {id:"24I-80",pistas:["El libre examen permite que cada persona lea e interprete la Biblia por sí misma. ¿Qué valora eso: el grupo o el individuo?","La pregunta habla de una ética sostenida «únicamente en la acción personal»."],
     pasos:["Con el libre examen, la relación con Dios pasa por la conciencia de cada creyente.","Eso refuerza una ética basada en la acción personal, no en la mediación de la Iglesia.","Es la individualidad moderna (B)."],
     mal:{0:"La salvación grupal contradice la idea de una acción personal.",2:"«Iniciativa no propia» es lo opuesto a la acción personal.",3:"La «doctrina cristiana» es demasiado general; lo nuevo es la individualidad.",4:"La interpretación es personal, no colectiva."}}],
   chequeo:[
    {q:"«Pienso, luego existo» es una idea de",o:["Locke","Descartes","Hume","Kant","Bacon"],a:1,e:"Primera certeza tras la duda metódica."},
    {q:"«Toda idea viene de la experiencia; la mente nace como una tabula rasa» resume el",o:["racionalismo","empirismo","idealismo platónico","criticismo","escolasticismo"],a:1,e:"Locke es su exponente."},
    {q:"Kant intenta superar la oposición entre",o:["fe y razón","racionalismo y empirismo","ciencia y arte","Estado e Iglesia","mito y logos"],a:1,e:"Su criticismo une experiencia y formas de la razón."}],
   prac:[
    {q:"«Ser es ser percibido» es la tesis de",o:["Berkeley","Spinoza","Descartes","Bacon","Leibniz"],a:0,e:"Inmaterialismo."},
    {q:"Para Hume, la relación de causa y efecto es",o:["una idea innata","un hábito mental","una verdad matemática","una revelación","una forma a priori"],a:1,e:"Vemos sucesión, no la conexión necesaria."},
    {q:"Novum Organum, método inductivo y teoría de los ídolos son de",o:["Bacon","Locke","Hume","Kant","Descartes"],a:0,e:"Francis Bacon, precursor del empirismo."}]}
  ]},
"fil:Epistemología y ciencia":{
  fuente:"Preguntas reales del banco (2025-II a 2027-I). Teoría redactada para Ruta 1250 a partir del temario CEPRE 2026-II (semanas 8 y 9: epistemología).",
  lee:[["Puro DECO · Filosofía (Drive)","https://drive.google.com/file/d/1IREV2eaty25BHTsH3YaK1JpNPjEV6CzP/view"],["Apuntes digitales · Filosofía (Drive)","https://drive.google.com/drive/folders/1Zg5l5I3tXRxj2w4MHXxRTTwkSpcFVAo1"]],
  bloques:[
  {id:"epis",t:"Epistemología: Comte, Popper y Kuhn",ts:["Epistemología · Popper","Epistemología · Kuhn","Método científico","Positivismo","Ciencia y poder"],
   obj:["Reconocer los rasgos del conocimiento científico y los pasos del método.","Explicar la falsabilidad de Popper y los paradigmas de Kuhn.","Identificar los tres estadios de Comte y el uso de la ciencia para legitimar el poder."],
   concepto:"La epistemología es la reflexión filosófica sobre la ciencia: qué la distingue de otros saberes, cómo se justifica y cómo cambia. Popper responde con la falsabilidad; Kuhn, con los paradigmas y las revoluciones científicas.",
   explica:[
    "El conocimiento científico es racional, objetivo, metódico, sistemático, verificable o contrastable, falible y general. Ciencias formales (lógica, matemática) se demuestran; ciencias fácticas (naturales y sociales) se contrastan con la experiencia. Método: problema (una dificultad aún sin solución que exige conocimiento) → hipótesis → contrastación → conclusión.",
    "Positivismo (Comte, siglo XIX): la humanidad pasa por tres estadios: teológico (explica todo por dioses), metafísico (por esencias abstractas) y positivo o científico (por hechos observables y leyes). Positivismo lógico o Círculo de Viena (siglo XX): un enunciado tiene sentido solo si es verificable empíricamente (o analítico); rechaza la metafísica.",
    "Popper (racionalismo crítico): critica la inducción; ninguna cantidad de casos confirma una teoría para siempre. Criterio de demarcación: una teoría es científica si es falsable, es decir, si se puede imaginar una observación que la refute. La ciencia avanza por conjeturas y refutaciones. La astrología no es ciencia porque siempre se acomoda a los hechos.",
    "Kuhn (La estructura de las revoluciones científicas, 1962): un paradigma es el conjunto de supuestos que comparte una comunidad científica. Hay una fase preparadigmática (muchas hipótesis en competencia), luego ciencia normal (se trabaja dentro del paradigma), aparecen anomalías, crisis y una revolución científica, que lleva a un nuevo paradigma.",
    "Otros: Lakatos (programas de investigación), Feyerabend (anarquismo epistemológico: «todo vale»). Ciencia y poder: Foucault y la Escuela de Frankfurt advierten que la ciencia puede usarse para legitimar decisiones de poder, no solo para buscar la verdad."],
   tabla:{t:"Tres miradas sobre la ciencia",cab:["Autor","Idea central","Palabra clave"],filas:[
    ["Comte","La humanidad llega al estadio positivo","Tres estadios"],["Popper","La ciencia se puede refutar","Falsabilidad"],["Kuhn","La ciencia cambia por revoluciones","Paradigma"]]},
   claves:[["Falsabilidad (Popper)","Una teoría es científica si puede ser refutada por la experiencia."],
     ["Paradigma (Kuhn)","Supuestos compartidos por una comunidad científica que guían la ciencia normal."],
     ["Ciencia normal","Investigación dentro de un paradigma aceptado; la proliferación de hipótesis es de la fase preparadigmática o revolucionaria."],
     ["Tres estadios de Comte","Teológico, metafísico y positivo o científico."],
     ["Problema (método científico)","Dificultad aún sin solución que exige conocimiento: punto de partida de la investigación."],
     ["Ciencia y poder","Usar el prestigio de la ciencia para legitimar decisiones (Foucault)."]],
   errores:["Decir que Popper busca verificar: busca falsar.","Creer que en la ciencia normal proliferan hipótesis rivales: eso pasa antes o durante una revolución.","Confundir positivismo (hechos observables) con empirismo moderno (siglo XVII)."],
   ejemplo:{id:"26II-80",pasos:[
     "Para Popper, una teoría es científica si puede mostrarse un contraejemplo que la refute.",
     "La astrología siempre se acomoda a lo que ocurre: no hay observación que la pueda refutar.",
     "Por eso es una seudociencia, por la imposibilidad de falsarla (E)."],
     idea:"Si nada podría refutarla, para Popper no es ciencia."},
   guiada:[
    {id:"25II-78",pistas:["Según el texto, ¿la ciencia normal tiene paradigma? ¿Y la extraordinaria?","¿En qué fases proliferan hipótesis diferentes?"],
     pasos:["I. Sí: la ciencia normal se basa en un paradigma.","II. No: la proliferación de hipótesis es de la fase preparadigmática y de la revolucionaria.","III. Sí: en la ciencia extraordinaria no domina un paradigma.","IV. Sí: las disciplinas avanzan de paradigma en paradigma. Respuesta: I, III y IV (A)."],
     mal:{1:"Faltan la III y la IV, que también se desprenden del texto.",2:"La II es falsa: en la ciencia normal no proliferan hipótesis rivales.",3:"La II es falsa y falta la III.",4:"Falta la IV: el texto dice que se avanza de paradigma en paradigma."}},
    {id:"27I-79",pistas:["José explica las decisiones por Dios; Roberto, por pruebas observables. ¿Qué autor ordena la historia en estadios así?","Uno está en el estadio teológico y el otro en el positivo."],
     pasos:["José explica las decisiones por Dios: estadio teológico.","Roberto exige pruebas observables: estadio positivo o científico.","Ambos son estadios de la ley de Comte: positivismo (D)."],
     mal:{0:"El idealismo pone el fundamento en las ideas, no en estadios históricos.",1:"El empirismo del siglo XVII habla del origen del conocimiento, no de estadios de la humanidad.",2:"El criticismo es Kant.",4:"El marxismo explica la historia por la lucha de clases y la economía."}}],
   chequeo:[
    {q:"Según Popper, el criterio que distingue la ciencia de la seudociencia es la",o:["verificabilidad","falsabilidad","inducción","utilidad","coherencia"],a:1,e:"Que la teoría pueda ser refutada."},
    {q:"El periodo en que la comunidad trabaja dentro de un paradigma aceptado es la",o:["revolución científica","ciencia normal","fase preparadigmática","crisis","inconmensurabilidad"],a:1,e:"Kuhn."},
    {q:"Los estadios de la ley de Comte son",o:["mítico, lógico y científico","teológico, metafísico y positivo","antiguo, medieval y moderno","religioso, artístico y filosófico","inductivo, deductivo y abductivo"],a:1,e:"El positivo es el científico."}],
   prac:[
    {q:"La matemática es una ciencia",o:["fáctica","formal","natural","social","experimental"],a:1,e:"Se demuestra, no se contrasta con la experiencia."},
    {q:"«Todo vale» resume la postura de",o:["Popper","Feyerabend","Kuhn","Comte","Lakatos"],a:1,e:"Anarquismo epistemológico."},
    {q:"Para el Círculo de Viena, un enunciado sobre hechos tiene sentido si",o:["es verificable empíricamente","es bello","lo acepta la mayoría","es metafísico","es útil"],a:0,e:"Criterio de verificabilidad."}]}
  ]},
"fil:Ética y estética":{
  fuente:"Pregunta real del banco (2026-II). Teoría redactada para Ruta 1250 a partir del temario CEPRE 2026-II (semana 12: ética).",
  lee:[["Puro DECO · Filosofía (Drive)","https://drive.google.com/file/d/1IREV2eaty25BHTsH3YaK1JpNPjEV6CzP/view"],["Apuntes digitales · Filosofía (Drive)","https://drive.google.com/drive/folders/1Zg5l5I3tXRxj2w4MHXxRTTwkSpcFVAo1"]],
  bloques:[
  {id:"etica",t:"Teorías éticas",ts:["Teorías éticas"],
   obj:["Distinguir ética y moral, y los rasgos del acto moral.","Reconocer eudemonismo, hedonismo, estoicismo, utilitarismo y ética kantiana.","Diferenciar imperativo categórico e hipotético."],
   concepto:"La moral es el conjunto de normas y valores que guían la conducta; la ética es la reflexión filosófica sobre esa moral. Cada teoría ética responde de forma distinta qué hace buena una acción: la felicidad, el placer, la razón, las consecuencias o el deber.",
   explica:[
    "Acto moral: consciente, libre y responsable. Sin libertad o sin conocimiento no hay responsabilidad moral plena.",
    "Teorías de la felicidad y la virtud. Eudemonismo (Aristóteles): el fin último es la felicidad (eudaimonía), que se alcanza con la virtud, entendida como el término medio entre dos extremos (la valentía entre la cobardía y la temeridad). Hedonismo: el bien es el placer; Epicuro lo entiende como placeres moderados y ausencia de dolor y de perturbación (ataraxia). Estoicismo (Zenón, Séneca, Marco Aurelio): vivir conforme a la razón y la naturaleza, dominando las pasiones (imperturbabilidad).",
    "Utilitarismo (Bentham, Mill): una acción es buena si produce la mayor felicidad para el mayor número. Es consecuencialista: juzga por los resultados.",
    "Ética formal o deontológica de Kant: lo moral es actuar por deber, con buena voluntad y autonomía (la ley moral me la doy yo mismo con la razón). Imperativo categórico: manda sin condiciones («obra de modo que tu máxima pueda ser ley universal»; trata a la humanidad siempre como fin y nunca solo como medio). Imperativo hipotético: manda solo si quieres un fin («si quieres aprobar, estudia»).",
    "Otras: ética de los valores (Scheler), existencialista (Sartre: libertad y responsabilidad total), discursiva (Habermas: validez por el diálogo racional), intuicionismo (Moore: el bien se capta por intuición)."],
   tabla:{t:"Teorías éticas",cab:["Teoría","Autor","¿Qué hace buena una acción?"],filas:[
    ["Eudemonismo","Aristóteles","Conducir a la felicidad por la virtud"],["Hedonismo","Epicuro","Dar placer moderado y paz"],["Estoicismo","Zenón, Séneca","Seguir la razón y dominar las pasiones"],["Utilitarismo","Bentham, Mill","La mayor felicidad para el mayor número"],["Ética del deber","Kant","Hacerse por deber, con buena voluntad"]]},
   claves:[["Eudemonismo","Aristóteles: la felicidad por la virtud, que es el término medio."],
     ["Hedonismo de Epicuro","Placeres moderados y ataraxia (ausencia de perturbación)."],
     ["Utilitarismo","La mayor felicidad para el mayor número: juzga por las consecuencias."],
     ["Imperativo categórico","Kant: deber sin condiciones; tratar a la humanidad siempre como fin."],
     ["Imperativo hipotético","Manda solo si quieres un fin: «si quieres X, haz Y»."],
     ["Acto moral","Consciente, libre y responsable."]],
   errores:["Confundir el utilitarismo (consecuencias) con la ética kantiana (deber).","Creer que el hedonismo de Epicuro busca placeres desenfrenados.","Llamar categórico a un mandato condicionado a un fin."],
   ejemplo:{id:"26II-81",pasos:[
     "María actúa de forma razonada, autónoma, desinteresada y por buena voluntad.",
     "No busca un beneficio ni la mayor utilidad: actúa por deber.",
     "Autonomía, deber y buena voluntad sin condiciones son la ética de Kant: imperativo categórico (D)."],
     idea:"Buena voluntad + deber + autonomía = Kant. Mayor felicidad para más personas = utilitarismo."},
   guiada:[],
   chequeo:[
    {q:"La virtud como término medio entre dos extremos es una idea de",o:["Kant","Aristóteles","Bentham","Epicuro","Sartre"],a:1,e:"Ética a Nicómaco."},
    {q:"«La mayor felicidad para el mayor número» define el",o:["estoicismo","utilitarismo","eudemonismo","formalismo kantiano","intuicionismo"],a:1,e:"Bentham y Mill."},
    {q:"«Si quieres aprobar, estudia» es un imperativo",o:["categórico","hipotético","universal","estético","eudemónico"],a:1,e:"Depende de un fin que puedes querer o no."}],
   prac:[
    {q:"Buscar la ataraxia mediante placeres moderados es propio de",o:["Epicuro","Kant","Mill","Zenón","Scheler"],a:0,e:"Hedonismo epicúreo."},
    {q:"Tratar a las personas siempre como fin y nunca solo como medio es una formulación de",o:["el imperativo categórico de Kant","el utilitarismo","el estoicismo","el hedonismo","el eudemonismo"],a:0,e:"Segunda formulación del imperativo categórico."},
    {q:"Para que un acto sea moral debe ser",o:["consciente, libre y responsable","placentero","útil para la mayoría","legal","aprobado por la sociedad"],a:0,e:"Sin libertad o conocimiento no hay responsabilidad plena."}]}
  ]},

"fis:Dinámica y gravitación":{
  fuente:"Preguntas reales del banco (2023-I a 2027-I) y sus resoluciones. Teoría redactada para Ruta 1250 y verificada con cálculo.",
  lee:[["Puro DECO · Física","https://drive.google.com/file/d/1Kxx77MgrklnADw10HIe5tUeYeFxJOsvY/view"],["Apuntes digitales · Física","https://drive.google.com/drive/folders/1baa5DYY7gGt9376QAPns3TK5IU7MR5uf"]],
  bloques:[
  {id:"din",t:"Leyes de Newton, rozamiento y choques",ts:["Dinámica","Estática con rozamiento","Choques"],
   obj:["Dibujar las fuerzas sobre un cuerpo y escribir F neta = m·a.","Calcular la normal y el rozamiento, también en planos inclinados.","Resolver bloques unidos por cuerdas y choques con conservación de la cantidad de movimiento."],
   concepto:"La fuerza neta sobre un cuerpo es igual a su masa por su aceleración: F neta = m·a (2.ª ley de Newton). Si la fuerza neta es cero, el cuerpo está en reposo o va a velocidad constante (1.ª ley). Todo el problema consiste en dibujar bien las fuerzas.",
   explica:[
    "Paso 1: aísla el cuerpo y dibuja sus fuerzas: peso (mg, hacia abajo), normal (perpendicular a la superficie), tensión (a lo largo de la cuerda), rozamiento (contra el movimiento o contra la tendencia a moverse) y las fuerzas aplicadas.",
    "Paso 2: elige ejes. En la dirección donde no hay movimiento, las fuerzas se equilibran (de ahí sale la normal). En la dirección del movimiento, F neta = m·a.",
    "Rozamiento: cinético f = μk·N cuando ya desliza; estático máximo f = μs·N cuando está «a punto de moverse». Ojo: la normal no siempre es mg. Si una fuerza inclinada levanta el bloque, N = mg − F·senθ; si lo empuja hacia abajo, N = mg + F·senθ.",
    "Plano inclinado θ: el peso se descompone en mg·senθ (a lo largo del plano, hacia abajo) y mg·cosθ (perpendicular). Por eso N = mg·cosθ si no hay otras fuerzas perpendiculares.",
    "Bloques unidos por una cuerda: trátalos como un solo cuerpo para hallar la aceleración (fuerza que mueve el sistema ÷ masa total); luego aísla uno para hallar la tensión.",
    "Choques: en todo choque se conserva la cantidad de movimiento, p = m·v (con signo según el sentido). En un choque totalmente inelástico los cuerpos quedan juntos: m₁v₁ + m₂v₂ = (m₁ + m₂)·v."],
   tabla:{t:"Fuerzas que más aparecen",cab:["Fuerza","Cómo se calcula","Dirección"],filas:[
    ["Peso","mg","Vertical, hacia abajo"],["Normal","Sale del equilibrio perpendicular","Perpendicular a la superficie"],["Rozamiento cinético","μk·N","Contra el movimiento"],["Rozamiento estático máx.","μs·N","Contra la tendencia a moverse"],["Componentes en el plano","mg·senθ y mg·cosθ","A lo largo y perpendicular al plano"]]},
   claves:[["2.ª ley","F neta = m·a."],["Normal","No siempre es mg: depende de las otras fuerzas perpendiculares."],["Rozamiento","f = μ·N (estático máximo: «a punto de moverse»)."],["Plano inclinado","Peso: mg·senθ a lo largo; mg·cosθ perpendicular."],["Sistema de bloques","a = fuerza que mueve ÷ masa total."],["Choque inelástico","m₁v₁ + m₂v₂ = (m₁ + m₂)v."]],
   errores:["Poner N = mg cuando hay una fuerza inclinada o un plano inclinado.","Olvidar que, al subir por una rampa, el peso y el rozamiento frenan a la vez.","Usar la masa de un solo bloque para la aceleración de todo el sistema.","Ignorar el signo de la velocidad en los choques (sentidos opuestos)."],
   ejemplo:{id:"27I-82",pasos:[
     "Mientras el ladrillo sube, lo frenan dos cosas: la componente del peso a lo largo de la rampa (mg·sen37°) y el rozamiento (μ·mg·cos37°).",
     "Desaceleración: a = g(sen37° + μ·cos37°) = 10(0,6 + 0,4 × 0,8) = 9,2 m/s².",
     "Se detiene cuando v = 0: 0 = v₀² − 2ad → d = 100/(2 × 9,2).",
     "d ≈ 5,4 m."],
     idea:"En un plano inclinado, descompón el peso: mg·senθ a lo largo del plano y mg·cosθ contra el plano (de ahí sale la normal)."},
   guiada:[
    {id:"26II-85",pistas:["F tiene una parte horizontal F·cos37° = 0,8F que empuja y una vertical F·sen37° = 0,6F que levanta un poco el bloque: la normal baja.","A punto de moverse, la parte horizontal de F iguala al rozamiento estático máximo: 0,8F = μs·N."],
     pasos:["Vertical: N + 0,6F = 30 → N = 30 − 0,6F.","A punto de moverse: 0,8F = (1/3)(30 − 0,6F).","Multiplica por 3: 2,4F = 30 − 0,6F → 3F = 30.","F = 10 N."],
     mal:{0:"Con 8 N no alcanza: 0,8 × 8 = 6,4 N, pero el rozamiento máximo es (1/3)(30 − 4,8) = 8,4 N.",2:"12 N sí lo mueve, pero no es la mínima. Iguala 0,8F = (1/3)(30 − 0,6F).",3:"7 N no vence el rozamiento. Plantea 0,8F = (1/3)(30 − 0,6F).",4:"9 N se queda corto: 0,8 × 9 = 7,2 N y el rozamiento máximo es (30 − 5,4)/3 = 8,2 N."}},
    {id:"24I-86",pistas:["El bloque que cuelga (4 kg, peso 40 N) jala a todo el sistema; la mesa es lisa, así que no hay rozamiento.","Aceleración del sistema: a = 40 N ÷ (4 + 6) kg. Luego la cuerda es la única fuerza horizontal sobre el bloque de 6 kg: T = 6·a."],
     pasos:["a = 40/(4 + 6) = 4 m/s².","Bloque de 6 kg sobre la mesa: T = 6 × 4.","T = 24 N.","Comprueba con el que cuelga: 40 − T = 4 × 4 → T = 24 N."],
     mal:{0:"23 N no sale. a = 40/10 = 4 m/s² y T = 6 × 4.",1:"20 N sería la mitad del peso que cuelga; la tensión es T = 6·a = 24 N.",3:"26 N no sale. Con a = 4 m/s², el bloque que cuelga cumple 40 − T = 16.",4:"21 N no sale. Revisa: a = 4 m/s² y T = 6 × 4 = 24 N."}}],
   chequeo:[
    {q:"Un bloque de 5 kg sobre un piso liso es empujado con 20 N horizontales. ¿Cuál es su aceleración?",o:["100 m/s²","4 m/s²","0,25 m/s²","15 m/s²","25 m/s²"],a:1,e:"a = F/m = 20/5 = 4 m/s²."},
    {q:"Un bloque reposa en un plano inclinado θ sin otras fuerzas que el peso, la normal y el rozamiento. La normal vale",o:["mg","mg·senθ","mg·cosθ","mg·tanθ","0"],a:2,e:"Perpendicular al plano solo están la normal y mg·cosθ: se equilibran."},
    {q:"En un choque totalmente inelástico…",o:["solo se conserva la energía cinética","se conserva la cantidad de movimiento y los cuerpos quedan juntos","no se conserva nada","cada cuerpo mantiene su velocidad","se conservan la energía cinética y la cantidad de movimiento"],a:1,e:"En todo choque se conserva p. En el totalmente inelástico los cuerpos quedan unidos y se pierde energía cinética."}],
   prac:[
    {q:"Un bloque de 10 kg sobre un piso con μk = 0,2 es jalado con 50 N horizontales. ¿Cuál es su aceleración? (g = 10 m/s²)",o:["5 m/s²","3 m/s²","2 m/s²","7 m/s²","1 m/s²"],a:1,e:"N = 100 N; f = 0,2 × 100 = 20 N; a = (50 − 20)/10 = 3 m/s²."},
    {q:"Un carrito de 2 kg a 5 m/s choca con otro de 3 kg en reposo y quedan unidos. ¿Con qué rapidez se mueven juntos?",o:["2 m/s","5 m/s","3 m/s","2,5 m/s","1 m/s"],a:0,e:"2 × 5 = (2 + 3)v → v = 10/5 = 2 m/s."},
    {q:"Un ascensor sube acelerando a 2 m/s². ¿Qué marca una balanza bajo una persona de 60 kg? (g = 10 m/s²)",o:["600 N","480 N","720 N","660 N","120 N"],a:2,e:"N − mg = ma → N = 60(10 + 2) = 720 N."}]},
  {id:"grav",t:"Gravitación universal y leyes de Kepler",ts:["Leyes de Kepler","Gravitación universal"],
   obj:["Usar F = G·M·m/d² y ver cómo cambia con la distancia.","Calcular el peso o la gravedad a una altura h.","Reconocer las tres leyes de Kepler."],
   concepto:"Dos masas se atraen con una fuerza proporcional al producto de sus masas e inversamente proporcional al cuadrado de la distancia entre sus centros: F = G·M·m/d². Si la distancia se duplica, la fuerza se reduce a la cuarta parte.",
   explica:[
    "La gravedad en la superficie es g = G·M/R². A una altura h (distancia al centro R + h): g(h) = g·R²/(R + h)². El peso cambia igual: W(h) = W(superficie)·R²/(R + h)².",
    "1.ª ley de Kepler (órbitas): los planetas giran en elipses y el Sol está en uno de los focos, no en el centro.",
    "2.ª ley (áreas): la línea Sol–planeta barre áreas iguales en tiempos iguales. Por eso el planeta va más rápido cerca del Sol (perihelio) y más lento lejos (afelio).",
    "3.ª ley (periodos): el cuadrado del periodo es proporcional al cubo de la distancia media: T² ∝ r³. Si r se multiplica por 4, T se multiplica por 8 (porque 4³ = 64 = 8²)."],
   claves:[["Ley de gravitación","F = G·M·m/d²."],["Gravedad a una altura","g(h) = g·R²/(R + h)²."],["1.ª ley de Kepler","Elipse con el Sol en un foco."],["2.ª ley","Áreas iguales en tiempos iguales: más rápido en el perihelio."],["3.ª ley","T² ∝ r³."]],
   errores:["Poner el Sol en el centro de la elipse.","Medir la distancia desde la superficie y no desde el centro del planeta (R + h).","Invertir la 3.ª ley (T³ ∝ r²)."],
   ejemplo:{id:"26I-84",pasos:[
     "I es falsa: el Sol está en uno de los focos de la elipse, no en su centro.",
     "II es verdadera: es la 2.ª ley de Kepler, la de las áreas.",
     "III es falsa: la 3.ª ley dice que el cuadrado del periodo es proporcional al cubo de la distancia media (T² ∝ r³), no al revés.",
     "Respuesta: FVF."],
     idea:"Kepler: elipse con el Sol en un foco; áreas iguales en tiempos iguales; T² ∝ r³."},
   guiada:[
    {id:"24II-87",pistas:["En la superficie el bloque pesa m·g = 1,6 × 10 = 16 N. A la altura h pesa 9 N.","El peso cae con el cuadrado de la distancia al centro: 9/16 = R²/(R + h)². Saca raíz a ambos lados."],
     pasos:["Peso en la superficie: 16 N; a la altura h: 9 N.","9/16 = R²/(R + h)² → 3/4 = R/(R + h).","3(R + h) = 4R → 3h = R.","h = R/3."],
     mal:{0:"Con h = 2R la distancia al centro es 3R y el peso sería 16/9 ≈ 1,8 N, no 9 N.",1:"Con h = R/2 el peso sería 16 × (1/1,5)² ≈ 7,1 N.",3:"Con h = 3R/4 el peso sería 16 × (4/7)² ≈ 5,2 N.",4:"Con h = 4R/3 el peso sería 16 × (3/7)² ≈ 2,9 N."}}],
   chequeo:[
    {q:"Si la distancia entre dos masas se duplica, la fuerza gravitatoria entre ellas…",o:["se duplica","se reduce a la mitad","se reduce a la cuarta parte","se cuadruplica","no cambia"],a:2,e:"F ∝ 1/d²: con 2d, la fuerza es 1/4."},
    {q:"Según la 2.ª ley de Kepler, un planeta va más rápido…",o:["en el afelio","en el perihelio, cuando está más cerca del Sol","siempre igual","cuando pasa por el centro de la elipse","solo cuando está en un foco vacío"],a:1,e:"Para barrer la misma área en el mismo tiempo, cerca del Sol debe ir más rápido."},
    {q:"Un planeta tiene una distancia media al Sol 4 veces mayor que otro. Su periodo es…",o:["4 veces mayor","16 veces mayor","8 veces mayor","2 veces mayor","64 veces mayor"],a:2,e:"T² ∝ r³ → T² es 64 veces mayor → T es 8 veces mayor."}]}]},
"qui:Estequiometría":{
  fuente:"Preguntas reales del banco (2023-II a 2027-I) y sus resoluciones. Teoría redactada para Ruta 1250 y verificada con cálculo.",
  lee:[["Puro DECO · Química","https://drive.google.com/file/d/1yx8D-TMWubNwmWaX_IaSiwxSvyVxTNN4/view"],["Apuntes digitales · Química","https://drive.google.com/drive/folders/142diYcSXek1Bb-Xzw5OfY8ZD2OZw8Wyk"]],
  bloques:[
  {id:"est",t:"El mol y los cálculos con ecuaciones",ts:["Composición centesimal","Estequiometría","Cálculos químicos","Cálculos químicos - uqm","Unidades químicas de masa","Estequiometría-soluciones","Ley de equivalentes","Estequiometría redox","Estequiometría - redox"],
   obj:["Pasar entre gramos, moles, partículas y litros de gas.","Calcular la composición centesimal de un compuesto.","Usar los coeficientes de una ecuación balanceada, con pureza y reactivo limitante."],
   concepto:"La estequiometría cuenta partículas pesándolas. El puente es el mol: 1 mol = 6 × 10²³ partículas = la masa molar en gramos = 22,4 L si es un gas en condiciones normales. En una ecuación balanceada, los coeficientes dicen en qué proporción de moles reaccionan y se forman las sustancias.",
   explica:[
    "Masa molar (M): suma de las masas atómicas de la fórmula. H₂O = 2(1) + 16 = 18 g/mol. Moles: n = m/M.",
    "Partículas: N = n × 6 × 10²³. Gas en condiciones normales (0 °C y 1 atm): V = n × 22,4 L.",
    "Composición centesimal: %E = (masa del elemento en 1 mol del compuesto ÷ masa molar) × 100.",
    "Cálculo con ecuaciones, siempre en este orden: 1) balancea; 2) pasa el dato a moles; 3) usa la proporción de los coeficientes; 4) convierte el resultado a lo que piden (gramos, litros o partículas).",
    "Pureza y rendimiento: si la muestra es 90 % pura, solo el 90 % de su masa reacciona. Si el rendimiento es 80 %, obtienes el 80 % de lo calculado.",
    "Reactivo limitante: el que se acaba primero. Divide los moles de cada reactivo entre su coeficiente; el menor es el limitante y con él se calculan los productos."],
   tabla:{t:"Conversiones con el mol",cab:["Tienes","A moles","De moles a…"],filas:[["Masa (g)","n = m/M","m = n·M"],["Partículas","n = N/(6 × 10²³)","N = n·6 × 10²³"],["Gas en C. N. (L)","n = V/22,4","V = n·22,4"]]},
   claves:[["Mol","6 × 10²³ partículas; su masa en gramos es la masa molar."],["n = m/M","Moles = masa ÷ masa molar."],["22,4 L","Volumen de 1 mol de gas en condiciones normales."],["Coeficientes","Proporción en moles (no en gramos)."],["Pureza","Solo reacciona la parte pura de la muestra."],["Limitante","El reactivo que se acaba primero decide cuánto producto sale."]],
   errores:["Usar la proporción de coeficientes con gramos: es en moles.","Calcular sin balancear la ecuación.","Olvidar la pureza o aplicarla dos veces.","Confundir moles de moléculas (1 mol de H₂) con moles de átomos (2 mol de H)."],
   ejemplo:{id:"26I-93",pasos:[
     "Acetileno puro: 0,90 × 117,0 = 105,3 g.",
     "Moles: M(C₂H₂) = 2(12) + 2(1) = 26 g/mol → 105,3/26 = 4,05 mol.",
     "Ecuación: 2C₂H₂ + 5O₂ → 4CO₂ + 2H₂O. Por cada 2 mol de C₂H₂ salen 4 mol de CO₂: 4,05 × 2 = 8,1 mol de CO₂.",
     "Volumen en condiciones normales: 8,1 × 22,4 = 181,4 L."],
     idea:"Siempre por moles: dato → moles → proporción de coeficientes → lo que piden."},
   guiada:[
    {id:"27I-89",pistas:["Calcula primero la masa molar de C₁₀H₂₀O con C = 12, H = 1, O = 16.","%O = masa del oxígeno en la fórmula ÷ masa molar × 100."],
     pasos:["M = 10(12) + 20(1) + 16 = 156 g/mol.","El oxígeno aporta 16 g por cada mol.","%O = 16/156 × 100 ≈ 10 %."],
     mal:{0:"20 % no sale de la fórmula. Calcula 16/156 × 100.",1:"13 % es el porcentaje de hidrógeno (20/156). Te piden el de oxígeno.",2:"77 % es el porcentaje de carbono (120/156).",3:"26 % no sale. %O = 16/156 × 100 ≈ 10 %."}},
    {id:"24I-89",pistas:["Balancea: el sodio y el yodo fijan 2 NaI y 2 NaOH; luego revisa O e H.","Para II: 1 mol de O₃ necesita 2 mol de NaI, y M(NaI) = 23 + 127 = 150 g/mol."],
     pasos:["Balanceada: O₃ + 2NaI + H₂O → O₂ + I₂ + 2NaOH. Suma de coeficientes: 1 + 2 + 1 + 1 + 1 + 2 = 8 → I es V.","10 mol de O₃ necesitan 20 mol de NaI = 20 × 150 = 3000 g = 3 kg → II es V.","NaI es una sal haloidea (no tiene oxígeno): yoduro de sodio → III es V.","Respuesta: VVV."],
     mal:{1:"I sí es verdadera: la suma de coeficientes balanceados es 8.",2:"I y II son verdaderas: la suma es 8 y se necesitan 20 mol × 150 g/mol = 3 kg.",3:"II es verdadera: 10 mol de O₃ piden 20 mol de NaI = 3000 g.",4:"III también es verdadera: NaI es yoduro de sodio, una sal haloidea."}}],
   chequeo:[
    {q:"¿Cuántos moles hay en 88 g de CO₂? (C = 12; O = 16)",o:["0,5","2","88","4","44"],a:1,e:"M = 12 + 32 = 44 g/mol; n = 88/44 = 2 mol."},
    {q:"¿Qué volumen ocupan 0,5 mol de O₂ en condiciones normales?",o:["22,4 L","11,2 L","44,8 L","5,6 L","16 L"],a:1,e:"V = 0,5 × 22,4 = 11,2 L."},
    {q:"En 2H₂ + O₂ → 2H₂O, con 4 mol de H₂ (y O₂ suficiente) se forman…",o:["2 mol de H₂O","8 mol de H₂O","4 mol de H₂O","1 mol de H₂O","6 mol de H₂O"],a:2,e:"La proporción H₂ : H₂O es 2 : 2 = 1 : 1."}],
   prac:[
    {q:"¿Cuál es el porcentaje de nitrógeno en el NH₃? (N = 14; H = 1)",o:["17,6 %","82,4 %","14 %","75 %","50 %"],a:1,e:"M = 17 g/mol; %N = 14/17 × 100 ≈ 82,4 %."},
    {q:"¿Cuántas moléculas hay en 36 g de agua? (Nₐ = 6 × 10²³)",o:["6 × 10²³","3 × 10²³","1,2 × 10²⁴","3,6 × 10²⁴","2 × 10²³"],a:2,e:"36/18 = 2 mol; 2 × 6 × 10²³ = 1,2 × 10²⁴ moléculas."},
    {q:"CaCO₃ → CaO + CO₂. ¿Cuántos gramos de CaO se obtienen de 200 g de una muestra con 50 % de CaCO₃? (Ca = 40; C = 12; O = 16)",o:["112 g","56 g","100 g","28 g","44 g"],a:1,e:"CaCO₃ puro: 100 g = 1 mol → 1 mol de CaO = 56 g."}]}]},
"qui:Química orgánica":{
  fuente:"Preguntas reales del banco (2023-II a 2027-I) y sus resoluciones. Teoría redactada para Ruta 1250.",
  lee:[["Puro DECO · Química","https://drive.google.com/file/d/1yx8D-TMWubNwmWaX_IaSiwxSvyVxTNN4/view"],["Apuntes digitales · Química","https://drive.google.com/drive/folders/142diYcSXek1Bb-Xzw5OfY8ZD2OZw8Wyk"]],
  bloques:[
  {id:"hc",t:"El carbono y los hidrocarburos",ts:["Hidrocarburos","Química orgánica-hidrocarburos","Enlace y compuestos orgánicos","Compuestos aromáticos","Isomería"],
   obj:["Reconocer la hibridación de cada carbono (sp³, sp², sp).","Contar enlaces sigma y pi y clasificar carbonos.","Diferenciar alcanos, alquenos, alquinos y aromáticos, y sus reacciones."],
   concepto:"El carbono forma cuatro enlaces. Según cuántos enlaces múltiples tenga, cambia su hibridación y su forma: sp³ (solo enlaces simples, tetraédrico, 109,5°), sp² (un doble enlace, plano, 120°) y sp (un triple enlace o dos dobles, lineal, 180°). Los hidrocarburos solo tienen C e H.",
   explica:[
    "Fórmulas generales de cadena abierta: alcano CₙH₂ₙ₊₂ (solo simples), alqueno CₙH₂ₙ (un doble), alquino CₙH₂ₙ₋₂ (un triple). Un cicloalcano también es CₙH₂ₙ.",
    "Enlaces: simple = 1 sigma (σ); doble = 1 σ + 1 pi (π); triple = 1 σ + 2 π. Número de enlaces pi = dobles + 2 × triples.",
    "Tipos de carbono: primario (unido a 1 carbono), secundario (a 2), terciario (a 3) y cuaternario (a 4).",
    "Reacciones: los alcanos dan sustitución y combustión. Alquenos y alquinos dan adición: se rompe el enlace π y se suman átomos. Saturar 1 mol de alquino necesita 2 mol de H₂ (4 mol de átomos de H).",
    "Combustión completa: hidrocarburo + O₂ → CO₂ + H₂O. Ejemplo: 2C₂H₂ + 5O₂ → 4CO₂ + 2H₂O. El hidrocarburo se oxida: es el agente reductor.",
    "Aromáticos: tienen el anillo bencénico (C₆H₆), con sus seis carbonos sp² y enlaces π que resuenan. Un anillo con algunos dobles enlaces no es aromático por eso.",
    "Isomería geométrica: en un doble enlace con dos grupos distintos en cada carbono. Cis = los grupos del mismo lado; trans = en lados opuestos. En el sistema Z/E, cis suele corresponder a Z (juntos) y trans a E (opuestos)."],
   tabla:{t:"Hibridación del carbono",cab:["Enlaces del C","Hibridación","Forma y ángulo"],filas:[["4 simples","sp³","Tetraédrica, 109,5°"],["1 doble + 2 simples","sp²","Plana trigonal, 120°"],["1 triple + 1 simple (o 2 dobles)","sp","Lineal, 180°"]]},
   claves:[["sp³ / sp² / sp","Solo simples / un doble / un triple."],["Enlaces pi","Doble = 1 π; triple = 2 π."],["Alcanos","CₙH₂ₙ₊₂; sustitución y combustión."],["Alquenos y alquinos","CₙH₂ₙ y CₙH₂ₙ₋₂; reacciones de adición."],["Aromáticos","Anillo bencénico; carbonos sp²."],["Cis = Z, trans = E","Isomería geométrica en el doble enlace."]],
   errores:["Decir que los carbonos de un triple enlace son sp²: son sp.","Contar enlaces pi en los enlaces simples.","Llamar aromático a cualquier anillo con dobles enlaces.","Confundir moles de H₂ con moles de átomos de H al saturar."],
   ejemplo:{id:"25I-94",pasos:[
     "A: C₂H₂ + 2H₂ → C₂H₆. Saturar 1 mol de etino necesita 2 mol de H₂ = 4 mol de átomos de H. Verdadera.",
     "B: es lineal, pero sus carbonos (triple enlace) son sp, no sp². Falsa.",
     "C: 260 g ÷ 26 g/mol = 10 mol de C₂H₂. Por la ecuación 2C₂H₂ + 5O₂ → 4CO₂ + 2H₂O salen 20 mol de CO₂ = 1,2 × 10²⁵ moléculas, no 10²⁴. Falsa.",
     "D: el etino se oxida, así que es el agente reductor. E: los coeficientes suman 2 + 5 + 4 + 2 = 13. Ambas falsas.",
     "Respuesta: A."],
     idea:"Triple enlace → carbonos sp, molécula lineal y 2 H₂ para saturarla."},
   guiada:[
    {id:"25II-94",pistas:["Cis: los grupos de mayor prioridad del mismo lado del doble enlace. Trans: en lados opuestos.","En el sistema Z/E, Z significa «juntos» y E «opuestos». ¿Cómo están los –COOH en el ácido trans?"],
     pasos:["El ácido fumárico es el trans-but-2-endioico: sus dos –COOH están en lados opuestos del doble enlace.","En el sistema Z/E, grupos de mayor prioridad en lados opuestos = E.","B falla porque no todos sus átomos son sp² (el O de los –OH no lo es y el H no se hibrida); C falla porque el derivado dihidroxilado da otro producto al hidrogenarse.","Respuesta: A."],
     mal:{1:"No todos los átomos son sp²: el oxígeno de los –OH no lo es y el hidrógeno no se hibrida.",2:"El fumárico y el maleico sí dan el mismo producto al hidrogenarse, pero el derivado 2,3-dihidroxi da otro: «todos» la hace falsa.",3:"Eso no se deduce de su estructura. La afirmación segura es la del sistema Z/E.",4:"La palabra «solo» la hace falsa: con sus dobles enlaces y grupos –OH puede dar otras reacciones."}}],
   chequeo:[
    {q:"¿Qué hibridación tienen los carbonos del eteno, CH₂=CH₂?",o:["sp³","sp²","sp","sp³d","No tienen"],a:1,e:"Cada carbono tiene un doble enlace: sp²."},
    {q:"La fórmula general de los alquinos de cadena abierta es…",o:["CₙH₂ₙ₊₂","CₙH₂ₙ","CₙH₂ₙ₋₂","CₙHₙ","CₙH₂ₙ₋₆"],a:2,e:"Un triple enlace quita 4 H respecto del alcano: CₙH₂ₙ₋₂."},
    {q:"¿Cuántos enlaces pi tiene CH≡C–CH=CH₂?",o:["1","2","3","4","5"],a:2,e:"Triple = 2 π y doble = 1 π: en total 3."}],
   prac:[
    {q:"CH₂=CH₂ + Br₂ → CH₂Br–CH₂Br es una reacción de…",o:["sustitución","adición","eliminación","combustión","neutralización"],a:1,e:"Se rompe el enlace π y se suman dos átomos de Br: adición."},
    {q:"Un alcano de 5 carbonos tiene la fórmula…",o:["C₅H₁₀","C₅H₁₂","C₅H₈","C₅H₅","C₅H₁₄"],a:1,e:"CₙH₂ₙ₊₂ con n = 5: C₅H₁₂."},
    {q:"En el 2-metilpropano, CH₃–CH(CH₃)–CH₃, el carbono central es…",o:["primario","secundario","terciario","cuaternario","aromático"],a:2,e:"Está unido a tres carbonos: terciario."}]},
  {id:"ox",t:"Funciones oxigenadas y nitrogenadas",ts:["Funciones oxigenadas","Química orgánica - funciones orgánicas oxigenadas","Compuestos nitrogenados","Proteínas","Química orgánica"],
   obj:["Reconocer alcohol, éter, aldehído, cetona, ácido, éster, amina y amida.","Aplicar la jerarquía de grupos para nombrar.","Predecir oxidaciones, esterificación y solubilidad."],
   concepto:"Un grupo funcional es el átomo o grupo de átomos que da a la molécula sus propiedades. Con oxígeno: alcohol (–OH), éter (–O–), aldehído (–CHO), cetona (–CO–), ácido carboxílico (–COOH) y éster (–COO–). Con nitrógeno: amina (–NH₂) y amida (–CONH₂).",
   explica:[
    "Jerarquía para nombrar (de mayor a menor): ácido carboxílico > éster > amida > aldehído > cetona > alcohol > amina > éter. El grupo de mayor jerarquía da la terminación del nombre.",
    "Alcoholes: primario (el carbono del –OH está unido a 1 carbono), secundario (a 2) o terciario (a 3). Oxidación: alcohol primario → aldehído → ácido carboxílico; alcohol secundario → cetona; el terciario casi no se oxida. Ganar oxígeno o perder hidrógeno es oxidación.",
    "Esterificación: ácido + alcohol → éster + agua. El ácido pierde el –OH completo y el alcohol solo su H. Se nombra «…ato de …ilo»: ácido acético + etanol → acetato de etilo.",
    "El carboxilo (–COOH) es un solo grupo: un carbonilo (C=O) y un hidroxilo (–OH) en el mismo carbono. No es «cetona + alcohol».",
    "Solubilidad: –OH, –COOH y –NH₂ son polares y forman puentes de hidrógeno con el agua. Una cadena larga de C e H es apolar y vuelve la molécula poco soluble.",
    "Proteínas: cadenas de aminoácidos (cada uno con –COOH y –NH₂) unidas por enlaces peptídicos (tipo amida). El calor y el pH extremo las desnaturalizan."],
   tabla:{t:"Grupos funcionales",cab:["Función","Grupo","Nombre"],filas:[["Ácido carboxílico","–COOH","ácido …-oico"],["Éster","–COO–","…-ato de …-ilo"],["Amida","–CONH₂","…-amida"],["Aldehído","–CHO","…-al"],["Cetona","–CO–","…-ona"],["Alcohol","–OH","…-ol"],["Amina","–NH₂","…-amina"],["Éter","–O–","… éter"]]},
   claves:[["Jerarquía","Ácido > éster > amida > aldehído > cetona > alcohol > amina > éter."],["Oxidación","Alcohol 1.° → aldehído → ácido; alcohol 2.° → cetona."],["Esterificación","Ácido + alcohol → éster + agua."],["Carboxilo","C=O y –OH en el mismo carbono: un solo grupo."],["Polar o apolar","–OH, –COOH y –NH₂ dan solubilidad; las cadenas largas la quitan."]],
   errores:["Ver el –COOH como «cetona + alcohol».","Llamar reducción al paso de aldehído a ácido: gana oxígeno, es oxidación.","Nombrar por el grupo de menor jerarquía.","Creer que cualquier molécula con un –OH es muy soluble en agua."],
   ejemplo:{id:"25II-93",pasos:[
     "I: el sustituyente a es un –OH (hidroxilo): polar y forma puentes de hidrógeno. V.",
     "II: b es el grupo carbamoilo (de amida). Por resonancia, el enlace C–N tiene carácter de doble enlace y sus átomos quedan en un mismo plano. V.",
     "III: c es un carboxilo (–COOH): carbonilo e hidroxilo en el mismo carbono, no una cetona más un alcohol. F.",
     "Respuesta: VVF."],
     idea:"El carboxilo es un solo grupo funcional, aunque tenga un C=O y un –OH."},
   guiada:[
    {id:"25II-92",pistas:["I: son cadenas largas casi solo de C e H con muchos dobles enlaces (polienos). ¿Polares o apolares?","III: el retinal es un aldehído (–CHO) y el ácido retinoico tiene –COOH. Ganar oxígeno, ¿es oxidación o reducción?"],
     pasos:["I: polienos de C e H, apolares: poco solubles en agua. V.","II: tienen más de cuatro metilos (β-caroteno 10; retinal, retinol y ácido retinoico, 5). F.","III: aldehído → ácido carboxílico es una oxidación, no una reducción. F.","Respuesta: VFF."],
     mal:{0:"II es falsa: hay más de cuatro restos metilo.",1:"II y III son falsas: hay más de cuatro metilos y aldehído → ácido es oxidación.",2:"I es verdadera: son polienos apolares, poco solubles en agua.",3:"I es verdadera: cadenas largas de C e H, apolares."}},
    {id:"24II-93",pistas:["En un benceno con dos sustituyentes: 1,2 = orto; 1,3 = meta; 1,4 = para. El –COOH manda: es la posición 1.","En la esterificación, el ácido pierde el –OH completo (se rompe el enlace C–O) y el alcohol pierde solo su H."],
     pasos:["I: el Cl está en el carbono 3 respecto del –COOH → meta. V.","II: no se rompe el O–H del carboxilo, sino el enlace C–OH: el –OH del ácido sale con el H del alcohol como agua. F.","III: según la clave es falsa: el nombre «bencilo» corresponde a C₆H₅–CH₂–OH; revisa en la figura qué alcohol participa.","Respuesta: VFF."],
     mal:{0:"II es falsa: en la esterificación el ácido pierde el –OH completo (enlace C–O).",1:"I es verdadera: el Cl está en posición 3 respecto del –COOH, es decir, meta.",2:"II es falsa: no se rompe el O–H del carboxilo sino el C–OH.",3:"III es falsa según la clave: el nombre del éster no corresponde al alcohol de la figura."}}],
   chequeo:[
    {q:"El grupo funcional de los ácidos carboxílicos es…",o:["–OH","–CHO","–COOH","–CO–","–NH₂"],a:2,e:"Carboxilo: –COOH."},
    {q:"La oxidación de un alcohol secundario produce…",o:["un aldehído","una cetona","un ácido carboxílico","un éter","un alcano"],a:1,e:"Alcohol 2.° → cetona."},
    {q:"Ácido acético + etanol → ? + agua",o:["acetato de etilo","éter dietílico","acetona","etanal","metanol"],a:0,e:"Esterificación: el éster es acetato (etanoato) de etilo."}],
   prac:[
    {q:"¿Qué grupo tiene mayor jerarquía al nombrar un compuesto?",o:["Alcohol","Cetona","Aldehído","Ácido carboxílico","Amina"],a:3,e:"El ácido carboxílico encabeza la jerarquía."},
    {q:"CH₃–CH₂–CHO se llama…",o:["propanol","propanona","propanal","ácido propanoico","propano"],a:2,e:"Tres carbonos con –CHO en el extremo: propanal."},
    {q:"Los aminoácidos de una proteína se unen por enlaces…",o:["glucosídicos","peptídicos (tipo amida)","éster","fosfodiéster","puente de hidrógeno"],a:1,e:"El –COOH de un aminoácido y el –NH₂ del siguiente forman un enlace peptídico."}]}]},
"bio:Genética":{
  fuente:"Preguntas reales del banco (2023-I a 2027-I). Teoría redactada para Ruta 1250 (leyes de Mendel y citogenética básica).",
  lee:[["Puro DECO · Biología","https://drive.google.com/file/d/1YgBv8Aos8vzmlKs54hQHtyWFobWU_hKJ/view"],["Apuntes digitales · Biología","https://drive.google.com/drive/folders/1LyATsLLVJDXZqilgnwr73lPp-ghpBsX6"]],
  bloques:[
  {id:"gen",t:"Mendel, cruces y alteraciones cromosómicas",ts:["Genética","Citogenética"],
   obj:["Diferenciar gen, alelo, genotipo y fenotipo.","Resolver cruces de uno y dos genes y escribir gametos.","Reconocer los síndromes cromosómicos más preguntados."],
   concepto:"Un gen es un fragmento de ADN con información para un carácter; sus variantes son los alelos. Cada persona tiene dos alelos de cada gen, uno de cada progenitor. El genotipo es la combinación de alelos (AA, Aa, aa) y el fenotipo es el carácter que se ve.",
   explica:[
    "Dominante (A): se expresa con una sola copia. Recesivo (a): solo se ve en aa. Homocigoto o puro: AA o aa. Heterocigoto: Aa (portador si el carácter es recesivo).",
    "1.ª ley de Mendel (segregación): los dos alelos se separan al formar los gametos; cada gameto lleva uno solo. Aa × Aa → 1 AA : 2 Aa : 1 aa (fenotipos 3 : 1). Aa × aa → 1/2 Aa y 1/2 aa.",
    "2.ª ley (distribución independiente): genes en cromosomas distintos se reparten por separado. Un dihíbrido AaBb forma 4 tipos de gametos: AB, Ab, aB y ab. AaBb × AaBb da fenotipos 9 : 3 : 3 : 1.",
    "Cada hijo es un sorteo independiente: que el primero saliera sano no cambia la probabilidad del siguiente. Si el gen es autosómico, el sexo del hijo tampoco cambia nada.",
    "Herencia ligada al X (daltonismo, hemofilia): el varón (XY) tiene un solo X, así que con un alelo recesivo ya lo manifiesta. Los hijos varones reciben su X de la madre.",
    "Citogenética: el ser humano tiene 46 cromosomas: 44 autosomas + XX o XY. Alteraciones numéricas: síndrome de Down (trisomía 21, de un autosoma), Klinefelter (44 + XXY), Turner (44 + X0) y triple X o superhembra (44 + XXX).",
    "Cromosomas homólogos: tienen la misma forma y los mismos loci (lugares de los genes), pero pueden llevar alelos distintos, porque uno viene del padre y otro de la madre."],
   tabla:{t:"Cruces más preguntados",cab:["Cruce","Genotipos","Fenotipos"],filas:[["AA × aa","100 % Aa","100 % dominante"],["Aa × Aa","1 AA : 2 Aa : 1 aa","3 dominante : 1 recesivo"],["Aa × aa","1 Aa : 1 aa","50 % y 50 %"],["AaBb × AaBb","16 combinaciones","9 : 3 : 3 : 1"]]},
   claves:[["Alelo","Variante de un gen; tienes dos por gen."],["Genotipo y fenotipo","Los alelos que tienes y el carácter que se ve."],["Segregación","Cada gameto lleva un solo alelo de cada gen."],["Dihíbrido AaBb","Gametos AB, Ab, aB, ab."],["Down","Trisomía 21: alteración numérica de un autosoma."],["Klinefelter / Turner","44 + XXY / 44 + X0."]],
   errores:["Creer que los hijos anteriores cambian la probabilidad del siguiente.","Confundir autosomas (cromosomas somáticos) con gonosomas (sexuales).","Escribir gametos con dos alelos del mismo gen (Pp): cada gameto lleva uno.","Confundir locus (lugar del gen) con alelo (variante)."],
   ejemplo:{id:"26II-100",pasos:[
     "El macho albino es aa. La hembra portadora (sana) es Aa.",
     "aa × Aa → la mitad de las crías Aa (pigmentación normal) y la mitad aa (albinas).",
     "Es un gen autosómico: el sexo de la cría no importa, y que la primera haya salido sana tampoco.",
     "Probabilidad de que la cría hembra sea albina: 1/2 = 50 %."],
     idea:"Cada cría es un sorteo nuevo con las mismas probabilidades."},
   guiada:[
    {id:"23I-99",pistas:["Puros = homocigotos: PPGG × ppgg. ¿Qué genotipo tiene toda la F1?","Un gameto lleva un alelo de cada gen. Combina P o p con G o g."],
     pasos:["Padres puros: PPGG × ppgg.","Toda la F1 es PpGg.","Por segregación y distribución independiente, cada gameto lleva un alelo P o p y uno G o g.","Gametos de la F1: PG, Pg, pG y pg."],
     mal:{1:"GG y pp no son gametos: un gameto lleva un solo alelo de cada gen.",2:"Pp, PP, Gg y gg son genotipos, no gametos.",3:"Pp, Gg, GG y PP son genotipos. Un gameto lleva un alelo de cada gen: PG, Pg, pG, pg.",4:"PP, GG y pp tienen dos alelos del mismo gen: no son gametos."}},
    {id:"27I-100b",pistas:["Turner tiene un solo cromosoma sexual: X0.","Klinefelter es un varón con un X de más; la superhembra, una mujer con un X de más."],
     pasos:["Klinefelter: 44 + XXY → b.","Superhembra (triple X): 44 + XXX → c.","Turner: 44 + X0 → a.","Respuesta: Ib, IIc, IIIa."],
     mal:{1:"Klinefelter no es X0: es XXY, un varón con un X de más.",2:"Klinefelter no es XXX: esa es la superhembra.",3:"La superhembra no es X0 sino XXX; X0 es Turner.",4:"Klinefelter es XXY, no X0."}}],
   chequeo:[
    {q:"En el cruce Aa × Aa, ¿qué porcentaje de los hijos muestra el carácter recesivo?",o:["0 %","25 %","50 %","75 %","100 %"],a:1,e:"Solo aa, que es 1 de 4."},
    {q:"Un varón daltónico (XᵈY) y una mujer no portadora (XᴰXᴰ). Sus hijos varones serán…",o:["todos daltónicos","50 % daltónicos","todos de visión normal","25 % daltónicos","todos portadores"],a:2,e:"Los hijos varones reciben el X de la madre, que es normal."},
    {q:"El síndrome de Down es…",o:["una monosomía del X","una trisomía del cromosoma 21","una deleción del cromosoma 5","una trisomía de los cromosomas sexuales","una translocación del cromosoma 16"],a:1,e:"Tres copias del cromosoma 21: alteración numérica de un autosoma."}],
   prac:[
    {q:"¿Cuántos tipos de gametos forma un individuo AaBbCC?",o:["2","4","6","8","16"],a:1,e:"2 (A/a) × 2 (B/b) × 1 (C) = 4."},
    {q:"Dos padres sanos portadores de albinismo (Aa × Aa). ¿Probabilidad de un hijo con pigmentación normal?",o:["25 %","50 %","75 %","100 %","0 %"],a:2,e:"AA + Aa = 3 de 4."},
    {q:"Los cromosomas homólogos…",o:["tienen los mismos loci, aunque pueden llevar alelos distintos","tienen siempre los mismos alelos","tienen distinta forma y tamaño","llevan genes distintos","vienen ambos del padre"],a:0,e:"Mismos genes en los mismos lugares; los alelos pueden diferir porque cada uno viene de un progenitor."}]}]},
"hlm:Orden y deducción":{
  fuente:"Preguntas reales del banco (2023-I a 2027-I). Estrategias redactadas para Ruta 1250.",
  lee:[["Puro DECO · Razonamiento matemático","https://drive.google.com/file/d/1jdagiD7lcBFkpqAFomHbNdb-46Sf25eF/view"],["PPTs RM (Prof. Flash)","https://drive.google.com/drive/folders/1AH9d-CWk4rslCwS0oQZfO10xD8ElZWm_"]],
  bloques:[
  {id:"ded",t:"Orden de información, deducción y verdades o mentiras",ts:["Ordenamiento circular","Deducción","Verdades y mentiras","Orden de información (ordenamiento circular)","Razonamiento deductivo","Relación de parentesco","Orden de información"],
   obj:["Elegir el esquema correcto: línea, círculo, tabla o árbol.","Ubicar primero los datos fijos y descartar con cada pista.","Resolver verdades y mentiras suponiendo y buscando contradicciones."],
   concepto:"En estos problemas no se calcula: se ordenan datos. Haz un esquema (línea, círculo, tabla o árbol) y llena primero los datos fijos; luego los que dependen de ellos. Cada pista descarta posibilidades hasta que solo queda una.",
   explica:[
    "Orden lineal: dibuja una línea con sus extremos (más alto–más bajo, izquierda–derecha). «A está a la izquierda de B» no significa que estén juntos; «junto y a la izquierda» sí.",
    "Orden circular: la derecha y la izquierda se toman desde la persona sentada, mirando al centro. Para ella, su derecha va en sentido antihorario visto desde arriba. «Frente a» = diametralmente opuesto (asientos simétricos y en número par).",
    "Tablas de doble entrada: cuando hay nombres, apellidos, profesiones y edades, arma una tabla y marca ✓ o ✗. Si en una fila o columna queda un solo hueco libre, ese es el dato.",
    "Frases como «Alva fue a la casa del médico» o «Orlando es amigo del médico» dicen que son personas distintas: úsalas para descartar.",
    "Verdades y mentiras: supón que alguien dice la verdad y revisa si aparece una contradicción. Una frase como «todos somos mentirosos» no la puede decir un veraz: quien la dice miente.",
    "Parentesco: dibuja el árbol con una generación por fila. Lee la frase de atrás hacia adelante: «la hija de mi hija» es mi nieta."],
   claves:[["Esquema primero","Línea, círculo, tabla o árbol según el problema."],["Datos fijos","Ubica primero lo que no depende de otros datos."],["Mesa circular","Izquierda y derecha mirando al centro; «frente» = opuesto."],["Tabla de doble entrada","Marca ✓ y ✗; el único hueco libre es la respuesta."],["Verdades y mentiras","Supón un caso y busca la contradicción."]],
   errores:["Leer «a la izquierda» como «junto y a la izquierda».","En la mesa circular, tomar la izquierda desde tu vista y no desde la de la persona.","Llenar la tabla con suposiciones sin anotar lo que descartaste.","No verificar todas las condiciones al final."],
   ejemplo:{id:"26I-29",pasos:[
     "La primera dice «todos somos mentirosos». Si dijera la verdad, ella también sería mentirosa: contradicción. Entonces miente, y también es falso que «no hay más de seis»: hay más de 6 personas.",
     "La segunda dice «no hay más de siete» y «algunos son mentirosos». Lo segundo es cierto (la primera miente), así que dice la verdad: hay como máximo 7. Junto con lo anterior, son 7.",
     "La tercera dice «hay ocho»: falso, así que miente. Entonces también es falso que haya al menos tres mentirosos.",
     "Mentirosos: la primera y la tercera, 2. Respuesta: 7 y 2."],
     idea:"Empieza por la frase que se contradice sola: quien la dice miente seguro."},
   guiada:[
    {id:"25II-27",pistas:["¿Quién NO puede ser el médico? Alva fue a su casa y Kuong es su amigo: el médico no es Alva ni Kuong.","Orlando es amigo del médico y «Narváez y Óscar» son dos personas distintas. ¿Quién queda para ser el médico Narváez?"],
     pasos:["El médico (40 años) no es Alva ni Kuong: se apellida Narváez.","No es Orlando (es su amigo) ni Óscar (Óscar no es Narváez): César Narváez es el médico.","El contador, el mayor (42), no es Narváez ni Óscar: es Orlando. Óscar es el abogado, de 37.","Respuesta: César se apellida Narváez y Óscar tiene 37 años."],
     mal:{0:"Orlando no es Narváez: es amigo del médico, que se apellida Narváez.",1:"Orlando tiene 42: es el contador, el mayor.",2:"Óscar no puede ser Narváez: la pista habla de «Narváez y Óscar», dos personas.",3:"Orlando no es Narváez, y César tiene 40 (es el médico)."}},
    {id:"23I-20",pistas:["Nancy es la única hija de Carlos y Maribel.","Daniela es hija de Nancy. ¿Qué es la hija de tu hija?"],
     pasos:["Carlos y Maribel son esposos; su única hija es Nancy.","Nancy es madre de Daniela.","La hija de mi hija es mi nieta: Daniela es nieta de Carlos."],
     mal:{0:"Bisnieta sería la hija de un nieto. Daniela es hija de Nancy, que es hija de Carlos.",1:"La hija de Carlos es Nancy, no Daniela.",3:"Sobrina sería la hija de un hermano de Carlos.",4:"Nuera es la esposa de un hijo."}}],
   chequeo:[
    {q:"Ana es más alta que Bea y Bea es más alta que Ceci. ¿Quién es la más baja?",o:["Ana","Bea","Ceci","No se puede saber","Ana y Ceci"],a:2,e:"Orden: Ana > Bea > Ceci."},
    {q:"Seis personas en una mesa circular con asientos simétricos. Entre dos que están frente a frente hay…",o:["1 persona a cada lado","2 personas a cada lado","3 personas a cada lado","nadie","depende"],a:1,e:"Quedan 4 personas, 2 por cada lado."},
    {q:"¿Qué es para mí la hermana de mi padre?",o:["Prima","Tía","Sobrina","Abuela","Cuñada"],a:1,e:"La hermana de mi padre es mi tía."}],
   prac:[
    {q:"Cinco amigos en fila: Luis está a la derecha de Pedro y a la izquierda de Raúl; Pedro está a la derecha de Mario; Raúl está a la izquierda de Saúl. ¿Quién está en el extremo izquierdo?",o:["Pedro","Mario","Luis","Saúl","Raúl"],a:1,e:"De izquierda a derecha: Mario, Pedro, Luis, Raúl, Saúl."},
    {q:"De tres hermanos, solo uno miente. A: «Yo digo la verdad». B: «A miente». C: «B miente». ¿Quién miente?",o:["A","B","C","Ninguno","No se puede saber"],a:1,e:"Si B miente, A y C dicen la verdad: un solo mentiroso. Si mintiera A o C, habría dos."},
    {q:"Ana, Bruno, Ceci y Dino se sientan en una mesa circular de 4 asientos simétricos. Ana está frente a Bruno y Ceci está a la derecha de Ana. ¿Quién está a la izquierda de Ana?",o:["Bruno","Ceci","Dino","Nadie","No se puede saber"],a:2,e:"Ana tiene a Bruno al frente y dos vecinos: Ceci a la derecha y Dino a la izquierda."}]},
  {id:"dep",t:"Situaciones deportivas y puntos cardinales",ts:["Situaciones deportivas","Rumbos y puntos cardinales","Puntos cardinales"],
   obj:["Reconstruir marcadores con la tabla de goles a favor y en contra.","Contar partidos de un torneo todos contra todos.","Descomponer recorridos con rumbos y hallar la distancia final."],
   concepto:"En la tabla de un torneo todo cuadra: en cada partido, los goles a favor de un equipo son los goles en contra del otro. Por eso la suma de goles a favor de todos los equipos es igual a la suma de goles en contra. Con eso y las pistas, reconstruyes cada marcador.",
   explica:[
    "Con n equipos en una rueda todos contra todos se juegan n(n − 1)/2 partidos, y cada equipo juega n − 1.",
    "Total de goles del torneo = ΣGF = ΣGC. Los goles de los partidos de un equipo son su GF + GC; como cada partido aparece en dos equipos, sumando los de todos se cuenta cada partido dos veces.",
    "Arma la lista de partidos (A–B, A–C, B–C…) y llena primero los que tienen un dato directo (un empate, una diferencia de goles). Luego completa con lo que le falta a cada equipo para llegar a su GF y GC.",
    "Puntos cardinales: N30°E significa que desde el norte giras 30° hacia el este. Un tramo L con rumbo N θ° E avanza L·cosθ al norte y L·senθ al este.",
    "Suma todo lo que va al norte (restando el sur) y todo lo que va al este (restando el oeste). La distancia final es la hipotenusa: d = √(x² + y²)."],
   claves:[["ΣGF = ΣGC","Los goles a favor del torneo igualan a los goles en contra."],["Partidos","n equipos en una rueda: n(n − 1)/2 partidos."],["Rumbo N θ° E","Desde el norte, girando θ hacia el este."],["Componentes","Norte: L·cosθ; este: L·senθ."],["Distancia final","d = √(x² + y²)."]],
   errores:["Olvidar que cada partido aparece en la fila de los dos equipos.","Confundir N30°E con E30°N.","Sumar las distancias de los tramos en vez de sus componentes."],
   ejemplo:{id:"24II-22",pasos:[
     "Goles en los partidos de A: 8 + 7 = 15; de B: 10 + 11 = 21; de C: 9 + 9 = 18. Cada partido se cuenta dos veces: en total hubo (15 + 21 + 18)/2 = 27 goles.",
     "El partido B–C es el que no juega A: 27 − 15 = 12 goles. Igual, A–B = 27 − 18 = 9 goles.",
     "A–B: x + y = 9 y x − y = 3 → A 6, B 3.",
     "B hizo 10 goles: en B–C, 10 − 3 = 7. Recibió 11: en B–C, 11 − 6 = 5. Resultado: B 7 − C 5."],
     idea:"Cada partido aparece dos veces: usa los totales y ve restando lo que ya sabes."},
   guiada:[
    {id:"26II-22",pistas:["Empieza por M: tiene dos empates (con P y con Q) y M–Q tiene el doble de goles que M–P. Un empate tiene un número par de goles: prueba M–P 1-1 y M–Q 2-2.","M hizo 6 y recibió 5. En su tercer partido (contra N) le quedan 6 − 3 = 3 a favor y 5 − 3 = 2 en contra."],
     pasos:["M–P 1-1 y M–Q 2-2. Entonces M–N terminó 3-2.","N ya hizo 2 y recibió 3 ante M. Le quedan 6 goles a favor y 1 en contra para sus partidos con P y Q.","Sin más empates y con goles en todos los partidos: N–P 4-1 y N–Q 2-0. Luego P–Q 3-1 completa a P (GF 5, GC 6) y a Q (GF 3, GC 7).","En N vs Q hubo 2 goles."],
     mal:{0:"Con 3 goles en N–Q no cuadran los totales de P y Q. Revisa cuánto le queda a N después de jugar con M.",2:"Con 4 goles en N–Q, P o Q no llegan a sus GF y GC.",3:"Con 5 goles no cuadra: a N solo le quedan 6 a favor y 1 en contra para dos partidos.",4:"6 goles en un partido no deja goles para N–P, y en todos los partidos hubo goles."}}],
   chequeo:[
    {q:"En una rueda de todos contra todos con 5 equipos, ¿cuántos partidos se juegan?",o:["5","10","20","25","4"],a:1,e:"5 × 4 / 2 = 10."},
    {q:"En un torneo, la suma de los goles a favor de todos los equipos es 18. La suma de los goles en contra es…",o:["9","18","36","No se puede saber","0"],a:1,e:"Cada gol a favor de uno es un gol en contra de otro."},
    {q:"Caminas 3 km al norte y luego 4 km al este. ¿A qué distancia estás del punto de partida?",o:["7 km","1 km","5 km","12 km","25 km"],a:2,e:"√(3² + 4²) = 5 km."}],
   prac:[
    {q:"Torneo de tres equipos, todos contra todos. A: GF 4, GC 1; B: GF 2, GC 3; C: GF 1, GC 3. Si A–B terminó 2-1, ¿cómo terminó A–C?",o:["2-0","3-0","1-0","2-1","3-1"],a:0,e:"A hizo 4 − 2 = 2 y recibió 1 − 1 = 0 en A–C. Comprueba: B–C 1-1."},
    {q:"Un auto avanza 10 km con rumbo N60°E. ¿Cuánto avanzó hacia el norte?",o:["5 km","5√3 km","10 km","8 km","√3 km"],a:0,e:"Norte = 10·cos60° = 5 km."},
    {q:"En un torneo de 6 equipos, todos contra todos en una rueda, cada equipo juega…",o:["6 partidos","5 partidos","15 partidos","30 partidos","3 partidos"],a:1,e:"Juega contra cada uno de los otros 5."}]}]},

"hv:Compatibilidad e incompatibilidad":{
  fuente:"Preguntas reales del banco (2024-I a 2027-I). Estrategias redactadas para Ruta 1250.",
  lee:[["Puro DECO · Razonamiento verbal","https://drive.google.com/file/d/1QtapDh7tOVG8wgi9I7lOWC7fHzT_Aew6/view"]],
  bloques:[
  {id:"comp",t:"Compatible o incompatible con el texto",ts:["Compatibilidad","Incompatibilidad","Afirmaciones","Comprensión de texto: incompatibilidad","Comprensión de texto: compatibilidad","Incompatibilidad textual","Comprensión de lectura: incompatibilidad textual","Comprensión de lectura crítica - valorativa"],
   obj:["Comparar cada alternativa con la parte exacta del texto.","Detectar exageraciones y cambios sutiles de sentido.","Usar los datos de gráficos e infografías como parte del texto."],
   concepto:"Compatible es lo que el texto dice o lo que se sigue de él sin contradecirlo. Incompatible es lo que choca con alguna idea o dato del texto. No importa si la frase es cierta en la vida real: importa si concuerda con lo leído.",
   explica:[
    "Método: 1) ubica de qué parte del texto habla la alternativa; 2) vuelve a esa parte y compara con cuidado; 3) decide si concuerda, si contradice o si el texto no lo menciona.",
    "En «compatible» gana la alternativa respaldada por el texto, aunque esté dicha con otras palabras (paráfrasis). En «incompatible» gana la que contradice una idea, un dato o la tesis del autor.",
    "Palabras trampa: «siempre», «nunca», «únicamente», «todos», «por completo». Suelen exagerar lo que dice el texto y vuelven la frase incompatible.",
    "Cambios sutiles: causa por efecto, una parte por el todo, lo posible por lo seguro, una fecha o una cifra cambiada.",
    "En los textos con gráfico o infografía, los datos del gráfico cuentan igual que el texto: revisa cifras, años y unidades.",
    "Con enunciados I, II y III, evalúa cada uno por separado y marca V o F antes de mirar las alternativas."],
   tabla:{t:"Señales rápidas",cab:["Si la alternativa…","Suele ser"],filas:[["Parafrasea una idea del texto","Compatible"],["Contradice la tesis o un dato","Incompatible"],["Exagera con «siempre», «únicamente», «por completo»","Incompatible"],["Habla de algo que el texto no menciona","No respaldada (ni la mejor compatible)"]]},
   claves:[["Compatible","Lo dice el texto o se sigue de él."],["Incompatible","Contradice una idea, un dato o la tesis."],["Paráfrasis","La respuesta correcta suele usar otras palabras."],["Absolutos","«Siempre», «únicamente», «por completo»: sospecha."],["Gráficos","Sus cifras cuentan como parte del texto."]],
   errores:["Elegir lo que es cierto en la realidad pero el texto no dice.","Marcar como incompatible algo que solo no se menciona: debe contradecir.","Responder de memoria sin volver al texto.","Leer rápido las cifras del gráfico."],
   ejemplo:{id:"27I-13",pasos:[
     "Evalúa cada enunciado buscándolo en el texto o en el gráfico; no basta con que «suene bien».",
     "I: el gráfico marca las nalgas (glúteos), las muñecas y los codos. Compatible.",
     "II: el texto explica que el picor es una reacción alérgica al parásito y a sus heces (deyecciones). Compatible.",
     "III: lo que permite detectarla a tiempo son lesiones visibles (los surcos), no síntomas invisibles. Incompatible.",
     "Respuesta: Solo I y II."],
     idea:"Compatible = el texto lo dice o se sigue de él sin contradicción."},
   guiada:[
    {id:"26II-16",pistas:["Primero resume la tesis del texto A en una línea: hay que trabajar intensamente.","La incompatible es la que contradice esa tesis o sus razones, aunque suene razonable por sí sola."],
     pasos:["Tesis del texto A: es necesario trabajar más e intensamente.","A, B, C y D repiten razones del propio texto A (bienestar, pensiones, competencia, expectativas): son compatibles.","E dice que la tecnología liberó por completo al trabajador de trabajar más horas: contradice la tesis.","Respuesta: E."],
     mal:{0:"A resume un argumento del texto A: reducir la jornada pondría en riesgo el bienestar. Es compatible.",1:"B es compatible: el texto A dice que el esfuerzo sostenido financia pensiones y salud.",2:"C es compatible: la competencia mundial es una de las razones del texto A.",3:"D es compatible: el texto A une más horas de trabajo con expectativas de bienestar más altas."}},
    {id:"25II-12",pistas:["Busca una afirmación que choque con un dato concreto: una cifra o una fecha.","Mira las cifras del gráfico (2015) y del texto (2020): ¿la malaria desapareció?"],
     pasos:["A, B, C y E describen el ciclo de la malaria y sus síntomas tal como aparecen en el texto y el gráfico.","El gráfico da 212 millones de casos y 429 mil muertes en 2015; el texto, 241 millones de casos en 2020.","Decir que el mosquito fue erradicado en 2015 contradice esas cifras.","Respuesta: D."],
     mal:{0:"A es compatible: describe una etapa del ciclo que presenta el texto. La incompatible choca con las cifras.",1:"B es compatible: los escalofríos con fiebre son síntomas descritos.",2:"C es compatible: es parte del ciclo de transmisión que muestra el gráfico.",4:"E es compatible: el daño a los glóbulos rojos es parte de lo que explica el texto."}}],
   chequeo:[
    {q:"Texto: «El consumo de agua embotellada creció 20 % en 2023, sobre todo en zonas urbanas». ¿Qué afirmación es incompatible?",o:["En 2023 aumentó el consumo de agua embotellada","Las ciudades impulsaron el aumento","El consumo de agua embotellada se redujo en 2023","El aumento fue de un quinto","Hubo crecimiento en zonas urbanas"],a:2,e:"El texto dice que creció; decir que se redujo lo contradice."},
    {q:"En una pregunta de compatibilidad, la alternativa correcta…",o:["siempre copia una frase del texto","puede decir la misma idea con otras palabras","es la más larga","debe ser verdadera en la vida real","usa «siempre» o «nunca»"],a:1,e:"Suele ser una paráfrasis de lo que dice el texto."},
    {q:"Texto: «Algunos peces de río toleran el agua salada». Es incompatible afirmar que…",o:["hay peces de río que toleran el agua salada","ningún pez de río tolera el agua salada","ciertos peces de río resisten la sal","no todos los peces de río toleran el agua salada","existen peces con tolerancia a la sal"],a:1,e:"«Ningún» contradice «algunos»."}],
   prac:[
    {q:"Texto: «La mayoría de los encuestados prefiere estudiar de noche». Es compatible afirmar que…",o:["todos estudian de noche","nadie estudia de día","más de la mitad prefiere la noche","la noche es mejor para aprender","los encuestados no estudian"],a:2,e:"«La mayoría» es más de la mitad. Las demás exageran o agregan algo."},
    {q:"Texto: «Las abejas polinizan muchos cultivos; su disminución amenaza la producción de alimentos». Es incompatible sostener que…",o:["las abejas ayudan a producir alimentos","menos abejas pueden afectar las cosechas","la disminución de abejas no afecta la agricultura","algunos cultivos dependen de la polinización","las abejas cumplen una función ecológica"],a:2,e:"El texto dice que su disminución amenaza la producción."},
    {q:"¿Cuál de estas palabras suele volver incompatible una alternativa porque exagera el texto?",o:["algunos","a veces","únicamente","posiblemente","en parte"],a:2,e:"«Únicamente» cierra posibilidades que el texto suele dejar abiertas."}]}]},
"hv:Idea principal, tema y propósito":{
  fuente:"Preguntas reales del banco (2024-I a 2027-I). Estrategias redactadas para Ruta 1250.",
  lee:[["Puro DECO · Razonamiento verbal","https://drive.google.com/file/d/1QtapDh7tOVG8wgi9I7lOWC7fHzT_Aew6/view"]],
  bloques:[
  {id:"idea",t:"Tema central, idea principal y propósito",ts:["Idea principal","Tema central (dos textos)","Tema de la polémica","Propósito del texto mixto","Punto de convergencia","Tema central","Jerarquía textual","Comprensión de lectura, jerarquía textual","Comprensión de lectura","Tesis y argumentos","Idea principal, tema y propósito","Comprensión lectora: punto de discrepancia","Punto de convergencia (coherencia)","Comprensión de lectura: jerarquía textual"],
   obj:["Distinguir tema, idea principal y propósito.","Descartar alternativas demasiado estrechas o demasiado amplias.","Hallar el tema de una polémica y los puntos de convergencia y discrepancia entre dos textos."],
   concepto:"El tema es de qué trata el texto: una frase breve («la malaria»). La idea principal es lo que el autor afirma sobre ese tema: una oración completa que vale para todo el texto. El propósito es para qué lo escribió: informar, explicar, persuadir, advertir, criticar.",
   explica:[
    "Para el tema, pregunta: ¿de qué se habla en todo el texto? Para la idea principal: ¿qué se dice de eso? Tiene que cubrir el texto entero, no un solo párrafo.",
    "Descarta las alternativas demasiado estrechas (un dato, un ejemplo, una cifra) y las demasiado amplias (hablan de más de lo que trata el texto).",
    "Textos mixtos (texto con gráfico o infografía): la idea principal debe integrar las dos partes.",
    "Dos textos (polémica): el tema central es el asunto que ambos discuten. El punto de convergencia es en lo que coinciden; el de discrepancia, en lo que se oponen. Comprueba que la alternativa valga para A y para B.",
    "Propósito: mira qué hace el texto. Si da datos y explica, informa; si defiende una postura con argumentos, persuade; si recomienda, orienta o advierte.",
    "Cuidado con las alternativas que exageran («únicamente», «todo») o que agregan juicios que el autor no hace."],
   tabla:{t:"Tema, idea principal y propósito",cab:["Pregunta","Responde a","Forma"],filas:[["Tema","¿De qué trata?","Frase breve"],["Idea principal","¿Qué dice el autor de eso?","Oración completa"],["Propósito","¿Para qué lo escribió?","Un verbo: informar, persuadir, advertir…"],["Tema de la polémica","¿Qué discuten A y B?","El asunto común a ambos"]]},
   claves:[["Tema","De qué trata el texto entero."],["Idea principal","Lo que se afirma del tema, válido para todo el texto."],["Muy estrecha","Un detalle, un ejemplo o una cifra."],["Muy amplia","Más de lo que el texto trata."],["Dos textos","La respuesta debe valer para A y para B."]],
   errores:["Elegir el tema de un solo párrafo.","Confundir un dato llamativo (una cifra) con la idea principal.","En dos textos, elegir la postura de uno solo como tema central.","Aceptar alternativas que exageran lo que dice el autor."],
   ejemplo:{id:"26II-14",pasos:[
     "Resume cada texto en una línea. A: hay que trabajar más para sostener el bienestar. B: ese exceso de trabajo destruye la satisfacción con la vida.",
     "El asunto que ambos discuten es la relación entre más horas de trabajo y la calidad de vida.",
     "B, C, D y E hablan de tecnología, salarios, obligaciones o ganancias: no es lo que articula el debate.",
     "Respuesta: A."],
     idea:"En dos textos, el tema central es lo que A y B discuten, no la postura de uno de ellos."},
   guiada:[
    {id:"26I-11",pistas:["¿De qué tratan el texto y la infografía de principio a fin? Ese es el tema.","La idea principal dice qué es la crianza positiva y qué logra, sin exagerar ni quedarse en un detalle."],
     pasos:["Tema: la crianza positiva.","Lo que se dice de ella: funciona, fomenta relaciones saludables y enseña habilidades a los padres.","C lo reúne todo. A y E se quedan en una parte, y B exagera con «únicamente».","Respuesta: C."],
     mal:{0:"A se queda en una parte: calmarse es una de las habilidades, no la idea de todo el texto.",1:"B exagera con «únicamente»: el texto no dice que sea el único método.",3:"D pone como centro la «relación horizontal», que no es lo que articula el texto.",4:"E reduce todo a dos habilidades y agrega una «valía universal» que el texto no afirma."}},
    {id:"25II-11",pistas:["Texto y gráfico juntos: ¿de qué enfermedad hablan y qué aspectos tratan?","Descarta las alternativas que toman un solo dato o un solo paso del ciclo."],
     pasos:["Tema: la malaria.","El texto y el gráfico tratan su transmisión, sus síntomas y el daño que causa (casos y muertes).","A, B, C y D toman un solo detalle.","Respuesta: E."],
     mal:{0:"A toma solo una cifra (las muertes de 2015): demasiado estrecha.",1:"B se queda en la picadura y los malestares: es solo una parte.",2:"C es un paso del ciclo: un detalle.",3:"D habla de la resistencia a insecticidas, que no es el centro del texto."}}],
   chequeo:[
    {q:"El tema de un texto se expresa mejor como…",o:["una pregunta","una frase breve sobre de qué trata","una cifra","una opinión del lector","el título de otro texto"],a:1,e:"El tema es una frase breve; la idea principal, una oración completa."},
    {q:"Texto: «Dormir poco reduce la memoria, la atención y el rendimiento en los exámenes, según varios estudios». La idea principal es…",o:["Varios estudios investigan el sueño","Dormir poco perjudica capacidades clave para estudiar","La memoria es importante","Los exámenes son difíciles","Hay que dormir ocho horas"],a:1,e:"Cubre todo lo que afirma el texto. Las «ocho horas» no se mencionan."},
    {q:"Si el autor defiende una postura con argumentos, su propósito principal es…",o:["informar","persuadir","narrar","describir","entretener"],a:1,e:"Defender una postura es persuadir."}],
   prac:[
    {q:"En una polémica, el punto de convergencia es…",o:["lo que dice el texto A","aquello en que ambos autores coinciden","aquello en que se oponen","el título","la conclusión del lector"],a:1,e:"Convergencia = coincidencia."},
    {q:"Una alternativa que solo menciona una cifra del gráfico suele ser…",o:["la idea principal","demasiado estrecha","demasiado amplia","el propósito","el tema de la polémica"],a:1,e:"Un dato aislado no resume todo el texto."},
    {q:"Texto: «Lima produce miles de toneladas de basura al día; separar los residuos en casa reduciría el problema». Su propósito es…",o:["narrar una historia","informar del problema y proponer una solución","criticar a una autoridad","describir Lima","entretener"],a:1,e:"Presenta un problema y plantea qué hacer."}]}]},
