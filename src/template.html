  bloques:[
  {id:"ing",t:"Comprensión de textos en inglés",ts:["Inglés*"],
   obj:["Reconocer qué pide cada pregunta en inglés.","Deducir el significado de una palabra por el contexto.","Usar conectores, cognados y falsos amigos para entender el texto."],
   concepto:"Las preguntas de inglés usan las mismas habilidades que en castellano: idea principal, propósito, vocabulario en contexto, inferencia y compatibilidad. No necesitas entender cada palabra: basta con las palabras clave y los conectores.",
   explica:[
    "Lee primero las preguntas: así sabes qué buscar (main idea, purpose, closest in meaning, antonym, INCOMPATIBLE, infer).",
    "Vocabulario en contexto: «closest in meaning» pide un sinónimo según la oración; «opposite» o «antonym», lo contrario. Reemplaza la palabra por cada alternativa y mira si la oración conserva (o invierte) su sentido.",
    "Conectores que guían: however / but (contraste), because / since (causa), so / therefore (consecuencia), also / moreover (adición), for example (ejemplo).",
    "Cognados: muchas palabras se parecen al castellano (information, important, legal, consequences). Cuidado con los falsos amigos: actually = en realidad; realize = darse cuenta; library = biblioteca; sensible = sensato.",
    "Destinatario y propósito: fíjate a quién le habla el texto (you, teens, dog owners) y qué busca (inform, warn, persuade, describe).",
    "Inferencia (what will happen, it can be inferred): la respuesta se deduce del texto, no se copia; debe encajar con todo lo leído."],
   tabla:{t:"Palabras de las preguntas",cab:["En la pregunta","Significa"],filas:[["main idea","idea principal"],["primary purpose","propósito principal"],["closest in meaning","sinónimo en contexto"],["opposite / antonym","antónimo"],["INCOMPATIBLE / NOT true","incompatible"],["it can be inferred","se infiere"],["addressed to","dirigido a"]]},
   claves:[["Preguntas primero","Así sabes qué buscar en el texto."],["Contexto","Reemplaza la palabra por cada alternativa."],["Conectores","however, because, so, also: guían el sentido."],["Cognados","Palabras parecidas al castellano te dan pistas."],["Falsos amigos","actually = en realidad; realize = darse cuenta."]],
   errores:["Traducir palabra por palabra y perder la idea general.","Elegir el significado más común de la palabra y no el del contexto.","Confiar en falsos amigos.","Elegir un detalle como idea principal."],
   ejemplo:{id:"27I-19",pasos:[
     "Ubica la palabra en el texto: algo ilegal «can have legal outcomes».",
     "Lo ilegal puede traer resultados legales: multas, procesos. Es decir, consecuencias.",
     "Prueba las alternativas en la oración: «legal behaviors», «legal boundaries» no encajan; «legal consequences» sí.",
     "Respuesta: consequences."],
     idea:"En vocabulario manda la oración: reemplaza la palabra por cada alternativa."},
   guiada:[
    {id:"27I-18",pistas:["¿A quién le habla el texto con «you»? Mira los temas: relaciones, redes sociales y la frase «under the age of 18».","Si habla de pareja y redes, y advierte sobre menores de 18 «even if you're close in age», ¿qué edad tiene su lector?"],
     pasos:["El texto le habla directamente a «you» sobre su pareja, sus amigos y las redes sociales.","Advierte sobre contenidos con menores de 18 «aunque tengas una edad cercana».","Su lector es un adolescente.","Respuesta: teenagers."],
     mal:{1:"Un adulto puede leerlo, pero el texto le habla a «you» sobre pareja, redes y personas menores de 18 de edad cercana: adolescentes.",2:"No se dirige a los padres: no da consejos de crianza.",3:"No hay nada dirigido a los abuelos.",4:"Children (niños) es muy joven para un texto sobre pareja y redes sociales."}},
    {id:"26II-19",pistas:["La oración es «The report did not release specific test results».","Si el informe no hizo eso con los resultados y por eso no se conocen las marcas, ¿qué no hizo?"],
     pasos:["Contexto: el informe no dio a conocer los resultados específicos (por eso no se saben las marcas).","Aquí release = publicar, hacer público.","La alternativa que conserva el sentido es to announce.","Respuesta: to announce."],
     mal:{0:"To save (guardar) no encaja: no se trata de guardar resultados.",1:"To hide (ocultar) es casi lo contrario de release en esta oración.",2:"To record (registrar) no es lo mismo que darlos a conocer.",4:"To analyze (analizar) no encaja: el informe no los publicó."}}],
   chequeo:[
    {q:"El conector «however» indica…",o:["causa","contraste","ejemplo","adición","consecuencia"],a:1,e:"However = sin embargo."},
    {q:"«Actually» significa…",o:["actualmente","en realidad","activamente","exactamente","ahora mismo"],a:1,e:"Falso amigo: «actualmente» es currently."},
    {q:"«The author's primary purpose» pregunta por…",o:["el tema","el propósito principal del autor","una palabra difícil","un dato","el título"],a:1,e:"Purpose = propósito."}],
   prac:[
    {q:"In «Many people quit smoking because it is harmful», the word HARMFUL is closest in meaning to…",o:["useful","dangerous","cheap","popular","easy"],a:1,e:"Harmful = dañino, peligroso."},
    {q:"El conector «therefore» expresa…",o:["contraste","consecuencia","ejemplo","duda","tiempo"],a:1,e:"Therefore = por lo tanto."},
    {q:"The opposite of «increase» is…",o:["grow","rise","decrease","improve","expand"],a:2,e:"Increase = aumentar; decrease = disminuir."}]}]}

const VISTAS=[["inicio","Inicio"],["tarjetas","Tarjetas"],["cursos","Cursos"],["progreso","Progreso"],["banco","Banco"]];

// ---- estado (misma clave de siempre: no se pierde el progreso). v2 agrega log, cfg y FSRS sin borrar nada.
const BASE=()=>({xp:0,racha:0,dia:"",r:{},hechas:{},hist:[],dias:{},metaDia:20,log:[],cfg:{fecha:"",min:45,t:0},diags:[],diag:null,diagT:0,res:[],plan:null,borrado:0,fi:{},un:{},v:2});
let DEV=""; try{DEV=localStorage.getItem(DKEY)||""; if(!DEV){DEV=Math.random().toString(36).slice(2,8); localStorage.setItem(DKEY,DEV)}}catch(e){DEV="x"}
let S=BASE();
// un estado guardado sin "v" es de la versión 1 (antes del 16 nov): hay que migrarlo
const cargar=o=>{const x=Object.assign(BASE(),o||{}); x.v=(o&&o.v)||1; return migrar(x)};
try{const raw=localStorage.getItem(KEY); if(raw) S=cargar(JSON.parse(raw));}catch(e){}
function migrar(o){
  if(!o.dias||typeof o.dias!=="object") o.dias={};
  if(!Object.keys(o.dias).length&&o.hist&&o.hist.length) o.hist.forEach(h=>{o.dias[h.d]=(o.dias[h.d]||0)+h.n});
  if(!Array.isArray(o.log)) o.log=[]; if(!Array.isArray(o.diags)) o.diags=[]; if(!Array.isArray(o.res)) o.res=[];
  if(!o.cfg||typeof o.cfg!=="object") o.cfg={fecha:"",min:45,t:0};
  if(!o.fi||typeof o.fi!=="object") o.fi={};
  if((o.v||1)<2){ // Leitner → FSRS: la estabilidad arranca en el intervalo que tenía cada pregunta
    const st=[.4,1,3,7,14];
    Object.values(o.r).forEach(r=>{const b=r.box||0; r.s=st[b]; r.d=5; r.lr=r.due?r.due-DIAS[b]*DIA:Date.now()-DIA; r.t=r.t||r.lr; r.g=r.ok?3:1;
      if(r.n===1) r.f=r.ok?1:0;});  // con un solo intento sí sabemos el resultado del primer intento
    o.diags.forEach((d,i)=>{if(!d.ini) d.ini=Date.parse(d.f)+i});
    o.v=2}
  return o}
S=migrar(S);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} if(typeof syncPronto==="function") syncPronto()};

// ---- temas: cada pregunta cae en un tema de su curso según su etiqueta "t" (ver temas.js)

  DATA.cursos.forEach(c=>{TC[c.id]=(T[c.id]||[]).map((x,i)=>({id:c.id+"-"+(i+1),c:c.id,n:x[0],ts:x[1],ids:[]}))});

    if(!tm){tm=lista.find(t=>t.otros); if(!tm){tm={id:p.c+"-x",c:p.c,n:"Otros temas",ts:[],ids:[],otros:true}; lista.push(tm)}}
    tm.ids.push(p.id); p.tm=tm.id});
  DATA.cursos.forEach(c=>{TC[c.id]=TC[c.id].filter(t=>t.ids.length); TC[c.id].forEach(t=>{t.veces=new Set(t.ids.map(id=>Q[id].ex)).size; t.porEx=t.ids.length/NEX; TM[t.id]=t});
    TC[c.id].sort((a,b)=>b.ids.length-a.ids.length||b.veces-a.veces)});
})();
DECOS.forEach(p=>{const tm=(TC[p.c]||[]).find(t=>t.n===p.tn); if(tm){tm.ids.push(p.id); p.tm=tm.id; Q[p.id]=p}});
const idsCurso=cid=>DATA.preguntas.filter(p=>p.c===cid).map(p=>p.id);
const idsDeco=cid=>DECOS.filter(p=>p.c===cid&&Q[p.id]).map(p=>p.id);
const idsCursoT=cid=>idsCurso(cid).concat(idsDeco(cid));

// ---- reserva: preguntas que solo salen en el simulacro diagnóstico, para que siempre mida con preguntas nunca vistas.
// Dos simulacros completos (2 × preguntas del curso en el examen). Orden fijo por hash para que sea igual en todos los dispositivos.
const hash=s=>{let h=2166136261; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i); h=Math.imul(h,16777619)} return h>>>0};
let RES=new Set();
// preguntas de las fichas (ejemplos resueltos y práctica guiada): las llena el motor de fichas
let FIDS=new Set(), FEJ=new Set();
function armarReserva(){const ya=new Set((S.res||[]).filter(id=>Q[id]&&!S.r[id]&&!FIDS.has(id)));
  DATA.cursos.forEach(c=>{const meta=2*c.peso, tiene=[...ya].filter(id=>Q[id].c===c.id).length; if(tiene>=meta) return;
    idsCurso(c.id).filter(id=>!S.r[id]&&!ya.has(id)&&!FIDS.has(id)).sort((a,b)=>hash(a)-hash(b)).slice(0,meta-tiene).forEach(id=>ya.add(id))});
  S.res=[...ya]; RES=ya}
armarReserva();
const esRes=id=>RES.has(id)&&!S.r[id];
const libres=ids=>ids.filter(id=>!esRes(id));

// ---- FSRS-4.5 (parámetros por defecto, retención deseada 90 %)
const W=[0.4872,1.4003,3.7145,13.8206,5.1618,1.2298,0.8975,0.031,1.6474,0.1367,1.0461,2.1072,0.0793,0.3246,1.587,0.2272,2.8755];
const RET=.9, DECAY=-.5, FACTOR=19/81;
const clampD=d=>Math.min(10,Math.max(1,d));
const D0=g=>clampD(W[4]-(g-3)*W[5]);
const retenc=(t,s)=>Math.pow(1+FACTOR*t/s,DECAY);
function actOk(){const v=S&&S.cfg&&S.cfg.act; return typeof v==="number"?v:8}
function actPts(){return actOk()*EXAMEN.actPuntos}
function ptsD(r){return r.pts+(typeof r.act==="number"?r.act:actPts())}
function fechaExamen(){return S.cfg.fecha||EXAMEN.fechaRef}
function diasAlExamen(){const f=new Date(fechaExamen()+"T08:00:00"); return Math.ceil((f-Date.now())/DIA)}
function tope(){const d=diasAlExamen(); return Math.max(1,Math.min(60,d>3?d-2:60))}   // ningún repaso queda para después del examen
const ivl=s=>Math.max(1,Math.min(tope(),Math.round(s/FACTOR*(Math.pow(RET,1/DECAY)-1))));
function fsrs(r,g,now){
  if(!r.s){r.s=W[g-1]; r.d=D0(g)}
  else{const t=Math.max(0,(now-(r.lr||now))/DIA), R=retenc(t,r.s);
    if(t<.5){ if(g===1){r.s=Math.min(r.s,W[0]); r.d=clampD(r.d+W[6])} }   // repaso el mismo día: solo cuenta si falla
    else{const s=g===1?Math.min(r.s,W[11]*Math.pow(r.d,-W[12])*(Math.pow(r.s+1,W[13])-1)*Math.exp(W[14]*(1-R)))
                     :r.s*(1+Math.exp(W[8])*(11-r.d)*Math.pow(r.s,-W[9])*(Math.exp(W[10]*(1-R))-1)*(g===2?W[15]:1));
      r.d=clampD(W[7]*D0(3)+(1-W[7])*(r.d-W[6]*(g-3))); r.s=Math.max(.1,s)}}
  r.due=g===1?now:now+ivl(r.s)*DIA}
// cuántos días faltarían si calificas con g (para mostrar en los botones)
function previa(id,g){const r=Object.assign({},S.r[id]||{}), now=Date.now(); fsrs(r,g,now); return Math.round((r.due-now)/DIA)}
const cuando=d=>d<=0?"hoy":d===1?"mañana":`en ${d} días`;

// ---- un intento = una fila del historial. Es la base de toda la medición.
// m: l lección · r repaso · s simulacro rápido · d diagnóstico · k tarjeta. ok: 1, 0 o null (en blanco). nv: primera vez que la ve.
function intento(id,o){const now=Date.now(), r=S.r[id]||(S.r[id]={n:0}), nuevo=!r.n, mc=o.m!=="k";
  const g=o.g||(o.ok?(o.cf==="d"?2:3):1);
  // primer intento = evidencia de habilidad, salvo si hubo ayuda (práctica guiada) o ya vio la solución (ejemplo de ficha)
  if(nuevo){ if(mc&&o.m!=="g"&&!FEJ.has(id)) r.f=o.ok?1:0; else r.fk=1 }
  if(r.lr&&(now-r.lr)/DIA>=2){ if(g>=3) r.sp=(r.sp||0)+1; else if(g===1) r.sf=(r.sf||0)+1 }
  fsrs(r,g,now); r.n++; r.ok=g>=2; r.g=g; r.lr=now; r.t=now;
  const e={t:now,id,m:o.m,ok:o.ok===null||o.ok===undefined?(mc?null:(g>=2?1:0)):(o.ok?1:0),dv:DEV};
  if(o.ms) e.ms=Math.round(Math.min(o.ms,15*6e4)); if(nuevo) e.nv=1; if(o.cf) e.cf=o.cf; if(o.er) e.er=o.er; if(!mc) e.g=g; if(o.px) e.px=o.px;
  S.log.push(e); if(S.log.length>40000) S.log.splice(0,S.log.length-40000);
  RES.delete(id); return e}
// repaso por "pregunta hermana": la original se reprograma con el resultado de la hermana
function reprogramar(id,g){const r=S.r[id]; if(!r) return; const now=Date.now(); fsrs(r,g,now); r.lr=now; r.t=now}

// ---- medición honesta
// Habilidad = aciertos en preguntas que veías por primera vez (Laplace: (aciertos+1)/(intentos+2)).
// Retención = aciertos al recordar después de 2 días o más. Repetir la misma pregunta el mismo día no suma.
function nivel(ids){let nF=0,okF=0,sp=0,sf=0,v=0;
  ids.forEach(id=>{const r=S.r[id]; if(!r||!r.n) return; v++; if(r.f!==undefined){nF++; okF+=r.f} sp+=r.sp||0; sf+=r.sf||0});
  const hab=(okF+1)/(nF+2), ret=(sp+1)/(sp+sf+2);
  let l=0;
  if(v===0) l=0;
  else if(nF>=3&&hab>=.5&&sp+sf>=2&&ret<.5) l=4;
  else if(nF>=4&&hab>=.72&&sp>=2&&ret>=.7) l=3;
  else if(nF>=3&&hab>=.55) l=2;
  else l=1;
  return {p:nF?hab:0,hab,ret,nF,okF,sp,sf,v,n:ids.length,l}}
function statCurso(cid){const x=nivel(idsCurso(cid)); return {total:x.n,v:x.v,ok:x.okF,nF:x.nF,p:x.nF?x.hab:null}}
function extremos(cid){const vistos=TC[cid].map(t=>({t,x:nivel(t.ids)})).filter(o=>o.x.nF>0);
  if(!vistos.length) return null; vistos.sort((a,b)=>b.x.hab-a.x.hab);
  const f=vistos[0].x.okF?vistos[0]:null, d=vistos[vistos.length-1]; return {fuerte:f,flojo:(vistos.length>1||!f)?d:null}}
const nuevasDe=ids=>ids.filter(id=>!S.r[id]&&!esRes(id)).length;
// puntaje estimado: por curso con su habilidad en preguntas nuevas; los cursos sin datos se proyectan con tu promedio.
function estimado(){let pts=0,cub=0,varz=0,okT=0,nT=0; const k=EXAMEN.ok-EXAMEN.mal;
  DATA.cursos.forEach(c=>{const x=nivel(idsCurso(c.id)); if(x.nF<3) return; okT+=x.okF; nT+=x.nF;
    pts+=c.peso*(x.hab*EXAMEN.ok+(1-x.hab)*EXAMEN.mal); cub+=c.peso;
    varz+=c.peso*x.hab*(1-x.hab)*k*k + c.peso*c.peso*k*k*x.hab*(1-x.hab)/(x.nF+3)});
  const resto=EXAMEN.conPuntaje-cub, pm=nT?(okT+1)/(nT+2):0;
  const proy=pts+resto*(pm*EXAMEN.ok+(1-pm)*EXAMEN.mal)+actPts();
  if(resto) varz+=resto*pm*(1-pm)*k*k+resto*resto*k*k*pm*(1-pm)/(nT+3);
  const sd=Math.sqrt(varz);
  // con menos de un tercio del examen cubierto, proyectar el total sería inventar: no se muestra
  return {pts:Math.max(0,Math.round(cub?proy:0)),cub,lo:Math.max(0,Math.round(proy-1.28*sd)),hi:Math.min(MAXP,Math.round(proy+1.28*sd)),ok:cub>=30}}
function totales(){let v=0,ok=0; Object.keys(S.r).forEach(id=>{if(!Q[id]||!S.r[id].n) return; v++; if(S.r[id].ok) ok++}); return {v,ok}}
// aciertos en preguntas nuevas (primera vez, con alternativas) entre dos fechas
function nuevasEntre(a,b){let n=0,ok=0; S.log.forEach(e=>{if(e.nv&&e.m!=="k"&&e.t>=a&&e.t<b&&e.ok!==null){n++; ok+=e.ok}}); return {n,ok,p:n?ok/n:null}}
function pendientes(){const t=Date.now(); return Object.keys(S.r).filter(id=>Q[id]&&S.r[id].n&&S.r[id].due<=t)
  .sort((a,b)=>retenc((t-(S.r[a].lr||t))/DIA,S.r[a].s||1)-retenc((t-(S.r[b].lr||t))/DIA,S.r[b].s||1))}
const pendConcepto=()=>pendientes().filter(id=>!esCalc(id));
const pendCalculo=()=>pendientes().filter(id=>esCalc(id));
function tocarRacha(){const h=hoy(); S.dias[h]=(S.dias[h]||0)+1; if(S.dia===h) return; const a=new Date(); a.setDate(a.getDate()-1);
  S.racha=(S.dia===ymd(a))?S.racha+1:1; S.dia=h}
function rachaViva(){const a=new Date(); a.setDate(a.getDate()-1); return (S.dia===hoy()||S.dia===ymd(a))?S.racha:0}
function saludo(){const h=new Date().getHours(); return h<12?"Buenos días":h<19?"Buenas tardes":"Buenas noches"}
function fecha(){const s=new Date().toLocaleDateString("es-PE",{weekday:"long",day:"numeric",month:"long"}); return s.charAt(0).toUpperCase()+s.slice(1)}
function shuffle(a){a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]} return a}
const plural=(n,s,p)=>n===1?s:(p||s+"s");
// tiempo típico por respuesta (mediana de tus últimos intentos)
function velocidad(m,def){const v=S.log.filter(e=>(m==="k"?e.m==="k":e.m!=="k")&&e.ms>3e3&&e.ms<15*6e4).slice(-120).map(e=>e.ms).sort((a,b)=>a-b);
  return v.length>=8?v[Math.floor(v.length/2)]:def}
const minutosHoy=()=>{const a=new Date(); a.setHours(0,0,0,0); return Math.round(S.log.filter(e=>e.t>=+a).reduce((s,e)=>s+Math.min(e.ms||(e.m==="k"?30e3:90e3),5*6e4),0)/6e4)};
// alternativas mezcladas para no memorizar la letra; no se mezclan si están en la imagen o se nombran entre sí
const NOMEZ=/\b[A-E]\s*(y|e|o|,)\s*[A-E]\b|\b(ambas|todas las anteriores|ninguna de las anteriores|todas son correctas|ninguna es correcta)\b|gr[aá]fica\s+[A-E]\b|^\s*[A-E]\s*$/i;
const mezclable=p=>!p.fqa&&!p.o.some(o=>NOMEZ.test(o));
const nuevoOrden=p=>mezclable(p)?shuffle(p.o.map((_,i)=>i)):p.o.map((_,i)=>i);
function orden(id){ses.ord=ses.ord||{}; return ses.ord[id]||(ses.ord[id]=nuevoOrden(Q[id]))}
const opciones=(p,ord,cls,attr)=>ord.map((oi,k)=>`<button class="opt ${cls(oi)}" data-act="${attr}" data-i="${oi}"><span class="l">${L[k]}</span><span class="t">${esc(p.o[oi])}</span></button>`).join("");

// ---- mazos
function mazoHoy(){return pendConcepto().slice(0,20)}
function mazoMezcla(){const out=pendConcepto().slice(0,6); const set=new Set(out);
  const flojo=c=>{const s=statCurso(c); return s.p===null?.55:s.p};
  const nuevas=shuffle(DATA.preguntas.filter(p=>!CALC.has(p.c)&&!S.r[p.id]&&!esRes(p.id)&&!set.has(p.id))).sort((a,b)=>flojo(a.c)*C[a.c].peso**-.3-flojo(b.c)*C[b.c].peso**-.3);
  const usados={}; for(const p of nuevas){if(out.length>=15) break; if((usados[p.c]||0)>=2) continue; usados[p.c]=(usados[p.c]||0)+1; out.push(p.id); set.add(p.id)}
  if(out.length<15) shuffle(Object.keys(S.r).filter(id=>Q[id]&&!esCalc(id)&&!set.has(id))).slice(0,15-out.length).forEach(id=>out.push(id));
  return shuffle(out)}
const errores=()=>Object.keys(S.r).filter(id=>Q[id]&&!Q[id].fx&&S.r[id].n&&S.r[id].g===1);
// orden para practicar un curso o un tema: primero lo pendiente, luego lo nuevo, luego lo menos estable. Nunca la reserva.
function ordenar(ids,max){const t=Date.now(); ids=libres(ids);
  const due=ids.filter(id=>S.r[id]&&S.r[id].n&&S.r[id].due<=t), nuevas=ids.filter(id=>!S.r[id]||!S.r[id].n), resto=ids.filter(id=>S.r[id]&&S.r[id].n&&S.r[id].due>t).sort((a,b)=>(S.r[a].s||0)-(S.r[b].s||0));
  return shuffle(due).concat(ordNuevas(nuevas,ids),resto).slice(0,max)}
// repaso de cálculo: cada pregunta pendiente se cambia por una hermana nueva del mismo tema si la hay
function hermanas(ids){const usados=new Set(ids), out=[], proxy={};
  ids.forEach(id=>{const tm=TM[Q[id].tm]; const h=tm&&shuffle(tm.ids).find(x=>!S.r[x]&&!esRes(x)&&!usados.has(x));
    if(h){usados.add(h); out.push(h); proxy[h]=id} else out.push(id)});
  return {out,proxy}}
// valor de estudiar un tema: preguntas que vienen por examen × lo que te falta dominar
function valorTema(t){const x=nivel(t.ids); const falta=x.nF?1-x.hab:.6; return t.porEx*falta*(x.l===4?1.5:1)*(x.l===3?.15:1)}
function prioridades(n){return Object.values(TM).map(t=>({t,x:nivel(t.ids),v:valorTema(t)})).sort((a,b)=>b.v-a.v).slice(0,n)}
function erroresTema(tid){const c={}; S.log.forEach(e=>{if(e.er&&Q[e.id]&&Q[e.id].tm===tid) c[e.er]=(c[e.er]||0)+1}); return c}

// ---- planificador: qué estudiar hoy, cuánto tiempo y por qué
// Considera minutos disponibles, fecha del examen, repasos vencidos, carga prevista de los próximos 7 días,
// temas débiles y el valor de cada tema en el examen. El plan se guarda por día para que no cambie mientras avanzas.
function cargaProxima(){const t=Date.now(), dias=[0,0,0,0,0,0,0];
  Object.values(S.r).forEach(r=>{if(!r.n) return; const d=Math.floor((r.due-t)/DIA); if(d>=0&&d<7) dias[d]++}); return dias}
function armarPlan(){const min=S.cfg.min||45, presu=min*6e4, tK=velocidad("k",35e3), tQ=velocidad("q",110e3);
  const it=[]; let usado=0;
  const pk=pendConcepto().length, pc=pendCalculo().length;
  if(pk){const n=Math.min(pk,Math.max(5,Math.floor(presu*.35/tK)),20); usado+=n*tK;
    it.push({k:"rep",act:"flash",deck:"hoy",n,t:`Repasa ${n} ${plural(n,"tarjeta")}`,s:`${pk} ${plural(pk,"tarjeta")} con la memoria bajando (menos de 90 % de probabilidad de recordarla). Repasar hoy cuesta menos que reaprender.`})}
  if(pc){const n=Math.min(pc,Math.max(3,Math.floor(presu*.25/tQ)),10); usado+=n*tQ;
    it.push({k:"esp",act:"esp",n,t:`Práctica espaciada: ${n} ${plural(n,"problema")}`,s:`${pc} ${plural(pc,"problema")} de cálculo para repasar. Te toca otra pregunta del mismo tema: así practicas el método y no la respuesta.`})}
  const carga=cargaProxima().slice(1).reduce((a,b)=>a+b,0)/6, pesada=carga*tK>presu*.5;
  const maxTemas=pesada?1:3, porTema=6;
  if(S.diag&&S.diag.bl){const b=S.diag.hecho.indexOf(false); if(min>=60){usado+=60*6e4; it.push({k:"diag",act:"dg-go",b,t:`Simulacro diagnóstico: bloque ${b+1} de 3`,s:"Terminarlo te da tu puntaje medido con preguntas que nunca viste."})}}
  else{const ult=(S.diags||[]).slice(-1)[0], hace=ult?Math.floor((Date.now()-(ult.ini||Date.parse(ult.f)))/DIA):null;
    if((hace===null||hace>=14)&&min>=60&&presu-usado>=55*6e4){usado+=60*6e4; it.push({k:"diag",act:"dg-new",t:"Simulacro diagnóstico: bloque 1 de 3",s:hace===null?"Aún no tienes un puntaje medido. Sin él, todo lo demás es estimado.":`Tu último puntaje medido es de hace ${hace} días. Medir cada 2 semanas muestra si de verdad subes.`})}}
  const cand=Object.values(TM).filter(t=>nuevasDe(t.ids)>=2||nivel(t.ids).l===4).map(t=>({t,x:nivel(t.ids),v:valorTema(t)})).filter(o=>o.v>0).sort((a,b)=>b.v-a.v);
  for(const o of cand){if(it.filter(x=>x.k.startsWith("tema")).length>=maxTemas) break; if(presu-usado<3*tQ&&it.length) break;
    const n=Math.min(porTema,Math.max(3,Math.floor((presu-usado)/tQ))); usado+=n*tQ;
    const c=C[o.t.c], ev=o.x.nF?`Aciertas ${o.x.okF} de ${o.x.nF} preguntas nuevas.`:"Aún no lo practicas.";
    const er=erroresTema(o.t.id), con=(er.con||0)>=2?" Tus errores aquí son de concepto: lee primero la resolución de una pregunta resuelta.":"";
    const ref=o.x.l===4?" Lo sabías, pero al repasarlo lo estás olvidando.":"";
    const fi=FT[o.t.id], afi=fi&&avanceFicha(fi), conF=fi&&afi.sig>=0;
    it.push({k:"tema:"+o.t.id,act:conF?"ficha":"temaq",id:o.t.id,n,t:conF?`Aprende: ${c.n} · ${o.t.n} (${fi.bloques[afi.sig].t})`:`${c.n} · ${o.t.n}`,s:(conF?"Con ficha: concepto, ejemplo resuelto y práctica guiada antes de las preguntas. ":"")+`Viene ≈${dec(o.t.porEx)} ${plural(Math.round(o.t.porEx*10)/10===1?1:2,"pregunta")} por examen (≈${fmt(o.t.porEx*20)} pts). ${ev}${ref}${con}`})}
  if(pesada) it.push({k:"nota",t:"Hoy, pocos temas nuevos",s:`Tus repasos de los próximos días ya ocupan ≈${Math.round(carga*tK/6e4)} min diarios. Aprender más hoy te dejaría sin tiempo para repasar.`});
  if(!it.some(x=>x.k!=="nota")) it.push({k:"sim",act:"sim",t:"Simulacro rápido de 20",s:"Ya repasaste todo. Practica con la calificación real."});
  return {d:hoy(),min,it,t:Date.now()}}

function hechoHoy(x){const a=new Date(); a.setHours(0,0,0,0); const lg=S.log.filter(e=>e.t>=+a);

// ---- fusión de progreso: combina dos copias sin perder nada (respaldo por código y sincronización)
// Por pregunta gana la versión con el último cambio; historial, días y simulacros se unen sin duplicar.
function fusionar(a,b){a=cargar(a); b=cargar(b);
  const o=BASE(), borrado=Math.max(a.borrado||0,b.borrado||0), vivo=t=>(t||0)>=borrado;
  o.borrado=borrado;
  const ids=new Set([...Object.keys(a.r),...Object.keys(b.r)]);
  ids.forEach(id=>{const x=a.r[id], y=b.r[id]; const g=!x?y:!y?x:((y.t||0)>(x.t||0)||((y.t||0)===(x.t||0)&&(y.n||0)>(x.n||0))?y:x);
    if(g&&vivo(g.t)) o.r[id]=g});
  const vis=new Set(), lg=[]; a.log.concat(b.log).forEach(e=>{const k=e.t+"|"+e.id+"|"+(e.dv||"")+"|"+e.m+"|"+e.ok+"|"+(e.g||""); if(!vis.has(k)&&vivo(e.t)){vis.add(k); lg.push(e)}});
  o.log=lg.sort((x,y)=>x.t-y.t).slice(-40000);
  const dl={}; o.log.forEach(e=>{const d=ymd(new Date(e.t)); dl[d]=(dl[d]||0)+1});
  const dmin=borrado?ymd(new Date(borrado)):"";
  new Set([...Object.keys(a.dias),...Object.keys(b.dias),...Object.keys(dl)]).forEach(d=>{if(d>=dmin) o.dias[d]=Math.max(a.dias[d]||0,b.dias[d]||0,dl[d]||0)});
  const hk=new Set(); o.hist=a.hist.concat(b.hist).filter(h=>{const k=JSON.stringify([h.t,h.d,h.ok,h.n,h.tipo,h.ts||0]); if(hk.has(k)||!vivo(h.ts||Date.parse(h.d))) return false; hk.add(k); return true})
    .sort((x,y)=>(x.ts||Date.parse(x.d))-(y.ts||Date.parse(y.d))).slice(-60);
  const dk=new Set(); o.diags=a.diags.concat(b.diags).filter(d=>{const k=d.ini||(d.n+"|"+d.f); if(dk.has(k)||!vivo(d.ini||Date.parse(d.f))) return false; dk.add(k); return true}).sort((x,y)=>(x.ini||0)-(y.ini||0));
  const nd=(b.diagT||0)>(a.diagT||0)?b:a; o.diag=nd.diag&&vivo(nd.diag.ini)?nd.diag:null; o.diagT=nd.diagT||0;
  // si un simulacro terminó en un dispositivo, el que quedó "en curso" en el otro ya no vale
  if(o.diag&&o.diags.some(d=>d.ini===o.diag.ini)) o.diag=null;
  const nc=(b.cfg.t||0)>(a.cfg.t||0)?b:a; o.cfg=Object.assign({},nc.cfg); o.metaDia=nc.metaDia||20;
  o.plan=(b.plan&&a.plan&&b.plan.t>a.plan.t)||!a.plan?b.plan:a.plan;
  o.xp=Math.max(a.xp||0,b.xp||0); o.hechas=Object.assign({},a.hechas,b.hechas);
  Object.keys(a.hechas).forEach(k=>{o.hechas[k]=Math.max(a.hechas[k]||0,b.hechas[k]||0)});
  o.fi=Object.assign({},a.fi); Object.entries(b.fi||{}).forEach(([k,v])=>{if(!o.fi[k]||(v.t||0)>(o.fi[k].t||0)) o.fi[k]=v});
  o.un=Object.assign({},a.un); Object.entries(b.un||{}).forEach(([k,v])=>{if(!o.un[k]||(v.t||0)>(o.un[k].t||0)) o.un[k]=v});
  o.res=[...new Set([...(a.res||[]),...(b.res||[])])].filter(id=>!o.r[id]);
  // racha recalculada con los días combinados
  let r=0; const d=new Date(); if(!o.dias[ymd(d)]) d.setDate(d.getDate()-1); while(o.dias[ymd(d)]){r++; d.setDate(d.getDate()-1)}
  o.racha=r; const ds=Object.keys(o.dias).filter(k=>o.dias[k]).sort(); o.dia=ds[ds.length-1]||"";
  return o}

// La llave (token con permiso solo de "gist") se guarda en este navegador, aparte del progreso. Nunca va en los códigos de respaldo.
const GFILE="ruta1250-progreso.json", GDESC="Ruta 1250 · progreso (no borrar)";

async function gh(ruta,opt={}){const r=await fetch("https://api.github.com"+ruta,{...opt,cache:"no-store",headers:{Authorization:"Bearer "+SYNC.tok,Accept:"application/vnd.github+json",...(opt.body?{"Content-Type":"application/json"}:{})}});
  if(!r.ok){const e=new Error("http "+r.status); e.status=r.status; throw e} return r.status===204?null:r.json()}
async function empacar(o){const json=JSON.stringify(o);
  if(window.CompressionStream){const st=new Blob([json]).stream().pipeThrough(new CompressionStream("gzip")); const u=new Uint8Array(await new Response(st).arrayBuffer());
    let b=""; for(let i=0;i<u.length;i+=8192) b+=String.fromCharCode.apply(null,u.subarray(i,i+8192)); return "R1250z:"+btoa(b)}
  return "R1250:"+btoa(unescape(encodeURIComponent(json)))}
async function desempacar(c){c=(c||"").replace(/\s+/g,"");
  if(c.startsWith("R1250z:")){const bin=atob(c.slice(7)), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    const st=new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip")); return JSON.parse(await new Response(st).text())}
  if(c.startsWith("R1250:")) return JSON.parse(decodeURIComponent(escape(atob(c.slice(6)))));
  if(c.startsWith("{")) return JSON.parse(c);
  throw new Error("formato")}

async function sincronizar(manual){if(!SYNC.tok||syncando||window.R1250_ARTEFACTO) return; if(!navigator.onLine){SYNC.est="offline"; pintarSync(); return}
  syncando=true; SYNC.est="sync"; pintarSync();
  try{if(!SYNC.gist) SYNC.gist=await buscarGist();
    let g; try{g=await gh("/gists/"+SYNC.gist)}catch(e){if(e.status===404){SYNC.gist=await buscarGist(); g=await gh("/gists/"+SYNC.gist)} else throw e}
    const f=g.files[GFILE]; let txt=f?f.content:"";
    if(f&&f.truncated) txt=await (await fetch(f.raw_url,{cache:"no-store"})).text();
    const antes=JSON.stringify(S);
    if(txt){const remoto=await desempacar(txt); S=fusionar(S,remoto); armarReserva()}
    const cambio=JSON.stringify(S)!==antes;
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    const nuevo=await empacar(S);
    if(nuevo!==txt) await gh("/gists/"+SYNC.gist,{method:"PATCH",body:JSON.stringify({files:{[GFILE]:{content:nuevo}}})});
    SYNC.last=Date.now(); SYNC.est="ok"; SYNC.msg=""; guardarSync();

  }catch(e){SYNC.est=navigator.onLine?"error":"offline";
    SYNC.msg=e.status===401?"La llave ya no es válida (¿la borraste o venció?). Crea una nueva y vuelve a conectar.":e.status===403?"GitHub rechazó la llave: debe tener el permiso «gist».":navigator.onLine?"No se pudo sincronizar. Se reintenta solo.":"Sin conexión: se sincroniza al volver.";
    pintarSync()}
  finally{syncando=false}}

function accionFicha(a,el){
  if(a==="ficha"){abrirFicha(el.dataset.id,el.dataset.b!==undefined?+el.dataset.b:undefined); return}
  if(!fz) return; const f=FT[fz.tid], b=f.bloques[fz.b];
  if(a==="fi-bloque"){const i=+el.dataset.b; const e=estB(f.bloques[i]); fz={tid:fz.tid,b:i,paso:e.ok?6:Math.min(e.p||0,6),rev:0,gi:0,g:null,ev:null}; draw(); window.scrollTo(0,0); return}
  if(a==="fi-saber"){fz.b=fz.b-1; irPaso(5); return}
  if(a==="fi-paso"){irPaso(+el.dataset.p); return}
  if(a==="fi-next"){irPaso(fz.paso+1); return}
  if(a==="fi-rev"){fz.rev++; draw(); return}
  if(a==="fi-recver"){fz.rec=b.key; draw(); return}
  if(a==="fi-fey"){const t=(document.getElementById("fey")||{}).value||""; FE[b.key]=t.slice(0,2000); try{localStorage.setItem(FKEY,JSON.stringify(FE))}catch(e){} fz.fey=!!t.trim(); draw(); return}
  if(a==="fi-gpick"){fz.g.sel=+el.dataset.i; draw(); return}
  if(a==="fi-pr"){const i=+el.dataset.q; fz.pr=fz.pr||{resp:{}}; if(fz.pr.resp[i]===undefined){fz.pr.resp[i]=+el.dataset.i;
    if(Object.keys(fz.pr.resp).length===b.prac.length){marcarB(b,{ej:estB(b).ej||Date.now(),p:Math.max(estB(b).p||0,4)}); tocarRacha(); save()}} draw(); return}
  if(a==="fi-gpista"){fz.g.pistas++; draw(); return}
  if(a==="fi-gcheck"){guiadaCheck(); return}
  if(a==="fi-grendir"){fz.g.ok=false; cerrarGuiada(); fz.g.pasos=1; draw(); return}
  if(a==="fi-gpaso"){fz.g.pasos++; draw(); return}
  if(a==="fi-gnext"){if(fz.gi+1<b.guiada.length){fz.gi++; fz.g=null; draw(); window.scrollTo(0,0)} else irPaso(4); return}
  if(a==="fi-ej"){const pool=libres(b.ids).filter(id=>!FIDS.has(id)); const ids=ordenar(pool,5); if(ids.length) start("leccion",ids,"Sin ayuda · "+b.t,"fi:"+b.key); return}
  if(a==="fi-evpick"){fz.ev.resp[+el.dataset.q]=+el.dataset.i; draw(); return}
  if(a==="fi-evcheck"){const ev=fz.ev, qs=b.chequeo; ev.fin=true; const bien=qs.filter((q,i)=>ev.resp[i]===q.a).length, ok=bien>=Math.ceil(qs.length*2/3);
    marcarB(b,{ev:bien,ok:estB(b).ok||ok,p:Math.max(estB(b).p||0,5)}); if(ok) tocarRacha(); S.plan=null; save(); draw(); return}
  if(a==="fi-evretry"){fz.ev=null; draw(); window.scrollTo(0,0); return}
  if(a==="fi-cards"){marcarB(b,{p:6}); startFlash("fx:"+b.key); return}
}

// ---- dificultad por niveles (1 Fundamental · 2 Básico · 3 Intermedio · 4 Avanzado)
// Nivel propio de cada pregunta: se estima con rasgos del enunciado (tipo de pregunta, cuánto hay que leer,
// pasos de la resolución) y se reparte por cuartiles dentro de cada curso. Es una estimación, no un dato oficial.
// Tu dificultad personal se mide aparte, con tus respuestas.
const NIVD=["","Fundamental","Básico","Intermedio","Avanzado"];
const NIVD_TXT=["","Definiciones e ideas base: reconocer y recordar.","Aplicar una idea directa en un caso sencillo.","Combinar dos ideas, descartar distractores o hacer varios pasos.","Casos largos, varias condiciones o trampas: nivel de las preguntas más difíciles del examen."];
const DIF={};
function rasgoDif(p){const q=p.q||"", e=p.e||"", o=(p.o||[]).join(" "), calc=CALC.has(p.c);
  let s=Math.log(40+q.length)*1.2+Math.log(20+o.length)*.5+Math.log(20+e.length)*(calc?1.3:.7);
  if(/relacion|columna|correspondencia/i.test(q)) s+=1.1;
  if(/\b(I|II|III|IV)\.|\bI\s*,\s*II|\b(I|II|III)\s+y\s+(II|III|IV)\b/.test(q+o)) s+=.8;
  if(/\b[VF]{3,5}\b|verdader|falsedad|\(V\)|\(F\)/i.test(q+o)) s+=.7;
  if(/\bNO\b|EXCEPTO|INCORRECT|INCOMPATIBLE|no corresponde/.test(q)) s+=.5;
  if(/se infiere|se deduce|se colige|incompatible|implica|conclu/i.test(q)) s+=.4;
  if(p.fq||p.f) s+=.3;
  if(calc){const nums=(q.match(/\d+([.,]\d+)?/g)||[]).length; s+=Math.min(1.5,nums*.12);
    const pasos=(e.match(/→|=|;|\. /g)||[]).length; s+=Math.min(1.5,pasos*.08)}
  return s}
function calcularDif(){const por={};
  Object.values(Q).forEach(p=>{if(p.fx) return; (por[p.c]=por[p.c]||[]).push([p.id,rasgoDif(p)])});
  Object.values(por).forEach(arr=>{arr.sort((a,b)=>a[1]-b[1]); const n=arr.length;
    arr.forEach(([id],i)=>{DIF[id]=Math.min(4,1+Math.floor(i*4/n))})})}
calcularDif();
// nivel de una unidad: cuántos escalones de prerrequisitos tiene debajo + dificultad media de sus preguntas
const DIFU={};
(function(){const prof={}; const pf=id=>{if(prof[id]!==undefined) return prof[id]; prof[id]=0; const u=UN[id];
    const d=u&&u.pre.length?1+Math.max(...u.pre.map(p=>UN[p]?pf(p):0)):0; return prof[id]=d};
  Object.keys(UN).forEach(id=>{const u=UN[id], ds=u.ids.map(i=>DIF[i]).filter(Boolean), m=ds.length?ds.reduce((a,b)=>a+b,0)/ds.length:null;
    const porPre=Math.min(4,1+pf(id)), base=m===null?porPre:(porPre+m)/2;
    DIFU[id]=Math.max(1,Math.min(4,Math.round(base+(u.pr>=3?.25:0))))})})();
const difTag=(n,corto)=>n?`<span class="dif d${n}" title="${esc(NIVD_TXT[n])}"><i></i><i></i><i></i><i></i>${corto?"":" "}${corto?"":NIVD[n]}</span>`:"";
// tu dificultad personal en una pregunta: lo que te pasó la primera vez y la última
function difPersonal(id){const r=S.r[id]; if(!r||!r.n) return null;
  if(r.f===0&&r.g===1) return "Te costó y aún te cuesta"; if(r.f===0) return "Te costó la primera vez"; if(r.g===1) return "La fallaste la última vez"; return "Te salió bien"}
// nivel objetivo para preguntas nuevas según cómo vas en ese grupo de preguntas
function nivelObjetivo(ids){const x=nivel(ids); return x.l===4?1:x.l===0?1:Math.min(4,x.l+1)}
function ordNuevas(nuevas,ids){const t=nivelObjetivo(ids), d=x=>DIF[x]||2;
  return shuffle(nuevas).sort((a,b)=>Math.abs(d(a)-t)-Math.abs(d(b)-t)||d(a)-d(b))}
// precisión por nivel (primeros intentos)
function statsDif(ids){const out=[0,1,2,3,4].map(()=>({n:0,ok:0,tot:0}));
  ids.forEach(id=>{const d=DIF[id]; if(!d) return; out[d].tot++; const r=S.r[id]; if(r&&r.f!==undefined){out[d].n++; out[d].ok+=r.f}}); return out}
function cardNiveles(ids,titulo,cid){const st=statsDif(ids), t=nivelObjetivo(ids);
  return `<section class="card"><h2>${titulo||"Practica por nivel"}</h2><p class="muted small">Cada pregunta tiene un nivel propio estimado (de Fundamental a Avanzado). Tu ruta te va subiendo de nivel: las preguntas nuevas que te tocan ahora son de nivel <b>${NIVD[t]}</b>.</p>
  <div class="nivs">${[1,2,3,4].map(n=>{const s=st[n], p=s.n?Math.round(s.ok/s.n*100):null; return `<button class="niv ${n===t?"on":""}" data-act="nivq" data-c="${cid||""}" data-lv="${n}" ${s.tot?"":"disabled"}>${difTag(n,true)}<b>${NIVD[n]}</b><small>${s.tot} preg.${p!==null?` · ${p} % bien`:""}</small></button>`}).join("")}</div></section>`}

  const t0=performance.now(), d=1000; const step=t=>{const k=Math.min(1,(t-t0)/d), q=1-Math.pow(1-k,3); el.textContent=fmt(to*q)+suf; if(k<1) requestAnimationFrame(step)}; el.textContent="0"+suf; requestAnimationFrame(step)})}
function draw(){const app=$("#app"), nav=$("#nav"), side=$("#side"); const enSes=!!(ses||fl||dg); document.body.classList.toggle("insession",enSes); document.body.classList.toggle("v-inicio",!enSes&&view()==="inicio");

  else {nav.style.display=""; side.style.display=""; const v=view(); key=v+(v.startsWith("f-")&&fz?"|"+fz.b+"|"+fz.paso:""); navs(v.startsWith("c-")||v.startsWith("f-")||v.startsWith("u-")||v.startsWith("m-")||v.startsWith("t-")||v==="biblioteca"?"cursos":v==="historial"?"progreso":v==="errores"?"tarjetas":v);
    app.innerHTML=v.startsWith("f-")?vFicha(v.slice(2)):v.startsWith("u-")?vUnidad(v.slice(2)):v.startsWith("m-")?vMapa(v.slice(2)):v.startsWith("t-")?vTeoria(v.slice(2)):v==="biblioteca"?vBiblio():v==="historial"?vHistorial():v==="ajustes"?vAjustes():v==="errores"?vErrores():v.startsWith("c-")?vCurso(v.slice(2)):{inicio:vInicio,tarjetas:vTarjetas,cursos:vCursos,progreso:vProgreso,banco:vBanco}[v]()}
  document.body.classList.toggle("enficha",!enSes&&String(key).startsWith("f-"));
  const nueva=key!==lastKey; app.classList.toggle("enter",nueva&&key!=="ses"&&key!=="fl"); if(nueva) contar(); lastKey=key}

document.addEventListener("click",ev=>{const b=ev.target.closest("[data-act]");
  if(!b){const c=ev.target.closest(".fcard"); if(c&&fl&&!fl.flip&&!ev.target.closest("summary,details,a")) voltear(); return}
  const a=b.dataset.act;
  if(a!=="reset"&&resetArmed){resetArmed=false}
  if(a!=="dg-drop"&&dropArmed){dropArmed=false}
  if(a==="dg-new"){armarDiag(); abrirBloque(0); return}
  if(a==="dg-go"){if(diagEnCurso()) abrirBloque(+b.dataset.b); return}
  if(a==="dg-pick"){dg.sel=+b.dataset.i; draw(); return}
  if(a==="dg-next"){diagSiguiente(1); return}
  if(a==="dg-prev"){const d=S.diag, id=d.bl[dg.b][d.pos[dg.b]]; if(dg.sel!==undefined&&dg.sel!==null) d.resp[id]=dg.sel; diagSiguiente(-1); return}
  if(a==="dg-blank"){dg.sel=undefined; diagSiguiente(1); return}
  if(a==="dg-pause"){salir(); return}
  if(a==="dg-drop"){if(dropArmed){S.diag=null; S.diagT=Date.now(); armarReserva(); save(); dropArmed=false} else dropArmed=true; draw(); return}
  if(a==="dg-copy"){copiarTexto(resumenDiag(dg.res)).then(ok=>{cpMsg=ok?"Copiado ✓ · pégalo en el chat con Claude":"No se pudo copiar: toma una captura"; draw()}); return}

  if(a==="bk-open"){bk.abrir=!bk.abrir; bk.pend=null; bk.msg=""; draw(); return}
  if(a==="bk-restore"){if(bk.pend){S=fusionar(S,bk.pend); armarReserva(); S.plan=null; save(); bk={txt:"",msg:`Progreso combinado ✓ · ahora tienes ${Object.keys(S.r).length} preguntas vistas`,abrir:false,pend:null}; draw(); return}
    const el=$("#bk-in"); leerCodigo(el&&el.value).then(o=>{if(!o||typeof o.r!=="object") throw 0; bk.pend=o; bk.msg=""; draw()}).catch(()=>{bk.msg="Ese código no es válido. Cópialo completo, desde R1250."; draw()}); return}
  if(a==="sy-open"){syncAbierto=true; SYNC.msg=""; draw(); return}
  if(a==="sy-on"){const el=$("#sy-tok"); conectarSync(el&&el.value); return}
  if(a==="sy-now"){sincronizar(true); return}
  if(a==="sy-copy"){copiarTexto(SYNC.tok).then(ok=>{SYNC.cp=ok?"Copiada ✓ · pégala en el otro dispositivo":"No se pudo copiar"; pintarSync(); setTimeout(()=>{SYNC.cp=""; pintarSync()},6e3)}); return}
  if(a==="sy-off"){SYNC={tok:"",gist:"",last:0,est:"",msg:""}; guardarSync(); draw(); return}
  if(a==="tema"){fijarTema(b.dataset.v); draw(); return}
  if(a==="min"){S.cfg.min=+b.dataset.m; S.cfg.t=Date.now(); S.plan=null; save(); draw(); return}
  if(a==="replan"){S.plan=null; save(); draw(); return}
  if(a==="cfg-act"){S.cfg.act=+b.dataset.m; S.cfg.t=Date.now(); save(); draw(); return}
  if(a==="cfg-fecha"){const el=$("#cfg-fecha"); if(el&&/^\d{4}-\d{2}-\d{2}$/.test(el.value)){S.cfg.fecha=el.value; S.cfg.t=Date.now(); S.plan=null; save(); draw()} return}
  if(a.startsWith("fi-")||a==="ficha"){accionFicha(a,b); return}
  if(a==="cf"){ses.cf=b.dataset.v; draw(); return}
  if(a==="er"){ses.er=ses.er===b.dataset.v?"":b.dataset.v; draw(); return}
  if(a==="cfil"){cfil=b.dataset.v; draw(); return}
  if(a==="modo"){S.cfg.modo=b.dataset.v==="explorar"?"explorar":"ruta"; S.cfg.t=Date.now(); save(); draw(); return}
  if(a==="u-hecha"){const id=b.dataset.id; S.un=S.un||{}; S.un[id]={v:unHecha(id)?0:1,t:Date.now()}; save(); draw(); return}
  if(a==="nivq"){const c=b.dataset.c, n=+b.dataset.lv, ids=(c?idsCursoT(c):Object.keys(Q).filter(i=>!Q[i].fx)).filter(i=>DIF[i]===n); if(ids.length) start("leccion",ordenar(ids,10),(c?C[c].n+" · ":"")+"Nivel "+NIVD[n]); return}
  if(a==="unq"){const u=UN[b.dataset.id]; if(u&&u.ids.length) start("leccion",ordenar(u.ids,8),C[u.c].n+" · "+u.n); return}
  if(a==="temaq"){iniciarTema(b.dataset.id)}
  else if(a==="cursoq"){const c=b.dataset.id; start("leccion",ordenar(idsCursoT(c),10),C[c].n)}
  else if(a==="esp"){iniciarEsp()}
  else if(a==="olvq"){const p=olvidando().filter(o=>esCalc(o.id)).slice(0,10).map(o=>o.id); if(p.length) start("repaso",p,"Lo que estás olvidando")}
  else if(a==="errq"){const e=shuffle(errores()).slice(0,10); start("repaso",e,"Mis errores")}
  else if(a==="errk"){const g=gruposErrores(), k=b.dataset.k, e=shuffle(g.tipo[k]||[]).slice(0,10); if(e.length) start("repaso",e,"Mis errores · "+(k==="sin"?"sin marcar":ERRORES.find(x=>x[0]===k)[1]))}
  else if(a==="errt"){const g=gruposErrores(), t=b.dataset.t, e=shuffle(g.tema[t]||[]).slice(0,10); if(e.length) start("repaso",e,"Mis errores · "+TM[t].n)}
  else if(a==="review"){const p=pendientes(); if(p.length) start("repaso",p.slice(0,10),"Repaso")}
  else if(a==="sim"){start("sim",armarSim(20),"Simulacro rápido")}
  else if(a==="flash"){startFlash(b.dataset.deck)}
  else if(a==="flip"){voltear()}
  else if(a==="pista"){pista()}
  else if(a==="rate"){calificarTarjeta(+b.dataset.n)}
  else if(a==="pick"){ses.sel=+b.dataset.i; draw()}
  else if(a==="check"){if(ses.sel!==null) responder(ses.sel)}
  else if(a==="blank"){responder(null)}
  else if(a==="next"){avanzar()}
  else if(a==="exit"||a==="home"){salir()}
  else if(a==="reset"){if(resetArmed){const m=S.cfg; S=BASE(); S.cfg=m; S.borrado=Date.now(); armarReserva(); save(); resetArmed=false; if(SYNC.tok) sincronizar(true)} else resetArmed=true; draw()}
});

    return}

<script>
/* App instalable: guarda todo para usarla sin internet y se actualiza sola */
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  const habiaVersion = !!navigator.serviceWorker.controller;  // en la primera visita no hay versión anterior: no se avisa
  addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      reg.addEventListener("updatefound", () => {
        const nuevo = reg.installing;
        if (!nuevo) return;
        nuevo.addEventListener("statechange", () => {
          if (nuevo.state === "activated" && habiaVersion) avisoVersion();
        });
      });
    }).catch(() => {});
  });
}
function avisoVersion() {
  if (document.getElementById("aviso-version")) return;
  const d = document.createElement("button");
  d.id = "aviso-version";
  d.type = "button";
  d.textContent = "Nueva versión lista · Toca para actualizar";
  d.style.cssText = "position:fixed;left:50%;bottom:calc(" + (innerWidth >= 900 ? 24 : 92) + "px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9999;min-height:44px;padding:10px 18px;border-radius:999px;border:1px solid #C0A92B;background:#6E1423;color:#F8F4EE;font:600 15px 'Instrument Sans',system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.4);cursor:pointer;max-width:calc(100vw - 32px)";
  d.onclick = () => location.reload();
  document.body.appendChild(d);
}
