<script>
// Ruta 1250 · fichas por tema (piloto, 16 nov 2026)
// Cada ficha divide un tema en bloques: concepto → explicación → ejemplo resuelto → práctica guiada
// → ejercicios independientes (preguntas reales del banco) → evaluación sin pistas → repaso (tarjetas FSRS).
// Los ejemplos y la práctica guiada usan preguntas reales del banco (id) con su clave verificada;
// la teoría, las pistas, los pasos y las evaluaciones propias los redactó Claude y se verificaron con cálculo.
// Formato de un bloque:
//   id, t (título), ts (etiquetas "t" del banco que cubre; "*" al final = empieza con),
//   concepto, explica:[párrafos], claves:[[frente, reverso]] (pasan a tarjetas),
//   ejemplo:{id, pasos:[...], idea}, guiada:[{id, pistas:[...], pasos:[...], mal:{índiceOriginal:"por qué está mal"}}],
//   chequeo:[{q, o:[...], a, e}]  (evaluación propia, sin pistas)
//   tabla?:{t, cab:[...], filas:[[...]]}  (comparación o clasificación; se muestra en la explicación y en la biblioteca)
//   prac?:[{q, o, a, e}]  (práctica extra redactada por Ruta 1250, con corrección inmediata; no entra al banco ni al puntaje)
const FICHAS={
"hlm:Problemas operativos":{
  fuente:"Preguntas reales del banco (2023-I a 2026-II) y sus resoluciones. Teoría redactada para Ruta 1250.",
  bloques:[
  {id:"cert",t:"Certezas (el peor de los casos)",ts:["Certezas"],
   concepto:"Tener algo «con certeza» significa que debe pasar aunque tengas la peor suerte posible. Por eso se calcula con el peor de los casos: primero sale todo lo que NO te sirve.",
   explica:[
    "En estas preguntas no importa la probabilidad. Te preguntan cuántos objetos sacar, como mínimo, para estar SEGURO de lograr algo.",
    "Método en 3 pasos: (1) cuenta cuántos objetos hay de cada tipo; (2) imagina que salen primero todos los que no te sirven, o la mayor cantidad posible sin lograr el objetivo; (3) suma lo que falta para lograrlo con seguridad.",
    "Caso clásico: con k tipos distintos y sin límite de cantidad, para asegurar n del mismo tipo necesitas k·(n − 1) + 1. Con 3 colores, para tener 2 iguales: 3·1 + 1 = 4.",
    "Error típico: responder con el caso favorable («si tengo suerte salen 2 seguidas»). La certeza siempre se calcula contra la mala suerte."],
   claves:[["En certezas, ¿qué es el «peor de los casos»?","Suponer que primero salen todos los objetos que NO te sirven, y luego sumar lo que falta para lograr el objetivo."],
     ["Para asegurar n objetos del mismo tipo (k tipos, sin límite)","k·(n − 1) + 1"],
     ["¿Cuántas personas aseguran 2 con la misma fecha de cumpleaños?","367: los 366 días de un año bisiesto + 1."]],
   ejemplo:{id:"25II-28",pasos:[
     "Cuenta lo que hay: del 8 al 30 son 30 − 8 + 1 = 23 fichas.",
     "Sepáralas según lo que pide la pregunta: pares (8, 10, …, 30) son 12; impares (9, 11, …, 29) son 11.",
     "Peor de los casos: salen primero todas las que no sirven, los 12 pares.",
     "Después de eso, toda ficha que sale es impar: faltan 2.",
     "Total: 12 + 2 = 14 fichas."],
     idea:"Empieza siempre por la peor suerte posible y luego suma lo que falta."},
   guiada:[
    {id:"23I-25",pistas:["Pregúntate: ¿cuántos bolos puedo sacar SIN tener tres consecutivos?","Prueba tomando pares de números y saltando uno: 2-3, 5-6, 8-9."],
     pasos:["Para evitar tres consecutivos, toma bolos de dos en dos y salta uno: 2, 3, _, 5, 6, _, 8, 9.","Así sacas 6 bolos sin terna: ese es el peor de los casos.","El siguiente bolo (4 o 7) completa sí o sí una terna: 3-4-5 o 6-7-8.","Mínimo: 6 + 1 = 7."],
     mal:{0:"Con 5 bolos todavía puedes tener 2, 3, 5, 6, 8: no hay tres consecutivos.",1:"6 es el peor caso SIN terna (2, 3, 5, 6, 8, 9). Te falta el +1 que la asegura.",3:"Con 4 es fácil evitar la terna: 2, 3, 5, 6.",4:"Tres consecutivos de entrada sería buena suerte, no certeza."}},
    {id:"24II-21",pistas:["¿Cuántas fechas de cumpleaños distintas puede haber como máximo? Piensa en el año bisiesto.","Peor caso: todos los niños con fechas distintas. ¿Cuántos niños como máximo sin repetir fecha?"],
     pasos:["Un año bisiesto tiene 366 fechas (incluye el 29 de febrero).","Peor caso: 366 niños, cada uno con una fecha distinta.","El niño número 367 repite fecha con seguridad.","Ya hay 299 matriculados: faltan 367 − 299 = 68."],
     mal:{0:"Revisa la resta: 367 − 299 = 68.",1:"67 sale de 366 − 299: llegas al peor caso, pero todavía sin repetir. Falta el +1.",2:"Te sobra uno: 367 − 299 = 68.",3:"66 = 365 − 299: olvidaste el 29 de febrero y el +1."}}],
   chequeo:[
    {q:"En una caja hay 5 bolas rojas, 4 azules y 3 verdes. ¿Cuántas debes sacar, como mínimo, para tener con certeza 2 del mismo color?",o:["2","3","4","5","6"],a:2,e:"Peor caso: una de cada color (3 bolas). La siguiente repite color: 3 + 1 = 4."},
    {q:"Tienes 6 pares de guantes negros y 6 pares blancos, todos sueltos y mezclados. ¿Cuántos guantes debes sacar, como mínimo, para tener con certeza un par usable (un izquierdo y un derecho del mismo color)?",o:["3","7","12","13","24"],a:3,e:"Peor caso: salen los 12 guantes izquierdos (6 negros y 6 blancos). El siguiente es derecho y forma par con alguno: 12 + 1 = 13."},
    {q:"En problemas de certeza, el «peor de los casos» significa…",o:["suponer que primero salen todos los objetos que no te sirven","suponer que tienes la mejor suerte posible","calcular la probabilidad de lograr el objetivo","sacar la mitad de los objetos"],a:0,e:"La certeza se calcula contra la mala suerte: primero sale todo lo que no sirve."}]},
  {id:"crono",t:"Cronometría (relojes y campanadas)",ts:["Cronometría","Cronometría (ángulos)","Cronometría - campanadas","Calendarios"],
   concepto:"Un reloj que se atrasa marca MENOS que la hora real; uno que se adelanta marca MÁS. En campanadas, el tiempo lo ocupan los intervalos entre ellas, no las campanadas.",
   explica:[
    "Adelantos y atrasos: primero calcula cuánto se desfasó en total (por ejemplo, 4 min cada 80 min durante 480 min: 480 ÷ 80 = 6 veces → 6 × 4 = 24 min).",
    "Luego decide el signo. Si el reloj se atrasa, la hora real va adelante: hora real = hora marcada + atraso. Si se adelanta: hora real = hora marcada − adelanto.",
    "Campanadas: entre n campanadas hay n − 1 intervalos. Tiempo total = (n − 1) × tiempo de un intervalo. Ojo con relojes que dan una campanada menos o más que la hora.",
    "Ángulo entre las agujas a las H:M: θ = |30·H − 5,5·M|. El horario avanza 0,5° por minuto y el minutero 6° por minuto."],
   claves:[["Reloj que se ATRASA: hora real = …","Hora marcada + atraso total."],
     ["Reloj que se ADELANTA: hora real = …","Hora marcada − adelanto total."],
     ["Tiempo total de n campanadas","(n − 1) × tiempo entre dos campanadas."],
     ["Ángulo entre agujas a las H:M","θ = |30·H − 5,5·M| (el horario avanza 0,5° por minuto)."]],
   ejemplo:{id:"25II-21",pasos:[
     "Convierte todo a minutos: 8 h = 480 min.",
     "¿Cuántas veces caben 80 min en 480 min? 480 ÷ 80 = 6.",
     "Atraso total: 6 × 4 min = 24 min.",
     "El reloj se ATRASA, así que marca menos que la hora real: hora real = marcada + atraso.",
     "10 h + 24 min = 10 h 24 min."],
     idea:"Primero el desfase total, después el signo: atraso suma, adelanto resta."},
   guiada:[
    {id:"23II-18",pistas:["¿Cuántas horas pasan del domingo 25 a las 10:00 al sábado 31 a las 10:00?","6 días = 144 horas. Multiplica por el atraso de cada hora.","El reloj atrasado marca MENOS que la hora real."],
     pasos:["Del 25 al 31 a la misma hora hay 6 días = 6 × 24 = 144 h.","Atraso: 144 × 2 min = 288 min = 4 h 48 min.","Hora marcada = hora real − atraso = 10:00 − 4 h 48 min = 5:12 a. m."],
     mal:{1:"4 h 48 min es el atraso, no la hora que marca: réstalo de las 10:00.",0:"Revisa la resta: 10:00 − 4:48 = 5:12.",2:"Revisa la cuenta: el atraso es 288 min = 4 h 48 min, y 10:00 − 4:48 = 5:12.",4:"Revisa la cuenta: el atraso es 288 min = 4 h 48 min, y 10:00 − 4:48 = 5:12."}},
    {id:"23II-17",pistas:["Ojo: este reloj da una campanada MENOS que la hora. ¿Cuántas da a las 8:00?","7 campanadas tienen 6 intervalos. ¿Cuánto dura cada intervalo?"],
     pasos:["A las 8:00 da 8 − 1 = 7 campanadas → 6 intervalos.","3 s ÷ 6 = 0,5 s por intervalo.","A las 10:00 da 10 − 1 = 9 campanadas → 8 intervalos.","8 × 0,5 s = 4 s."],
     mal:{0:"El tiempo depende de los intervalos (campanadas − 1), no del número de campanadas.",1:"No es una regla de tres con las horas: cuenta los intervalos (campanadas − 1).",2:"Recuerda que a las 10:00 este reloj da 9 campanadas, o sea 8 intervalos.",3:"Recuerda que a las 10:00 este reloj da 9 campanadas, o sea 8 intervalos."}}],
   chequeo:[
    {q:"Un reloj se adelanta 3 minutos cada hora. Se puso a la hora exacta hace 5 horas y ahora marca las 2:20. ¿Qué hora es en realidad?",o:["2:05","2:35","2:17","2:15","2:23"],a:0,e:"Adelanto total: 5 × 3 = 15 min. El reloj adelantado marca más: hora real = 2:20 − 0:15 = 2:05."},
    {q:"Un reloj da 5 campanadas en 8 segundos. ¿Cuánto tarda en dar 9 campanadas?",o:["14,4 s","16 s","18 s","15 s","12 s"],a:1,e:"5 campanadas = 4 intervalos de 2 s. 9 campanadas = 8 intervalos: 8 × 2 = 16 s."},
    {q:"Si un reloj se atrasa, la hora real es…",o:["mayor que la que marca","menor que la que marca","igual a la que marca","imposible de saber"],a:0,e:"Si se atrasa, va por detrás: la hora real está adelante de lo que marca."}]},
  {id:"tras",t:"Trasvases y pesadas",ts:["Trasvases","Pesadas","Balanzas y pesadas"],
   concepto:"Sin marcas ni graduación, solo sabes cuánto hay cuando un recipiente está lleno o vacío. Con una balanza sin pesas, cada pesada te permite partir algo en dos mitades iguales.",
   explica:[
    "Trasvases: anota el estado de todos los recipientes en cada paso, por ejemplo (15, 0, 0) → (8, 7, 0). Cada trasvase termina cuando el que recibe se llena o el que vierte se vacía.",
    "Para obtener una cantidad que no es la capacidad de ningún recipiente, busca la resta: llenar uno de 7 desde otro y pasar a uno de 4 deja 7 − 4 = 3.",
    "Pesadas con balanza de dos platillos: sin pesas, una pesada parte una cantidad en dos mitades. Con pesas a y b (a > b), en una sola pesada puedes medir a, b, a + b (ambas en el mismo platillo) y a − b (una en cada platillo).",
    "Combina las dos ideas: primero parte en mitades para acercarte y luego usa las pesas para ajustar."],
   claves:[["En trasvases, ¿cuándo termina cada paso?","Cuando el recipiente que recibe se llena o el que vierte se vacía (no hay marcas)."],
     ["Balanza sin pesas: ¿qué logras con una pesada?","Dividir una cantidad en dos mitades iguales."],
     ["Con pesas de a y b kg (a > b), en una pesada puedes medir…","a, b, a + b (las dos juntas) y a − b (una en cada platillo)."],
     ["Estrategia de trasvases","Anotar el estado de todos los recipientes en cada paso, p. ej. (15, 0, 0) → (8, 7, 0), y contar los pasos."]],
   ejemplo:{id:"23I-17",pasos:[
     "Anota el estado como (11 L, 3 L, 5 L): empiezas en (11, 0, 0).",
     "Meta: dejar 10 L en el primero. Necesitas apartar exactamente 1 L en otro recipiente.",
     "1) Llena el de 3: (8, 3, 0). 2) Pasa el de 3 al de 5: (8, 0, 3).",
     "3) Llena otra vez el de 3: (5, 3, 3). 4) Con el de 3 completa el de 5, al que le faltan 2: (5, 1, 5).",
     "5) Devuelve los 5 L al primero: (10, 1, 0). Son 5 trasvases."],
     idea:"Escribir el estado de cada recipiente en cada paso evita perderse."},
   guiada:[
    {id:"26II-24",pistas:["Escribe el estado (15, 7, 4) en cada paso. Empiezas en (15, 0, 0).","Primero llena el de 7 y desde ahí llena el de 4: ¿qué queda en el de 7?","Con 3 L en el de 7, guárdalos en el de 4 y vuelve a llenar el de 7."],
     pasos:["(15, 0, 0) → llena el de 7: (8, 7, 0).","Del de 7 llena el de 4: (8, 3, 4).","Devuelve los 4 L al grande: (12, 3, 0).","Pasa los 3 L al de 4: (12, 0, 3).","Llena el de 7 desde el grande: (5, 7, 3). Ya tienes 5, 7 y 3: fueron 5 trasvases."],
     mal:{0:"Con tan pocos pasos no se puede. Anota los estados y verás que necesitas 5.",1:"Con tan pocos pasos no se puede. Anota los estados y verás que necesitas 5.",2:"Se puede en menos: (15,0,0) → (8,7,0) → (8,3,4) → (12,3,0) → (12,0,3) → (5,7,3).",4:"Se puede en menos: (15,0,0) → (8,7,0) → (8,3,4) → (12,3,0) → (12,0,3) → (5,7,3)."}},
    {id:"26II-26",pistas:["Sin usar pesas, ¿qué obtienes al equilibrar el saco en los dos platillos?","Con 25 kg, pon la pesa de 7 en un platillo y la de 3 en el otro. Plantea la ecuación."],
     pasos:["1.ª pesada: reparte los 50 kg hasta equilibrar → 25 kg y 25 kg.","2.ª pesada: con 25 kg, platillo A tiene x + 7 y platillo B tiene (25 − x) + 3.","x + 7 = 28 − x → 2x = 21 → x = 10,5 kg. Total: 2 pesadas."],
     mal:{1:"En una sola pesada con 3 y 7 kg solo obtienes 3, 7, 10 o 4 kg: 10,5 no sale.",2:"Se puede en 2: primero mitades (25 kg) y luego ajustar con las pesas.",3:"Se puede en 2: primero mitades (25 kg) y luego ajustar con las pesas.",4:"Se puede en 2: primero mitades (25 kg) y luego ajustar con las pesas."}}],
   chequeo:[
    {q:"Con una balanza de dos platillos y sin pesas, ¿cuántas pesadas necesitas, como mínimo, para sacar 12 kg de un saco de 48 kg?",o:["1","2","3","4","6"],a:1,e:"1.ª: 48 → 24 y 24. 2.ª: 24 → 12 y 12. Son 2 pesadas."},
    {q:"Tienes pesas de 2 kg y 5 kg. En UNA sola pesada, ¿qué cantidad NO puedes medir?",o:["3 kg","7 kg","2 kg","4 kg","5 kg"],a:3,e:"Puedes medir 2, 5, 2 + 5 = 7 y 5 − 2 = 3. 4 kg no sale en una pesada."},
    {q:"En un problema de trasvases sin marcas, cada trasvase termina cuando…",o:["el recipiente que recibe se llena o el que vierte se vacía","pasas exactamente la mitad","decides parar","los dos recipientes tienen lo mismo"],a:0,e:"Sin marcas, lo único medible es lleno o vacío."}]}
  ]},
"fis:Electricidad y magnetismo":{
  fuente:"Preguntas reales del banco (2023-I a 2026-II) y sus resoluciones. Teoría redactada para Ruta 1250.",
  bloques:[
  {id:"elec",t:"Corriente y circuitos",ts:["Electrodinámica","Circuitos eléctricos"],
   concepto:"La corriente (I) es carga que circula. El voltaje (V) la empuja y la resistencia (R) la frena: V = I·R. Todo circuito se resuelve reduciendo resistencias y aplicando esta ley.",
   explica:[
    "Ley de Ohm: V = I·R (voltios = amperios × ohmios). Si conoces dos valores, sacas el tercero.",
    "En serie (una detrás de otra) pasa la misma corriente y las resistencias se suman: R = R₁ + R₂. En paralelo (lado a lado) tienen el mismo voltaje y se suman las inversas: 1/R = 1/R₁ + 1/R₂. Dos iguales en paralelo dan la mitad.",
    "Una batería real tiene resistencia interna r: ε = I·(R + r). El calor disipado (efecto Joule) es Q = I²·R·t.",
    "Kirchhoff, para circuitos con varias ramas: en un nodo, lo que entra es igual a lo que sale; en una malla, la suma de las fem es igual a la suma de las caídas I·R."],
   claves:[["Ley de Ohm","V = I·R"],
     ["Resistencias en serie / en paralelo","Serie: R = R₁ + R₂ + … · Paralelo: 1/R = 1/R₁ + 1/R₂ + … (dos iguales: R/2)."],
     ["Fuente con resistencia interna r","ε = I·(R + r)"],
     ["Efecto Joule (calor disipado)","Q = I²·R·t"],
     ["Leyes de Kirchhoff","Nodo: lo que entra = lo que sale. Malla: suma de fem = suma de caídas I·R."]],
   ejemplo:{id:"23I-84",pasos:[
     "Fórmula de Joule: Q = I²·R·t.",
     "Nuevas condiciones: misma corriente I, resistencia 2R y tiempo 2t.",
     "Q' = I²·(2R)·(2t) = 4·I²·R·t.",
     "Q' = 4Q."],
     idea:"Escribe la fórmula, reemplaza solo lo que cambia y compara con la original."},
   guiada:[
    {id:"23II-85",pistas:["Del gráfico toma dos puntos (R, I): por ejemplo R = 0,5 Ω con I = 6 A, y R = 1 Ω con I = 4 A.","Usa ε = I·(R + r) en los dos puntos: la fem es la misma en ambos."],
     pasos:["Punto 1: ε = 6·(0,5 + r). Punto 2: ε = 4·(1 + r).","Iguala: 3 + 6r = 4 + 4r → 2r = 1 → r = 0,5 Ω.","Comprueba: ε = 6·(0,5 + 0,5) = 6 V, igual que el dato."],
     mal:{1:"1 Ω es un valor del reóstato que se lee en el gráfico, no la resistencia interna.",0:"Plantea ε = I·(R + r) con dos puntos del gráfico e iguala.",3:"Plantea ε = I·(R + r) con dos puntos del gráfico e iguala.",4:"Plantea ε = I·(R + r) con dos puntos del gráfico e iguala."}},
    {id:"26II-87",pistas:["Nodo: la corriente que entra es igual a la que sale. ¿Cuánto vale la tercera corriente?","La caída en la rama de 6 Ω (V = I·R) es la diferencia de potencial entre los dos nodos.","Recorre la rama de abajo: ε₂ menos la caída en su resistencia debe dar ese mismo voltaje."],
     pasos:["Nodo: I₃ = I₂ − I₁ = 2 − 0,5 = 1,5 A por la rama de 2 Ω.","Rama de 6 Ω: V = 6 × 2 = 12 V entre los nodos. Arriba se confirma: 14 − 0,5 × 4 = 12 V.","Rama de abajo: ε₂ − 1,5 × 2 = 12 → ε₂ = 15 V."],
     mal:{2:"14 V es ε₁. ε₂ sale de la otra rama.",3:"Revisa la caída en la resistencia de 2 Ω: 1,5 × 2 = 3 V, así que ε₂ = 12 + 3 = 15 V.",0:"Revisa el nodo: I₃ = 2 − 0,5 = 1,5 A, y la rama de 6 Ω tiene 12 V.",1:"Revisa el nodo: I₃ = 2 − 0,5 = 1,5 A, y la rama de 6 Ω tiene 12 V."}}],
   chequeo:[
    {q:"Dos resistencias de 6 Ω conectadas en paralelo equivalen a…",o:["12 Ω","6 Ω","3 Ω","1,5 Ω","36 Ω"],a:2,e:"Dos iguales en paralelo dan la mitad: 6/2 = 3 Ω."},
    {q:"Una batería de 12 V se conecta a una resistencia de 4 Ω. ¿Qué corriente circula?",o:["48 A","3 A","0,33 A","8 A","16 A"],a:1,e:"I = V/R = 12/4 = 3 A."},
    {q:"En un nodo de un circuito, la suma de las corrientes que entran es igual a…",o:["la suma de las que salen","cero siempre","el voltaje del nodo","la resistencia total"],a:0,e:"Primera ley de Kirchhoff: la carga no se acumula en el nodo."}]},
  {id:"cond",t:"Condensadores",ts:["Condensadores"],
   concepto:"Un condensador guarda carga: C = Q/V. Al combinarlos la regla es al revés que en las resistencias: en paralelo se suman y en serie se suman las inversas.",
   explica:[
    "Capacidad: C = Q/V, en faradios (F). En la práctica se usan µF (10⁻⁶ F). Uno de placas paralelas tiene C = ε₀·A/d: más área, más capacidad; más separación, menos.",
    "Paralelo (mismos dos puntos): C = C₁ + C₂ + … Serie (uno tras otro): 1/C = 1/C₁ + 1/C₂ + … Dos iguales en serie dan la mitad.",
    "Para reducir un arreglo, busca primero los que comparten los mismos dos puntos (paralelo), reemplázalos por uno solo y repite.",
    "Energía guardada: U = ½·C·V²."],
   claves:[["Capacidad de un condensador","C = Q/V. De placas paralelas: C = ε₀·A/d."],
     ["Condensadores en paralelo / en serie","Paralelo: C = C₁ + C₂ + … · Serie: 1/C = 1/C₁ + 1/C₂ + … (al revés que las resistencias)."],
     ["Energía almacenada en un condensador","U = ½·C·V²"]],
   ejemplo:{id:"25II-85",pasos:[
     "Identifica qué está en paralelo: C₂ y C₃ comparten los mismos dos puntos, así que se suman: 4 + 4 = 8 μF.",
     "Ese bloque de 8 μF queda en serie con C₁ y C₄.",
     "Serie: 1/C = 1/4 + 1/8 + 1/4 = 2/8 + 1/8 + 2/8 = 5/8.",
     "C = 8/5 = 1,6 μF."],
     idea:"Reduce por partes: primero los paralelos, luego la serie."},
   guiada:[
    {id:"24II-86",pistas:["Primero halla C: cuatro iguales en paralelo dan 8 µF, así que 4C = 8.","Con C = 2 µF, reduce el arreglo por partes. Dos C en serie dan C/2, y lo que queda en paralelo se suma."],
     pasos:["4C = 8 µF → C = 2 µF.","Reduce el arreglo de la figura: queda un bloque de 2C en paralelo con una rama de dos C en serie (C/2).","Total: 2C + C/2 = 5C/2.","5 × 2/2 = 5,0 µF."],
     mal:{0:"4 µF es 2C: te falta sumar la rama en serie (C/2).",1:"Revisa la rama en serie: dos C en serie dan C/2, no C.",2:"Revisa: 2C + C/2 con C = 2 µF da 5 µF.",4:"Revisa: 2C + C/2 con C = 2 µF da 5 µF."}}],
   chequeo:[
    {q:"Dos condensadores de 6 µF conectados en serie equivalen a…",o:["12 µF","6 µF","3 µF","36 µF","1,5 µF"],a:2,e:"En serie, dos iguales dan la mitad: 3 µF (al revés que las resistencias)."},
    {q:"Un condensador de 4 µF se conecta a 10 V. ¿Qué carga almacena?",o:["0,4 µC","2,5 µC","40 µC","14 µC","400 µC"],a:2,e:"Q = C·V = 4 µF × 10 V = 40 µC."},
    {q:"¿Cómo se combinan condensadores en paralelo?",o:["Se suman sus capacidades","Se suman las inversas","Se multiplican","Se toma el mayor"],a:0,e:"En paralelo: C = C₁ + C₂ + …"}]},
  {id:"induc",t:"Magnetismo e inducción",ts:["Ley de Lenz","Ley de Faraday","Inducción electromagnética","Electromagnetismo"],
   concepto:"Si el flujo magnético que atraviesa una espira cambia, aparece una corriente inducida (Faraday). Esa corriente siempre se opone al cambio que la produjo (Lenz).",
   explica:[
    "Flujo magnético: Φ = B·A·cos θ (en weber, Wb). Cambia si cambia el campo B, el área A o el ángulo θ (por ejemplo, si la espira gira).",
    "Ley de Faraday: la fem inducida es ε = N·ΔΦ/Δt, donde N es el número de espiras. Con la fem, la corriente sale con Ohm: I = ε/R.",
    "Ley de Lenz: si el flujo aumenta, la corriente inducida crea un campo opuesto. Si disminuye, crea un campo en el mismo sentido para «sostenerlo». El sentido se halla con la regla de la mano derecha.",
    "Una carga q que se mueve dentro de un campo B siente una fuerza F = q·v·B·sen θ. Si v es perpendicular a B, la partícula describe una circunferencia de radio R = m·v/(q·B)."],
   claves:[["Flujo magnético","Φ = B·A·cos θ (weber)"],
     ["Ley de Faraday","ε = N·ΔΦ/Δt (en módulo)"],
     ["Ley de Lenz","La corriente inducida se opone al cambio de flujo que la produce."],
     ["Radio de una carga en un campo magnético (v ⊥ B)","R = m·v/(q·B)"]],
   ejemplo:{id:"25II-87",pasos:[
     "Faraday: ε = N·B·(ΔA/Δt) cuando lo que cambia es el área.",
     "ε = 50 × 0,5 × 1,2 = 30 V.",
     "Ohm: I = ε/R = 30/10 = 3 A."],
     idea:"Faraday te da la fem; la ley de Ohm te da la corriente."},
   guiada:[
    {id:"26I-87",pistas:["Al acercar el imán, ¿el flujo que atraviesa la espira aumenta o disminuye?","La corriente inducida crea un campo que se OPONE a ese cambio. Usa la regla de la mano derecha para ver por dónde circula en la resistencia.","Solo una de las afirmaciones I, II y III puede ser verdadera: Va − Vb no puede ser positiva y negativa a la vez."],
     pasos:["El imán se acerca: el flujo aumenta.","Por Lenz, la corriente inducida produce un campo opuesto. Con la regla de la mano derecha, en la resistencia circula de b hacia a.","En una resistencia la corriente va del mayor al menor potencial: Vb > Va, así que Va − Vb < 0.","I falsa, II verdadera, III falsa: FVF."],
     mal:{2:"I y II no pueden ser verdaderas a la vez: solo una de las tres es cierta.",4:"I y III no pueden ser verdaderas a la vez: solo una de las tres es cierta.",0:"Si el flujo cambia hay corriente inducida, así que la diferencia de potencial no es cero.",3:"Revisa el sentido con Lenz: la corriente se opone al aumento del flujo y en la resistencia va de b hacia a."}}],
   chequeo:[
    {q:"Según la ley de Faraday, en una espira se induce corriente cuando…",o:["cambia el flujo magnético que la atraviesa","hay un campo magnético fuerte que no cambia","la espira es de cobre","la espira está quieta junto a un imán"],a:0,e:"Lo que induce corriente es el CAMBIO de flujo, no el campo en sí."},
    {q:"Una bobina de 100 espiras ve variar su flujo de 0,02 Wb a 0,08 Wb en 0,2 s. ¿Cuál es la fem media inducida?",o:["3 V","30 V","0,3 V","300 V","12 V"],a:1,e:"ε = N·ΔΦ/Δt = 100 × 0,06/0,2 = 30 V."},
    {q:"Si acercas un imán a una espira, la corriente inducida crea un campo que…",o:["se opone al aumento del flujo","refuerza el aumento del flujo","no tiene relación con el imán","atrae siempre al imán"],a:0,e:"Ley de Lenz: se opone al cambio (en este caso, al aumento)."}]}
  ]},
"hv:Inferencia y extrapolación":{
  fuente:"Textos y preguntas reales del banco (2025-II a 2027-I). Método redactado para Ruta 1250.",
  bloques:[
  {id:"infer",t:"Inferencia",ts:["Inferencia","Inferencias","Inferencia contextual","Inferencia textual","Comprensión lectora: inferencia","Comprensión de lectura: la inferencia"],
   concepto:"Inferir es sacar una conclusión que el texto no dice con esas palabras, pero que se deduce de lo que sí dice. La respuesta correcta siempre se puede justificar señalando una parte del texto.",
   explica:[
    "Una inferencia válida no agrega información de afuera ni exagera. Si para aceptar una alternativa tienes que suponer algo que el texto no da, es falsa.",
    "Método: (1) ubica en el texto la parte de la que habla la pregunta; (2) lee cada alternativa y pregúntate «¿esto se sigue de ahí?»; (3) descarta las que agregan datos, exageran o contradicen.",
    "Señales de alternativa falsa: palabras absolutas que el texto no respalda («siempre», «único», «todos», «nunca»); datos, cifras o causas que no aparecen; comparaciones que el texto no hace.",
    "Si el texto trae un gráfico o una infografía, la respuesta puede salir de un número del gráfico. Haz la cuenta (por día × 7 días, por ejemplo)."],
   claves:[["¿Qué es inferir?","Sacar una conclusión que el texto no dice explícitamente pero que se deduce de lo que sí dice."],
     ["Señales de una alternativa falsa en inferencia","Agrega datos que no están, exagera (siempre, único, todos) o contradice el texto."],
     ["Método para preguntas de inferencia","1) Ubica la parte del texto. 2) ¿La alternativa se sigue de ahí? 3) Descarta lo que inventa, exagera o contradice."]],
   ejemplo:{id:"27I-11",pasos:[
     "La pregunta pide inferir a partir del GRÁFICO: búscalo en el Texto 1 (abre el texto arriba).",
     "El gráfico indica que la hembra pone de 2 a 3 huevos por día.",
     "En una semana (7 días): mínimo 2 × 7 = 14 huevos, máximo 3 × 7 = 21. La alternativa «como mínimo, catorce huevos en una semana» se deduce.",
     "Las otras agregan datos que no están: que el surco suele salir en el rostro, que el macho vive más por ser más grande, nueve días o cinco etapas en dos meses."],
     idea:"La respuesta correcta se puede comprobar con el texto o el gráfico. Las demás necesitan datos de afuera."},
   guiada:[
    {id:"26II-17",pistas:["Ubica en el texto B la parte que habla de la tecnología.","El texto B dice que la tecnología «difuminó las fronteras entre el trabajo y la vida»: correos a medianoche, disponibles en vacaciones. ¿Qué alternativa dice eso con otras palabras?"],
     pasos:["El texto B: la tecnología prometió liberarnos, pero «ha difuminado las fronteras entre el trabajo y la vida».","Ejemplos del texto: respondemos correos a medianoche y estamos disponibles en vacaciones.","Inferencia: la tecnología ata al trabajador incluso fuera del trabajo. Es la alternativa de la «nueva forma de sujeción»."],
     mal:{0:"Exagera y contradice: el texto B no dice que la tecnología sea «la única solución»; dice que borró la frontera entre trabajo y vida.",2:"Agrega una comparación que el texto no hace: horas «en línea» frente a generaciones anteriores.",3:"El texto B no habla de que la tecnología reduzca costos a las empresas.",4:"El texto no menciona en qué prefieren invertir las empresas."}}],
   chequeo:[
    {q:"Una inferencia válida es…",o:["una conclusión que se deduce de lo que dice el texto, sin agregar datos de afuera","cualquier opinión razonable sobre el tema","una frase copiada literalmente del texto","lo que el lector cree que el autor debería decir"],a:0,e:"Inferir es deducir del texto, no opinar ni copiar."},
    {q:"Texto: «Desde que la biblioteca amplió su horario hasta las 10 p. m., las salas de estudio están llenas por la noche.» ¿Qué se infiere?",o:["Antes del cambio, la biblioteca cerraba antes de las 10 p. m.","Los estudiantes prefieren estudiar de noche que de día.","La biblioteca compró más libros.","Las notas de los estudiantes mejoraron.","De día la biblioteca está vacía."],a:0,e:"«Amplió su horario hasta las 10 p. m.» implica que antes cerraba más temprano. Lo demás no se dice."},
    {q:"¿Cuál es una trampa típica en las alternativas de inferencia?",o:["Usar palabras absolutas («siempre», «único», «todos») que el texto no respalda","Usar sinónimos de palabras del texto","Ser más corta que las demás","Hablar del tema central"],a:0,e:"Lo absoluto suele exagerar lo que el texto dice."}]},
  {id:"extra",t:"Extrapolación",ts:["Extrapolación","Comprensión de lectura, extrapolación textual","Comprensión de lecturas – extrapolación"],
   concepto:"Extrapolar es llevar la lógica del texto a una situación hipotética: «Si ocurriera X, entonces…». Cambias SOLO lo que dice la condición; todo lo demás del texto sigue siendo verdad.",
   explica:[
    "Las preguntas de extrapolación casi siempre empiezan con «Si…». Te piden aplicar una regla o una relación del texto a un caso nuevo.",
    "Método: (1) identifica qué cambia en la condición; (2) busca en el texto la regla o causa relacionada con eso; (3) aplica esa regla al caso nuevo, sin inventar efectos que el texto no permite.",
    "Si el texto da una lista cerrada (por ejemplo, «se contagia por A y por B») y la condición quita una, queda solo la otra.",
    "Descarta las alternativas que traen soluciones o consecuencias de afuera (fumigación, vacunas, «sería inofensivo») que el texto no respalda."],
   claves:[["¿Qué es extrapolar?","Llevar la lógica del texto a una situación hipotética: «Si ocurriera X, entonces…»."],
     ["Clave de la extrapolación","Cambia solo lo que dice la condición; todo lo demás del texto sigue siendo verdad."]],
   ejemplo:{id:"27I-12",pasos:[
     "La condición cambia una cosa: la sarna ya NO se contagia por fómites.",
     "El texto dice que se contagia por dos vías: contacto directo y fómites (ropa, sábanas, toallas).",
     "Si quitas una vía de una lista de dos, queda la otra: solo por contacto directo.",
     "Las otras alternativas hablan de cosas que la condición no toca: la cara, los síntomas, la sudoración o el tiempo de aparición."],
     idea:"Busca en el texto la parte que la condición modifica y aplica solo ese cambio."},
   guiada:[
    {id:"25II-13",pistas:["¿Qué dice el texto sobre la malaria y el clima?","El texto dice que es un problema en países tropicales y que, en climas templados, el parásito desaparece en invierno. ¿Qué pasaría si el frío desapareciera?"],
     pasos:["Condición: los países fríos tendrían clima tropical.","El texto: la malaria es propia de zonas tropicales y subtropicales, y en climas templados el parásito desaparece en invierno.","Aplicando la regla: con calor todo el año, el mosquito Anopheles y la malaria llegarían a esos países. Su aparición sería inminente."],
     mal:{0:"La fumigación no aparece en el texto: es una solución traída de afuera.",1:"El texto no dice nada sobre que los infectados se vuelvan más resistentes.",3:"Es lo contrario: con más calor la malaria se extendería, no desaparecerían sus síntomas.",4:"Es lo contrario: el clima cálido favorece al mosquito, no lo elimina."}}],
   chequeo:[
    {q:"Una pregunta de extrapolación te pide…",o:["aplicar la lógica del texto a una situación hipotética o distinta","copiar la idea principal","dar tu opinión personal sobre el tema","encontrar el significado de una palabra"],a:0,e:"Extrapolar = «si ocurriera X, entonces…», según la lógica del texto."},
    {q:"Texto: «El parásito X solo sobrevive a más de 20 °C; por eso la enfermedad es común en la selva y rara en la sierra.» Si la sierra se calentara por encima de 20 °C todo el año, entonces…",o:["la enfermedad podría volverse frecuente en la sierra","la enfermedad desaparecería de la selva","el parásito dejaría de necesitar calor","la sierra se convertiría en selva","nada cambiaría en la sierra"],a:0,e:"La condición quita la barrera del frío. Con la regla del texto, el parásito sobreviviría en la sierra."}]}
  ]}
,
"qui:Soluciones, ácidos y equilibrio":{
  fuente:"Preguntas reales del banco (2025-II a 2027-I) y sus resoluciones. Teoría redactada para Ruta 1250 y verificada con cálculo.",
  bloques:[
  {id:"sol",t:"Concentración y dilución",ts:["Soluciones","Soluciones - unidades de concentración"],
   concepto:"Una solución es una mezcla homogénea de soluto (lo que se disuelve) y solvente (casi siempre agua). La concentración dice cuánto soluto hay; la más usada es la molaridad: M = moles de soluto ÷ litros de solución.",
   explica:[
    "Molaridad: M = n ÷ V (V en litros). Si te dan masa, pásala a moles: n = masa ÷ masa molar. Despeja lo que pidan: n = M·V y masa = M·V·(masa molar).",
    "Normalidad: N = M·θ. θ es el número de H⁺ de un ácido (HCl 1, H₂SO₄ 2), de OH⁻ de una base (NaOH 1, Ca(OH)₂ 2) o la carga total del catión en una sal. En una neutralización, N_ácido·V_ácido = N_base·V_base.",
    "Diluir es agregar solvente: los moles de soluto no cambian, por eso M₁·V₁ = M₂·V₂. Ojo: V₂ es el volumen final total (100 mL + 900 mL de agua = 1000 mL).",
    "Porcentajes: % en masa = masa de soluto ÷ masa de solución × 100; % en volumen = volumen de soluto ÷ volumen de solución × 100. Un etanol al 55 % en volumen tiene 55 % de etanol y 45 % de agua.",
    "Si una fórmula tiene subíndices, úsalos para pasar de moles del compuesto a moles de un elemento: 1 mol de Al₂(SO₄)₃ tiene 2 mol de Al."],
   claves:[["Molaridad (M)","M = moles de soluto ÷ litros de solución (mol/L)."],
     ["Normalidad (N)","N = M × θ. θ = H⁺ que libera el ácido, OH⁻ de la base o carga total del catión en una sal."],
     ["Dilución","Los moles de soluto no cambian: M₁·V₁ = M₂·V₂ (V₂ = volumen final total)."],
     ["% en masa y % en volumen","% m/m = masa soluto ÷ masa solución × 100. % v/v = volumen soluto ÷ volumen solución × 100."]],
   ejemplo:{id:"25II-89",pasos:[
     "Primera parte: n = M × V = 0,17 mol/L × 5 L = 0,85 mol de alumbre.",
     "Masa = n × masa molar = 0,85 × 948,0 = 805,8 g.",
     "Segunda parte: en 100 mL (0,1 L) hay 0,17 × 0,1 = 0,017 mol de alumbre.",
     "Cada fórmula de alumbre tiene 2 Al (en Al₂(SO₄)₃): 0,034 mol de Al. Cada Al₂O₃ usa 2 Al, así que se forman 0,017 mol de Al₂O₃.",
     "Masa de Al₂O₃ = 0,017 × 102 = 1,73 g. Respuesta: 805,8 y 1,73."],
     idea:"Pasa todo a moles: M·V te da los moles y la fórmula te dice cuántos átomos de cada elemento hay."},
   guiada:[
    {id:"27I-91",pistas:["La mezcla de separación es 20/80: 20 partes de etanol al 75 % y 80 de ácido fórmico al 5 %. ¿Cuánto es el 20 % de 300 mL?","Un etanol acuoso al 55,10 % tiene 55,10 % de etanol y el resto es agua. ¿Y qué pH tiene una mezcla con ácido fórmico?"],
     pasos:["I: 20 % de 300 mL = 0,20 × 300 = 60 mL de etanol al 75 %. Verdadera.","II: «al 55,10 %» significa 55,10 % de etanol y 44,9 % de agua. La proposición lo invierte: falsa.","III: la mezcla contiene ácido fórmico, así que su pH es ácido, no alcalino. Falsa.","Solo I es verdadera."],
     mal:{0:"II es falsa: el 44,9 % es agua, no etanol.",2:"III es falsa: con ácido fórmico el pH es ácido (menor que 7).",3:"Las dos son falsas: el 44,9 % es agua y con ácido fórmico el pH es ácido. Además I sí es verdadera.",4:"III es falsa, y I sí es verdadera: 20 % de 300 mL = 60 mL."}}],
   chequeo:[
    {q:"¿Cuántos moles de soluto hay en 250 mL de una solución 2 M?",o:["0,5 mol","8 mol","0,125 mol","500 mol","2 mol"],a:0,e:"n = M × V = 2 mol/L × 0,25 L = 0,5 mol."},
    {q:"Se diluyen 200 mL de HCl 3 M con agua hasta un volumen final de 600 mL. ¿Cuál es la molaridad final?",o:["3 M","1 M","9 M","0,5 M","1,5 M"],a:1,e:"M₁V₁ = M₂V₂ → 3 × 200 = M₂ × 600 → M₂ = 1 M."},
    {q:"¿Cuál es la normalidad de una solución de H₂SO₄ 0,5 M?",o:["0,25 N","0,5 N","1 N","2 N","1,5 N"],a:2,e:"El H₂SO₄ libera 2 H⁺ (θ = 2): N = 0,5 × 2 = 1 N."}]},
  {id:"ph",t:"pH, ácidos, bases y neutralización",ts:["Ácidos y bases","Soluciones (neutralización)"],
   concepto:"El pH mide la acidez: pH = −log[H⁺]. A 25 °C, pH + pOH = 14. Menos de 7 es ácido, 7 es neutro y más de 7 es básico.",
   explica:[
    "Ácido (Arrhenius): libera H⁺ en agua. Base: libera OH⁻. Los ácidos fuertes (HCl, HNO₃, H₂SO₄) y las bases fuertes (NaOH, KOH) se disocian por completo: [H⁺] o [OH⁻] es igual a su concentración (multiplicada por θ).",
    "Si la concentración es una potencia de 10, el pH sale directo: [H⁺] = 10⁻³ → pH = 3. Si no, usa logaritmos: [OH⁻] = 2 × 10⁻⁴ → pOH = 4 − log 2 = 4 − 0,3 = 3,7.",
    "Con una base calcula primero el pOH y luego pH = 14 − pOH. El error más común es dar el pOH como si fuera el pH.",
    "Diluir acerca el pH a 7 pero no lo cruza: un ácido diluido sigue siendo ácido y una base diluida sigue siendo básica.",
    "Mezcla de ácido fuerte con base fuerte: calcula los equivalentes (N × V) de cada uno y réstalos. Lo que sobra se divide entre el volumen TOTAL. Si son iguales, el pH es 7."],
   claves:[["pH y pOH","pH = −log[H⁺]; pOH = −log[OH⁻]; a 25 °C, pH + pOH = 14."],
     ["Escala de pH","Menor que 7: ácido. Igual a 7: neutro. Mayor que 7: básico."],
     ["Ácidos y bases fuertes","Se disocian por completo (HCl, HNO₃, H₂SO₄, NaOH, KOH): [H⁺] o [OH⁻] = concentración × θ."],
     ["Mezcla ácido fuerte + base fuerte","Resta equivalentes (N·V); el exceso se divide entre el volumen total."]],
   ejemplo:{id:"25II-91",pasos:[
     "Dilución: 0,01 M × 100 mL = M₂ × (100 + 900) mL → M₂ = 0,001 M = 10⁻³ M.",
     "El HCl es un ácido fuerte: [H⁺] = 10⁻³ M → pH = 3.",
     "Piden el pOH: 14 − 3 = 11."],
     idea:"Lee si piden pH o pOH, y usa el volumen final total al diluir."},
   guiada:[
    {id:"26II-92",pistas:["Primero la molaridad inicial: 4 g de NaOH (masa molar 40 g/mol) en 1 L.","Al pasar 1 mL a 500 mL la concentración se divide entre 500. Es una base: calcula el pOH y luego el pH."],
     pasos:["[NaOH] = (4 ÷ 40) mol ÷ 1 L = 0,1 M.","Dilución: 0,1 × 1 mL = M₂ × 500 mL → M₂ = 2 × 10⁻⁴ M = [OH⁻].","pOH = −log(2 × 10⁻⁴) = 4 − log 2 = 4 − 0,3 = 3,7.","pH = 14 − 3,7 = 10,3."],
     mal:{0:"3,7 es el pOH. Es una base: pH = 14 − 3,7.",2:"11 saldría con [OH⁻] = 10⁻³ M. Revisa la dilución: de 1 mL a 500 mL la concentración se divide entre 500.",3:"13 es el pH de la solución sin diluir (0,1 M). Te faltó la dilución.",4:"Un pH ácido es imposible: el NaOH es una base, su pH es mayor que 7."}},
    {id:"27I-93b",pistas:["Calcula los equivalentes: N × V (en litros) del ácido y de la base.","HNO₃: 0,50 × 0,6 = 0,30. KOH: 1,00 × 0,4 = 0,40. ¿Qué sobra y en qué volumen total?"],
     pasos:["Equivalentes de HNO₃ = 0,50 × 0,600 L = 0,30.","Equivalentes de KOH = 1,00 × 0,400 L = 0,40.","Sobran 0,10 de OH⁻ en 1,000 L: [OH⁻] = 0,1 M.","pOH = 1 → pH = 14 − 1 = 13."],
     mal:{0:"Para pH 12 tendría que quedar [OH⁻] = 0,01 M. Sobran 0,10 mol en 1 L: [OH⁻] = 0,1 M.",1:"1 es el pOH, no el pH. Como sobra base, el pH es mayor que 7.",3:"Sobra base (0,40 > 0,30): el pH no puede ser ácido.",4:"El pH sería 7 solo con equivalentes iguales; aquí sobra base."}}],
   chequeo:[
    {q:"¿Cuál es el pH de una solución de HCl 0,001 M?",o:["1","11","3","0,001","7"],a:2,e:"[H⁺] = 10⁻³ M → pH = 3."},
    {q:"Una solución tiene pOH = 4. Entonces es…",o:["ácida, con pH 4","básica, con pH 10","neutra, con pH 7","ácida, con pH 10","básica, con pH 4"],a:1,e:"pH = 14 − 4 = 10, mayor que 7: básica."},
    {q:"Se mezclan cantidades iguales de equivalentes de un ácido fuerte y una base fuerte. El pH de la mezcla es…",o:["menor que 7","7","mayor que 7","0","14"],a:1,e:"Se neutralizan por completo: queda una solución neutra, pH 7."}]}]},
"bio:Ecología y recursos":{
  fuente:"Preguntas reales del banco (2023-I a 2026-II) y sus resoluciones. Teoría redactada para Ruta 1250.",
  bloques:[
  {id:"rel",t:"Relaciones entre especies y ecosistema",ts:["Ecología","Reino plantae – ecología (antibiosis)"],
   concepto:"Un ecosistema es la comunidad de seres vivos (biocenosis) junto con su ambiente físico (biotopo). Las relaciones entre especies se clasifican según quién gana (+), quién pierde (−) y a quién no le afecta (0).",
   explica:[
    "Mutualismo (+ +): ambas ganan (líquenes: alga + hongo; abejas y flores). Comensalismo (+ 0): una gana y a la otra no le afecta (la rémora y el tiburón).",
    "Predación (+ −): una especie mata a otra para comer (el puma y la vicuña). Parasitismo (+ −): vive a costa del otro sin matarlo de inmediato (pulgas, tenias).",
    "Competencia (− −): ambas se perjudican al disputar el mismo recurso. Amensalismo o antibiosis (0 −): un organismo libera sustancias que inhiben a otro, como el hongo Penicillium a las bacterias.",
    "Cadena trófica: productores (plantas, algas) → consumidores primarios (herbívoros) → secundarios → terciarios. Los descomponedores reciclan la materia de todos los niveles.",
    "Regla del 10 %: a cada nivel pasa cerca del 10 % de la energía del anterior. En preguntas con resultados de un experimento, concluye solo lo que muestran los datos."],
   claves:[["Mutualismo","+ / +: ambas especies se benefician (líquenes: alga + hongo)."],
     ["Comensalismo","+ / 0: una se beneficia y a la otra no le afecta (rémora y tiburón)."],
     ["Predación vs. parasitismo","Predación: uno mata a otro para comer. Parasitismo: vive a costa del otro sin matarlo de inmediato."],
     ["Competencia","− / −: ambas se perjudican al disputar el mismo recurso."],
     ["Amensalismo (antibiosis)","0 / −: una especie libera sustancias que inhiben a otra (Penicillium y bacterias)."],
     ["Regla del 10 %","A cada nivel trófico pasa cerca del 10 % de la energía del nivel anterior."]],
   ejemplo:{id:"26II-98",pasos:[
     "Traduce cada relación a signos: competencia (− −), predación (+ −, matando), comensalismo (+ 0).",
     "«Cada especie actúa de modo desfavorable sobre la otra» = − −: competencia → Ib.",
     "«Obtiene su alimento matando a otra» = predación → IIc.",
     "«Una se beneficia y la otra no obtiene ventaja» = + 0: comensalismo → IIIa. Respuesta: Ib, IIc, IIIa."],
     idea:"Clasifica cada relación por quién gana, quién pierde y a quién no le afecta."},
   guiada:[
    {id:"23I-100",pistas:["La efectividad se mide con el halo de inhibición: si hay halo, el extracto detuvo el crecimiento del microbio.","El gráfico muestra halos en los tres microorganismos (E. coli, S. aureus y C. albicans). ¿Qué se puede concluir sin inventar variables?"],
     pasos:["El experimento mide una sola cosa: el halo de inhibición (en mm) frente a tres microorganismos.","Hay halo en los tres: el extracto inhibe a las dos bacterias y al hongo.","La conclusión que se apoya en los datos: el arrayán tiene actividad antimicrobiana frente a los patógenos evaluados.","Temperatura, dosis y medio de cultivo no se midieron: esas alternativas inventan variables."],
     mal:{0:"El experimento no midió la temperatura: no se puede concluir nada sobre ella.",2:"Contradice los datos: hay halos de inhibición, así que sí fueron afectados.",3:"No se probaron distintas dosis; además, un halo mayor indica más inhibición, no menos.",4:"El medio de cultivo no fue una variable del estudio."}}],
   chequeo:[
    {q:"La rémora se adhiere al tiburón y come sus restos sin dañarlo. Es un caso de…",o:["mutualismo","comensalismo","parasitismo","predación","competencia"],a:1,e:"La rémora gana y al tiburón no le afecta (+ 0): comensalismo."},
    {q:"Dos especies de aves comen las mismas semillas, que escasean, y ambas se perjudican. Es…",o:["mutualismo","comensalismo","competencia","amensalismo","predación"],a:2,e:"Ambas pierden por el mismo recurso (− −): competencia."},
    {q:"Si los productores fijan 10 000 kcal, ¿cuánta energía llega aproximadamente a los consumidores secundarios?",o:["1 000 kcal","100 kcal","10 kcal","10 000 kcal","5 000 kcal"],a:1,e:"10 000 → 1 000 (primarios) → 100 kcal (secundarios), por la regla del 10 %."}]},
  {id:"rec",t:"Recursos, contaminación y huella ecológica",ts:["Recursos naturales","Ecologia - biorremediación","Ecología"],
   concepto:"Los recursos naturales son lo que el ser humano toma de la naturaleza. Se usan de forma sostenible si no se consumen más rápido de lo que se renuevan. La huella ecológica mide cuánta superficie necesita una población para su consumo.",
   explica:[
    "Renovables: se regeneran si se respeta su ritmo (bosques, peces, fauna silvestre, agua). No renovables: existen en cantidad fija (minerales como el cobre, petróleo, gas). Inagotables: energía solar y eólica.",
    "Huella ecológica: hectáreas necesarias para producir lo que consume una población y absorber sus desechos. La aumentan la explosión demográfica y el consumo excesivo; la reducen el reciclaje y la economía circular (reusar, reparar, reciclar).",
    "Biorremediación: usar microorganismos, hongos o plantas para degradar contaminantes. El contaminante debe poder ser atacado biológicamente y los productos deben ser inocuos (no dañinos); no tienen que ser comestibles.",
    "Ciclo del nitrógeno: fijación (bacterias como Rhizobium convierten N₂ en amoniaco), amonificación (los descomponedores convierten restos orgánicos en amoniaco), nitrificación (amoniaco → nitritos → nitratos) y desnitrificación (nitratos → N₂ que vuelve al aire). El N₂ es cerca del 78 % del aire.",
    "Consumo responsable de fauna silvestre: con planes de manejo comunal y desde zoocriaderos autorizados."],
   claves:[["Recurso renovable vs. no renovable","Renovable: se regenera si se respeta su ritmo (bosque, peces). No renovable: cantidad fija (cobre, petróleo)."],
     ["Huella ecológica","Superficie (ha) necesaria para sostener el consumo de una población y absorber sus desechos."],
     ["Biorremediación","Uso de microorganismos, hongos o plantas para degradar contaminantes en productos inocuos."],
     ["Amonificación","Los descomponedores transforman restos orgánicos (proteínas, aminoácidos) en amoniaco."],
     ["Economía circular","Reusar, reparar y reciclar para que los materiales vuelvan al ciclo: reduce la huella ecológica."]],
   ejemplo:{id:"24II-100",pasos:[
     "I: para que un ser vivo degrade un contaminante, este debe ser susceptible a la acción biológica. V.",
     "II: el objetivo es transformar el contaminante en productos inocuos (agua, CO₂, sales). V.",
     "III: inocuo no significa apto para consumo humano; eso no es un requisito. F.",
     "Respuesta: VVF."],
     idea:"Biorremediar = degradar con seres vivos hasta productos inofensivos, no comestibles."},
   guiada:[
    {id:"23II-99",pistas:["Un indicador negativo es algo que AUMENTA la huella ecológica (más presión sobre los recursos).","¿Cuál de las alternativas significa más personas consumiendo recursos?"],
     pasos:["La huella ecológica crece cuando aumenta el consumo de recursos.","El crecimiento de la población es uno de los factores con que se calcula: más personas, más hectáreas necesarias.","La explosión demográfica es el indicador negativo. La economía circular y la extracción sostenida la reducen."],
     mal:{0:"«Regresión ecológica» no es un factor con que se mida la huella ecológica.",2:"La economía circular reduce la huella: es un indicador positivo.",3:"La extracción sostenida respeta el ritmo de renovación: no es negativa.",4:"«Recesión ecológica» no es un factor de la huella ecológica."}},
    {id:"26I-98",pistas:["Piensa en consumo responsable: ¿qué proposiciones describen una práctica responsable y cuál describe un problema?","III es cierta como hecho, pero ¿es una forma de consumir de manera responsable?"],
     pasos:["I: el aprovechamiento con acuerdos comunales en áreas naturales es manejo sostenible de un recurso renovable. Correcta.","II: la carne de zoocriaderos legales puede venderse: es consumo responsable. Correcta.","III: describe una presión sobre la fauna (un problema), no una práctica de consumo responsable.","Respuesta según la clave oficial: I y II."],
     mal:{0:"Te falta I: el manejo con acuerdos comunales también es consumo responsable.",1:"III describe un problema, no una práctica de consumo responsable; y te falta I.",3:"III describe un problema, no una práctica responsable; y te falta II.",4:"III describe un problema; las prácticas responsables son I y II."}}],
   chequeo:[
    {q:"¿Cuál es un recurso natural no renovable?",o:["El cobre","Un bosque de eucaliptos","Los peces de río","El agua de lluvia","La energía solar"],a:0,e:"El cobre es un mineral: su cantidad es fija y no se regenera."},
    {q:"¿Qué práctica reduce la huella ecológica?",o:["La explosión demográfica","La economía circular (reusar y reciclar)","La deforestación para cultivos","El consumo de productos descartables","La quema de combustibles fósiles"],a:1,e:"La economía circular devuelve los materiales al ciclo y baja el consumo de recursos."},
    {q:"En el ciclo del nitrógeno, la transformación de restos orgánicos en amoniaco por los descomponedores se llama…",o:["fijación","nitrificación","amonificación","desnitrificación","fotosíntesis"],a:2,e:"Amonificación: restos orgánicos → amoniaco."}]}]},
"len:Acentuación y fonología":{
  fuente:"Preguntas reales del banco (2023-II a 2027-I) y sus resoluciones. Reglas según la Ortografía de la RAE (2010), redactadas para Ruta 1250.",
  bloques:[
  {id:"silaba",t:"Sílaba y secuencias vocálicas",ts:["Silabeo","Sílaba y reglas de silabeo","La sílaba","Concurrencia vocálica"],excl:["26II-50"],
   concepto:"La sílaba es el grupo de sonidos que se pronuncia en un solo golpe de voz. Para separar sílabas manda cómo se juntan las vocales: el diptongo y el triptongo van en una sola sílaba; el hiato se separa.",
   explica:[
    "Vocales abiertas: a, e, o. Cerradas: i, u. Diptongo: dos vocales en la misma sílaba: abierta + cerrada átona (ai-re, cau-sa), cerrada átona + abierta (pia-no, cue-va) o dos cerradas distintas (ciu-dad, cons-truir).",
    "Triptongo: cerrada + abierta + cerrada, con las cerradas átonas, en una sola sílaba: Pa-ra-guay, a-ve-ri-guáis, huai-no.",
    "Hiato: las vocales van en sílabas distintas. Simple: dos abiertas (po-e-ma, ro-e-dor, a-é-re-o) o dos iguales (zo-o, chi-i-ta). Acentual: una cerrada tónica junto a una abierta; la cerrada siempre lleva tilde (Ca-ín, Lu-cí-a, pa-ís, ví-a).",
    "La h intercalada no impide el diptongo: prohi-bi-do, ahi-ja-do, de-sahu-cio. Si la cerrada es tónica, hay hiato y lleva tilde: bú-ho, ahú-ma.",
    "Consonantes: una sola consonante entre vocales va con la vocal siguiente (e-xhi-bi-ción). Los grupos bl, br, cl, cr, dr, fl, fr, gl, gr, pl, pr, tr no se separan (co-bre, a-trás)."],
   claves:[["Vocales abiertas y cerradas","Abiertas: a, e, o. Cerradas: i, u."],
     ["Diptongo","Dos vocales en una sílaba: abierta + cerrada átona, cerrada átona + abierta o dos cerradas distintas (ai-re, pia-no, ciu-dad)."],
     ["Triptongo","Cerrada + abierta + cerrada, átonas las cerradas, en una sílaba (Pa-ra-guay, huai-no)."],
     ["Hiato simple","Dos vocales abiertas (o iguales) en sílabas distintas (po-e-ma, zo-o)."],
     ["Hiato acentual","Cerrada tónica + abierta: se separan y la cerrada lleva tilde (pa-ís, Lu-cí-a, Ca-ín)."]],
   ejemplo:{id:"24II-50",pasos:[
     "Construir: u + i, dos cerradas distintas en una sílaba (cons-truir) → diptongo: Ib.",
     "Huaino: u (cerrada) + a (abierta) + i (cerrada) en una sílaba (huai-no) → triptongo: IIc.",
     "Caín: la i es cerrada y tónica junto a la a → se separan (Ca-ín) y lleva tilde → hiato acentual: IIId.",
     "Aerosol: a + e, dos abiertas → hiato simple (a-e-ro-sol): IVa. Respuesta: Ib, IIc, IIId, IVa."],
     idea:"Marca cada vocal como abierta o cerrada y luego mira si la cerrada es tónica."},
   guiada:[
    {id:"24II-48",pistas:["Revisa cada palabra con dos vocales juntas: ¿es diptongo (no se separa) o hiato (se separa)?","Lucía tiene hiato acentual (í tónica) y poemas hiato simple (o + e). Busca los errores en entusiasmo, roedores, viajaron y Diógenes."],
     pasos:["A: en-tu-sias-mo; «ia» con i átona es diptongo, no se separa. Mal.","B: ro-e-do-res; o y e son abiertas: hiato, sí se separan. Mal.","C: via-ja-ron; «ia» es diptongo. Mal.","E: Dió-ge-nes; la tilde está en la o (abierta), así que «io» sigue siendo diptongo. Mal.","D: Lu-cí-a (hiato acentual), es-cri-bió y sie-te (diptongos), po-e-mas (hiato simple). Correcta."],
     mal:{0:"«Entusiasmo» se separa en-tu-sias-mo: «ia» con i átona es diptongo.",1:"«Roedores» se separa ro-e-do-res: o y e son abiertas y forman hiato.",2:"«Viajaron» se separa via-ja-ron: «ia» con i átona es diptongo.",4:"«Diógenes» se separa Dió-ge-nes: la tilde va en la o (abierta), así que «io» sigue siendo diptongo."}},
    {id:"25II-50",pistas:["Busca en cada alternativa una palabra mal separada: ¿rompe un diptongo o junta un hiato?","La h intercalada no impide el diptongo (prohi-bi-do) y una consonante entre vocales va con la vocal siguiente."],
     pasos:["A: «aeropuerto» se separa a-e-ro-puer-to: «ue» es diptongo y no se separa. Mal.","B: «exhortación» termina en -ción: «ci-ón» rompe el diptongo «io». Mal.","C: «zoología» se separa zo-o-lo-gí-a (o + o es hiato) y «biología», bio-lo-gí-a. Mal.","E: «desahuciado» se separa de-sahu-cia-do: rompe los diptongos «au» (con h intercalada) e «ia». Mal.","D: e-xhi-bi-ción, prohi-bi-do, ahi-ja-do. Correcta."],
     mal:{0:"«Aeropuerto» se separa a-e-ro-puer-to: «ue» es diptongo.",1:"«Exhortación» termina en -ción: «io» es diptongo y no se separa.",2:"«Zoología» se separa zo-o-lo-gí-a (o + o es hiato) y «biología», bio-lo-gí-a.",4:"«Desahuciado» se separa de-sahu-cia-do: la h no rompe el diptongo «au», y «ia» también es diptongo."}}],
   chequeo:[
    {q:"¿Qué palabra tiene hiato acentual?",o:["cuidado","país","aire","peine","ciudad"],a:1,e:"Pa-ís: la i es cerrada y tónica junto a la a, por eso se separan y lleva tilde."},
    {q:"¿Cuál es el silabeo correcto de «avión»?",o:["a-vi-ón","av-ión","a-vión","avi-ón","a-v-ión"],a:2,e:"«io» es diptongo (la tilde va en la o, abierta): a-vión."},
    {q:"¿Qué palabra tiene triptongo?",o:["Perú","Paraguay","poema","reír","cuidado"],a:1,e:"Pa-ra-guay: u + a + y (sonido i) en una sola sílaba."}]},
  {id:"tilde",t:"Tildación general y diacrítica",ts:["Tildación general","Tildación diacrítica","Tilde diacrítica","Tilde enfática","La acentuación y tildación"],
   concepto:"La tilde marca la sílaba tónica según reglas fijas para agudas, graves y esdrújulas. Además, la tilde diacrítica distingue palabras que se escriben igual pero cumplen funciones distintas (tú/tu, sé/se).",
   explica:[
    "Agudas (tónica en la última sílaba): llevan tilde si terminan en n, s o vocal (can-ción, com-pás, ca-fé). Graves o llanas (penúltima): llevan tilde si NO terminan en n, s o vocal (ár-bol, lá-piz, cés-ped). Esdrújulas y sobresdrújulas: siempre (mú-si-ca, dí-ga-se-lo).",
    "Los monosílabos no llevan tilde (fue, dio, vio, fe, ti), salvo los diacríticos: tú (pronombre) / tu (posesivo); él / el; mí / mi; sí (afirmación o pronombre) / si (condicional o nota musical); sé (saber o ser) / se; dé (dar) / de; té (bebida) / te; más (cantidad) / mas (pero).",
    "Tilde enfática: qué, quién, cuál, cómo, cuándo, dónde y cuánto llevan tilde cuando preguntan o exclaman, también en preguntas indirectas («No sé dónde vive»). Sin valor interrogativo no la llevan («Cuando llegue, te aviso»).",
    "Desde 2010, «solo» y los demostrativos (este, ese, aquel) no llevan tilde, y «guion» o «truhan» se escriben sin tilde por ser monosílabos ortográficos.",
    "Hiato acentual: la vocal cerrada tónica lleva tilde aunque rompa la regla general (ma-íz, ba-úl, re-ír)."],
   claves:[["Regla de las agudas","Tónica en la última sílaba; tilde si terminan en n, s o vocal (canción, café)."],
     ["Regla de las graves (llanas)","Tónica en la penúltima; tilde si NO terminan en n, s o vocal (árbol, lápiz)."],
     ["Esdrújulas","Tónica en la antepenúltima: siempre llevan tilde (música, pájaro)."],
     ["Tilde diacrítica: sé / se","Sé: verbo saber o ser («No sé»). Se: pronombre («Se fue»)."],
     ["Tilde diacrítica: dé / de, té / te","Dé: verbo dar. Té: bebida. De: preposición. Te: pronombre."],
     ["Tilde enfática","Qué, cómo, dónde, cuándo… llevan tilde cuando preguntan o exclaman, también en preguntas indirectas."]],
   ejemplo:{id:"26I-47",pasos:[
     "I: «te» es pronombre (sin tilde) y «dé» es el verbo dar (con tilde). Correcta.",
     "II: el primer «si» es afirmación: debe ser «Sí afinaré». La nota musical es «si», sin tilde. Está invertido: incorrecta.",
     "III: «si» condicional (sin tilde), «sé» del verbo saber y «tú» pronombre (con tilde). Correcta.",
     "Respuesta: I y III."],
     idea:"Pregúntate qué función cumple la palabra en la oración: eso decide la tilde, no la palabra sola."},
   guiada:[
    {id:"23II-46",pistas:["En cada oración decide la función de las palabras con tilde o sin ella: ¿verbo, pronombre, interrogativo?","En II, «te» es pronombre. En IV, «cuando» introduce una idea de tiempo, no pregunta."],
     pasos:["I: «sé» (verbo saber) y «qué» (interrogativo indirecto). Correcta.","II: «té» es la bebida; aquí es el pronombre («para que te llame»): sin tilde. Incorrecta.","III: «Él» pronombre con tilde, «ti» nunca lleva tilde y «te» pronombre. Correcta.","IV: «Cuando lo oí» indica tiempo, no pregunta: «cuando» va sin tilde. Incorrecta.","Respuesta: I y III."],
     mal:{0:"II está mal: «para que te llame» usa el pronombre «te», sin tilde.",1:"IV está mal: «Cuando lo oí» indica tiempo, no pregunta; va sin tilde.",2:"II está mal: «té» con tilde es la bebida; aquí es el pronombre «te».",3:"II y IV están mal: «te» pronombre va sin tilde y «cuando» temporal también."}},
    {id:"27I-49",pistas:["Una pregunta indirecta no lleva signos de interrogación, pero la palabra interrogativa sí lleva tilde.","¿En qué oraciones «cómo», «qué» o «donde» introducen algo que se pregunta o se desconoce?"],
     pasos:["I: «pregunté… cómo está»: pregunta indirecta, «cómo» con tilde. Correcta.","II: «Nadie sabe qué sucedió»: pregunta indirecta, «qué» con tilde. Correcta.","III: «no sabe dónde vive» también es pregunta indirecta, así que debía llevar tilde. Incorrecta.","Respuesta: I y II."],
     mal:{0:"III está mal: «no sabe dónde vive» es pregunta indirecta y necesita tilde.",1:"I también es correcta: «pregunté cómo está» es pregunta indirecta.",2:"II también es correcta: «Nadie sabe qué sucedió» es pregunta indirecta.",3:"III está mal: le falta la tilde a «dónde»."}}],
   chequeo:[
    {q:"¿Qué palabra está mal tildada?",o:["canción","árbol","música","examén","café"],a:3,e:"«Examen» es grave terminada en n: no lleva tilde."},
    {q:"¿Qué oración tiene bien la tilde diacrítica?",o:["Tu sabes que el te está frío.","Tú sabes que el té está frío.","Tú sábes que el té esta frío.","Tu sabes que él té está frío.","Tú sabes que el te está frio."],a:1,e:"Tú (pronombre), té (bebida), está (verbo, aguda en vocal), frío (hiato acentual)."},
    {q:"¿Qué oración usa bien la tilde enfática?",o:["No sé cuando empieza el examen.","No se cuándo empieza el examen.","No sé cuándo empieza el examen.","No sé cuándo empieza el exámen.","No se cuando empieza el examen."],a:2,e:"«Sé» del verbo saber y «cuándo» en pregunta indirecta; «examen» no lleva tilde."}]}]}
