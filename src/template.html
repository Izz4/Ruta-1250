    "Narrativa urbana (neorrealismo): Julio Ramón Ribeyro (Los gallinazos sin plumas, 1955; sus cuentos reunidos en La palabra del mudo; Crónica de San Gabriel), Enrique Congrains (Lima, hora cero), Oswaldo Reynoso (Los inocentes), Carlos Eduardo Zavaleta. Sebastián Salazar Bondy escribe el ensayo Lima la horrible (1964).",
    "Ribeyro: prosa sobria y clara, narración casi siempre lineal, personajes frustrados o marginados («los sin voz») y finales escépticos o abiertos. No es vanguardista.",
    "Los gallinazos sin plumas: Efraín y Enrique, nietos de don Santos, recogen basura al amanecer («la hora celeste») para alimentar al cerdo Pascual. El abuelo los explota; Efraín se hiere y Enrique enferma. Al final el abuelo cae al chiquero y es atacado por el cerdo; los niños huyen hacia una ciudad que abre «su gigantesca mandíbula»: futuro incierto, no esperanzador. «Gallinazos sin plumas» es una metáfora de los niños que viven de la basura.",
    "Poesía: Blanca Varela (Ese puerto existe, 1959), de tono existencial e influencia surrealista; Jorge Eduardo Eielson, Javier Sologuren, Washington Delgado, Juan Gonzalo Rose."],
   claves:[["Contexto de la Generación del 50","Gobierno de Odría, migración del campo a Lima, barriadas y modernización urbana."],
     ["Los gallinazos sin plumas","Ribeyro (1955): Efraín y Enrique, explotados por su abuelo don Santos, recogen basura para el cerdo Pascual."],
     ["Estilo de Ribeyro","Prosa sobria, narración lineal, personajes marginales y frustrados, final escéptico."],
     ["Lima, hora cero","Enrique Congrains: la vida en las barriadas de Lima."],
     ["Blanca Varela","Poeta del 50: Ese puerto existe; tono existencial."]],
   errores:["Creer que el final de Los gallinazos es esperanzador: la ciudad es una «mandíbula» que los devorará.","Atribuir técnicas vanguardistas a Ribeyro: su narración es tradicional y lineal.","Confundir la Generación del 50 (Ribeyro) con la del 60 (Vargas Llosa)."],
   ejemplo:{id:"25I-56",pasos:[
     "I es falsa: los niños huyen hacia un futuro incierto, no esperanzador.",
     "II es falsa: Ribeyro usa técnicas tradicionales, no vanguardistas.",
     "III es verdadera: los niños son los «gallinazos sin plumas» que recogen basura.",
     "IV es verdadera: el relato es lineal y empieza con las faenas de Lima al amanecer. Respuesta: III y IV (B)."],
     idea:"Ribeyro = realismo sobrio y lineal, marginados sin salida."},
   guiada:[
    {id:"25II-56",pistas:["¿Adónde van los hermanos y con qué?","¿Qué sugiere la imagen de la ciudad como una «gigantesca mandíbula»?"],
     pasos:["Huyen sin nada, «al muladar», «donde los gallinazos»: siguen ligados a la basura.","La ciudad es una mandíbula que los va a devorar: no hay bienestar a la vista.","Lo más probable es que sigan buscando comida en los basurales. Respuesta C."],
     mal:{0:"No se llevan a Pascual: huyen sin nada, rumbo al muladar.",1:"El final no es esperanzador: la ciudad aparece como una mandíbula amenazante.",3:"El texto no permite suponer que el abuelo sobreviva y los eche; ellos ya se van.",4:"No hay disfrute: la ciudad es una amenaza y van hacia el muladar."}},
    {id:"24I-54",pistas:["¿Qué proceso cambia Lima en los años 50 además de la migración?","¿Qué tono tiene la poesía de Blanca Varela: social, indigenista o existencial?"],
     pasos:["En los 50 hay migración y modernización urbana de Lima (gobierno de Odría).","Blanca Varela escribe una poesía de tono existencial, cercana al surrealismo.","Respuesta: una modernización urbana – existencialista (D)."],
     mal:{0:"Hubo modernización urbana, pero la poesía de Varela no es elitista: es existencial.",1:"El crecimiento no fue planificado, y Varela no es indigenista.",2:"«Desborde popular» es un concepto posterior (Matos Mar, 1984) y Varela no es eurocentrista.",4:"La poesía de Varela no es androcentrista: es existencial."}}],
   chequeo:[
    {q:"La Generación del 50 surge durante el gobierno de",o:["Leguía","Odría","Velasco","Belaunde","Benavides"],a:1,e:"Manuel Odría gobernó de 1948 a 1956."},
    {q:"El tema central de la narrativa urbana del 50 es",o:["la vida de las comunidades andinas","la marginalidad y la migración en la Lima moderna","el pasado incaico","la independencia","la selva amazónica"],a:1,e:"Barriadas, pobreza y personajes marginales en Lima."},
    {q:"Poemario de Blanca Varela",o:["Ese puerto existe","Trilce","Poemas humanos","La canción de las figuras","Simbólicas"],a:0,e:"1959. Trilce y Poemas humanos son de Vallejo; los otros, de Eguren."}],
   prac:[
    {q:"Autor de Lima, hora cero",o:["Ribeyro","Congrains","Reynoso","Zavaleta","Salazar Bondy"],a:1,e:"Enrique Congrains Martin (1954)."},
    {q:"Ensayo de Sebastián Salazar Bondy sobre la capital",o:["Lima la horrible","La ciudad y los perros","Lima, hora cero","Los inocentes","Crónica de San Gabriel"],a:0,e:"Lima la horrible (1964) critica la «Arcadia colonial»."},
    {q:"Rasgo del estilo de Ribeyro",o:["experimentación vanguardista","prosa sobria y personajes frustrados","lirismo andino en quechua","exaltación heroica","humor costumbrista del siglo XIX"],a:1,e:"Realismo sobrio; sus personajes suelen fracasar."}]}
  ]},
"psi:Psicología social":{
  fuente:"Preguntas reales del banco (2023-I a 2027-I). Teoría redactada para Ruta 1250 según el temario oficial 2027-I (unidad 2: bases biológicas y socialización).",
  lee:[["Psicología · Pre San Marcos (Drive)","https://drive.google.com/file/d/1x4b_t85j9mmnNLiS0rK0YDYmsan8hQHc/view"],["Puro DECO · Psicología (Drive)","https://drive.google.com/file/d/1LJDL8KLwhLaCclek9SXODB5oi6--vE4l/view"]],
  bloques:[
  {id:"soc",t:"Socialización, crianza y actitudes",ts:["Socialización","Bases socioculturales de la conducta","Actitudes y prejuicio"],
   obj:["Diferenciar socialización primaria y secundaria y sus agentes.","Identificar los cuatro estilos de crianza.","Separar los tres componentes de una actitud: estereotipo, prejuicio y discriminación."],
   concepto:"La socialización es el proceso, que dura toda la vida, por el que aprendemos las normas, valores, roles y costumbres de nuestra sociedad y formamos nuestra identidad. La familia es su primer y principal agente.",
   explica:[
    "Socialización primaria: en la infancia y la niñez, sobre todo en la familia y con fuerte carga afectiva. Se aprenden el lenguaje, las normas básicas y la primera identidad. Socialización secundaria: después, cuando la persona ya tiene cierta madurez; ocurre en instituciones (escuela, universidad, trabajo, grupos) y prepara para roles especializados, incluida la inserción laboral.",
    "Agentes de socialización: familia (protección, afecto, control; transmite actitudes y comportamientos), escuela, grupo de pares o amigos (muy fuerte en la adolescencia), medios de comunicación y redes sociales (transmiten valores y modelos, a veces poco realistas; su impacto depende del tipo de tecnología y del tiempo de exposición), comunidad, iglesia y trabajo.",
    "Estilos de crianza (Baumrind; Maccoby y Martin), según dos ejes: afecto o comunicación, y control o exigencia. Democrático o autoritativo: mucho afecto y normas claras que se explican. Autoritario: mucho control, poco afecto, se impone sin explicar. Permisivo o indulgente: mucho afecto, pocas normas. Negligente, indiferente o desapegado: poco afecto y poca supervisión.",
    "Actitud: predisposición aprendida y relativamente estable a responder a favor o en contra de algo o alguien. Tiene tres componentes: cognitivo (lo que creo: el estereotipo, una creencia generalizada sobre un grupo), afectivo (lo que siento: el prejuicio, una valoración negativa) y conductual (lo que hago: la discriminación, un trato desigual)."],
   tabla:{t:"Estilos de crianza",cab:["Estilo","Afecto","Control","Ejemplo"],filas:[
    ["Democrático","Alto","Alto, con explicación","Pone reglas y las conversa"],["Autoritario","Bajo","Alto, impuesto","«Porque lo digo yo»"],["Permisivo o indulgente","Alto","Bajo","Le deja hacer todo"],["Negligente o desapegado","Bajo","Bajo","No asiste, no supervisa"]]},
   claves:[["Socialización primaria","En la infancia y la niñez, sobre todo en la familia y con carga afectiva: lenguaje, normas básicas, identidad."],
     ["Socialización secundaria","Posterior, en instituciones (escuela, trabajo): roles especializados e inserción laboral."],
     ["Estilo democrático","Mucho afecto y normas claras que se explican."],
     ["Estilo negligente o desapegado","Poco afecto y poca supervisión."],
     ["Componentes de la actitud","Cognitivo (estereotipo), afectivo (prejuicio) y conductual (discriminación)."]],
   errores:["Creer que la socialización termina en la infancia: dura toda la vida.","Poner la inserción laboral en la socialización primaria.","Confundir estereotipo (creencia) con prejuicio (sentimiento) y con discriminación (acción)."],
   ejemplo:{id:"25II-60",pasos:[
     "I: la primaria se da sobre todo en la familia y en las primeras etapas → V.",
     "II: la secundaria empieza cuando hay madurez para decidir; abarca el final de la adolescencia y la adultez → V.",
     "III: los roles del adulto y la inserción laboral son de la socialización secundaria, no de la primaria → F.",
     "Respuesta: VVF (A)."],
     idea:"Primaria = familia y afecto en la infancia; secundaria = instituciones y roles en la vida adulta."},
   guiada:[
    {id:"26II-59",pistas:["¿Cuánto afecto e involucramiento hay? ¿Y cuánta supervisión?","Los padres no asisten y dejan al niño con alguien que tampoco tiene tiempo."],
     pasos:["Afecto e involucramiento: bajo (no van a las reuniones, el trabajo los absorbe).","Supervisión: baja (la abuela también está ocupada).","Poco afecto y poca supervisión = estilo desapegado o negligente (E)."],
     mal:{0:"El indulgente da mucho afecto aunque ponga pocas normas; aquí el afecto y la presencia son bajos.",1:"El autoritario controla mucho; aquí casi no hay control.",2:"El permisivo es cercano y afectuoso, solo que no pone límites; aquí hay ausencia.",3:"El democrático implica afecto y normas claras: lo contrario de este caso."}},
    {id:"27I-60",pistas:["Piensa en los tres componentes: qué se cree, qué se siente y qué se hace.","La afirmación III dice que solo cuenta la conducta: ¿es posible explicar la discriminación sin creencias ni emociones?"],
     pasos:["I: hay estereotipo (creer que la ropa andina «ensucia»), prejuicio (valoración negativa) y discriminación (prohibir tocar) → correcta.","II: la conducta es discriminatoria y nace de un concepto aprendido, el estereotipo → correcta.","III: niega las emociones y las ideas; una actitud siempre las incluye → falsa.","Respuesta: I y II (C)."],
     mal:{0:"La III es falsa: la actitud incluye creencias y emociones, no solo conducta.",1:"La III es falsa: no se puede explicar solo por la conducta.",3:"Falta la II, que también es correcta: la discriminación nace de un estereotipo.",4:"Falta la I: el caso muestra los tres componentes."}}],
   chequeo:[
    {q:"El agente principal de la socialización primaria es",o:["la escuela","la familia","los medios","el trabajo","el Estado"],a:1,e:"La familia transmite el lenguaje, las normas y el afecto en los primeros años."},
    {q:"El estereotipo corresponde al componente ____ de la actitud.",o:["afectivo","cognitivo","conductual","motivacional","biológico"],a:1,e:"Es una creencia generalizada: componente cognitivo."},
    {q:"Padres afectuosos que ponen reglas claras y las explican tienen un estilo",o:["autoritario","permisivo","democrático","negligente","indulgente"],a:2,e:"Alto afecto + alto control explicado = democrático."}],
   prac:[
    {q:"La socialización secundaria",o:["ocurre solo en la infancia","se da en instituciones como la escuela y el trabajo y prepara para roles específicos","es exclusivamente familiar","termina en la niñez","no implica aprendizaje"],a:1,e:"Sigue a la primaria y dura toda la vida adulta."},
    {q:"Negarle un empleo a alguien por su origen es la parte ____ de una actitud.",o:["cognitiva","afectiva","conductual","perceptiva","genética"],a:2,e:"Es una acción: discriminación, componente conductual."},
    {q:"Padres que imponen normas rígidas sin explicar y con poco afecto",o:["democráticos","autoritarios","permisivos","negligentes","indulgentes"],a:1,e:"Mucho control, poco afecto: estilo autoritario."}]}
  ]},
"psi:Aprendizaje y memoria":{
  fuente:"Preguntas reales del banco (2023-I a 2027-I). Teoría redactada para Ruta 1250 según el temario oficial 2027-I (unidad 3: procesos cognitivos y aprendizaje).",
  lee:[["Psicología · Pre San Marcos (Drive)","https://drive.google.com/file/d/1x4b_t85j9mmnNLiS0rK0YDYmsan8hQHc/view"],["Puro DECO · Psicología (Drive)","https://drive.google.com/file/d/1LJDL8KLwhLaCclek9SXODB5oi6--vE4l/view"]],
  bloques:[
  {id:"apr",t:"Teorías del aprendizaje",ts:["Aprendizaje","Aprendizaje observacional","Teorías del aprendizaje"],
   obj:["Distinguir condicionamiento clásico y operante.","Reconocer aprendizaje por insight, por descubrimiento, significativo, observacional y sociocultural.","Aplicar las estrategias metacognitivas: planificación, control y evaluación."],
   concepto:"Aprender es un cambio relativamente permanente en la conducta o el conocimiento producido por la experiencia. Cada teoría explica ese cambio de forma distinta: por asociaciones, por consecuencias, por comprensión, por observación o por interacción social.",
   explica:[
    "Conductismo. Condicionamiento clásico (Pavlov): un estímulo neutro (campana) se asocia a un estímulo incondicionado (comida) hasta provocar por sí solo una respuesta condicionada (salivar). Condicionamiento operante (Skinner): la conducta depende de sus consecuencias. Reforzamiento positivo (dar algo agradable) y negativo (quitar algo desagradable) AUMENTAN la conducta; el castigo la DISMINUYE; sin refuerzo, se extingue.",
    "Cognitivismo. Insight (Köhler, Gestalt): comprensión súbita al reorganizar la situación (el chimpancé que encaja dos cañas). Por descubrimiento (Bruner): el alumno descubre el contenido resolviendo problemas, de los casos a lo general; el docente es un facilitador. Significativo (Ausubel): lo nuevo se ancla en lo que ya sabes (conocimientos previos); lo opuesto es el aprendizaje memorístico.",
    "Aprendizaje observacional, vicario o social (Bandura): se aprende observando a un modelo, sin necesidad de premio directo. Tiene cuatro procesos: atención, retención, reproducción y motivación. Supera al conductismo porque añade procesos cognitivos (representaciones mentales).",
    "Sociocultural (Vygotsky): se aprende en interacción con otros. La zona de desarrollo próximo es la distancia entre lo que haces solo y lo que logras con ayuda de alguien más experto (andamiaje).",
    "Metacognición (Flavell): pensar sobre tu propio aprendizaje. Planificación (organizar antes: prioridades, horario), control o supervisión (vigilar durante y corregir: pedir ayuda si no avanzas) y evaluación (revisar el resultado frente al objetivo). Aprendizaje cooperativo: objetivo común, apoyo mutuo y responsabilidad de cada uno."],
   tabla:{t:"Teorías del aprendizaje",cab:["Teoría","Autor","Idea clave"],filas:[
    ["Condicionamiento clásico","Pavlov","Asociar estímulos"],["Condicionamiento operante","Skinner","Consecuencias: refuerzo y castigo"],["Insight","Köhler","Comprensión súbita"],["Por descubrimiento","Bruner","El alumno descubre; de lo particular a lo general"],["Significativo","Ausubel","Anclar lo nuevo en lo previo"],["Observacional o vicario","Bandura","Imitar modelos"],["Sociocultural","Vygotsky","Zona de desarrollo próximo"]]},
   claves:[["Condicionamiento operante","Skinner: el refuerzo (positivo o negativo) aumenta una conducta; el castigo la disminuye."],
     ["Aprendizaje por descubrimiento","Bruner: el alumno resuelve problemas y llega por sí mismo a lo general; el docente facilita."],
     ["Aprendizaje significativo","Ausubel: relacionar lo nuevo con los conocimientos previos."],
     ["Aprendizaje observacional o vicario","Bandura: aprender viendo a un modelo (atención, retención, reproducción, motivación)."],
     ["Zona de desarrollo próximo","Vygotsky: lo que logras con ayuda pero aún no solo."],
     ["Estrategias metacognitivas","Planificar (antes), controlar (durante) y evaluar (después)."]],
   errores:["Creer que el refuerzo negativo es un castigo: el refuerzo negativo quita algo molesto y aumenta la conducta.","Confundir descubrimiento (Bruner) con significativo (Ausubel).","Pensar que Bandura usa los condicionamientos como base: él añade lo cognitivo."],
   ejemplo:{id:"25II-57",pasos:[
     "Bernabé aprendió a cultivar uvas viendo a su padre y a su abuelo.",
     "Aprender observando e imitando a un modelo es el aprendizaje observacional de Bandura, también llamado vicario.",
     "No hay comprensión súbita (insight), ni descubrimiento propio, ni anclaje explícito en conocimientos previos. Respuesta D."],
     idea:"Si alguien aprende mirando a otro, es vicario u observacional."},
   guiada:[
    {id:"23I-58",pistas:["¿El profesor explica primero la regla general o parte de ejemplos y problemas?","¿Quién llega al conocimiento: el profesor que lo da o los alumnos que lo encuentran?"],
     pasos:["Parte de ejemplos para llegar a lo general (inductivo).","Plantea un problema y mantiene activos a los alumnos para que identifiquen ellos mismos el contenido.","Eso es el aprendizaje por descubrimiento de Bruner (E)."],
     mal:{0:"El procesamiento de la información se centra en cómo se codifica y almacena, no en descubrir.",1:"Ausubel usa los conocimientos previos, pero el rasgo central aquí es que los alumnos descubren por sí mismos.",2:"El social-cognitivo (Bandura) se basa en imitar modelos.",3:"Metacognitivo es regular el propio aprendizaje, no un método de enseñanza por problemas."}},
    {id:"24II-59",pistas:["¿Qué estrategia se usa ANTES de la tarea, cuál DURANTE y cuál AL FINAL?","Organizar un horario es antes; pedir ayuda al ver que no avanzas es durante."],
     pasos:["Planificación (antes): Percy prioriza y hace un horario → Ib.","Control (durante): Rogelio vigila su avance y busca ayuda cuando no avanza → IIa.","Evaluación (después o en cortes): Tomás se detiene a medir cuánto logró → IIIc.","Respuesta: Ib, IIa, IIIc (C)."],
     mal:{0:"Tomás no planifica: se detiene a medir su logro (evaluación).",1:"Tomás evalúa, no planifica; Percy es quien planifica.",3:"Rogelio no planifica: corrige sobre la marcha (control).",4:"Tomás no controla sobre la marcha: mide si logró el objetivo (evaluación); Rogelio es el control."}}],
   chequeo:[
    {q:"Relacionar lo nuevo con lo que ya sabes es el aprendizaje",o:["por descubrimiento","significativo","vicario","por insight","operante"],a:1,e:"Ausubel: el anclaje en los conocimientos previos."},
    {q:"Una rata presiona más la palanca porque cada vez recibe comida. Es",o:["condicionamiento clásico","reforzamiento positivo","castigo negativo","insight","imitación"],a:1,e:"Dar algo agradable aumenta la conducta: refuerzo positivo (Skinner)."},
    {q:"Los procesos del aprendizaje observacional de Bandura son",o:["estímulo, respuesta y refuerzo","atención, retención, reproducción y motivación","asimilación y acomodación","planificación, control y evaluación","sensación, percepción y memoria"],a:1,e:"Prestas atención al modelo, lo recuerdas, lo reproduces y tienes motivos para hacerlo."}],
   prac:[
    {q:"Un chimpancé, tras observar, encaja de pronto dos cañas para alcanzar un plátano. Es aprendizaje",o:["por insight","vicario","operante","clásico","significativo"],a:0,e:"Comprensión súbita: Köhler."},
    {q:"Te levantas al instante para que se apague la alarma molesta, y cada día lo haces más rápido. Es",o:["castigo positivo","reforzamiento negativo","extinción","condicionamiento clásico","insight"],a:1,e:"Quitar algo molesto aumenta la conducta: refuerzo negativo."},
    {q:"La zona de desarrollo próximo es un concepto de",o:["Piaget","Vygotsky","Skinner","Bruner","Pavlov"],a:1,e:"Vygotsky: lo que logras con ayuda de alguien más experto."}]}
  ]},
"psi:Desarrollo humano":{
  fuente:"Preguntas reales del banco (2023-I a 2027-I). Teoría redactada para Ruta 1250 según el temario oficial 2027-I (unidad 4: desarrollo humano, identidad y vida saludable).",
  lee:[["Psicología · Pre San Marcos (Drive)","https://drive.google.com/file/d/1x4b_t85j9mmnNLiS0rK0YDYmsan8hQHc/view"],["Puro DECO · Psicología (Drive)","https://drive.google.com/file/d/1LJDL8KLwhLaCclek9SXODB5oi6--vE4l/view"]],
  bloques:[
  {id:"etapas",t:"Etapas del desarrollo: Erikson y Freud",ts:["Desarrollo humano","Autoestima, búsqueda de la identidad y proyecto de vida"],excl:["25I-59"],
   obj:["Ubicar las etapas del ciclo vital.","Asociar cada etapa con la crisis psicosocial de Erikson.","Reconocer las fases psicosexuales de Freud y la idea de fijación."],
   concepto:"El desarrollo humano son los cambios físicos, cognitivos y psicosociales que vivimos desde la concepción hasta la vejez. Erikson lo explica como ocho crisis psicosociales; Freud, como fases psicosexuales.",
   explica:[
    "Etapas del ciclo vital: prenatal, infancia (0-3 años), niñez (temprana 3-6 e intermedia 6-12), adolescencia (12-18 aprox.: pubertad, búsqueda de identidad, peso del grupo de pares), adultez temprana, intermedia y tardía (vejez). Cada etapa tiene dimensiones física, cognitiva y psicosocial.",
    "Erikson: en cada etapa hay una crisis entre dos polos. 0-1 año: confianza vs. desconfianza (el bebé depende del cuidado y del vínculo con su madre). 1-3: autonomía vs. vergüenza y duda. 3-6: iniciativa vs. culpa. 6-12: laboriosidad vs. inferioridad. Adolescencia: identidad vs. confusión de rol. Adulto joven: intimidad vs. aislamiento. Adultez media: generatividad vs. estancamiento. Vejez: integridad vs. desesperación.",
    "Freud: la energía sexual (libido) se concentra en distintas zonas según la fase: oral (0-1, boca), anal (1-3), fálica (3-6), latencia (6-12) y genital (desde la pubertad). Si un conflicto no se resuelve hay fijación: por ejemplo, la fijación oral se asociaría a comer, hablar o fumar en exceso. Para Freud la sexualidad busca placer en general, no solo lo genital, y en el desarrollo influyen lo biológico y las relaciones con los padres.",
    "Identidad y autoestima: el autoconcepto es la percepción que tienes de ti; la autoestima, la valoración afectiva de ti mismo. La identidad se construye sobre todo en la adolescencia, integrando cómo te ves y tu realidad.",
    "Vida saludable (OMS): la salud es bienestar físico, mental y social, no solo ausencia de enfermedad. Un buen desarrollo emocional se asocia con menos conductas de riesgo en la adolescencia."],
   tabla:{t:"Crisis psicosociales de Erikson",cab:["Edad","Crisis","Se logra"],filas:[
    ["0-1","Confianza vs. desconfianza","Esperanza"],["1-3","Autonomía vs. vergüenza y duda","Voluntad"],["3-6","Iniciativa vs. culpa","Propósito"],["6-12","Laboriosidad vs. inferioridad","Competencia"],["Adolescencia","Identidad vs. confusión de rol","Fidelidad"],["Adulto joven","Intimidad vs. aislamiento","Amor"],["Adultez media","Generatividad vs. estancamiento","Cuidado"],["Vejez","Integridad vs. desesperación","Sabiduría"]]},
   claves:[["Confianza vs. desconfianza","Primer año (Erikson): depende del cuidado y del vínculo con la madre o cuidador."],
     ["Identidad vs. confusión de rol","Adolescencia (Erikson): definir quién soy."],
     ["Laboriosidad vs. inferioridad","Niñez escolar, 6 a 12 años (Erikson)."],
     ["Fases psicosexuales de Freud","Oral, anal, fálica, latencia y genital."],
     ["Fijación (Freud)","Quedarse anclado en una fase no resuelta: la oral se asocia a comer, hablar o fumar en exceso."],
     ["Autoestima","Valoración afectiva de uno mismo (el autoconcepto es la percepción)."]],
   errores:["Mezclar el orden de las crisis de Erikson (iniciativa va antes que laboriosidad).","Confundir autoestima (valoración) con autoconcepto (percepción).","Decir que según Freud todas las personas quedan fijadas: la fijación es un caso, no la regla."],
   ejemplo:{id:"25I-58",pasos:[
     "Fresia llora cuando la separan de su madre y se calma cuando la cargan: es una bebé.",
     "Su bienestar depende del cuidado y del vínculo con la madre.",
     "Eso corresponde a la primera crisis de Erikson: confianza vs. desconfianza (D)."],
     idea:"Ubica la edad del caso y busca la crisis de esa etapa."},
   guiada:[
    {id:"23I-59",pistas:["Revisa cada afirmación con la teoría de Freud: ¿base biológica y factores externos?, ¿TODAS las personas se fijan?","La fijación oral se asocia a la boca: comer, hablar, fumar."],
     pasos:["I. V: las fases tienen base biológica, pero las relaciones con los padres y la experiencia son decisivas.","II. F: no todas las personas se fijan; es una posibilidad, no la regla.","III. V: la fijación oral se asocia a comer, hablar o fumar en exceso.","IV. V: para Freud la sexualidad busca placer en general, no solo genital. Respuesta: VFVV (C)."],
     mal:{0:"La I es verdadera: Freud reconoce la base biológica y el peso de las relaciones con los padres.",1:"La IV también es verdadera: la sexualidad no se reduce a lo genital.",3:"La II es falsa: no todas las personas se fijan en una fase.",4:"La I es verdadera y la II falsa."}},
    {id:"24I-59",pistas:["El texto relaciona baja inteligencia emocional con conductas sexuales de riesgo. ¿Qué se infiere al revés?","Busca la alternativa que se deduce del texto sin agregar información (programas, moral, colegio)."],
     pasos:["El estudio asocia baja inteligencia emocional con inicio sexual precoz y riesgo.","Se infiere lo inverso: un buen desarrollo emocional se asocia con menos conductas de riesgo.","Las demás agregan ideas que el texto no menciona. Respuesta B."],
     mal:{0:"El texto no dice que la moda cause la inmadurez sexual; la menciona como búsqueda de aceptación.",2:"El texto no habla de vida moral.",3:"El texto no menciona programas de intervención.",4:"El texto no habla de programas escolares."}}],
   chequeo:[
    {q:"Un niño de 4 años inventa juegos, pero se siente culpable cuando lo regañan. Según Erikson, vive la crisis",o:["confianza vs. desconfianza","autonomía vs. duda","iniciativa vs. culpa","laboriosidad vs. inferioridad","identidad vs. confusión"],a:2,e:"De 3 a 6 años: iniciativa vs. culpa."},
    {q:"La crisis de identidad vs. confusión de rol corresponde a la",o:["infancia","niñez","adolescencia","adultez","vejez"],a:2,e:"En la adolescencia se define quién soy."},
    {q:"Fase psicosexual en la que la libido se centra en la boca",o:["oral","anal","fálica","latencia","genital"],a:0,e:"Primer año de vida."}],
   prac:[
    {q:"Un escolar se esfuerza por hacer bien sus tareas y teme ser menos que sus compañeros. Crisis de Erikson:",o:["laboriosidad vs. inferioridad","iniciativa vs. culpa","intimidad vs. aislamiento","generatividad vs. estancamiento","integridad vs. desesperación"],a:0,e:"Niñez escolar (6 a 12 años)."},
    {q:"Un adulto mayor mira su vida con satisfacción y acepta su final. Logró",o:["integridad","generatividad","intimidad","identidad","autonomía"],a:0,e:"Integridad vs. desesperación, en la vejez."},
    {q:"La valoración afectiva que una persona hace de sí misma es",o:["autoconcepto","autoestima","identidad","personalidad","temperamento"],a:1,e:"El autoconcepto es la percepción; la autoestima, la valoración."}]},
  {id:"piaget",t:"Desarrollo cognitivo: Piaget",ts:["Piaget","Desarrollo cognitivo"],
   obj:["Ubicar las cuatro etapas de Piaget y sus logros.","Reconocer las formas de la función simbólica (imitación diferida, juego simbólico, imagen gráfica).","Explicar asimilación, acomodación y los factores del desarrollo."],
   concepto:"Para Piaget, la inteligencia se construye por etapas: el niño organiza esquemas y los ajusta al interactuar con el mundo (asimilación y acomodación), pasando de la acción sensorial al pensamiento abstracto.",
   explica:[
    "Mecanismos: el esquema es una estructura para actuar o pensar. Asimilación: incorporar lo nuevo a un esquema que ya tienes. Acomodación: modificar el esquema cuando lo nuevo no encaja. Equilibración: el balance entre ambas.",
    "Sensoriomotora (0-2 años): reflejos, acciones y sentidos; logra la permanencia del objeto (sabe que algo existe aunque no lo vea). Entre los 18 y 24 meses aparece la función simbólica o representacional: el pensamiento reemplaza los objetos por imágenes.",
    "Preoperacional (2-7): función simbólica en pleno: imitación diferida (repetir después algo visto u oído, como una lisura que escuchó en clase), juego simbólico (usar una cuchara como si fuera un carro), imagen gráfica o dibujo (trazar algo y decir que es mamá), imagen mental y lenguaje. Limitaciones: egocentrismo, animismo (dar vida a las cosas), centración, irreversibilidad y no conservación.",
    "Operaciones concretas (7-11/12): lógica aplicada a lo concreto: conservación, reversibilidad, clasificación y seriación. Razona, pero apoyado en objetos o en la confirmación de otros. Operaciones formales (12 en adelante): pensamiento abstracto e hipotético-deductivo.",
    "Factores del desarrollo: maduración biológica, experiencia con objetos, transmisión social (aspecto psicosocial: lo que aprende en interacción y con guía de otros) y equilibración. Una limitación física no impide el desarrollo psicológico."],
   tabla:{t:"Etapas de Piaget",cab:["Etapa","Edad","Logro principal"],filas:[
    ["Sensoriomotora","0-2","Permanencia del objeto; inicio de la función simbólica"],["Preoperacional","2-7","Función simbólica (juego, dibujo, lenguaje); egocentrismo"],["Operaciones concretas","7-11/12","Conservación, reversibilidad, clasificación"],["Operaciones formales","12+","Pensamiento abstracto e hipotético-deductivo"]]},
   claves:[["Asimilación y acomodación","Asimilar: meter lo nuevo en un esquema. Acomodar: cambiar el esquema para que encaje."],
     ["Permanencia del objeto","Logro de la etapa sensoriomotora: el objeto existe aunque no se vea."],
     ["Juego simbólico","Usar un objeto como si fuera otro (cuchara = carro): etapa preoperacional."],
     ["Imitación diferida","Reproducir tiempo después algo visto u oído."],
     ["Operaciones concretas","7 a 11 años: conservación y reversibilidad, pero sobre lo concreto."],
     ["Operaciones formales","Desde los 12: pensamiento abstracto e hipotético."]],
   errores:["Confundir juego simbólico (hacer como si) con imitación diferida (repetir algo visto antes).","Poner la conservación en la etapa preoperacional: se logra en las operaciones concretas.","Creer que razonar con lógica ya es pensamiento formal: si necesita lo concreto o la confirmación de otro, es concreto."],
   ejemplo:{id:"25I-57",pasos:[
     "a: Matías usa la cuchara como si fuera un carro → juego simbólico (II).",
     "b: Kike traza una figura y dice que es su mamá → imagen gráfica (III).",
     "c: Grecia repite en casa la lisura que escuchó en clase → imitación diferida (I).",
     "Respuesta: Ic, IIa, IIIb (B)."],
     idea:"Juego simbólico = hacer como si; imitación diferida = repetir después; imagen gráfica = dibujo."},
   guiada:[
    {id:"27I-58",pistas:["¿Qué tipo de desarrollo es construir ideas y explicarlas: físico, social o cognitivo?","Si necesita que el profesor le confirme, ¿piensa ya de forma totalmente abstracta?"],
     pasos:["Construir y asociar conceptos es desarrollo cognitivo.","Usa lógica y conserva conceptos, pero depende de la confirmación externa: aún no es pensamiento formal.","Respuesta: cognitivo – concreta (E)."],
     mal:{0:"No es desarrollo físico y «posformal» no es una etapa de Piaget.",1:"Construir conceptos es desarrollo cognitivo, no social.",2:"Es cognitivo, pero si necesita confirmación externa aún no está en lo formal.",3:"Construir y explicar conceptos es desarrollo cognitivo, no social."}},
    {id:"26I-59",pistas:["Aspecto psicosocial = lo que aprende con otros. Aspecto psicológico = el razonamiento propio.","¿Una limitación física impide el desarrollo psicológico?"],
     pasos:["I. V: Jorge aprende a batir claras con supervisión: influencia psicosocial.","II. V: Mery razona causa-efecto (lavarse para no enfermar): aspecto psicológico.","III. F: una limitación física no impide el desarrollo psicológico.","Respuesta: VVF (E)."],
     mal:{0:"La III es falsa: un problema físico no impide el desarrollo psicológico.",1:"La I y la II son verdaderas.",2:"La I y la II son verdaderas.",3:"La I es verdadera: aprende con supervisión de otros."}}],
   chequeo:[
    {q:"Un niño cree que hay más agua en el vaso alto y delgado que en el bajo y ancho. Aún no logra la",o:["permanencia del objeto","conservación","función simbólica","imitación diferida","asimilación"],a:1,e:"La conservación llega con las operaciones concretas."},
    {q:"La etapa del pensamiento hipotético-deductivo es la de",o:["operaciones formales","operaciones concretas","preoperacional","sensoriomotora","latencia"],a:0,e:"Desde los 12 años: pensamiento abstracto."},
    {q:"Incorporar información nueva a un esquema que ya existe es",o:["acomodación","asimilación","equilibración","centración","seriación"],a:1,e:"Asimilación; si el esquema cambia, es acomodación."}],
   prac:[
    {q:"Un bebé busca el juguete que escondieron bajo la manta. Ya logró",o:["la conservación","la permanencia del objeto","la reversibilidad","el egocentrismo","la seriación"],a:1,e:"Sabe que el objeto existe aunque no lo vea: etapa sensoriomotora."},
    {q:"«El sol se esconde porque está cansado», dice un niño de 4 años. Muestra",o:["animismo","conservación","seriación","pensamiento formal","reversibilidad"],a:0,e:"Atribuye vida y emociones a las cosas: preoperacional."},
    {q:"Ordenar palitos del más corto al más largo (seriación) se logra en la etapa",o:["sensoriomotora","preoperacional","de operaciones concretas","de operaciones formales","genital"],a:2,e:"Clasificación y seriación son logros de las operaciones concretas."}]}
  ]},
"civ:Constitución y garantías":{
  fuente:"Preguntas reales del banco (2023-II a 2027-I). Teoría redactada para Ruta 1250 a partir de la Constitución Política del Perú de 1993 (arts. 1, 2, 137, 140 y 200).",
  lee:[["Cívica 2019 · Pre San Marcos (Drive)","https://drive.google.com/file/d/1tDJ5dwBWT_twith8wMFs4CdwSImKOsll/view"],["Puro DECO · Cívica (Drive)","https://drive.google.com/file/d/1HuKn44juqka8u7KNDgv8W7gIaiRv3STk/view"]],
  bloques:[
  {id:"gar",t:"Garantías constitucionales y regímenes de excepción",ts:["Garantías constitucionales","Regímenes de excepción","Constitución política"],
   obj:["Elegir la garantía correcta para cada caso (las seis del art. 200).","Saber ante quién se presenta y contra qué procede cada una.","Distinguir estado de emergencia y estado de sitio."],
   concepto:"Las garantías constitucionales son los procesos que protegen los derechos y la supremacía de la Constitución. El artículo 200 reconoce seis: hábeas corpus, amparo, hábeas data, acción de inconstitucionalidad, acción popular y acción de cumplimiento.",
   explica:[
    "Para elegir la garantía, pregunta qué se vulnera. ¿La libertad individual (detención arbitraria, libre tránsito)? Hábeas corpus. ¿El acceso a la información pública o tus datos personales e intimidad? Hábeas data. ¿Cualquier otro derecho constitucional (trabajo, educación, propiedad, salud)? Amparo, que es residual. Estas tres protegen derechos de una persona y sus efectos alcanzan a quien la presenta.",
    "Las otras tres atacan normas o la inacción. Acción de inconstitucionalidad: contra normas con rango de ley (leyes, decretos legislativos, decretos de urgencia, tratados, reglamento del Congreso, normas regionales y ordenanzas municipales); se presenta ante el Tribunal Constitucional y su fallo tiene efectos generales. Acción popular: contra reglamentos, normas administrativas y resoluciones de carácter general que violen la Constitución o la ley; ante el Poder Judicial. Acción de cumplimiento: contra la autoridad o funcionario renuente a acatar una norma legal o un acto administrativo.",
    "La Constitución empieza por la persona: «La defensa de la persona humana y el respeto de su dignidad son el fin supremo de la sociedad y del Estado» (art. 1). El art. 2 lista los derechos fundamentales (vida, igualdad, libertad de expresión, no hay prisión por deudas salvo los alimentos, etc.). La pena de muerte solo está prevista para traición a la patria en caso de guerra y terrorismo (art. 140).",
    "Regímenes de excepción (art. 137): los decreta el presidente con acuerdo del Consejo de Ministros, por plazo determinado y dando cuenta al Congreso. Estado de emergencia: por perturbación de la paz o del orden interno o catástrofe; hasta 60 días prorrogables; pueden restringirse la libertad y seguridad personales, la inviolabilidad de domicilio, la libertad de reunión y de tránsito; las Fuerzas Armadas asumen el control del orden interno si lo dispone el presidente. Estado de sitio: por invasión, guerra exterior, guerra civil o peligro inminente; hasta 45 días; el Congreso se reúne de pleno derecho y su prórroga requiere aprobación del Congreso.",
    "Ojo: en los regímenes de excepción se restringen derechos, pero no se suspenden el hábeas corpus ni el amparo; el juez revisa si la restricción es razonable y proporcional (art. 200)."],
   tabla:{t:"Las seis garantías (art. 200)",cab:["Garantía","Protege o ataca","Ante"],filas:[
    ["Hábeas corpus","Libertad individual y derechos conexos","Poder Judicial (TC en última instancia)"],["Amparo","Los demás derechos constitucionales","Poder Judicial (TC en última instancia)"],["Hábeas data","Información pública y datos personales","Poder Judicial (TC en última instancia)"],["Inconstitucionalidad","Normas con rango de ley","Tribunal Constitucional"],["Acción popular","Reglamentos y normas administrativas generales","Poder Judicial"],["Cumplimiento","Funcionario que no acata una norma o acto","Poder Judicial (TC en última instancia)"]]},
   claves:[["Hábeas corpus","Protege la libertad individual: detención arbitraria, libre tránsito."],
     ["Amparo","Protege los demás derechos constitucionales (residual); efectos solo para quien lo pide."],
     ["Hábeas data","Protege el acceso a la información pública y la autodeterminación sobre tus datos."],
     ["Acción de inconstitucionalidad","Contra normas con rango de ley (incluye ordenanzas municipales); ante el TC, efectos generales."],
     ["Acción popular","Contra reglamentos y normas administrativas de carácter general; ante el Poder Judicial."],
     ["Acción de cumplimiento","Contra el funcionario renuente a acatar una norma legal o un acto administrativo."],
     ["Estado de emergencia y de sitio","Emergencia: hasta 60 días. Sitio: hasta 45 días. Los decreta el presidente con el Consejo de Ministros."]],
   errores:["Elegir amparo cuando el derecho afectado es la libertad de tránsito (es hábeas corpus).","Usar acción popular contra una ordenanza municipal: tiene rango de ley, va inconstitucionalidad.","Creer que en un estado de excepción se suspenden las garantías: se restringen derechos.","Confundir los plazos: 60 días emergencia, 45 días sitio."],
   ejemplo:{id:"23II-62",pasos:[
     "I. Arresto sin cargos por más de 24 horas: se afecta la libertad individual → hábeas corpus (b).",
     "II. Funcionario que se resiste a cumplir una norma promulgada → acción de cumplimiento (a).",
     "III. Una ordenanza tiene rango de ley → acción de inconstitucionalidad (d).",
     "V. Corregir información personal inválida o caduca → hábeas data (c).",
     "IV queda con la acción popular (e). Respuesta: Ib, IIa, IIId, IVe, Vc (C)."],
     idea:"Resuelve primero los casos seguros (libertad, información, norma con rango de ley) y deja el resto por descarte."},
   guiada:[
    {id:"27I-62",pistas:["¿El efecto alcanza a todos o solo a quien lo pide?","Si fuera contra la ley en general, con efectos para todos, sería inconstitucionalidad. Aquí protege a una persona."],
     pasos:["Se protege un derecho constitucional vulnerado por la aplicación de una ley.","El efecto alcanza solo al solicitante: es una tutela individual.","No es libertad individual (hábeas corpus) ni datos (hábeas data): queda el amparo (A)."],
     mal:{1:"La acción popular va contra reglamentos y normas administrativas, no tutela el derecho de una persona.",2:"La inconstitucionalidad tiene efectos generales (para todos), no solo para el solicitante.",3:"La de cumplimiento va contra un funcionario que no acata una norma; aquí el problema es que la ley vulnera un derecho.",4:"El proceso competencial resuelve conflictos de competencias entre entidades del Estado."}},
    {id:"26II-61",pistas:["Recuerda los plazos: 60 días el estado de emergencia, 45 el de sitio.","¿Se restringen las garantías o los derechos?"],
     pasos:["I. V: en el estado de emergencia puede restringirse la inviolabilidad del domicilio.","II. F: el máximo del estado de emergencia es 60 días (45 es el de sitio).","III. V: las Fuerzas Armadas asumen el control si lo dispone el presidente.","IV. F: se restringen derechos; el hábeas corpus y el amparo siguen vigentes.","Respuesta: VFVF (E)."],
     mal:{0:"La III es verdadera y la IV falsa: las garantías no se restringen.",1:"La II es falsa: 45 días es el estado de sitio; la emergencia dura hasta 60.",2:"La II es falsa (60 días) y la IV también.",3:"La I es verdadera: puede restringirse la inviolabilidad del domicilio."}}],
   chequeo:[
    {q:"Te detienen tres días sin formularte cargos. ¿Qué garantía corresponde?",o:["amparo","hábeas corpus","hábeas data","acción popular","acción de cumplimiento"],a:1,e:"Se vulnera la libertad individual."},
    {q:"Una entidad pública te niega, sin justificación, información de interés público. Corresponde",o:["hábeas data","amparo","acción popular","hábeas corpus","inconstitucionalidad"],a:0,e:"El acceso a la información pública se protege con el hábeas data."},
    {q:"El plazo máximo del estado de emergencia, sin prórroga, es",o:["30 días","45 días","60 días","90 días","120 días"],a:2,e:"Art. 137: hasta 60 días; el de sitio, hasta 45."}],
   prac:[
    {q:"Un decreto supremo reglamentario contradice la ley que reglamenta. ¿Qué acción procede?",o:["inconstitucionalidad","acción popular","amparo","hábeas corpus","cumplimiento"],a:1,e:"Va contra un reglamento: acción popular, ante el Poder Judicial."},
    {q:"Una ley del Congreso vulnera la Constitución. Se la impugna ante el TC con",o:["acción popular","acción de inconstitucionalidad","amparo","hábeas data","cumplimiento"],a:1,e:"Normas con rango de ley: inconstitucionalidad, con efectos generales."},
    {q:"El estado de sitio puede durar como máximo",o:["30 días","45 días","60 días","90 días","no tiene plazo"],a:1,e:"45 días; su prórroga requiere aprobación del Congreso."}]}
  ]},
"civ:Sistema electoral y participación":{
  fuente:"Preguntas reales del banco (2023-I a 2027-I). Teoría redactada para Ruta 1250 a partir de la Constitución (arts. 30-35 y 176-186) y la Ley 26300 de participación y control ciudadanos.",
  lee:[["Cívica 2019 · Pre San Marcos (Drive)","https://drive.google.com/file/d/1tDJ5dwBWT_twith8wMFs4CdwSImKOsll/view"],["Puro DECO · Cívica (Drive)","https://drive.google.com/file/d/1HuKn44juqka8u7KNDgv8W7gIaiRv3STk/view"],["Ley 26300 actualizada (LP)","https://lpderecho.pe/ley-de-los-derechos-de-participacion-politica-y-control-ciudadanos-ley-26300-actualizada-2025/"]],
  bloques:[
  {id:"part",t:"Ciudadanía y participación ciudadana",ts:["Participación ciudadana","La ciudadanía","Derechos y deberes políticos"],
   obj:["Saber cuándo se adquiere y cuándo se suspende la ciudadanía.","Distinguir derechos de participación y derechos de control (Ley 26300).","Recordar los porcentajes de firmas y lo que no va a referéndum."],
   concepto:"La ciudadanía es la condición que permite participar en los asuntos públicos. En el Perú se adquiere a los 18 años y se ejerce con la inscripción electoral. Además de votar, el ciudadano puede proponer leyes, pedir referéndum y controlar a sus autoridades.",
   explica:[
    "Art. 30: son ciudadanos los peruanos mayores de 18 años; para ejercer la ciudadanía se requiere la inscripción electoral. Un menor de 18 no es juzgado como adulto: el adolescente infractor recibe medidas socioeducativas según su régimen especial.",
    "Art. 31: los ciudadanos participan mediante referéndum, iniciativa legislativa, remoción o revocación de autoridades y demanda de rendición de cuentas; tienen derecho a elegir y ser elegidos. El voto es personal, igual, libre, secreto y obligatorio hasta los 70 años; después es facultativo. También es derecho y deber de los vecinos participar en el gobierno municipal.",
    "Ley 26300. Derechos de participación: iniciativa de reforma constitucional, iniciativa legislativa (firmas de al menos el 0,3 % de la población electoral nacional), referéndum (10 % de firmas) e iniciativa en ordenanzas regionales y municipales. Derechos de control: revocatoria de autoridades elegidas (25 % de firmas de la circunscripción, hasta 400 000; se revoca con la mitad más uno de los votos válidos), remoción de autoridades designadas y demanda de rendición de cuentas.",
    "No pueden someterse a referéndum (art. 32): la supresión o disminución de derechos fundamentales, las normas tributarias y presupuestales, ni los tratados internacionales en vigor.",
    "La ciudadanía se suspende (art. 33) por resolución judicial de interdicción, por sentencia con pena privativa de la libertad y por sentencia con inhabilitación de derechos políticos. Otros mecanismos de participación: presupuesto participativo, consejos de coordinación regional y local, vigilancia ciudadana. La consulta previa es un derecho colectivo de los pueblos indígenas (Convenio 169 de la OIT), no un mecanismo general de la Ley 26300."],
   tabla:{t:"Mecanismos de la Ley 26300",cab:["Mecanismo","Tipo","Requisito clave"],filas:[
    ["Iniciativa legislativa","Participación","0,3 % de firmas de la población electoral"],["Referéndum","Participación","10 % de firmas; no derechos fundamentales, tributos, presupuesto ni tratados"],["Revocatoria","Control","25 % de firmas de la circunscripción; se revoca con mitad más uno de votos válidos"],["Remoción","Control","Autoridades designadas, no elegidas"],["Rendición de cuentas","Control","La autoridad responde sobre su gestión y presupuesto"]]},
   claves:[["Ciudadanía (art. 30)","Desde los 18 años; para ejercerla se requiere inscripción electoral."],
     ["Voto","Personal, igual, libre, secreto y obligatorio hasta los 70 años."],
     ["Iniciativa legislativa ciudadana","Firmas de al menos el 0,3 % de la población electoral nacional."],
     ["Revocatoria","Retira a una autoridad elegida (alcalde, regidor, gobernador regional) antes de terminar su mandato."],
     ["Lo que no va a referéndum","Recortar derechos fundamentales, normas tributarias y presupuestales, tratados en vigor."],
     ["Suspensión de la ciudadanía","Interdicción judicial, pena privativa de la libertad o inhabilitación de derechos políticos."]],
   errores:["Confundir revocatoria (autoridad elegida) con remoción (autoridad designada).","Creer que un referéndum puede aprobar la pena de muerte para nuevos delitos: recortaría un derecho fundamental.","Pensar que los tratados en vigor se someten a referéndum."],
   ejemplo:{id:"26I-62",pasos:[
     "A: la iniciativa en la formación de leyes es un mecanismo constitucional de participación (art. 31 y 107), y basta un grupo de ciudadanos con el 0,3 % de firmas.",
     "B: los tratados internacionales en vigor no pueden ir a referéndum.",
     "C: la consulta previa es un derecho de los pueblos indígenas, no un mecanismo general de participación ciudadana.",
     "D y E: no existe una «reforma constitucional promovida por asociaciones» como mecanismo, ni rendición de cuentas «bimestral». Respuesta A."],
     idea:"Memoriza los cuatro mecanismos del art. 31 y lo que no va a referéndum: con eso descartas casi todo."},
   guiada:[
    {id:"23I-61",pistas:["El ciudadano vigila, participa en decisiones, presenta iniciativas y opina: ¿es solo fiscalizar o es participar?","Busca el derecho más amplio, que incluya todas esas acciones."],
     pasos:["Vigilar la gestión, decidir en el gobierno local, presentar iniciativas y opinar son formas de participación.","El ciudadano actúa directamente, no a través de representantes.","Es el derecho a la participación activa y directa (B)."],
     mal:{0:"El control del Ejecutivo es una función del Congreso, no un derecho ciudadano.",2:"El control administrativo es solo una parte; aquí también decide y propone.",3:"Fiscalizar es solo una de las acciones descritas; el conjunto es participación.",4:"«Activismo popular ciudadano» no es un derecho constitucional."}},
    {id:"24II-64",pistas:["¿Desde qué edad se es ciudadano y se responde penalmente como adulto?","Los tratados de protección del menor siguen aplicándose aunque falte un día para los 18."],
     pasos:["A los 17 años sigue siendo adolescente: la ciudadanía y la mayoría de edad empiezan a los 18.","El adolescente infractor tiene un régimen especial (medidas socioeducativas), no el penal de adultos.","Respuesta: no puede ser juzgado y sancionado como si fuera mayor de edad (B)."],
     mal:{0:"Sí hay sanción, pero la del régimen especial para adolescentes.",2:"Los padres no van a la cárcel por el delito de su hijo.",3:"La protección del menor se aplica aunque el delito sea grave.",4:"Tener 17 no lo convierte en adulto: no va al fuero común."}}],
   chequeo:[
    {q:"La iniciativa legislativa ciudadana requiere firmas de al menos",o:["0,3 % de la población electoral","1 %","10 %","25 %","50 % más uno"],a:0,e:"Ley 26300, art. 11."},
    {q:"¿Cuál NO puede someterse a referéndum?",o:["una reforma constitucional","una ordenanza municipal","una norma tributaria","una norma con rango de ley","materias de descentralización"],a:2,e:"Art. 32: tampoco derechos fundamentales, presupuesto ni tratados en vigor."},
    {q:"El voto es facultativo a partir de los",o:["60 años","65 años","70 años","75 años","80 años"],a:2,e:"Art. 31: obligatorio hasta los 70."}],
   prac:[
    {q:"Mecanismo para retirar a un alcalde elegido antes de que termine su mandato",o:["remoción","revocatoria","rendición de cuentas","referéndum","vacancia por el JNE a pedido de cualquiera"],a:1,e:"La revocatoria es para autoridades elegidas; la remoción, para designadas."},
    {q:"Para ejercer la ciudadanía se requiere",o:["tener título","la inscripción electoral","ser propietario","saber leer","haber votado antes"],a:1,e:"Art. 30."},
    {q:"Mecanismo de control para exigir a una autoridad que informe sobre el uso de los recursos",o:["iniciativa legislativa","demanda de rendición de cuentas","referéndum","consulta previa","acción popular"],a:1,e:"Es un derecho de control de la Ley 26300."}]},
  {id:"elec",t:"Sistema electoral: JNE, ONPE y RENIEC",ts:["Sistema electoral","Sistema electoral: onpe","Jurado Nacional de Elecciones"],
   obj:["Asignar cada función al organismo correcto.","Conocer la composición del JNE.","Distinguir partido político y movimiento regional."],
   concepto:"El sistema electoral asegura que los votos expresen la voluntad de los ciudadanos. Lo forman tres organismos autónomos que se coordinan: el JNE fiscaliza y hace justicia electoral, la ONPE organiza las elecciones y el RENIEC lleva el padrón y la identidad.",
   explica:[
    "JNE (Jurado Nacional de Elecciones): fiscaliza la legalidad del sufragio y de los procesos; administra justicia electoral en última instancia (sus fallos no se revisan); lleva el Registro de Organizaciones Políticas; proclama a los candidatos elegidos y los resultados, y entrega las credenciales (proclama al presidente de la República). Sanciona infracciones como la entrega de dádivas en campaña, que puede llevar a la exclusión.",
    "Composición del pleno del JNE (5 miembros): uno elegido por la Corte Suprema (lo preside), uno por la Junta de Fiscales Supremos, uno por el Colegio de Abogados de Lima, uno por los decanos de Derecho de las universidades públicas y uno por los decanos de las privadas.",
    "ONPE (Oficina Nacional de Procesos Electorales): organiza y ejecuta las elecciones, referéndums y consultas; diseña la cédula de sufragio; distribuye actas y material electoral; informa permanentemente el cómputo desde el inicio del escrutinio; supervisa las finanzas de las organizaciones políticas.",
    "RENIEC: registra la identificación (DNI) y los hechos del estado civil (nacimientos, matrimonios, defunciones), elabora y mantiene el padrón electoral y verifica las firmas de adherentes de iniciativas ciudadanas.",
    "Organizaciones políticas: el partido político tiene alcance nacional; el movimiento regional participa en elecciones regionales y municipales."],
   tabla:{t:"Quién hace qué",cab:["Función","Organismo"],filas:[
    ["Justicia electoral, credenciales, proclamación","JNE"],["Registro de Organizaciones Políticas","JNE"],["Cédula, actas, cómputo de votos","ONPE"],["Padrón electoral, DNI, firmas","RENIEC"]]},
   claves:[["JNE","Fiscaliza, imparte justicia electoral en última instancia, inscribe organizaciones políticas y proclama a los elegidos."],
     ["ONPE","Organiza las elecciones: cédula, material, actas y cómputo de votos."],
     ["RENIEC","DNI, estado civil, padrón electoral y verificación de firmas."],
     ["Pleno del JNE","Corte Suprema (preside), Junta de Fiscales Supremos, CAL, decanos de Derecho públicos y privados."]],
   errores:["Creer que la ONPE proclama a los ganadores: proclama el JNE.","Atribuir el padrón electoral al JNE: lo elabora el RENIEC.","Pensar que el Congreso o el TC eligen miembros del JNE."],
   ejemplo:{id:"25I-64",pasos:[
     "I: diseñar la cédula y entregar actas y materiales es tarea de la ONPE → correcta.",
     "II: proclamar resultados y entregar credenciales es del JNE → incorrecta.",
     "III: informar el cómputo desde el escrutinio es de la ONPE → correcta.",
     "IV: el registro de organizaciones políticas lo lleva el JNE → incorrecta. Respuesta: I y III (C)."],
     idea:"ONPE = la logística y el conteo; JNE = la justicia y la proclamación; RENIEC = el padrón."},
   guiada:[
    {id:"27I-61",pistas:["¿Qué organismo entrega las credenciales a los ganadores de una elección?","Solo una de las alternativas es un cargo de elección popular."],
     pasos:["El JNE proclama a los candidatos elegidos y les entrega sus credenciales.","Entre las opciones, el único cargo elegido por voto popular es el presidente de la República (D)."],
     mal:{0:"El presidente de la Corte Suprema lo eligen los jueces supremos.",1:"El jefe de la SUNAT es designado por el Ejecutivo.",2:"El presidente del TC lo eligen sus propios magistrados.",4:"El fiscal de la Nación lo elige la Junta de Fiscales Supremos."}},
    {id:"26I-64",pistas:["Ya tienes tres: Corte Suprema, decanos públicos y decanos privados. Faltan dos.","Uno viene del Ministerio Público y otro de un colegio profesional de Lima."],
     pasos:["Los otros dos miembros los eligen la Junta de Fiscales Supremos y el Colegio de Abogados de Lima.","Respuesta D."],
     mal:{0:"El Consejo de Ministros no elige miembros del JNE: sería injerencia del Ejecutivo.",1:"El Congreso no elige miembros del JNE, y el CNM ya no existe (ahora es la JNJ).",2:"Ni el TC ni la JNJ eligen miembros del JNE.",4:"Ni la SUNEDU ni el Ministerio de Justicia participan."}}],
   chequeo:[
    {q:"El padrón electoral lo elabora y mantiene",o:["la ONPE","el JNE","el RENIEC","el Congreso","la Defensoría del Pueblo"],a:2,e:"El RENIEC lo elabora; el JNE lo aprueba."},
    {q:"Imparte justicia en materia electoral en última instancia",o:["el Poder Judicial","el JNE","la ONPE","el Tribunal Constitucional","el RENIEC"],a:1,e:"Sus resoluciones no son revisables (art. 181)."},
    {q:"Diseña la cédula de sufragio",o:["el RENIEC","el JNE","la ONPE","el Congreso","el Ministerio del Interior"],a:2,e:"Es parte de la organización del proceso."}],
   prac:[
    {q:"Preside el JNE el miembro elegido por",o:["el Colegio de Abogados de Lima","la Corte Suprema","la Junta de Fiscales Supremos","los decanos de universidades públicas","el Congreso"],a:1,e:"El representante de la Sala Plena de la Corte Suprema."},
    {q:"Inscribe a los partidos en el Registro de Organizaciones Políticas",o:["la ONPE","el RENIEC","el JNE","la SUNARP","el Congreso"],a:2,e:"El ROP depende del JNE."},
    {q:"Verifica las firmas de adherentes de una iniciativa ciudadana",o:["el RENIEC","la ONPE","el JNE","la Contraloría","el Poder Judicial"],a:0,e:"Compara las firmas con su registro de identificación."}]}
  ]},
"civ:Convivencia, diversidad y paz":{
  fuente:"Preguntas reales del banco (2023-I a 2027-I). Teoría redactada para Ruta 1250 a partir del temario CEPRE 2026-II (semanas 6 a 8) y del Informe Final de la CVR (2003).",
  lee:[["Cívica 2019 · Pre San Marcos (Drive)","https://drive.google.com/file/d/1tDJ5dwBWT_twith8wMFs4CdwSImKOsll/view"],["Puro DECO · Cívica (Drive)","https://drive.google.com/file/d/1HuKn44juqka8u7KNDgv8W7gIaiRv3STk/view"]],
  bloques:[
  {id:"conv",t:"Conflictos, cultura de paz y diversidad",ts:["Solución de conflictos","Mecanismo de solución de conflictos","Violencia y conflicto interno","Convivencia democrática"],
   obj:["Distinguir negociación, mediación, conciliación y arbitraje.","Conocer las conclusiones centrales de la CVR.","Reconocer discriminación, inclusión e interculturalidad en casos."],
   concepto:"Un conflicto es una oposición de intereses o necesidades entre partes; bien manejado puede ser una oportunidad. La cultura de paz propone resolverlo con diálogo y mecanismos democráticos, sin violencia.",
   explica:[
    "Mecanismos autocompositivos (deciden las partes): negociación, las partes dialogan directamente sin terceros; mediación, un tercero neutral facilita la comunicación de manera informal, sin imponer; conciliación, un conciliador acreditado por el Ministerio de Justicia y Derechos Humanos, en un centro de conciliación, ayuda y puede proponer fórmulas; el acuerdo queda en un acta con valor de título de ejecución. Es el paso usual cuando falla la negociación en temas como deudas o alquileres.",
    "Mecanismos heterocompositivos (decide un tercero): arbitraje, las partes eligen a un árbitro o tribunal arbitral especializado, cuya decisión (laudo arbitral) es definitiva y obligatoria; y el proceso judicial.",
    "Violencia terrorista (1980-2000): Sendero Luminoso inició la lucha armada en Chuschi (Ayacucho) en mayo de 1980; también actuó el MRTA. La Comisión de la Verdad y Reconciliación (CVR, 2001-2003) estimó unas 69 280 víctimas fatales, en su mayoría campesinos quechuahablantes, y señaló a Sendero como principal perpetrador. Vinculó la violencia con la exclusión y las profundas desigualdades (falta de justicia social) y recomendó reparaciones, reformas institucionales y reconciliación.",
    "Diversidad e inclusión: discriminar es tratar de forma desigual por origen, raza, sexo, idioma, religión, opinión, condición económica, discapacidad o identidad (art. 2.2 de la Constitución). Multiculturalidad es que varias culturas coexistan; interculturalidad es que dialoguen de forma horizontal y respetuosa. El reconocimiento jurídico de las culturas busca revertir la exclusión histórica de ciertas comunidades."],
   tabla:{t:"Mecanismos de solución de conflictos",cab:["Mecanismo","Tercero","¿Quién decide?"],filas:[
    ["Negociación","No hay","Las partes"],["Mediación","Neutral, facilita","Las partes"],["Conciliación","Conciliador acreditado (MINJUSDH)","Las partes; acta exigible"],["Arbitraje","Árbitro especializado","El árbitro: laudo definitivo"],["Proceso judicial","Juez","El juez: sentencia"]]},
   claves:[["Negociación","Las partes dialogan directamente, sin terceros."],
     ["Mediación","Un tercero neutral facilita el diálogo; no impone."],
     ["Conciliación","Conciliador acreditado por el MINJUSDH; el acta de acuerdo es exigible."],
     ["Arbitraje","Un árbitro especializado decide con un laudo definitivo y obligatorio."],
     ["CVR","2001-2003: unas 69 280 víctimas; vinculó la violencia con la exclusión y la desigualdad."],
     ["Interculturalidad","Diálogo horizontal y respeto entre culturas, no solo coexistencia."]],
   errores:["Confundir mediación (no propone formalmente, es informal) con conciliación (acreditada, acta exigible).","Creer que en el arbitraje las partes deciden: decide el árbitro.","Reducir la causa del conflicto armado a un solo factor político: la CVR destaca la desigualdad y la exclusión."],
   ejemplo:{id:"25II-61",pasos:[
     "En el arbitraje, las partes se someten a un tercero especializado.",
     "Ese tercero (árbitro) dicta un laudo definitivo y obligatorio.",
     "A describe la conciliación (persona acreditada por el MINJUSDH); B y C, la mediación (sugerencias informales). Respuesta D."],
     idea:"Si el tercero decide y su decisión obliga, es arbitraje; si solo ayuda, es mediación o conciliación."},
   guiada:[
    {id:"24II-62",pistas:["Miguel ya insistió por su cuenta (negociación) sin resultado. ¿Qué mecanismo formal sigue?","Hay una notificación notarial y quiere un proceso legal sobre una deuda de alquiler."],
     pasos:["La negociación directa ya fracasó.","Para deudas de alquiler, lo usual es acudir a un centro de conciliación con un conciliador acreditado.","El acta de conciliación es exigible. Respuesta C."],
     mal:{0:"La «reconciliación» no es un mecanismo formal de solución de conflictos.",1:"El arbitraje requiere que ambas partes acepten someterse a un árbitro; aquí el inquilino ni responde.",3:"La mediación es informal y no produce un acta exigible.",4:"La negociación ya se intentó y fracasó."}},
    {id:"26I-63",pistas:["Si la CVR propone un «nuevo pacto» entre Estado y sociedad, ¿qué falló antes?","Recuerda quiénes fueron la mayoría de víctimas: campesinos pobres y quechuahablantes."],
     pasos:["La mayoría de víctimas fueron poblaciones excluidas y pobres.","La CVR vinculó el conflicto con las profundas desigualdades sociales.","Por eso propone un nuevo pacto: la causa señalada es la falta de justicia social (E)."],
     mal:{0:"Hubo gobiernos democráticos durante el conflicto; la CVR enfatiza la desigualdad.",1:"Es una idea cercana, pero la CVR pone el acento en la injusticia social y la exclusión.",2:"«Contrato social moderno» no es la causa que destaca la CVR.",3:"Es un factor, pero la causa de fondo que se infiere es la falta de justicia social."}}],
   chequeo:[
    {q:"El tercero no decide ni propone formalmente: solo facilita el diálogo. Es",o:["arbitraje","mediación","conciliación","proceso judicial","laudo"],a:1,e:"La mediación es informal; la conciliación es acreditada."},
    {q:"El laudo es la decisión propia de",o:["la negociación","la mediación","la conciliación","el arbitraje","la CVR"],a:3,e:"Es definitivo y obligatorio."},
    {q:"La interculturalidad implica",o:["que una cultura absorba a las demás","solo la coexistencia de culturas","el diálogo horizontal y el respeto entre culturas","la separación de las culturas","la autonomía étnica regional"],a:2,e:"No basta coexistir (multiculturalidad): hay que dialogar."}],
   prac:[
    {q:"Dos vecinos conversan sin intermediarios hasta llegar a un acuerdo sobre un ruido. Es",o:["negociación","mediación","conciliación","arbitraje","juicio"],a:0,e:"No hay tercero."},
