"ari:Porcentajes y proporcionalidad":{
  fuente:"Preguntas reales del banco (2023-II a 2026-II) y sus resoluciones. Teoría redactada para Ruta 1250 y verificada con cálculo.",
  lee:[["Puro DECO · Aritmética","https://drive.google.com/file/d/1PtxqKIEoAVH21ksfPg9QJmgbtNZqfxSU/view"],["Separata ADUNI · Magnitudes proporcionales II","https://drive.google.com/file/d/1_sHnMW9wmhy2p4UEGTwYh6smw_6SvklJ/view"]],
  bloques:[
  {id:"razon",t:"Razones, proporciones y reparto",ts:["Razones y proporciones","Reparto proporcional"],
   obj:["Escribir cualquier razón «a es a b como 3 es a 5» con una constante k.","Unir dos razones que comparten un término.","Repartir una cantidad en partes directa o inversamente proporcionales."],
   concepto:"Una razón compara dos cantidades dividiendo: a/b = 3/5 dice que por cada 3 de a hay 5 de b. El truco de casi todos los problemas es escribir a = 3k y b = 5k, y buscar k con el dato que falta.",
   explica:[
    "Razón aritmética es una resta (a − b) y razón geométrica es una división (a/b). En admisión, «razón» sin más casi siempre es la geométrica.",
    "Si a/b = 3/5, entonces a = 3k y b = 5k para algún k. Con un dato más (la suma, la diferencia, un producto) hallas k y luego todo lo demás.",
    "Proporción es una igualdad de dos razones: a/b = c/d. Propiedad clave: a·d = b·c (producto de extremos = producto de medios).",
    "Si dos razones comparten un término, iguala ese término con el mínimo común múltiplo. Ej.: a/b = 11/2 y c/b = 7/3 → b debe ser múltiplo de 2 y de 3: b = 6k, a = 33k, c = 14k.",
    "Reparto directo (DP): cada parte es proporcional a su número. Si repartes N DP a 2, 3 y 5, las partes son 2k, 3k y 5k, y 10k = N.",
    "Reparto inverso (IP): cada parte es proporcional al inverso. Si repartes IP a 3, 4 y 6, toma el MCM (12) y divide: 12/3, 12/4, 12/6 = 4, 3, 2. Las partes son 4k, 3k y 2k: el que tiene el número más grande recibe menos."],
   claves:[["Razón geométrica","a/b = m/n → a = m·k y b = n·k. Con un dato más se halla k."],
     ["Proporción","a/b = c/d ⇔ a·d = b·c."],
     ["Unir razones con un término común","Iguala el término común usando su MCM: a/b = 11/2 y c/b = 7/3 → b = 6k, a = 33k, c = 14k."],
     ["Reparto directamente proporcional","Partes = (números)·k; la suma de las partes es el total."],
     ["Reparto inversamente proporcional","Pasa a DP con MCM ÷ cada número. IP a 3, 4, 6 ≡ DP a 4, 3, 2."]],
   errores:["Sumar las razones como fracciones (3/5 + 2/7) cuando lo que se suma son las cantidades 3k + 5k.","En razones con un término común, olvidar igualar ese término y usar dos k distintos como si fueran iguales.","En reparto inverso, dar más al número más grande. Es al revés: a más faltas, menos dinero."],
   ejemplo:{id:"23II-32",pasos:[
     "Llama a = cartera, b = correa, c = billetera. Datos: a/b = 11/2 y c/b = 7/3.",
     "La correa (b) aparece en las dos razones con 2 y con 3. MCM(2; 3) = 6: multiplica la primera por 3 y la segunda por 2.",
     "a = 33k, b = 6k, c = 14k.",
     "Dato: la cartera cuesta 243 más que la correa → 33k − 6k = 27k = 243 → k = 9.",
     "Piden billetera − correa = 14k − 6k = 8k = 8 × 9 = 72 soles."],
     idea:"Cuando dos razones comparten un término, iguálalo con el MCM y trabaja con una sola k."},
   guiada:[
    {id:"24II-32",pistas:["Reparto DP a 5, 7 y 10: las partes son 5k, 7k y 10k, y el total es 22k. Pero ojo: si fuera equitativo, cada uno recibiría 22k/3, que no es entero. ¿Por qué número conviene multiplicar 5, 7 y 10?","Multiplica todo por 3: partes 15k, 21k y 30k; total 66k; reparto equitativo 22k cada uno. El de 7 años habría recibido 22k − 21k = k más."],
     pasos:["Partes DP a 5, 7 y 10 → multiplico por 3 para que el total se divida entre 3: 15k, 21k, 30k. Total = 66k.","Si el reparto fuera equitativo, cada sobrino recibiría 66k ÷ 3 = 22k.","El de 7 años habría recibido 22k − 21k = k canicas más. Dato: k = 7.","Total = 66 × 7 = 462 canicas."],
     mal:{0:"453 no es múltiplo de 66: el total debe ser 66k. Revisa el reparto equitativo.",2:"484 = 22 × 22: parece que usaste 22k como total. El total es 66k (15k + 21k + 30k).",3:"475 no es múltiplo de 66. Escribe las partes 15k, 21k y 30k y compara con 22k.",4:"436 no es múltiplo de 66. El total debe ser 66k."}}],
   chequeo:[
    {q:"Dos números están en la razón 4 a 7 y su suma es 132. ¿Cuál es el mayor?",o:["48","84","77","56","66"],a:1,e:"4k + 7k = 11k = 132 → k = 12. Mayor = 7 × 12 = 84."},
    {q:"Si a/b = 2/3 y b/c = 6/5, ¿cuál es a/c?",o:["4/5","12/15","5/4","2/5","3/5"],a:0,e:"a/c = (a/b)·(b/c) = (2/3)·(6/5) = 12/15 = 4/5."},
    {q:"Se reparten 540 soles en forma inversamente proporcional a 2, 3 y 6. ¿Cuánto recibe el que tiene 6?",o:["270","180","90","60","120"],a:2,e:"IP a 2, 3, 6 ≡ DP a 6/2, 6/3, 6/6 = 3, 2, 1. 6k = 540 → k = 90. El de 6 recibe 1k = 90."}]},
  {id:"magn",t:"Magnitudes y regla de tres",ts:["Regla de tres compuesta","Aplicación de magnitudes"],
   obj:["Decidir si dos magnitudes son directa o inversamente proporcionales.","Resolver obras con la fórmula (obreros · días · horas · eficiencia) ÷ (obra · dificultad) = constante.","Plantear problemas donde cambian los trabajadores a mitad de la obra."],
   concepto:"Dos magnitudes son directamente proporcionales (DP) si al duplicar una se duplica la otra: su cociente es constante. Son inversamente proporcionales (IP) si al duplicar una la otra se reduce a la mitad: su producto es constante. La regla de tres compuesta junta varias de estas relaciones en una sola fórmula.",
   explica:[
    "Pregunta de control: «si aumento A, ¿B aumenta o disminuye?». Si aumenta en la misma proporción, son DP (A/B = cte). Si disminuye, son IP (A·B = cte).",
    "Ejemplos: más obreros → menos días (IP). Más horas diarias → menos días (IP). Más obra → más días (DP). Más dificultad → más días (DP). Más eficiencia → menos días (IP).",
    "Fórmula de obras: (obreros × días × horas/día × eficiencia) ÷ (obra × dificultad) = constante. Arriba va lo que «aporta trabajo» y abajo lo que «exige trabajo».",
    "Escribe la fórmula para la situación 1 y la situación 2, iguálalas y despeja. Pon solo las magnitudes que cambian; las que no cambian se cancelan.",
    "Cuando cambian los obreros a mitad de la obra, piensa en «jornadas-obrero»: lo que faltaba hacer se completa sumando lo que aporta cada grupo en su tiempo.",
    "Lee con cuidado: a veces hay datos de más (como el número total de paltas en una pregunta de cajas). Solo usa lo que cambia la obra."],
   claves:[["Magnitudes DP","A/B = constante: si una se multiplica por n, la otra también."],
     ["Magnitudes IP","A·B = constante: si una se multiplica por n, la otra se divide entre n."],
     ["Fórmula de obras","(obreros · días · h/d · eficiencia) ÷ (obra · dificultad) = constante."],
     ["Cambio de personal","Lo que falta de la obra = suma de (obreros × días × eficiencia) de cada tramo."]],
   errores:["Poner la dificultad o la obra arriba en la fórmula: van abajo, porque exigen trabajo.","Contar como «días que faltan» los días ya trabajados.","Olvidar la eficiencia: un obrero el doble de eficiente cuenta como 2."],
   ejemplo:{id:"26II-34",pasos:[
     "Las 7392 paltas son un dato de más: lo que importa es la obra en cajas.",
     "Situación 1: 8 obreros, 1 día, 6 h/d, obra 120 cajas. Situación 2: 12 obreros, x días, 5 h/d, obra 450 cajas.",
     "Fórmula: (obreros · días · h/d) ÷ obra = constante → (8 · 1 · 6)/120 = (12 · x · 5)/450.",
     "48/120 = 60x/450 → 0,4 = 60x/450 → x = 0,4 × 450 ÷ 60 = 3.",
     "Les tomará 3 días."],
     idea:"Arma la fórmula con lo que aporta trabajo arriba y la obra abajo, iguala las dos situaciones y despeja."},
   guiada:[
    {id:"25II-33",pistas:["Sea T el número inicial de trabajadores. Faltando 16 días, lo que quedaba de obra equivale a T × 16 jornadas.","Ese resto se hizo así: (T − 5) trabajadores los 16 días, más n nuevos que valen el doble durante los últimos 10 días: (T − 5)·16 + 2n·10."],
     pasos:["Lo que faltaba: 16T jornadas (T obreros × 16 días).","Lo que realmente se hizo: los T − 5 que quedaron trabajan 16 días → 16(T − 5). Los n nuevos (doble eficiencia) trabajan 16 − 6 = 10 días → 2n × 10 = 20n.","16T = 16T − 80 + 20n → 20n = 80 → n = 4.","Cada uno recibe 4800 ÷ 4 = 1200 soles."],
     mal:{0:"800 sería si fueran 6 trabajadores nuevos. Revisa: los nuevos trabajan 10 días (16 − 6), no 16.",1:"960 sería si fueran 5. Los que renunciaron son 5, pero los nuevos valen el doble: n = 4.",3:"600 sería con 8 trabajadores: parece que no usaste la doble eficiencia.",4:"480 sería con 10 trabajadores. Plantea 16T = 16(T − 5) + 2n·10."}},
    {id:"24I-34",pistas:["El plazo se mantiene: si ya pasó 1/3 de la obra, pasó 1/3 del tiempo (12 días) y quedan 24 días. Como los días son iguales, puedes dejarlos fuera.","Antes: 60 obreros, 8 h, dificultad 1. Después: (60 + 2x) obreros equivalentes (los nuevos valen doble), 10 h, dificultad 3. Fórmula: obreros·h/d ÷ dificultad = cte."],
     pasos:["Lo que falta (2/3 de la obra) se hará en los mismos días que se tenían previstos: los días se cancelan.","Obreros DP dificultad; obreros IP horas/día. Entonces: (obreros × h/d) ÷ dificultad = constante.","(60 × 8)/1 = ((60 + 2x) × 10)/3 → 480 × 3 = 10(60 + 2x) → 144 = 60 + 2x.","x = 42 obreros contratados."],
     mal:{1:"48 = 144 ÷ 3. Recuerda que en 144 ya están los 60 originales: 144 = 60 + 2x.",2:"50 no cumple 60 + 2x = 144. Revisa que los nuevos valen el doble.",3:"46 no cumple 60 + 2x = 144. Plantea (60 × 8)/1 = ((60 + 2x) × 10)/3.",4:"36 no cumple. La dificultad 3 va abajo, junto a la obra."}}],
   chequeo:[
    {q:"6 obreros hacen una obra en 10 días. ¿Cuántos días tardarán 15 obreros iguales?",o:["25","4","6","5","3"],a:1,e:"Obreros IP días: 6 × 10 = 15 × d → d = 4."},
    {q:"Si 4 máquinas producen 300 piezas en 5 horas, ¿cuántas piezas producen 6 máquinas en 4 horas?",o:["360","300","450","240","400"],a:0,e:"Piezas DP máquinas y DP horas: 300 × (6/4) × (4/5) = 360."},
    {q:"En la fórmula de obras, ¿dónde va la dificultad?",o:["Arriba, junto a los obreros","Abajo, junto a la obra","No se usa","Arriba, junto a las horas","Se suma a los días"],a:1,e:"La dificultad exige más trabajo, como la obra: va abajo (es DP a los días y a los obreros)."}]}]},
"alg:Polinomios y ecuaciones":{
  fuente:"Preguntas reales del banco (2023-I a 2024-II) y sus resoluciones. Teoría redactada para Ruta 1250 y verificada con cálculo.",
  lee:[["Puro DECO · Álgebra","https://drive.google.com/file/d/1YfpoeCQQs-9xhX6RJgBGRW5heW2P14Gn/view"],["Apuntes digitales · Álgebra","https://drive.google.com/drive/folders/1pSoJ6GLS9RIOm3oetbU3emL2N6oHiNnU"]],
  bloques:[
  {id:"ecu",t:"Ecuaciones de primer y segundo grado",ts:["Ecuación lineal","Ecuaciones cuadráticas","Ecuación bicuadrada"],
   obj:["Plantear y resolver una ecuación lineal a partir de un enunciado.","Resolver una cuadrática por factorización o por fórmula general.","Usar la suma y el producto de raíces sin hallar las raíces."],
   concepto:"Una ecuación es una igualdad con una incógnita. Las de primer grado (ax + b = 0) tienen una solución. Las de segundo grado (ax² + bx + c = 0) tienen dos raíces, y muchas preguntas se resuelven solo con su suma (−b/a) y su producto (c/a), sin hallarlas.",
   explica:[
    "Primer grado: despeja dejando x sola. Si el enunciado es largo, primero nombra con una letra lo que piden y traduce cada frase a una igualdad.",
    "Segundo grado ax² + bx + c = 0: intenta factorizar con aspa simple (dos números que multiplicados den a·c y sumados den b). Si no sale, usa la fórmula x = (−b ± √Δ)/(2a), con Δ = b² − 4ac.",
    "El discriminante Δ dice cómo son las raíces: Δ > 0, dos reales distintas; Δ = 0, una doble (iguales); Δ < 0, complejas conjugadas.",
    "Propiedades de Cardano-Vieta: x₁ + x₂ = −b/a y x₁·x₂ = c/a. Con ellas: x₁² + x₂² = (x₁ + x₂)² − 2x₁x₂.",
    "Para armar una cuadrática con raíces conocidas r y s: x² − (r + s)x + r·s = 0.",
    "Bicuadrada (ax⁴ + bx² + c = 0): haz z = x² y resuelve la cuadrática en z. Cada valor de z da dos valores de x: ±√z."],
   claves:[["Fórmula general","x = (−b ± √(b² − 4ac)) / (2a)."],
     ["Discriminante","Δ = b² − 4ac. Δ > 0: 2 raíces reales; Δ = 0: raíz doble; Δ < 0: complejas."],
     ["Suma y producto de raíces","x₁ + x₂ = −b/a; x₁·x₂ = c/a."],
     ["Cuadrática con raíces dadas","x² − Sx + P = 0, donde S es la suma y P el producto."],
     ["Suma de cuadrados de raíces","x₁² + x₂² = (x₁ + x₂)² − 2x₁x₂."]],
   errores:["Escribir la suma de raíces como +b/a: es −b/a.","Elevar al cuadrado (x₁ + x₂)² y olvidar el −2x₁x₂ al pedir x₁² + x₂².","En la bicuadrada, quedarse con z y no sacar las dos raíces ±√z."],
   ejemplo:{id:"24I-40",pasos:[
     "En x² + 5x − 3 = 0: suma x₁ + x₂ = −5 y producto x₁·x₂ = −3. No hace falta hallar las raíces.",
     "La nueva ecuación tiene raíces x₁² y x₂². Su suma: S = x₁² + x₂² = (x₁ + x₂)² − 2x₁x₂ = 25 − 2(−3) = 31.",
     "Su producto: P = x₁²·x₂² = (x₁x₂)² = (−3)² = 9.",
     "La ecuación es x² − Sx + P = 0 → x² − 31x + 9 = 0."],
     idea:"Para construir una ecuación nueva solo necesitas la suma y el producto de sus raíces."},
   guiada:[
    {id:"24II-40",pistas:["Llama x e y a los lados del jardín. Con la vereda de 2 m alrededor, el rectángulo grande mide (x + 4) por (y + 4).","Área de la vereda = área grande − área del jardín = (x + 4)(y + 4) − xy. Desarrolla: los xy se cancelan."],
     pasos:["Rectángulo total: (x + 4)(y + 4) = xy + 4x + 4y + 16.","Vereda = total − jardín = 4x + 4y + 16 = 88.","4(x + y) = 72 → x + y = 18.","Perímetro del jardín = 2(x + y) = 36 m."],
     mal:{0:"10 no sale de 4(x + y) = 72. Revisa: el lado grande es x + 4 (2 m de cada lado).",1:"18 es x + y, el semiperímetro. Piden el perímetro: 2(x + y).",2:"16 viene de un término suelto. Plantea (x + 4)(y + 4) − xy = 88.",4:"72 es 4(x + y). El perímetro es 2(x + y) = 36."}},
    {id:"24II-42",pistas:["Haz z = x²: queda z² + 45z + 324 = 0. Busca dos números que multiplicados den 324 y sumados 45.","z = −9 o z = −36. Entonces x² = −9 → x = ±3i, y x² = −36 → x = ±6i. ¿Cuál es el módulo de 3i?"],
     pasos:["Con z = x²: z² + 45z + 324 = 0 → (z + 9)(z + 36) = 0.","x² = −9 → x = ±3i; x² = −36 → x = ±6i.","Módulos: |3i| = 3, |−3i| = 3, |6i| = 6, |−6i| = 6.","Suma = 3 + 3 + 6 + 6 = 18."],
     mal:{0:"15 sería 9 + 6: no sumes los z, suma los módulos de las cuatro raíces.",1:"Revisa: hay cuatro raíces (±3i y ±6i), cada una con su módulo.",2:"17 no sale. Las raíces son ±3i y ±6i: sus módulos son 3, 3, 6 y 6.",3:"13 no sale. Haz z = x² y factoriza z² + 45z + 324."}}],
   chequeo:[
    {q:"Si x₁ y x₂ son las raíces de 2x² − 8x + 3 = 0, ¿cuánto vale x₁ + x₂?",o:["−4","4","3/2","8","−8"],a:1,e:"x₁ + x₂ = −b/a = −(−8)/2 = 4."},
    {q:"¿Para qué valor de k la ecuación x² − 6x + k = 0 tiene una raíz doble?",o:["6","−9","36","9","3"],a:3,e:"Raíz doble ⇔ Δ = 0: 36 − 4k = 0 → k = 9."},
    {q:"¿Qué ecuación tiene raíces 2 y −5?",o:["x² + 3x − 10 = 0","x² − 3x − 10 = 0","x² + 3x + 10 = 0","x² − 7x + 10 = 0","x² + 7x − 10 = 0"],a:0,e:"S = −3 y P = −10: x² − (−3)x + (−10) = x² + 3x − 10 = 0."}]},
  {id:"sis",t:"Sistemas de ecuaciones",ts:["Sistema de ecuaciones","Sistema de ecuaciones lineales"],excl:["24I-41"],
   obj:["Traducir un enunciado con varias incógnitas a un sistema.","Resolver sistemas 2×2 y 3×3 por sustitución o reducción.","Saber cuándo un sistema tiene solución única."],
   concepto:"Un sistema de ecuaciones son varias igualdades que deben cumplirse a la vez. Si hay tantas ecuaciones independientes como incógnitas, normalmente hay una sola solución. La idea es eliminar incógnitas hasta quedarte con una.",
   explica:[
    "Primero nombra cada incógnita con una letra que te recuerde qué es (A, F, E…). Luego escribe una ecuación por cada dato.",
    "Sustitución: despeja una incógnita en la ecuación más simple y reemplázala en las demás.",
    "Reducción (eliminación): multiplica ecuaciones por números convenientes y súmalas o réstalas para que desaparezca una incógnita.",
    "Si una ecuación tiene todos sus coeficientes divisibles por un mismo número, simplifícala antes: 20A + 80F + 120E = 8800 es lo mismo que A + 4F + 6E = 440.",
    "En un sistema 2×2 {ax + by = c; dx + ey = f}: hay solución única si a/d ≠ b/e. Si a/d = b/e = c/f hay infinitas; si a/d = b/e ≠ c/f no hay solución.",
    "Al terminar, comprueba reemplazando en todas las ecuaciones. En admisión es la forma más rápida de detectar un error."],
   claves:[["Sustitución","Despeja una incógnita y reemplázala en las otras ecuaciones."],
     ["Reducción","Combina ecuaciones (multiplicando y sumando) para eliminar una incógnita."],
     ["Solución única (2×2)","a/d ≠ b/e. Infinitas: a/d = b/e = c/f. Ninguna: a/d = b/e ≠ c/f."],
     ["Simplificar primero","Divide una ecuación entre el factor común de todos sus términos."]],
   errores:["Plantear menos ecuaciones que incógnitas porque se olvidó un dato del enunciado.","Restar ecuaciones y equivocarse con los signos del término que no se elimina.","Responder una incógnita cuando piden otra cosa (por ejemplo, el gasto en vez de la cantidad)."],
   ejemplo:{id:"23II-39",pasos:[
     "Sean A, B y C las máquinas de cada marca. Cada fila de la tabla da una ecuación.",
     "Vestidos: 20A + 15B + 8C = 700. Blusas: 40A + 50B + 60C = 2300. Pantalones: 30A + 10B + 20C = 1020.",
     "Resolviendo (por reducción): A = 20, B = 12, C = 15.",
     "Comprueba: 400 + 180 + 120 = 700 ✓; 800 + 600 + 900 = 2300 ✓; 600 + 120 + 300 = 1020 ✓.",
     "A + B + C = 47 máquinas."],
     idea:"Cada fila de la tabla (o cada dato) es una ecuación; al final comprueba en todas."},
   guiada:[
    {id:"23I-42",pistas:["Sean A almohadas, F frazadas y E edredones. Hay tres datos: total de unidades, gasto total y A = F + E.","Reemplaza A = F + E en A + F + E = 160: sale A = 80, así que F + E = 80. Simplifica el gasto dividiendo entre 20."],
     pasos:["A + F + E = 160 y A = F + E → 2A = 160 → A = 80, y F + E = 80.","Gasto: 20A + 80F + 120E = 8800 → (÷20) A + 4F + 6E = 440 → 4F + 6E = 360 → 2F + 3E = 180.","Con F + E = 80: 2F + 3E − 2(F + E) = 180 − 160 → E = 20, y F = 60.","Gasto en frazadas: 60 × 80 = 4800 soles."],
     mal:{1:"3600 = 45 × 80. Revisa: F + E = 80 y 2F + 3E = 180 dan F = 60.",2:"4400 no sale. Primero halla A con A = F + E y el total 160.",3:"5200 = 65 × 80. Resuelve F + E = 80 y 2F + 3E = 180.",4:"5000 no es múltiplo de 80 con F entero menor que 80. Revisa el sistema."}}],
   chequeo:[
    {q:"Resuelve: x + y = 10; x − y = 4. ¿Cuánto vale x·y?",o:["24","21","40","6","16"],a:1,e:"Sumando: 2x = 14 → x = 7, y = 3. x·y = 21."},
    {q:"En un corral hay gallinas y conejos: 20 cabezas y 56 patas. ¿Cuántos conejos hay?",o:["12","8","10","14","6"],a:1,e:"g + c = 20 y 2g + 4c = 56 → 2c = 56 − 40 = 16 → c = 8."},
    {q:"El sistema 2x + 3y = 5; 4x + 6y = 7…",o:["tiene solución única","tiene infinitas soluciones","no tiene solución","tiene x = 1","tiene y = 1"],a:2,e:"2/4 = 3/6 pero 5/7 es distinto: las rectas son paralelas, no hay solución."}]}]},
"alg:Funciones":{
  fuente:"Preguntas reales del banco (2025-I a 2026-II) y sus resoluciones. Teoría redactada para Ruta 1250.",
  lee:[["Puro DECO · Álgebra","https://drive.google.com/file/d/1YfpoeCQQs-9xhX6RJgBGRW5heW2P14Gn/view"]],
  bloques:[
  {id:"fun",t:"Funciones: dominio, rango y gráficas",ts:["Funciones","Funciones reales","Función inversa","Función cuadrática"],excl:["24II-41","23II-41"],
   obj:["Hallar el dominio y el rango de una función.","Saber si una función es creciente, inyectiva o biyectiva.","Hallar el máximo o mínimo de una cuadrática completando cuadrados."],
   concepto:"Una función asigna a cada valor de entrada x (del dominio) un único valor de salida f(x). El rango es el conjunto de salidas. En admisión se pide sobre todo: dominio y rango, máximo o mínimo de una cuadrática, y si la función tiene inversa (es inyectiva).",
   explica:[
    "Dominio: los x permitidos. Restricciones típicas: denominador ≠ 0, lo que está dentro de una raíz par ≥ 0, lo que está dentro de un logaritmo > 0. Si el enunciado da un intervalo (0 ≤ t ≤ 12), ese es el dominio.",
    "Rango: los valores que realmente toma f(x). En una recta en un intervalo, evalúa los extremos. En una cuadrática, mira el vértice.",
    "Cuadrática f(x) = ax² + bx + c: completa cuadrados para llevarla a a(x − h)² + k. El vértice es (h; k). Si a > 0 el mínimo es k; si a < 0 el máximo es k. También h = −b/(2a).",
    "Creciente: si x aumenta, f(x) aumenta (recta con pendiente positiva). Decreciente: al revés.",
    "Inyectiva: valores distintos de x dan valores distintos de f(x). Prueba rápida: si encuentras dos x distintos con el mismo f(x), no es inyectiva. Solo las inyectivas tienen inversa.",
    "Biyectiva = inyectiva y sobreyectiva (el rango es todo el conjunto de llegada). Una función constante en un tramo nunca es inyectiva.",
    "Valor absoluto |f(x)| refleja hacia arriba la parte de la gráfica que está debajo del eje x; por eso suele dejar de ser inyectiva."],
   claves:[["Dominio","Valores de x permitidos: denominador ≠ 0, raíz par ≥ 0, logaritmo > 0."],
     ["Vértice de la cuadrática","f(x) = a(x − h)² + k → vértice (h; k), h = −b/(2a). a > 0: mínimo k; a < 0: máximo k."],
     ["Inyectiva","x₁ ≠ x₂ ⇒ f(x₁) ≠ f(x₂). Solo las inyectivas tienen inversa."],
     ["Dominio y rango de la inversa","Dom f⁻¹ = Ran f y Ran f⁻¹ = Dom f."],
     ["Igualar funciones","«¿Cuándo f y g valen lo mismo?» → resuelve f(t) = g(t)."]],
   errores:["Olvidar las restricciones que pone el enunciado (0 ≤ t ≤ 12) y dar una respuesta fuera de ellas.","Confundir el valor de x en el vértice (h) con el valor máximo o mínimo (k).","Decir que una función es inyectiva sin probar: busca dos x con el mismo valor."],
   ejemplo:{id:"26II-40",pasos:[
     "I. f(x) = 3x − 6 tiene pendiente 3 > 0: es creciente, no decreciente. I es falsa.",
     "II. |f(1)| = |−3| = 3 y |f(3)| = |3| = 3: dos x distintos con el mismo valor, así que |f| no es inyectiva y no es biyectiva. II es verdadera.",
     "III. g(x) = |−f(x)| + f(x) = |f(x)| + f(x). En [0; 2), f(x) < 0 y g(x) = −f(x) + f(x) = 0: g es constante en ese tramo.",
     "Una función constante en un tramo no es inyectiva, así que no tiene inversa. III es falsa.",
     "Respuesta: FVF."],
     idea:"Para negar la inyectividad basta un contraejemplo: dos x distintos con el mismo valor."},
   guiada:[
    {id:"26II-41",pistas:["Piden el momento en que el número de enfermos y el de vacunados son iguales.","Iguala f(t) = g(t): 12 − t = 3t."],
     pasos:["Enfermos = vacunados → f(t) = g(t).","12 − t = 3t → 12 = 4t → t = 3.","Está dentro del dominio 0 ≤ t ≤ 12: después de 3 meses."],
     mal:{1:"Con t = 2: f = 10 y g = 6, todavía no son iguales.",2:"Con t = 1: f = 11 y g = 3. Resuelve 12 − t = 3t.",3:"Con t = 4: f = 8 y g = 12, ya se pasaron. Resuelve 12 − t = 3t.",4:"Con t = 5: f = 7 y g = 15. Resuelve 12 − t = 3t."}},
    {id:"25I-40",pistas:["Completa cuadrados: f(x) = x² + 2x + 5 = (x + 1)² + 4. Entonces f(x + 2) = (x + 3)² + 4.","En A: (x + 3)² + 4 = 20 → (x + 3)² = 16. En B: f(x − 2) = (x − 1)² + 4 = 13."],
     pasos:["f(x) = (x + 1)² + 4.","A: f(x + 2) = (x + 3)² + 4 = 20 → x + 3 = ±4 → x = 1 o x = −7.","B: f(x − 2) = (x − 1)² + 4 = 13 → x − 1 = ±3 → x = 4 o x = −2.","Producto: 1 · (−7) · 4 · (−2) = 56 soles."],
     mal:{0:"28 es la mitad: revisa los signos. (−7)·(−2) es positivo.",1:"36 no sale. Completa cuadrados: f(x) = (x + 1)² + 4.",2:"42 no sale. En A las soluciones son 1 y −7; en B, 4 y −2.",4:"48 no sale. Revisa B: (x − 1)² = 9 → x = 4 o x = −2."}}],
   chequeo:[
    {q:"¿Cuál es el valor mínimo de f(x) = x² − 6x + 11?",o:["3","11","2","−3","6"],a:2,e:"f(x) = (x − 3)² + 2: mínimo 2, en x = 3."},
    {q:"¿Cuál es el dominio de f(x) = √(x − 4)?",o:["x > 4","x ≥ 4","x ≤ 4","Todos los reales","x ≠ 4"],a:1,e:"Lo que está dentro de la raíz debe ser ≥ 0: x − 4 ≥ 0 → x ≥ 4."},
    {q:"¿Cuál de estas funciones NO tiene inversa en todos los reales?",o:["f(x) = 2x + 1","f(x) = x³","f(x) = x²","f(x) = −3x","f(x) = x − 7"],a:2,e:"x² no es inyectiva: f(2) = f(−2) = 4."}]}]},
"alg:Logaritmos y exponenciales":{
  fuente:"Preguntas reales del banco (2023-I a 2027-I) y sus resoluciones. Teoría redactada para Ruta 1250.",
  lee:[["Puro DECO · Álgebra","https://drive.google.com/file/d/1YfpoeCQQs-9xhX6RJgBGRW5heW2P14Gn/view"]],
  bloques:[
  {id:"log",t:"Exponenciales y logaritmos",ts:["Función logarítmica","Logaritmos","Función exponencial"],excl:["23I-42"],
   obj:["Pasar de forma exponencial a logarítmica y al revés.","Usar las propiedades de los logaritmos.","Hallar el dominio de una función logarítmica y resolver inecuaciones con logaritmos."],
   concepto:"El logaritmo es la operación inversa de la potencia: log_b(N) = x significa que bˣ = N. Responde a «¿a qué exponente elevo b para obtener N?». Por ejemplo, log₂(8) = 3 porque 2³ = 8.",
   explica:[
    "Condiciones: la base b > 0 y b ≠ 1; el número N > 0. Por eso el dominio de log(algo) exige algo > 0.",
    "Propiedades: log(A·B) = log A + log B; log(A/B) = log A − log B; log(Aⁿ) = n·log A; log_b(b) = 1; log_b(1) = 0. «log» sin base es base 10.",
    "Si la base es mayor que 1, el logaritmo es creciente: log A > log B ⇔ A > B (con A y B positivos). Si la base está entre 0 y 1, la desigualdad se invierte.",
    "Ecuación exponencial: intenta escribir todo con la misma base (4ᵗ = (2ᵗ)²) y haz un cambio de variable q = 2ᵗ. Queda una cuadrática en q.",
    "Crecimiento: si algo se duplica cada año, después de t años vale a·2ᵗ; si se cuadruplica, b·4ᵗ.",
    "Para el dominio de una función logarítmica, junta todas las condiciones (cada argumento > 0, cada base > 0 y ≠ 1) y luego intersecta."],
   claves:[["Definición","log_b(N) = x ⇔ bˣ = N, con b > 0, b ≠ 1, N > 0."],
     ["Propiedades","log(AB) = log A + log B; log(A/B) = log A − log B; log Aⁿ = n·log A."],
     ["Monotonía","Base > 1: log A > log B ⇔ A > B. Base entre 0 y 1: se invierte."],
     ["Misma base","4ᵗ = (2ᵗ)² y 8ᵗ = (2ᵗ)³: cambia q = 2ᵗ y resuelve en q."]],
   errores:["Escribir log(A + B) = log A + log B: es falso; la propiedad es para el producto.","Olvidar que el argumento debe ser positivo y dar un dominio con valores que lo anulan.","Invertir la desigualdad cuando la base es mayor que 1."],
   ejemplo:{id:"27I-40",pasos:[
     "Dominio: x − 1 > 0 y 5 − x > 0 → 1 < x < 5 (ya lo dice el enunciado).",
     "T(x) > 0 → log(x − 1) − log(5 − x) > 0 → log(x − 1) > log(5 − x).",
     "La base es 10 (> 1), así que la desigualdad se mantiene: x − 1 > 5 − x → 2x > 6 → x > 3.",
     "Intersecta con el dominio: 3 < x < 5. Intervalo ⟨3; 5⟩."],
     idea:"Con base mayor que 1, compara los argumentos directamente; al final intersecta con el dominio."},
   guiada:[
    {id:"23I-41",pistas:["En A hay 10 aves y se duplican cada año: después de t años hay 10·2ᵗ. En B hay 4 y se cuadruplican: 4·4ᵗ.","Escribe 4ᵗ = (2ᵗ)² y haz q = 2ᵗ: te queda una cuadrática en q."],
     pasos:["Al inicio hay 10 aves en A y 4 en B. Después de t años el total es 10·2ᵗ + 4·4ᵗ = 1184.","Como 4·4ᵗ = 4(2ᵗ)², con q = 2ᵗ queda 4q² + 10q − 1184 = 0; dividiendo entre 2: 2q² + 5q − 592 = 0.","Factoriza: (q − 16)(2q + 37) = 0 → q = 16 (q no puede ser negativo).","2ᵗ = 16 → t = 4 años."],
     mal:{0:"Con t = 5: 10·32 + 4·1024 = 4416, demasiado.",1:"Con t = 3: 10·8 + 4·64 = 336, muy poco.",2:"Con t = 7 el total sería enorme. Haz q = 2ᵗ.",3:"Con t = 6: 10·64 + 4·4096, demasiado. Prueba con q = 2ᵗ = 16."}},
    {id:"26I-42",pistas:["Para que exista log[algo − 1], hace falta algo − 1 > 0, es decir, logₓ((3x + 32)/(3x − 1)) > 1.","Con x > 1 (base mayor que 1), logₓ(A) > 1 = logₓ(x) ⇔ A > x."],
     pasos:["Se necesita logₓ((3x + 32)/(3x − 1)) > 1 = logₓ(x).","Como x > 1, la desigualdad se mantiene: (3x + 32)/(3x − 1) > x. Para x > 1, 3x − 1 > 0, así que puedes multiplicar.","3x + 32 > 3x² − x → 3x² − 4x − 32 < 0 → (3x + 8)(x − 4) < 0 → −8/3 < x < 4.","Con x > 1: dominio ⟨1; 4⟩. Altura = |4 − 1| = 3 m."],
     mal:{0:"1 m no sale. Plantea (3x + 32)/(3x − 1) > x y factoriza.",1:"2 m no sale. La cuadrática 3x² − 4x − 32 se anula en x = 4.",3:"2,5 m no sale. El dominio es ⟨1; 4⟩.",4:"3,5 m no sale. Recuerda que también debe cumplirse x > 1."}}],
   chequeo:[
    {q:"¿Cuánto vale log₃(81)?",o:["3","27","4","9","1/4"],a:2,e:"3⁴ = 81, así que log₃(81) = 4."},
    {q:"Si log 2 ≈ 0,30, ¿cuánto vale aproximadamente log 8?",o:["0,90","2,40","0,60","0,09","8,30"],a:0,e:"log 8 = log 2³ = 3·log 2 ≈ 0,90."},
    {q:"¿Cuál es el dominio de f(x) = log(x − 2)?",o:["x ≥ 2","x > 2","x < 2","x ≠ 2","Todos los reales"],a:1,e:"El argumento debe ser positivo: x − 2 > 0 → x > 2."}]}]},
"geo:Cuadriláteros y áreas":{
  fuente:"Preguntas reales del banco (2024-I a 2026-II) y sus resoluciones. Teoría redactada para Ruta 1250.",
  lee:[["Puro DECO · Geometría","https://drive.google.com/file/d/1Ub7H2rbVv7DyT55NsBqNN_xvWOg8pXVt/view"],["Apuntes digitales · Geometría","https://drive.google.com/drive/folders/1Xrc-57LkbDPVzA0HV7LpnJUlKgBfB1rI"]],
  bloques:[
  {id:"areas",t:"Áreas de regiones planas",ts:["Áreas en el trapecio","Áreas de regiones planas","Área de regiones triangulares","Área de regiones sombreadas","Áreas de regiones cuadrangulares"],excl:["24II-37"],
   obj:["Usar las fórmulas de área del triángulo, cuadriláteros y círculo.","Aprovechar que la mediana divide un triángulo en dos de igual área.","Calcular áreas sombreadas sumando y restando regiones."],
   concepto:"El área mide cuánta superficie ocupa una figura. En admisión casi nunca basta una fórmula: hay que partir la figura en piezas conocidas (triángulos, rectángulos, sectores) o comparar áreas usando relaciones como «la mediana divide en dos partes iguales».",
   explica:[
    "Fórmulas base: triángulo = base × altura ÷ 2; rectángulo = b × h; trapecio = (B + b)/2 × h; rombo = D × d ÷ 2; círculo = πr²; sector circular = πr²·θ/360°.",
    "Triángulos con la misma altura: sus áreas están en la misma razón que sus bases. Por eso la mediana divide un triángulo en dos de igual área.",
    "Triángulos semejantes: si la razón de lados es k, la razón de áreas es k². Por ejemplo, si un lado es el doble, el área es el cuádruple.",
    "Trapecio con sus dos diagonales: los triángulos de las bases son semejantes; si las bases están en razón 1:2, sus áreas son S y 4S, y cada triángulo lateral mide 2S (siempre son iguales entre sí).",
    "Áreas sombreadas: área sombreada = área total − lo que no está sombreado. A veces es más fácil trasladar piezas para formar una figura simple.",
    "Dibuja siempre la figura con los datos y marca las regiones con letras (S, 2S…). Así ves las relaciones."],
   claves:[["Trapecio","Área = (B + b)/2 × h."],
     ["Mediana","Divide el triángulo en dos regiones de igual área."],
     ["Misma altura","Las áreas de triángulos con igual altura son proporcionales a sus bases."],
     ["Semejanza","Si la razón de lados es k, la razón de áreas es k²."],
     ["Trapecio con diagonales","Bases en razón 1:k → triángulos de las bases S y k²S; cada lateral k·S."]],
   errores:["Usar como altura un lado inclinado: la altura siempre es perpendicular a la base.","En semejanza, poner la razón de áreas igual a la de lados (es al cuadrado).","Restar la misma región dos veces en un área sombreada."],
   ejemplo:{id:"26II-38",pasos:[
     "En el trapecio ABCD (bases BC = 80 y AD = 160, altura AB = 120), las diagonales AC y BD se cortan en M.",
     "Los triángulos BMC y DMA son semejantes con razón BC/AD = 80/160 = 1/2. Sus áreas: S y 4S.",
     "Los dos triángulos laterales (AMB y CMD) valen 2S cada uno (razón 1·2).",
     "Área del trapecio: (80 + 160)/2 × 120 = 14 400 = S + 4S + 2S + 2S = 9S.",
     "S = 1600 cm²: es el área de BMC."],
     idea:"Con las diagonales de un trapecio, ubica S, k²S y kS, y compara con el área total."},
   guiada:[
    {id:"25I-37",pistas:["M es punto medio de BC. Traza la diagonal AC: AM es mediana del triángulo ABC.","La mediana divide el triángulo en dos de igual área: S(ABM) = S(AMC). Haz lo mismo con N en el triángulo ACD."],
     pasos:["Traza la diagonal AC.","En el triángulo ABC, AM es mediana (BM = MC): S(AMC) = S(ABM) = 600.","En el triángulo ACD, CN es mediana (AN = ND): S(ACN) = S(NCD) = 900.","Total: 600 + 600 + 900 + 900 = 3000 m²."],
     mal:{0:"3200 no sale. Cada mediana duplica su área: 2 × 600 + 2 × 900.",1:"2800 no sale. Traza AC y usa la mediana en cada triángulo.",2:"3600 sería 4 × 900. El triángulo ABC suma 1200, no 1800.",4:"2600 no sale. La mediana divide en dos áreas iguales."}},
    {id:"24I-37",pistas:["El cuadrado mide 4 de lado: área 16. La circunferencia inscrita tiene radio 2.","Los cuatro semicírculos de diámetro 2 (radio 1) equivalen a dos círculos de radio 1. Mira la figura para ver qué se resta y qué se suma."],
     pasos:["Área del cuadrado: 4² = 16.","Se quita el círculo inscrito de radio 2: π · 2² = 4π.","Los cuatro semicírculos (radio 1) equivalen a 2 círculos: 2 · π · 1² = 2π, y según la figura esa parte sí está sombreada.","Sombreada = 16 − 4π + 2π = 16 − 2π = 2(8 − π) cm²."],
     mal:{0:"4(4 − π) = 16 − 4π: te faltó sumar los semicírculos (2π).",1:"2(6 − π) = 12 − 2π. El cuadrado mide 16, no 12.",2:"16 − π no sale. Los cuatro semicírculos de radio 1 equivalen a 2π.",4:"2(5 − π) = 10 − 2π. Revisa el área del cuadrado: 4² = 16."}}],
   chequeo:[
    {q:"Un trapecio tiene bases 6 y 10 y altura 5. ¿Cuál es su área?",o:["80","40","30","60","16"],a:1,e:"(6 + 10)/2 × 5 = 8 × 5 = 40."},
    {q:"Dos triángulos semejantes tienen lados en razón 1 a 3. Si el menor tiene área 5, ¿cuál es el área del mayor?",o:["15","45","25","9","30"],a:1,e:"Razón de áreas = 3² = 9: 5 × 9 = 45."},
    {q:"En un triángulo de área 50, se traza una mediana. ¿Qué área tiene cada parte?",o:["20 y 30","25 y 25","10 y 40","50 y 50","Depende del triángulo"],a:1,e:"La mediana divide al triángulo en dos regiones de igual área: 25 y 25."}]}]}

"fis:Trabajo y energía":{
  fuente:"Preguntas reales del banco (2024-I a 2027-I) y sus resoluciones. Teoría redactada para Ruta 1250 y verificada con cálculo.",
  lee:[["Puro DECO · Física","https://drive.google.com/file/d/1Kxx77MgrklnADw10HIe5tUeYeFxJOsvY/view"]],
  bloques:[
  {id:"ener",t:"Energía mecánica y su conservación",ts:["Conservación de la energía","Energía mecánica","Conservación de la energía mecánica"],
   obj:["Calcular la energía cinética, la potencial gravitatoria y la elástica.","Usar la conservación de la energía cuando no hay rozamiento.","Elegir bien el nivel de referencia para la altura."],
   concepto:"La energía mecánica es la suma de la energía de movimiento (cinética) y la de posición (potencial). Si sobre el cuerpo solo trabajan el peso y los resortes (no hay rozamiento), esa suma no cambia: lo que pierde en altura lo gana en rapidez, y al revés.",
   explica:[
    "Energía cinética: Ec = ½mv². Depende de la rapidez al cuadrado: si la rapidez se duplica, la Ec se cuadruplica.",
    "Energía potencial gravitatoria: Epg = mgh, donde h es la altura sobre un nivel de referencia que tú eliges (normalmente el suelo o el punto más bajo).",
    "Energía potencial elástica de un resorte: Epe = ½kx², donde x es lo que se estira o comprime.",
    "Conservación: si no hay rozamiento ni otras fuerzas externas que trabajen, Em(inicial) = Em(final): Ec₁ + Ep₁ = Ec₂ + Ep₂.",
    "Si hay rozamiento, la energía no se conserva: Em(final) = Em(inicial) − |trabajo del rozamiento|.",
    "Trabajo de una fuerza constante: W = F·d·cos θ. Teorema trabajo-energía: el trabajo neto es igual al cambio de energía cinética.",
    "Caso típico: algo que cae desde h partiendo del reposo llega con v = √(2gh), sin importar el camino (rampa o caída libre) si no hay rozamiento."],
   claves:[["Energía cinética","Ec = ½mv²."],
     ["Energía potencial gravitatoria","Epg = mgh (h medida desde el nivel de referencia)."],
     ["Energía potencial elástica","Epe = ½kx²."],
     ["Conservación de la energía","Sin rozamiento: Ec₁ + Ep₁ = Ec₂ + Ep₂."],
     ["Caída desde el reposo","v = √(2gh), sin importar la forma del camino liso."]],
   errores:["Usar la longitud de la rampa como altura: la altura es la vertical (h = L·sen θ).","Olvidar la energía cinética inicial cuando el cuerpo ya se mueve en el punto A.","Aplicar conservación cuando el enunciado dice que hay rozamiento."],
   ejemplo:{id:"26II-88",pasos:[
     "Toma el suelo como nivel de referencia.",
     "Energía inicial: Ec = ½(0,2)(30²) = 90 J y Epg = 0,2 × 10 × 55 = 110 J. Total: 200 J.",
     "Sin fricción, la energía se conserva. Cuando Ec = 40 J: 200 = 40 + 0,2 × 10 × H.",
     "160 = 2H → H = 80 m sobre el suelo."],
     idea:"Calcula la energía total una vez; en cualquier otro punto, Ec + Ep vale lo mismo."},
   guiada:[
    {id:"24I-88",pistas:["El tramo es liso: la energía se conserva entre A y C. Toma C (el punto más bajo) como nivel de referencia.","La altura de A no es 5 m: la rampa de 5 m está inclinada 37°, así que la altura es 5·sen 37° = 3 m."],
     pasos:["Altura de A respecto de C: h = 5 × sen 37° = 5 × 3/5 = 3 m.","Em(A) = Em(C): g·h + ½vA² = ½vC² (la masa se cancela).","10 × 3 + ½(2²) = ½vC² → 30 + 2 = ½vC² → vC² = 64.","vC = 8 m/s."],
     mal:{0:"10 m/s saldría con h = 5 m. La altura es la vertical: 5·sen 37° = 3 m.",1:"6 m/s no incluye la energía cinética de A ni la altura correcta. Plantea 10·3 + ½·2² = ½vC².",2:"4 m/s es muy poco: el bloque baja 3 m y gana rapidez.",4:"2 m/s es la rapidez en A. Al bajar, gana energía cinética."}},
    {id:"25II-84",pistas:["Al soltarlo, el bloque baja x metros: pierde energía potencial gravitatoria mgx.","En el punto más bajo se detiene un instante (v = 0): toda esa energía quedó en el resorte como ½kx²."],
     pasos:["Nivel de referencia: el punto más bajo. Arriba: Epg = mgx, Ec = 0, resorte sin deformar.","Abajo: Ec = 0 (estiramiento máximo), Epe = ½kx².","mgx = ½kx² → x = 2mg/k = 2 × 1 × 10/100.","x = 0,20 m."],
     mal:{1:"0,30 m no sale. Iguala mgx = ½kx².",2:"0,40 m sería 4mg/k. Revisa: x = 2mg/k.",3:"0,10 m = mg/k es el punto de equilibrio, no el estiramiento máximo: el bloque se pasa por inercia.",4:"0,15 m no sale. Usa mgx = ½kx²."}}],
   chequeo:[
    {q:"Una piedra de 2 kg se mueve a 3 m/s. ¿Cuál es su energía cinética?",o:["6 J","9 J","18 J","3 J","12 J"],a:1,e:"Ec = ½ × 2 × 3² = 9 J."},
    {q:"Se suelta un objeto desde 5 m de altura (g = 10 m/s²), sin aire. ¿Con qué rapidez llega al suelo?",o:["5 m/s","50 m/s","100 m/s","10 m/s","25 m/s"],a:3,e:"v = √(2gh) = √(2 × 10 × 5) = √100 = 10 m/s."},
    {q:"Si la rapidez de un auto se duplica, su energía cinética…",o:["se duplica","no cambia","se cuadruplica","se reduce a la mitad","se triplica"],a:2,e:"Ec depende de v²: (2v)² = 4v², se cuadruplica."}]}]},
"fis:Fluidos":{
  fuente:"Preguntas reales del banco (2023-II a 2027-I) y sus resoluciones. Teoría redactada para Ruta 1250 y verificada con cálculo.",
  lee:[["Puro DECO · Física","https://drive.google.com/file/d/1Kxx77MgrklnADw10HIe5tUeYeFxJOsvY/view"]],
  bloques:[
  {id:"flu",t:"Presión, empuje y fluidos en movimiento",ts:["Hidrostática","Dinámica de fluidos"],
   obj:["Calcular la presión dentro de un líquido.","Usar el principio de Arquímedes para cuerpos que flotan.","Aplicar la ecuación de continuidad y la de Bernoulli en tuberías."],
   concepto:"Un líquido empuja en todas direcciones, y empuja más cuanto más profundo estás. Todo cuerpo sumergido recibe un empuje hacia arriba igual al peso del líquido que desaloja (Arquímedes). Si el cuerpo flota, ese empuje es igual a su peso.",
   explica:[
    "Presión hidrostática: P = ρgh (ρ es la densidad del líquido y h la profundidad). Presión absoluta = presión atmosférica + ρgh.",
    "Pascal: una presión aplicada a un líquido encerrado se transmite igual a todos sus puntos. Por eso en una prensa hidráulica F₁/A₁ = F₂/A₂.",
    "Empuje (Arquímedes): E = ρ(líquido) · g · V(sumergido). Solo cuenta el volumen que está bajo el líquido.",
    "Si flota en equilibrio: empuje = peso. De ahí sale que la fracción sumergida = ρ(cuerpo)/ρ(líquido). Una madera de densidad 0,7 g/cm³ en agua tiene el 70 % sumergido.",
    "Continuidad (fluido en movimiento): el caudal se mantiene, A₁v₁ = A₂v₂. Donde el tubo es más angosto, el agua va más rápido. Con tubos circulares, v₁/v₂ = (d₂/d₁)².",
    "Bernoulli (misma altura): P₁ + ½ρv₁² = P₂ + ½ρv₂². Donde el agua va más rápido, la presión es menor."],
   claves:[["Presión hidrostática","P = ρgh; absoluta = P(atm) + ρgh."],
     ["Empuje de Arquímedes","E = ρ(líquido)·g·V(sumergido)."],
     ["Flotación","Peso = empuje → fracción sumergida = ρ(cuerpo)/ρ(líquido)."],
     ["Continuidad","A₁v₁ = A₂v₂. En tubos circulares, v₁/v₂ = (d₂/d₁)²."],
     ["Bernoulli (misma altura)","P₁ + ½ρv₁² = P₂ + ½ρv₂²."]],
   errores:["Usar el volumen total del cuerpo en el empuje cuando solo una parte está sumergida.","En continuidad con diámetros, olvidar elevar al cuadrado (el área depende de d²).","Mezclar unidades: pasa cm a m y kPa a Pa antes de reemplazar."],
   ejemplo:{id:"27I-86",pasos:[
     "El cubo flota: peso = empuje. Entonces la fracción sumergida es ρ(madera)/ρ(agua) = 700/1000 = 0,7.",
     "Altura sumergida: 0,7 × 30 cm = 21 cm.",
     "Sobresale: 30 − 21 = 9 cm."],
     idea:"Cuando algo flota, la fracción sumergida es la razón de densidades."},
   guiada:[
    {id:"26II-84",pistas:["La tabla queda totalmente sumergida y en equilibrio: el empuje sostiene el peso de la tabla más el del nadador.","Volumen de la tabla = A × 0,15. Escribe empuje = peso de la tabla + 72·g, y la g se cancela."],
     pasos:["Empuje = peso de la tabla + peso del nadador.","1000 · g · (A · 0,15) = 400 · g · (A · 0,15) + 72 · g.","150A = 60A + 72 → 90A = 72.","A = 0,80 m²."],
     mal:{0:"0,90 m² no sale. Plantea 1000·A·0,15 = 400·A·0,15 + 72.",1:"1,09 m² no sale. La tabla también pesa: réstala del empuje.",2:"1,80 m² sería si la tabla no pesara y usaras mal el espesor. Revisa 90A = 72.",4:"1,0 m² no sale. Resta el peso de la tabla: (1000 − 400)·0,15·A = 72."}},
    {id:"25II-82",pistas:["Por continuidad, A(ancha)·v(ancha) = A(angosta)·v(angosta).","El área de un círculo depende del diámetro al cuadrado: v(ancha) = v(angosta)·(d angosta/d ancha)²."],
     pasos:["Continuidad: A₁v₁ = A₂v₂. Con tubos circulares, A ∝ d².","v(ancha) = 4 × (4/10)² = 4 × 0,16.","v(ancha) = 0,64 m/s."],
     mal:{0:"0,60 m/s no sale. Calcula 4 × (0,4)².",1:"0,80 m/s no sale. Recuerda elevar la razón de diámetros al cuadrado.",3:"0,90 m/s no sale. En la parte ancha el agua va más lenta: 4 × 0,16.",4:"0,50 m/s no sale. Usa v₁ = v₂·(d₂/d₁)²."}}],
   chequeo:[
    {q:"¿Qué presión ejerce el agua a 5 m de profundidad? (ρ = 1000 kg/m³, g = 10 m/s²)",o:["5000 Pa","50 000 Pa","500 Pa","0,5 Pa","5 Pa"],a:1,e:"P = ρgh = 1000 × 10 × 5 = 50 000 Pa."},
    {q:"Un bloque flota en agua con el 60 % de su volumen sumergido. ¿Cuál es su densidad?",o:["400 kg/m³","1000 kg/m³","600 kg/m³","1600 kg/m³","60 kg/m³"],a:2,e:"Fracción sumergida = ρ(cuerpo)/ρ(agua) → ρ = 0,6 × 1000 = 600 kg/m³."},
    {q:"En una tubería horizontal, el agua pasa de una zona ancha a una angosta. En la zona angosta…",o:["la rapidez y la presión aumentan","la rapidez aumenta y la presión disminuye","la rapidez disminuye y la presión aumenta","ambas disminuyen","no cambia nada"],a:1,e:"Continuidad: más angosto, más rápido. Bernoulli: más rápido, menos presión."}]}]},

"len:Puntuación y mayúsculas":{
  fuente:"Preguntas reales del banco (2023-II a 2027-I). Reglas según la Ortografía de la RAE (2010), redactadas para Ruta 1250.",
  lee:[["Puro DECO · Lenguaje (Drive)","https://drive.google.com/file/d/1qOwrFM_RJbA4YH0eB809CHZ2RWj_aXy3/view"],["Apuntes digitales · Lenguaje (Drive)","https://drive.google.com/drive/folders/1D5XjTpVRsrXGqYoS5g1qKytFfKNcmzR_"]],
  bloques:[
  {id:"punt",t:"Coma, punto y coma y dos puntos",ts:["Puntuación","La coma","Signos de puntuación: la coma"],
   obj:["Reconocer las comas obligatorias (vocativo, inciso, enumeración, elipsis, conectores).","Detectar la coma prohibida entre sujeto y verbo.","Decidir entre coma, punto y coma y dos puntos."],
   concepto:"Puntuar es mostrar la sintaxis: la coma separa elementos dentro de una oración, el punto y coma separa proposiciones independientes que van juntas y los dos puntos anuncian lo que sigue.",
   explica:[
    "Coma obligatoria: (1) enumeración: «compró pan, leche y queso» (en una enumeración simple no va coma antes de «y»); (2) vocativo, al inicio, en medio o al final: «Niños, escuchen», «Escuchen, niños»; (3) inciso o aposición explicativa, siempre entre DOS comas: «Milagros, quien compró una casa, se mudará»; (4) antes de «pero», «mas», «sino que»: «Lo pidió, pero no se lo dieron»; (5) después de conectores como «sin embargo», «es decir», «por lo tanto», «además», y entre comas si van en medio; (6) elipsis: la coma reemplaza a un verbo que no se repite: «Teresa bordó un mantel; Ana, un pañuelo»; (7) adverbio que modifica toda la oración o complemento largo al inicio: «Felizmente, volví».",
    "Coma prohibida: nunca entre el sujeto y su verbo («Las muchachas, llamaron» ✗), ni entre el verbo y su objeto directo. Si entre sujeto y verbo hay un inciso, van dos comas, no una: «Esos individuos, según las pesquisas, integrarían la banda».",
    "Punto y coma: une proposiciones independientes con relación cercana, sobre todo cuando alguna ya tiene comas (elipsis, enumeraciones internas), y va antes de «sin embargo», «no obstante», «por lo tanto» en oraciones largas. Nunca separa una subordinada (si, como, porque, aunque) de su principal: ahí va coma.",
    "Dos puntos: anuncian una enumeración («Posee varias funciones: toma fotos…»), introducen una cita en estilo directo («Aseguró: «Murió envenenado»»), una explicación o una consecuencia, y van después del saludo de una carta. En estilo indirecto no van: «aseguró que murió» (✗ «aseguró: que murió»).",
    "Signos dobles: ¿? y ¡! se abren y se cierran; no se pone punto después del signo de cierre."],
   tabla:{t:"Qué signo usar",cab:["Situación","Signo","Ejemplo"],filas:[
    ["Le hablas a alguien (vocativo)","coma","Niños, escuchen."],["Inciso explicativo","dos comas","Carlos, mi primo, llegó."],["Verbo omitido (elipsis)","coma","Ana, un pañuelo."],["Dos proposiciones con comas internas","punto y coma","Teresa bordó un mantel; Ana, un pañuelo."],["Subordinada antepuesta (si, como, porque)","coma","Si llueve, no saldremos."],["Anuncio de lista, cita o explicación","dos puntos","Te lo digo claro: no iré."]]},
   claves:[["Coma vocativa","Separa el nombre de a quien se habla: «Niños, escuchen» / «Escuchen, niños»."],
     ["Coma de inciso","El inciso explicativo va entre DOS comas: «Carlos, mi primo, llegó»."],
     ["Coma elíptica","Reemplaza un verbo omitido: «Luis estudia Medicina; Ana, Derecho»."],
     ["Coma prohibida","Nunca entre sujeto y verbo: ✗ «Los alumnos, viajarán»."],
     ["Punto y coma","Une proposiciones independientes relacionadas, sobre todo si ya llevan comas. No va tras una subordinada."],
     ["Dos puntos","Anuncian lista, cita textual o explicación. No van después de «que»."]],
   errores:["Poner coma entre el sujeto y el verbo porque el sujeto es largo.","Abrir un inciso con una coma y olvidar la segunda.","Usar punto y coma después de una subordinada («Si llueve; no saldré»).","Poner coma antes de la «y» final de una enumeración simple.","Escribir dos puntos después de «que» (estilo indirecto)."],
   ejemplo:{id:"27I-47",pasos:[
     "A: «Como obtuvo una beca» es una subordinada causal antepuesta. Va seguida de coma, no de punto y coma.",
     "B: «Si se siente agotado» es una subordinada condicional: otra vez corresponde coma.",
     "D: «ya… ya» es un nexo distributivo dentro de una sola oración: se separa con coma.",
     "E: «Porque hace mucho calor» es causal antepuesta: coma.",
     "C: son dos proposiciones independientes y la segunda ya tiene una coma de elipsis (Ana, [bordó] un pañuelo). Por eso el punto y coma es correcto."],
     idea:"El punto y coma une proposiciones que podrían ser oraciones independientes. Si una empieza con si, como, porque o aunque, va coma."},
   guiada:[
    {id:"24II-49",pistas:["En cada alternativa, identifica qué tipo de coma se usó: ¿vocativo, inciso, conector, o una coma que separa partes que no deben separarse?","En A, «Felizmente» modifica toda la oración y «tierra querida» es a quien se le habla."],
     pasos:["B: son dos oraciones sin nexo con relación de consecuencia; una coma sola no basta (iría punto y coma o dos puntos).","C: «jóvenes» es vocativo y debe ir entre comas: «Debemos esforzarnos más, jóvenes, para salir adelante».","D: el inciso «quien adquirió una propiedad» debe cerrarse con otra coma.","E: después de «pero» no se pone coma.","A: coma tras el adverbio oracional «Felizmente» y coma antes del vocativo final «tierra querida». Correcta."],
     mal:{1:"Son dos oraciones con relación de consecuencia y sin nexo: la coma sola no basta; iría punto y coma o dos puntos.",2:"«jóvenes» es vocativo y va entre comas: «Debemos esforzarnos más, jóvenes, para salir adelante».",3:"El inciso no está cerrado: «Milagros, quien adquirió una propiedad, pronto se mudará».",4:"Después de «pero» no va coma: «…hipotecario, pero no fue aceptado»."}},
    {id:"26I-48",pistas:["Busca tres cosas: un vocativo, una enumeración y un conector.","«Señoras y señores» es vocativo; la lista de funciones tiene cuatro elementos y el último va con «y»; «sin embargo» lleva coma después."],
     pasos:["Vocativo: «Señoras y señores, el lapicero…» → 1 coma.","Enumeración: «toma fotos, envía mensajes de texto, tiene teléfono incorporado y cambia de color…» → 2 comas (no va coma antes de «y»).","Conector: «sin embargo, es de stock limitado» → 1 coma.","Total: 4 comas. Respuesta: cuatro."],
     mal:{0:"Te falta una. Cuenta el vocativo, las dos comas de la enumeración y la coma después de «sin embargo».",1:"Te sobran comas: en una enumeración no va coma antes de «y», y «el lapicero Xiomi 45» es un nombre que no se separa.",2:"Te sobra una: revisa que no hayas puesto coma antes de la «y» de la enumeración.",3:"Te sobran comas: el sujeto «el lapicero Xiomi 45» no se separa de su verbo «es»."}}],
   chequeo:[
    {q:"¿Qué enunciado está bien puntuado?",o:["Los alumnos del quinto año, viajarán mañana.","Carlos, mi primo, llegó ayer.","Dijo que: no vendría.","Si llueve; no saldremos.","Compré pan, leche, y queso."],a:1,e:"«mi primo» es una aposición explicativa y va entre dos comas. Las demás tienen coma entre sujeto y verbo, dos puntos tras «que», punto y coma tras subordinada y coma antes de la «y» final."},
    {q:"En «Luis estudia Medicina; Ana, Derecho», la coma después de «Ana» es",o:["vocativa","enumerativa","elíptica","explicativa","hiperbática"],a:2,e:"Reemplaza al verbo «estudia», que no se repite: coma elíptica."},
    {q:"¿Qué signo corresponde en «Te lo diré claramente ___ no aceptaré esa propuesta»?",o:["punto y coma","dos puntos","coma","puntos suspensivos","guion"],a:1,e:"Lo que sigue explica lo anunciado («te lo diré»): dos puntos."}],
   prac:[
    {q:"¿En qué oración la coma separa incorrectamente el sujeto del verbo?",o:["Los vecinos del barrio, protestaron ayer.","Ayer, los vecinos protestaron.","Los vecinos, molestos, protestaron.","Protestaron, sin embargo, los vecinos.","Vecinos, protesten."],a:0,e:"«Los vecinos del barrio» es el sujeto y «protestaron» su verbo: no se separan con una coma."},
    {q:"Elija la alternativa con uso correcto del punto y coma.",o:["Aunque estudió; no aprobó.","Juan trajo el pan; Pedro, la leche.","Dijo; que vendría.","Porque llovía; no salimos.","Si vienes; avísame."],a:1,e:"Dos proposiciones independientes y la segunda lleva coma elíptica. Las demás tienen subordinadas: ahí va coma."},
    {q:"¿Cuántas comas requiere «Hijo trae las llaves el celular y la billetera»?",o:["Una","Dos","Tres","Cuatro","Ninguna"],a:1,e:"Vocativo («Hijo,») y una coma en la enumeración («las llaves, el celular y la billetera»)."}]}
  ]},
"len:Sintaxis, semántica y texto":{
  fuente:"Preguntas reales del banco (2023-II a 2025-I). Clasificación según la gramática escolar del CEPRE y la Nueva gramática de la RAE, redactada para Ruta 1250.",
  lee:[["Puro DECO · Lenguaje (Drive)","https://drive.google.com/file/d/1qOwrFM_RJbA4YH0eB809CHZ2RWj_aXy3/view"],["Apuntes digitales · Lenguaje (Drive)","https://drive.google.com/drive/folders/1D5XjTpVRsrXGqYoS5g1qKytFfKNcmzR_"]],
  bloques:[
  {id:"ocomp",t:"Oración compuesta",ts:["Oración compuesta coordinada","Oración compuesta subordinada","Tipos de oración"],
   obj:["Distinguir oración simple y compuesta contando núcleos verbales.","Clasificar las coordinadas por su nexo.","Reconocer subordinadas sustantivas, adjetivas y adverbiales (sobre todo concesivas)."],
   concepto:"Una oración compuesta tiene dos o más proposiciones, cada una con su verbo. Se unen sin nexo (yuxtaposición), al mismo nivel (coordinación) o una dependiendo de la otra (subordinación).",
   explica:[
    "Paso 1, cuenta los verbos conjugados. Una perífrasis («pudo creer», «tuvo que cantar», «debe de estar») y un tiempo compuesto o pasivo («hemos presenciado», «fue cuestionado») son UN solo núcleo verbal. Los infinitivos, gerundios y participios sueltos («emocionado») no forman proposición en la gramática escolar. Un núcleo: oración simple; dos o más: compuesta.",
    "Coordinadas (las proposiciones tienen el mismo nivel): copulativas suman (y, e, ni, que); disyuntivas dan opciones (o, u); adversativas oponen (pero, mas, sino, sin embargo); distributivas alternan (unos… otros, ya… ya, bien… bien); explicativas aclaran (o sea, es decir, esto es); ilativas o consecutivas concluyen (luego, así que, por lo tanto, conque).",
    "Subordinadas sustantivas: funcionan como un sustantivo y se pueden reemplazar por «eso»: «Creyeron [que desatarían protestas]» → «Creyeron eso» (objeto directo). También pueden ser sujeto («Me alegra [que vengas]») o atributo.",
    "Subordinadas adjetivas (de relativo): modifican a un sustantivo antecedente con que, quien, cual, cuyo, donde. Especificativas, sin comas, restringen: «Los alumnos que estudiaron aprobaron». Explicativas, entre comas, añaden: «Los alumnos, que estudiaron, aprobaron».",
    "Subordinadas adverbiales: tiempo (cuando, mientras), lugar (donde), modo (como, según), causa (porque, ya que), condición (si), concesión (aunque, por más que, aun cuando: un obstáculo que no impide la acción), finalidad (para que), consecuencia (tan… que) y comparación (más… que)."],
   tabla:{t:"Coordinadas por su nexo",cab:["Clase","Nexos","Ejemplo"],filas:[
    ["Copulativa","y, e, ni, que","No asistió ni hizo la tarea."],["Disyuntiva","o, u","Irá al estadio o verá el partido."],["Adversativa","pero, mas, sino","No es bonita, pero tiene carisma."],["Distributiva","unos… otros, ya… ya","Unos declamaron, otros bailaron."],["Explicativa","o sea, es decir","Perdió, o sea, no clasificó."],["Ilativa","luego, así que, por tanto","Estudió, así que aprobará."]]},
   claves:[["Oración compuesta","Dos o más proposiciones, cada una con verbo conjugado. Una perífrasis cuenta como un solo verbo."],
     ["Coordinada copulativa","Une sumando con y, e, ni, que: «No vino ni llamó»."],
     ["Coordinada adversativa","Opone con pero, mas, sino: «Es pobre, pero honrado»."],
     ["Subordinada sustantiva","Equivale a «eso» y funciona como sujeto, objeto directo o atributo."],
     ["Subordinada adjetiva","Modifica a un antecedente con que, quien, cuyo; explicativa con comas, especificativa sin comas."],
     ["Adverbial concesiva","Aunque, por más que, aun cuando: un obstáculo que no impide la acción principal."]],
   errores:["Contar una perífrasis («tuvo que cantar») como dos verbos.","Creer que «ni» es disyuntiva: es copulativa (suma negaciones).","Confundir concesiva (aunque) con condicional (si).","Confundir «que» relativo (con antecedente: adjetiva) con «que» conjunción (sin antecedente: sustantiva)."],
   ejemplo:{id:"25I-49",pasos:[
     "A: «o» presenta una alternativa → disyuntiva.",
     "B: «pero» opone dos ideas → adversativa.",
     "C: «o sea» aclara lo anterior → explicativa.",
     "D: «Unos… otros» alterna sujetos → distributiva.",
     "E: «ni» une dos negaciones sumándolas («no asistió» + «no hizo la tarea») → copulativa. Respuesta E."],
     idea:"Mira el nexo y pregúntate qué relación crea: sumar, elegir, oponer, alternar, aclarar o concluir."},
   guiada:[
    {id:"24II-47",pistas:["¿Qué relación hay entre «le ruegues» y «no volverá»? ¿El ruego consigue que vuelva?","Un obstáculo que no impide la acción principal es una concesión."],
     pasos:["Proposición principal: «no volverá».","Subordinada: «por más que le ruegues», introducida por la locución «por más que».","El ruego es un obstáculo que no cambia el resultado → adverbial concesiva."],
     mal:{0:"Una adjetiva necesita un sustantivo antecedente al que modifique; aquí no lo hay.",1:"Una modal respondería «¿cómo?» (como, según); «por más que» no indica modo.",2:"La especificativa también es adjetiva: necesita antecedente.",3:"Una temporal respondería «¿cuándo?» (cuando, mientras)."}},
    {id:"23II-51",pistas:["Cuenta los verbos conjugados de cada alternativa. Ojo: una perífrasis es un solo núcleo.","Busca la alternativa con dos verbos en proposiciones distintas."],
     pasos:["B: «pudo creer» es perífrasis → simple.","C: «hemos presenciado» es tiempo compuesto → simple.","D: «tuvo que cantar» es perífrasis y «emocionado» es participio → simple.","E: «fue cuestionado» es voz pasiva → simple.","A: «Creyeron» + «desatarían»: dos verbos; «que los beneficiarios desatarían…» es el objeto directo de «creyeron» → compuesta (subordinada sustantiva)."],
     mal:{1:"«pudo creer» es una perífrasis: un solo núcleo verbal. Es simple.",2:"«hemos presenciado» es un tiempo compuesto: un solo verbo. Es simple.",3:"«tuvo que cantar» es perífrasis y «emocionado» es participio, no verbo conjugado. Es simple.",4:"«fue cuestionado» es voz pasiva: un solo núcleo. Es simple."}}],
   chequeo:[
    {q:"«Estudia mucho, así que aprobará» es una coordinada",o:["copulativa","disyuntiva","adversativa","ilativa","distributiva"],a:3,e:"«así que» introduce una consecuencia: ilativa."},
    {q:"En «Me dijo que vendría», la proposición subordinada cumple función de",o:["sujeto","objeto directo","complemento circunstancial","atributo","modificador indirecto"],a:1,e:"«Me dijo eso»: es lo dicho, el objeto directo."},
    {q:"¿Qué oración contiene una subordinada adjetiva?",o:["Aunque llueva, iré.","Quiero que vengas.","El libro que me prestaste es bueno.","Cuando llegó, todos callaron.","Estudia o trabaja."],a:2,e:"«que me prestaste» modifica al antecedente «libro»."}],
   prac:[
    {q:"«No vino a clase, sino que se quedó en casa» es coordinada",o:["adversativa","copulativa","explicativa","disyuntiva","ilativa"],a:0,e:"«sino que» opone y corrige lo anterior: adversativa."},
    {q:"«Si estudias, ingresarás» contiene una subordinada adverbial",o:["concesiva","condicional","causal","final","temporal"],a:1,e:"«si» plantea una condición."},
    {q:"¿Cuál es oración simple?",o:["Vino y se fue.","Debe de estar cansado.","Dijo que no.","Llegó cuando salíamos.","Unos ríen, otros lloran."],a:1,e:"«Debe de estar» es una perífrasis: un solo núcleo verbal."}]}
  ]},
"lit:Teoría y géneros literarios":{
  fuente:"Preguntas reales del banco (2023-I a 2026-I). Teoría redactada para Ruta 1250 a partir del temario CEPRE 2026-II (semana 1: géneros y figuras).",
  lee:[["Puro DECO · Literatura (Drive): temas 1 y 2","https://drive.google.com/file/d/1R0oRSKXFd6s9NvikyPR5GYhfxw9jXoQf/view"],["Abc · Literatura, resúmenes organizados (Drive)","https://drive.google.com/file/d/1BxqfSjweAn7BRLTbZouPuFkftoMkkYvU/view"]],
  bloques:[
  {id:"gen",t:"Géneros literarios",ts:["Géneros literarios"],
   obj:["Clasificar una obra en épico-narrativo, lírico o dramático por sus rasgos.","Reconocer las especies de cada género.","Distinguir narrador, hablante lírico y personajes en diálogo."],
   concepto:"Los géneros literarios agrupan las obras por su forma de presentar el mundo: el épico o narrativo cuenta hechos, el lírico expresa la intimidad de un yo y el dramático los representa con personajes que dialogan en escena.",
   explica:[
    "La división viene de Aristóteles (Poética). Pregunta clave: ¿alguien cuenta una historia, alguien expresa lo que siente o hay personajes que actúan y hablan para ser representados?",
    "Épico o narrativo: hay un narrador que cuenta hechos ocurridos a personajes, en un tiempo y un espacio. Narrador protagonista (1.ª persona, cuenta su historia), testigo (cuenta lo que vio) u omnisciente (3.ª persona, lo sabe todo, hasta lo que piensan los personajes). Especies: epopeya (hazañas de un héroe: Ilíada), cantar de gesta (Mio Cid), novela, cuento, leyenda, fábula.",
    "Lírico: un hablante lírico o «yo poético» (que no es necesariamente el autor) expresa emociones de forma subjetiva; predomina la función expresiva y suele usar verso. Especies: oda (exaltación), elegía (dolor por una pérdida), égloga (amor en ambiente pastoril), sátira (burla), canción, himno.",
    "Dramático: está escrito para representarse; hay diálogo, actores, actos y escenas, y acotaciones (indicaciones del autor entre paréntesis). Especies mayores: tragedia (el héroe choca con el destino; final funesto: Edipo Rey), comedia (vicios humanos con humor; final feliz) y drama (mezcla ambos). Menores: entremés, sainete, auto sacramental.",
    "En el examen te dan un fragmento o varias obras y te preguntan qué tienen en común: busca el rasgo de género, no el tema ni la época."],
   tabla:{t:"Los tres géneros",cab:["Género","Rasgo central","Especies"],filas:[
    ["Épico o narrativo","Un narrador cuenta hechos","Epopeya, cantar de gesta, novela, cuento"],["Lírico","Un yo expresa sentimientos","Oda, elegía, égloga, sátira, canción"],["Dramático","Personajes dialogan para ser representados","Tragedia, comedia, drama, entremés"]]},
   claves:[["Género épico o narrativo","Un narrador cuenta hechos de personajes en un tiempo y espacio. Ej.: Ilíada, novelas, cuentos."],
     ["Género lírico","Un hablante lírico expresa sus emociones de forma subjetiva. Ej.: Rimas de Bécquer."],
     ["Género dramático","Diálogo, actores y acotaciones: se escribe para ser representado."],
     ["Tragedia","Especie dramática: el héroe enfrenta al destino y termina en desgracia (Edipo Rey)."],
     ["Narrador omnisciente","Narra en tercera persona y conoce todo, incluso lo que piensan los personajes."]],
   errores:["Clasificar por el tema (amor, guerra) en vez de por la forma de enunciación.","Pensar que todo texto en verso es lírico: hay epopeyas y dramas en verso (La vida es sueño).","Confundir al hablante lírico con el autor."],
   ejemplo:{id:"26I-53",pasos:[
     "La vida es sueño es de Calderón de la Barca (Barroco español); Fuenteovejuna, de Lope de Vega; La señorita de Tacna, de Mario Vargas Llosa (1981).",
     "Autores, épocas y temas distintos: lo común tiene que ser el género.",
     "Las tres son obras de teatro: se escriben para representarse, con diálogos y actores.",
     "A (autobiografía), C (pasado mítico), D (sentimientos personales) y E (costumbrismo) no se cumplen en las tres. Respuesta B."],
     idea:"Cuando te dan varias obras distintas, busca el rasgo de género que comparten."},
   guiada:[
    {id:"24II-56",pistas:["¿El texto cuenta una historia con personajes o expresa lo que siente un yo?","La repetición de «hoy» intensifica la emoción del yo poético."],
     pasos:["No hay narrador que cuente hechos ni personajes que dialoguen.","Un yo expresa su felicidad de forma íntima y subjetiva: «hoy llega al fondo de mi alma el sol».","Eso es lo propio del género lírico. Respuesta A."],
     mal:{1:"No narra una historia: no hay narrador ni acciones de personajes, solo la emoción de un yo poético.",2:"Lo épico narra hazañas; aquí solo hay sentimientos íntimos.",3:"No hay acotaciones ni actores: «¡Hoy creo en Dios!» es una exclamación lírica, no un monólogo teatral.",4:"No hay diálogo entre personajes: es una sola voz que expresa su emoción."}}],
   chequeo:[
    {q:"La égloga, la elegía y la oda pertenecen al género",o:["narrativo","lírico","dramático","didáctico","épico"],a:1,e:"Son especies líricas: expresan sentimientos (amor pastoril, dolor, exaltación)."},
    {q:"¿Qué rasgo es propio del género dramático?",o:["narrador omnisciente","acotaciones","hablante lírico","verso libre","prólogo"],a:1,e:"Las acotaciones indican a los actores cómo actuar y dónde ocurre la escena."},
    {q:"La epopeya es una especie del género",o:["lírico","dramático","épico","didáctico","oratorio"],a:2,e:"Narra hazañas de héroes: género épico (Ilíada, Odisea)."}],
   prac:[
    {q:"En un poema lírico, quien expresa los sentimientos es",o:["el narrador","el hablante lírico","el protagonista","siempre el autor","el coro"],a:1,e:"El yo poético o hablante lírico; no siempre coincide con el autor."},
    {q:"La tragedia se caracteriza por",o:["final feliz y personajes populares","el conflicto del héroe con el destino y un final funesto","la narración en prosa","la sátira de costumbres","la expresión de sentimientos amorosos"],a:1,e:"Ejemplo: Edipo intenta escapar de su destino y termina cumpliéndolo."},
    {q:"Un narrador que conoce los pensamientos de todos los personajes es",o:["testigo","protagonista","omnisciente","personaje secundario","lírico"],a:2,e:"Omnisciente: «que todo lo sabe»."}]},
  {id:"fig",t:"Figuras literarias",ts:["Figuras literarias"],
   obj:["Distinguir metáfora y símil (el nexo comparativo).","Reconocer anáfora, hipérbaton, epíteto, hipérbole, antítesis y oxímoron.","Decidir qué figura «predomina» en un fragmento."],
   concepto:"Las figuras literarias son usos especiales del lenguaje para embellecer o intensificar la expresión: comparan, repiten, exageran, invierten el orden o contraponen ideas.",
   explica:[
    "Comparar: el símil o comparación une dos términos con un nexo (como, cual, semejante a, parece): «Sus ojos brillan como luceros». La metáfora identifica sin nexo: «Tú eras el huracán» o reemplaza el término real («las perlas de tu boca» por los dientes).",
    "Repetir: anáfora, repetir palabras al inicio de versos o frases («Una espada… / Una espada…»); aliteración, repetir sonidos; polisíndeton, muchos nexos («y… y… y»); asíndeton, suprimirlos.",
    "Ordenar: hipérbaton, alterar el orden lógico de la oración («Del salón en el ángulo oscuro»).",
    "Calificar y exagerar: epíteto, adjetivo que destaca una cualidad propia del sustantivo («la blanca nieve»); hipérbole, exageración («lloré ríos»); personificación o prosopopeya, dar rasgos humanos a lo que no lo es.",
    "Oponer: antítesis, ideas contrarias en una misma frase («Ayer, gigante; hoy, sombra»); oxímoron, dos términos contradictorios juntos («hielo abrasador»); paradoja, idea aparentemente absurda que esconde una verdad.",
    "Cuando preguntan qué figura «predomina», cuenta la que más se repite en todo el fragmento. Una sola comparación no hace predominar el símil si cinco versos empiezan igual."],
   tabla:{t:"Figuras que más caen",cab:["Figura","Cómo reconocerla","Ejemplo"],filas:[
    ["Símil","Nexo comparativo (como, cual)","Brillan como luceros"],["Metáfora","Identifica sin nexo","Tú eras el huracán"],["Anáfora","Misma palabra al inicio de versos","Una espada… / Una espada…"],["Hipérbaton","Orden alterado","Del salón en el ángulo oscuro"],["Epíteto","Adjetivo de cualidad obvia","La blanca nieve"],["Hipérbole","Exageración","Lloré ríos"],["Oxímoron","Contrarios juntos","Hielo abrasador"]]},
   claves:[["Metáfora","Identifica dos términos sin nexo comparativo: «Tú eras el huracán»."],
     ["Símil o comparación","Compara con nexo (como, cual): «brillan como luceros»."],
     ["Anáfora","Repetir una o más palabras al inicio de versos o frases."],
     ["Hipérbaton","Alterar el orden lógico de la oración."],
     ["Epíteto","Adjetivo que resalta una cualidad propia del sustantivo: «blanca nieve»."],
     ["Oxímoron","Dos términos contradictorios juntos: «hielo abrasador»."]],
   errores:["Llamar símil a una metáfora: sin «como» o «cual» no hay símil.","Elegir la figura de un solo verso cuando preguntan cuál predomina en todo el fragmento.","Confundir epíteto (cualidad obvia) con cualquier adjetivo."],
   ejemplo:{id:"25II-53",pasos:[
     "Busca nexos comparativos (como, cual): no hay ninguno. Entonces no son símiles.",
     "«Tú eras el huracán» identifica a «tú» con el huracán: metáfora 1. «yo la alta torre»: metáfora 2.",
     "«Tú eras el Océano»: metáfora 3. «y yo la enhiesta roca»: metáfora 4.",
     "«Hermosa tú, yo altivo» solo califica, no identifica. Total: cuatro metáforas (D)."],
     idea:"Sin nexo comparativo no hay símil: es metáfora. Cuenta cada identificación por separado."},
   guiada:[
    {id:"23I-53",pistas:["«Predomina» = la figura que se repite en casi todo el fragmento. ¿Qué se repite al inicio de los versos?","Aparece «como», pero fíjate en qué estructura completa se repite cinco veces al principio."],
     pasos:["Cinco versos empiezan con «¡Es como si…!».","Repetir palabras al inicio de versos es anáfora, y es lo que domina el fragmento.","Hay «como», pero lo dominante es la repetición inicial, no una comparación aislada. Respuesta C."],
     mal:{0:"Aparece «como si», pero lo que domina el fragmento es la repetición de «Es como si» al inicio de cinco versos.",1:"El orden de las palabras es normal: no hay hipérbaton dominante.",3:"El epíteto es un adjetivo de cualidad propia; no es lo que domina aquí.",4:"No hay una exageración que domine el fragmento."}},
    {id:"25I-53",pistas:["Mira cómo empieza cada verso.","«Una espada» abre casi todos los versos."],
     pasos:["La frase «Una espada» se repite al inicio de los versos.","Esa repetición inicial es anáfora y es la figura que predomina. Respuesta C."],
     mal:{0:"Hay imágenes, pero no una identificación de un término real con uno imaginario que domine el poema.",1:"No hay alteración del orden sintáctico como rasgo dominante.",3:"No hay una exageración evidente que domine el fragmento.",4:"No hay nexo comparativo (como, cual)."}}],
   chequeo:[
    {q:"«Sus dientes son perlas» es",o:["símil","metáfora","hipérbole","epíteto","anáfora"],a:1,e:"Identifica dientes con perlas sin nexo comparativo."},
    {q:"«Del salón en el ángulo oscuro» (Bécquer) presenta",o:["hipérbaton","anáfora","símil","oxímoron","epíteto"],a:0,e:"El orden lógico sería «en el ángulo oscuro del salón»."},
    {q:"«La blanca nieve» contiene",o:["metáfora","epíteto","hipérbole","antítesis","símil"],a:1,e:"La blancura es propia de la nieve: el adjetivo solo la resalta."}],
   prac:[
    {q:"«Lloré tanto que se desbordaron los ríos» contiene",o:["hipérbole","símil","epíteto","anáfora","hipérbaton"],a:0,e:"Exagera la cantidad de llanto."},
    {q:"«Es hielo abrasador, es fuego helado» (Quevedo) presenta",o:["símil","oxímoron","epíteto","polisíndeton","hipérbaton"],a:1,e:"Une términos contradictorios: hielo que quema, fuego que hiela."},
    {q:"«Sus ojos brillaban como dos luceros» es",o:["metáfora","símil","hipérbole","anáfora","personificación"],a:1,e:"Compara con el nexo «como»."}]}
  ]},
"lit:Literatura peruana":{
  fuente:"Preguntas reales del banco (2023-I a 2027-I). Teoría redactada para Ruta 1250 a partir del temario CEPRE 2026-II (semanas 11, 13 y 14).",
  lee:[["Literatura Peruana · resumen (Drive)","https://drive.google.com/file/d/1FiqgBShrt5_F6t2h3nsXvD4lBr_FFx3b/view"],["Puro DECO · Literatura (Drive)","https://drive.google.com/file/d/1R0oRSKXFd6s9NvikyPR5GYhfxw9jXoQf/view"],["Abc · Literatura, resúmenes organizados (Drive)","https://drive.google.com/file/d/1BxqfSjweAn7BRLTbZouPuFkftoMkkYvU/view"]],
  bloques:[
  {id:"indig",t:"Del indianismo al neoindigenismo",ts:["Indigenismo: Arguedas"],
   obj:["Distinguir indianismo, indigenismo y neoindigenismo.","Conocer las obras y personajes clave de Ciro Alegría y José María Arguedas.","Interpretar fragmentos de Los ríos profundos."],
   concepto:"La narrativa sobre el mundo andino pasó de mirar al indio desde fuera y con lástima (indianismo, siglo XIX), a mostrarlo como protagonista de su realidad (indigenismo) y, con Arguedas, a narrarlo desde dentro, con su lengua, su música y sus mitos (neoindigenismo).",
   explica:[
    "Indianismo (fines del siglo XIX): Clorinda Matto de Turner, Aves sin nido (1889). Denuncia a la «trinidad» que explota al indio en Killac: el cura (Pascual), el gobernador y el juez. El matrimonio criollo Marín protege a los Yupanqui. Visión paternalista: el indio aparece como alguien que necesita protección.",
    "Indigenismo (desde 1920): Enrique López Albújar (Cuentos andinos) y Ciro Alegría: La serpiente de oro (1935), Los perros hambrientos (1939) y El mundo es ancho y ajeno (1941). En esta última, la comunidad de Rumi, liderada por Rosendo Maqui, defiende sus tierras frente al hacendado Álvaro Amenábar; Benito Castro continúa la lucha. Es una epopeya de la comunidad despojada.",
    "Neoindigenismo: José María Arguedas narra el mundo andino desde dentro, con lirismo, mitos y un español que transmite la sintaxis del quechua. Obras: Agua (1935), Yawar Fiesta (1941), Los ríos profundos (1958), Todas las sangres (1964) y El zorro de arriba y el zorro de abajo (1971, póstuma, ambientada en Chimbote).",
    "Los ríos profundos: Ernesto, adolescente y narrador-protagonista, viaja con su padre, abogado itinerante, y queda interno en un colegio religioso de Abancay. Allí sufre la violencia del internado y se refugia en el mundo indígena que lo acogió de niño (las sirvientas indias, los cantos, el zumbayllu). Episodios clave: el motín de las chicheras de doña Felipa y la peste que obliga a los colonos a entrar en la ciudad.",
    "Clave de examen: en Arguedas, Ernesto se identifica con lo indígena y con la naturaleza andina; no es una visión idealizada sin conflicto, porque muestra también la violencia y la desigualdad."],
   tabla:{t:"Tres miradas sobre el mundo andino",cab:["Corriente","Autor y obra","Visión del indio"],filas:[
    ["Indianismo","Matto de Turner: Aves sin nido (1889)","Desde fuera, paternalista: necesita protección"],["Indigenismo","Ciro Alegría: El mundo es ancho y ajeno (1941)","Protagonista colectivo: la comunidad que lucha por su tierra"],["Neoindigenismo","Arguedas: Los ríos profundos (1958)","Desde dentro: lengua, mito, música e identidad andina"]]},
   claves:[["Indianismo","Visión externa y paternalista del indio; Matto de Turner, Aves sin nido (1889)."],
     ["El mundo es ancho y ajeno","Ciro Alegría (1941): la comunidad de Rumi (Rosendo Maqui) defiende sus tierras del hacendado Álvaro Amenábar."],
     ["Los ríos profundos","Arguedas (1958): Ernesto, narrador adolescente, en un colegio de Abancay; se identifica con el mundo indígena."],
     ["Neoindigenismo","Narra el mundo andino desde dentro, con lirismo, mito y técnicas modernas (Arguedas, Scorza)."],
     ["El zorro de arriba y el zorro de abajo","Novela póstuma de Arguedas (1971), ambientada en Chimbote."]],
   errores:["Poner Aves sin nido dentro del indigenismo: es su precursora (indianismo).","Decir que Arguedas idealiza el mundo andino: lo muestra desde dentro, con su belleza y su violencia.","Confundir personajes: Rosendo Maqui es de Alegría; Ernesto, de Arguedas."],
   ejemplo:{id:"27I-54",pasos:[
     "El narrador se siente bien en la habitación porque le recuerda la cocina donde vivió de niño, cuidado por las sirvientas indias.",
     "Recuerda con afecto su música, sus cantos y su «dulce hablar»: hay identificación con ellos.",
     "D falla: el cariño no viene de la familia, sino de los indios. B falla: Arguedas no idealiza; muestra también la violencia.",
     "La identificación de Ernesto con la vida indígena atraviesa toda la novela. Respuesta E."],
     idea:"En Arguedas, el afecto y la identidad de Ernesto están del lado indígena."},
   guiada:[
    {id:"26II-53",pistas:["¿Qué pasa en el duelo final entre Aquiles y Héctor?","¿Por qué lucha la comunidad de Rumi contra Amenábar?"],
     pasos:["En la Ilíada, Aquiles mata a Héctor: el troyano muere defendiendo su ciudad y Aquiles cumple su destino heroico.","En El mundo es ancho y ajeno, Amenábar quiere las tierras de Rumi y la comunidad las defiende.","Encuentran su destino épico – la defensa de sus tierras. Respuesta E."],
     mal:{0:"El duelo no se define por el odio, y la comunidad no lucha por sus creencias sino por su tierra.",1:"El duelo no ratifica linajes, y Rumi no lucha por crecer: defiende lo que le quieren quitar.",2:"La comunidad no lucha por «protección»: defiende sus tierras frente al despojo.",3:"Los héroes no fomentan conflictos entre ciudades en ese duelo; y Rumi no busca «progreso», defiende su tierra."}},
    {id:"26II-54",pistas:["En Aves sin nido, ¿quiénes abusan de los indios y quiénes los defienden?","La autora defiende al indio, pero lo presenta como alguien que necesita protección."],
     pasos:["I. V: visión paternalista del indígena.","II. F: los «notables» (el cura, el gobernador) son los abusadores, no los protectores.","III. V: los Marín, criollos instruidos, protegen a los Yupanqui.","IV. F: la novela critica al clero. Respuesta: VFVF (A)."],
     mal:{1:"La II es falsa: los notables son los que abusan de los indígenas.",2:"La III es verdadera: los Marín son los protectores criollos.",3:"La I es verdadera: la visión es paternalista.",4:"La I es verdadera y la IV falsa: la novela critica al clero."}}],
   chequeo:[
    {q:"¿Quién es el narrador-protagonista de Los ríos profundos?",o:["Rosendo Maqui","Ernesto","Benito Castro","Juan Yupanqui","Efraín"],a:1,e:"Ernesto, un adolescente que estudia en Abancay."},
    {q:"En El mundo es ancho y ajeno, la comunidad de Rumi enfrenta al hacendado",o:["Álvaro Amenábar","Fermín Aragón de Peralta","Sebastián Pancorbo","Cayo Bermúdez","don Santos"],a:0,e:"Amenábar quiere apropiarse de las tierras de Rumi."},
    {q:"¿Qué diferencia al indianismo del indigenismo?",o:["El indianismo usa el quechua y el indigenismo no","El indianismo ve al indio desde fuera y con paternalismo; el indigenismo lo presenta como protagonista de su realidad","El indigenismo es del siglo XIX","No hay diferencia","El indianismo es poesía y el indigenismo, teatro"],a:1,e:"Aves sin nido (1889) es paternalista; Alegría pone a la comunidad como protagonista."}],
   prac:[
    {q:"Novela póstuma de Arguedas ambientada en Chimbote",o:["Todas las sangres","El zorro de arriba y el zorro de abajo","Yawar Fiesta","Agua","Diamantes y pedernales"],a:1,e:"Publicada en 1971, tras su muerte."},
    {q:"El neoindigenismo se caracteriza por",o:["mirar al indio desde fuera","narrar el mundo andino desde dentro, con mito, lirismo y técnicas modernas","exaltar al gamonal","ser poesía modernista","retratar a la clase alta limeña"],a:1,e:"Arguedas y Scorza son sus principales autores."},
    {q:"Autor de La serpiente de oro",o:["José María Arguedas","Ciro Alegría","López Albújar","Manuel Scorza","Julio Ramón Ribeyro"],a:1,e:"Ciro Alegría, 1935, sobre los balseros del río Marañón."}]},
  {id:"g50",t:"Generación del 50",ts:["Generación del 50","Generación del 50: narrativa urbana - julio ramón ribeyro","Generación del 50: Ribeyro"],
   obj:["Ubicar a la Generación del 50 en su contexto (Odría, migración, crecimiento de Lima).","Conocer a sus autores: Ribeyro, Congrains, Reynoso, Salazar Bondy, Blanca Varela.","Interpretar Los gallinazos sin plumas."],
   concepto:"La Generación del 50 retrata la Lima que crece por la migración del campo a la ciudad: barriadas, pobreza y personajes marginales. En narrativa domina el realismo urbano; en poesía, voces como Blanca Varela, de tono existencial.",
   explica:[
    "Contexto: gobierno de Manuel Odría (1948-1956), modernización urbana de Lima, migración andina masiva y aparición de barriadas. La ciudad deja de ser criolla y aristocrática.",
