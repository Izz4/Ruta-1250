<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16070b">
<script>
/* Tema: auto (según el sistema), claro u oscuro. Se guarda por dispositivo. */
(function(){var mq=window.matchMedia&&matchMedia("(prefers-color-scheme: light)");
  window.temaPref=function(){try{return localStorage.getItem("ruta1250-tema")||"auto"}catch(e){return "auto"}};
  window.aplicarTema=function(){var p=temaPref(), t=p==="auto"?(mq&&mq.matches?"claro":"oscuro"):p;
    document.documentElement.setAttribute("data-tema",t);
    var m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content",t==="claro"?"#f8f4ee":"#16070b")};
  window.fijarTema=function(p){try{localStorage.setItem("ruta1250-tema",p)}catch(e){} aplicarTema()};
  aplicarTema(); if(mq&&mq.addEventListener) mq.addEventListener("change",function(){if(temaPref()==="auto") aplicarTema()});
})();
</script>
<title>Ruta 1250</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;0,9..144,900;1,9..144,400&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Ruta Decana · noche: vino translúcido sobre fondo oscuro, círculos de color y trazos finos.
   Colores del escudo: vino #6E1423, oro #C0A92B, marfil #F8F4EE. Fraunces + Instrument Sans. */
:root{
  --wine:#6e1423; --wine-2:#8f1a2e; --wine-d:#4a0d17; --red:#c8243f; --gold:#c0a92b; --gold-d:#8c7a1c; --gold-l:#e3cb6b;
  --ivory:#f8f4ee; --blush:#fbe4e6;
  /* tokens del sistema (Fase 1): modo oscuro por defecto */
  --fg:248,244,238; --acc:227,203,107;
  --bg:#16070b; --surface:#211015; --surface-2:#2b151a; --surface-3:#36191f; --well:rgba(0,0,0,.22);
  --line:rgba(var(--fg),.12); --line-2:rgba(var(--fg),.22);
  --ink:#f8f4ee; --ink-2:#ead9db; --muted:#c9b3b6;
  --accent:#e3cb6b; --rose:#fbe4e6; --l3:#ff9aab; --on-gold:#1f1315;
  --ok:#167a5b; --ok-t:#5fd3a0; --ok-bg:rgba(22,122,91,.24); --bad:#c2410c; --bad-t:#f59a70; --bad-bg:rgba(194,65,12,.22);
  --serif:"Fraunces",Georgia,serif; --sans:"Instrument Sans","Segoe UI",Arial,sans-serif;
  --fs-xs:13px; --fs-sm:15px; --fs-md:17px; --fs-lg:20px; --fs-xl:26px; --fs-2xl:34px; --fs-read:18px;
  --r-s:8px; --r-m:14px; --r-full:999px;
  --sh:0 1px 2px rgba(0,0,0,.25),0 8px 24px -16px rgba(0,0,0,.6);
  --ease:cubic-bezier(.2,.8,.2,1); --t-fast:150ms; --t-med:240ms;
  color-scheme:dark;
}
/* modo claro: marfil, derivado de los mismos colores */
:root[data-tema="claro"] .fig{box-shadow:inset 0 0 0 1px var(--line)}
:root[data-tema="claro"]{
  --fg:42,13,19; --acc:140,122,28;
  --bg:#f8f4ee; --surface:#ffffff; --surface-2:#f0e8dd; --surface-3:#e8ddd0; --well:rgba(110,20,35,.05);
  --ink:#2a0d13; --ink-2:#4a2a30; --muted:#6b5458;
  --accent:#6f5f10; --rose:#8f1a2e; --l3:#b0213b;
  --ok-t:#167a5b; --ok-bg:rgba(22,122,91,.12); --bad-t:#b23a0a; --bad-bg:rgba(194,65,12,.1);
  --sh:0 1px 2px rgba(42,13,19,.06),0 8px 24px -14px rgba(42,13,19,.22);
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;padding-top:env(safe-area-inset-top);color:var(--ink);background:var(--bg);font-family:var(--sans);font-size:var(--fs-md);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.08;margin:0;text-wrap:balance}
h1{font-size:clamp(var(--fs-xl),4vw,var(--fs-2xl));letter-spacing:-.015em} h2{font-size:var(--fs-lg)} h3{font-size:var(--fs-md);font-family:var(--sans);font-weight:700}
p{margin:0}
a{color:var(--accent);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible,.fcard:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.muted{color:var(--muted)} .small{font-size:var(--fs-sm)}
.kicker{font-size:var(--fs-xs);color:var(--accent);font-weight:600}

/* ---------- fondo: círculos translúcidos + trazos ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;
  background:radial-gradient(90% 70% at 85% 0%,#2a0b13 0%,transparent 62%),var(--bg)}
:root[data-tema="claro"] .bg{background:radial-gradient(90% 70% at 85% 0%,#f3e3e1 0%,transparent 62%),var(--bg)}
/* círculos: quietos y tenues, solo en Inicio y en modo oscuro (Fase 1) */
.orb,.glow{display:none}
body.v-inicio .orb{display:block;opacity:.32}
:root[data-tema="claro"] body.v-inicio .orb{display:none}
.orb{position:absolute;border-radius:50%}
.o1{width:min(64vmax,880px);aspect-ratio:1;right:-14vmax;top:-8vmax;background:linear-gradient(155deg,rgba(200,36,63,.78),rgba(110,20,35,.55) 55%,rgba(74,13,23,.25))}
.o2{width:min(17vmax,220px);aspect-ratio:1;left:44%;top:5vh;background:linear-gradient(200deg,rgba(var(--acc),.9),rgba(192,169,43,.55) 45%,rgba(143,26,46,.5))}
.o3{width:min(40vmax,540px);aspect-ratio:1;right:6vw;bottom:-22vmax;background:linear-gradient(180deg,rgba(143,26,46,.7),rgba(58,13,24,.35))}
.o4{width:min(9vmax,120px);aspect-ratio:1;left:-3vmax;bottom:22vh;background:linear-gradient(45deg,rgba(200,36,63,.55),rgba(var(--acc),.45))}
.glow{position:absolute;width:60vmax;aspect-ratio:1;left:20%;top:30%;border-radius:50%;background:radial-gradient(circle,rgba(200,36,63,.16),transparent 60%)}
@keyframes drift1{to{transform:translate(-4vmax,5vmax) scale(1.06)}}
@keyframes drift2{to{transform:translate(3vmax,-4vmax) rotate(40deg)}}
@keyframes drift3{to{transform:translate(-5vmax,-3vmax) scale(.94)}}
@keyframes breathe{50%{opacity:.55;transform:scale(1.08)}}
.art{position:absolute;fill:none;stroke:var(--blush);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.5}
.art path,.art line,.art circle{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 3.2s var(--ease) .3s forwards}
.a-bulb{width:min(15vw,190px);right:12vw;top:12vh}
.a-book{width:min(22vw,290px);right:5vw;bottom:9vh;opacity:.38}
.a-dash{position:absolute;height:3px;border-radius:2px;background:var(--blush);opacity:.45}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}

/* ---------- esqueleto ---------- */
.side{display:none}
.main{min-width:0}
.shell{max-width:1100px;margin:0 auto;padding:0 16px 130px;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 2px 2px}
.topbar img{height:38px;width:auto}
.topbar .t{font-family:var(--serif);font-weight:800;font-size:var(--fs-lg);line-height:1;letter-spacing:.01em}
.topbar .s{font-size:var(--fs-xs);color:var(--accent)}
.chips{margin-left:auto;display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-full);padding:6px 12px;font-weight:700;font-variant-numeric:tabular-nums;font-size:var(--fs-sm);white-space:nowrap;background:var(--surface);border:1px solid var(--line)}
.chip svg{width:15px;height:15px}
.pagehead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-top:4px}
.pagehead .chips{display:none}
.grow{flex:1;min-width:0}
@media (min-width:900px){
  .side{display:flex;position:fixed;inset:16px auto 16px 16px;width:244px;border-radius:var(--r-m);flex-direction:column;gap:26px;padding:22px 14px;overflow:auto;z-index:4;
    background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh)}
  .side::before{content:"";position:absolute;left:0;top:28px;bottom:28px;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(180deg,var(--red),var(--gold))}
  .side .brand{display:flex;align-items:center;gap:12px;padding:0 8px;text-decoration:none;color:inherit}
  .side .brand img{height:46px;width:auto}
  .side .brand b{font-family:var(--serif);font-weight:800;font-size:var(--fs-lg);display:block;line-height:1}
  .side .brand span{font-size:var(--fs-xs);color:var(--accent)}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r-s);color:var(--ink-2);text-decoration:none;font-weight:600;font-size:var(--fs-md);transition:background .2s,transform .2s var(--ease)}
  .side nav a:hover{background:rgba(var(--fg),.06)}
  .side nav a.on{background:rgba(var(--fg),.09);color:var(--ink);box-shadow:inset 3px 0 0 var(--gold)}
  .side nav a svg{width:21px;height:21px;flex:none}
  .side nav .badge{margin-left:auto;background:var(--gold);color:var(--on-gold);border-radius:var(--r-full);padding:0 8px;font-size:var(--fs-xs)}
  .side .goal{margin-top:auto;background:var(--well);border:1px solid var(--line);border-radius:var(--r-m);padding:16px;display:flex;gap:12px;align-items:center}
  .side .goal b{font-family:var(--serif);font-size:var(--fs-xl);font-weight:800;display:block;line-height:1.1}
  .side .goal span{font-size:var(--fs-xs);color:var(--ink-2)}
  .main{margin-left:276px}
  .shell{padding:30px 36px 60px;gap:22px}
  .topbar{display:none}
  .pagehead .chips{display:flex}
  .tabs{display:none!important}
  .insession .main{margin-left:0}
}

/* ---------- superficies de vidrio ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sh)}
.card.wine{background:linear-gradient(150deg,#4c1220,#2c0b13);border-color:rgba(var(--acc),.22)}
:root[data-tema="claro"] .card.wine{background:linear-gradient(150deg,#fbecee,#f6e2e5);border-color:rgba(110,20,35,.16)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* botones: uno principal por pantalla (oro); el resto, secundarios */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--r-s);padding:12px 20px;font-weight:700;font-size:var(--fs-md);min-height:48px;text-decoration:none;
  background:var(--gold);color:var(--on-gold);box-shadow:0 1px 0 var(--gold-d),0 6px 18px -10px rgba(192,169,43,.7);transition:transform var(--t-fast) var(--ease),background var(--t-fast),box-shadow var(--t-fast)}
.btn:hover{background:#cdb53a}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.gold{background:var(--gold);color:var(--on-gold)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2);box-shadow:none}
.btn.ghost:hover{background:rgba(var(--fg),.06)}
.btn.wine{background:var(--wine);color:var(--ivory);box-shadow:none}
.btn.dash{background:transparent;color:var(--ink-2);border:1.5px dashed var(--line-2);box-shadow:none}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;filter:none}

/* ---------- inicio: portada ---------- */
.hero{position:relative;display:grid;grid-template-columns:14px minmax(0,1.1fr) minmax(0,1fr);border-radius:var(--r-m);overflow:hidden;border:1px solid var(--line);
  background:var(--surface);min-height:380px}
.hero .strip{background:linear-gradient(180deg,var(--red),var(--gold))}
.hero .photo{position:relative;overflow:hidden;min-height:300px}
.hero .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:45% 50%;filter:saturate(.7) contrast(1.05)}
.hero .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(110,20,35,.35),rgba(30,6,12,.92) 88%),linear-gradient(90deg,rgba(60,10,20,.55),transparent 70%)}
@keyframes kenburns{to{transform:scale(1.12) translate(-2%,-1%)}}
.mega{position:absolute;left:22px;bottom:18px;z-index:2;margin:0;font-family:var(--serif);font-weight:900;text-transform:uppercase;line-height:.84;letter-spacing:-.02em;color:var(--rose);
  font-size:clamp(4rem,11vw,7.4rem);font-variation-settings:"opsz" 144}
.mega span{display:block}
.mega .frame{position:absolute;left:4px;top:-46px;font-family:var(--sans);font-size:var(--fs-xs);font-weight:700;letter-spacing:.04em;text-transform:none;line-height:1.2;border:1.5px solid var(--rose);padding:6px 10px;color:var(--rose)}
.hero .info{padding:26px 26px 24px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.hello{font-family:var(--serif);font-size:var(--fs-lg);font-weight:600;line-height:1.15}
.score{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.score .num{font-family:var(--serif);font-weight:800;font-size:clamp(3.2rem,8vw,4.6rem);line-height:.9;font-variant-numeric:tabular-nums;color:var(--ink)}
.score .lbl{font-size:var(--fs-sm);color:var(--ink-2);padding-bottom:6px}
.track{position:relative;height:12px;background:rgba(var(--fg),.12);border-radius:var(--r-full)}
.track .fill{height:100%;border-radius:var(--r-full);background:linear-gradient(90deg,var(--red),var(--gold-l));animation:grow 1.2s var(--ease) both}
@keyframes grow{from{width:0}}
.track .mk{position:absolute;top:-6px;width:3px;height:24px;border-radius:2px;background:var(--ink)}
.track .mk.min{background:rgba(var(--fg),.45);width:2px}
.scale{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--muted);font-variant-numeric:tabular-nums}
.rule{width:64px;height:3px;border-radius:2px;background:var(--rose);opacity:.6}

/* plan de hoy */
.plan{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .rb{stroke:rgba(var(--fg),.1)}
.ring .rf{stroke:url(#gr);animation:ringin 1.4s var(--ease) both}
@keyframes ringin{from{stroke-dashoffset:339.3}}
.ring .rt{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.05}
.ring .rt b{font-family:var(--serif);font-size:var(--fs-2xl);font-weight:800;font-variant-numeric:tabular-nums}
.ring .rt>span{font-size:var(--fs-xs);color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.step{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-s);background:rgba(var(--fg),.05);border:1px solid var(--line)}
.step .ck{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-2);font-weight:700;font-size:var(--fs-xs);color:var(--muted)}
.step.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.step.now{border-color:rgba(var(--acc),.5);background:rgba(var(--acc),.08)}
.step.now .ck{border-color:var(--gold);background:var(--gold);color:var(--on-gold)}
.step b{display:block;font-weight:600;line-height:1.25}
.step small{color:var(--muted);font-size:var(--fs-xs)}
.step.done b{color:var(--ink-2)}
.step .go{margin-left:auto;flex:none;background:none;border:1px solid var(--line-2);border-radius:var(--r-s);padding:8px 14px;min-width:48px;min-height:44px;font-weight:600;font-size:var(--fs-sm)}
.step .go:hover{background:rgba(var(--fg),.08)}
@keyframes halo{0%{box-shadow:0 0 0 0 rgba(var(--acc),.5)}100%{box-shadow:0 0 0 12px rgba(var(--acc),0)}}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.tile{border-radius:var(--r-m);padding:16px;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);transition:transform .2s var(--ease),background .2s}
a.tile:hover{transform:translateY(-3px);background:rgba(var(--fg),.1)}
.tile b{font-family:var(--serif);font-size:var(--fs-2xl);font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.tile>span{font-size:var(--fs-sm);color:var(--muted);font-weight:500}

/* constancia */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;justify-content:start;overflow-x:auto;padding-bottom:2px}
.heat i{width:15px;height:15px;border-radius:4px;background:rgba(var(--fg),.07);display:block}
.heat i.h1{background:rgba(200,36,63,.45)} .heat i.h2{background:var(--red)} .heat i.h3{background:var(--gold-l)}
.heat i.today{outline:2px solid var(--ivory);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:var(--fs-xs);color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* barras por curso */
.crow{display:grid;grid-template-columns:minmax(0,1fr) minmax(90px,38%) 48px;gap:12px;align-items:center;font-size:var(--fs-sm)}
.crow .n small{color:var(--muted);font-size:var(--fs-xs)}
.bar{height:10px;border-radius:var(--r-full);background:rgba(var(--fg),.1);overflow:hidden;display:flex}
.bar i{display:block;height:100%;animation:grow 1s var(--ease) both}
.bar .low{background:var(--bad)} .bar .mid{background:var(--gold)} .bar .hi{background:var(--red)}
.bar .m3{background:var(--red)} .bar .m2{background:var(--gold)} .bar .m1{background:rgba(var(--acc),.4)}
.pct{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.group-label{font-size:var(--fs-xs);color:var(--accent);font-weight:600;margin-top:6px}

/* tarjetas: mazos */
.deckhero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:22px;align-items:center}
.bignum{font-family:var(--serif);font-weight:900;font-size:clamp(4rem,10vw,6rem);line-height:.85;color:var(--rose);font-variant-numeric:tabular-nums}
.boxes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;text-align:center;font-size:var(--fs-xs);color:var(--ink-2)}
.boxes b{display:grid;place-items:center;height:44px;border-radius:var(--r-s);font-size:var(--fs-md);color:var(--ink);background:rgba(var(--fg),.12);margin-bottom:4px;font-variant-numeric:tabular-nums}
.boxes .b0 b{background:var(--bad)} .boxes .b3 b{background:var(--gold);color:var(--on-gold)} .boxes .b4 b{background:var(--ivory);color:var(--wine)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;list-style:none;margin:0;padding:0;counter-reset:h}
.how li{counter-increment:h;display:flex;gap:10px;align-items:flex-start;font-size:var(--fs-sm);color:var(--ink-2)}
.how li::before{content:counter(h);flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:var(--fs-xs);background:rgba(var(--acc),.16);color:var(--accent)}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}
.deck{position:relative;text-align:left;border-radius:var(--r-m);padding:16px 16px 14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;
  transition:transform .25s var(--ease),background .2s,border-color .2s}
.deck::after{content:"";position:absolute;inset:6px -5px -5px 6px;border-radius:var(--r-m);border:1px solid var(--line);z-index:-1;transition:transform .25s var(--ease)}
.deck:hover:not([disabled]){transform:translateY(-4px) rotate(-.6deg);background:rgba(var(--fg),.1);border-color:var(--line-2)}
.deck:hover:not([disabled])::after{transform:translate(4px,4px) rotate(1.4deg)}
.deck b{font-weight:700;line-height:1.2}
.deck small{color:var(--muted)}
.deck .due{position:absolute;top:12px;right:12px;background:var(--gold);color:var(--on-gold);border-radius:var(--r-full);padding:0 8px;font-size:var(--fs-xs);font-weight:700}
.deck[disabled]{opacity:.45;cursor:not-allowed}

/* cursos y temas */
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:var(--fs-sm);padding:7px 14px 7px 9px;border-radius:var(--r-s);border:1px solid var(--line);background:rgba(var(--fg),.06);align-self:flex-start;transition:background .2s}
.back:hover{background:rgba(var(--fg),.12)} .back svg{width:18px;height:18px}
.crslist{display:flex;flex-direction:column;gap:10px}
.crs{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(130px,1fr) auto 20px;gap:18px;align-items:center;padding:15px 18px;border-radius:var(--r-m);text-decoration:none;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);transition:transform .25s var(--ease),background .2s,border-color .2s}
.crs:hover{transform:translateX(4px);background:rgba(var(--fg),.11);border-color:var(--line-2)}
.crs b{font-family:var(--serif);font-size:var(--fs-lg);font-weight:600;display:block;line-height:1.2}
.crs small{display:block;color:var(--muted);font-size:var(--fs-xs);margin-top:2px}
.crs .pc{font-family:var(--serif);font-weight:800;font-size:var(--fs-lg);min-width:58px;text-align:right;font-variant-numeric:tabular-nums}
.crs>svg{width:20px;height:20px;color:var(--muted)}
.lv{display:flex;flex-direction:column;gap:5px;min-width:0}
.lvl{font-size:var(--fs-xs);font-weight:700;color:var(--muted)}
.lvl.l1{color:rgba(var(--acc),.8)} .lvl.l2{color:var(--accent)} .lvl.l3{color:var(--l3)}
.bar .b1{background:rgba(var(--acc),.45)} .bar .b2{background:var(--gold)} .bar .b3{background:linear-gradient(90deg,var(--red),#ef5675)}
.tema{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(140px,1fr) auto;gap:18px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.tema:first-of-type{border-top:0}
.tema b{font-weight:600;line-height:1.25;display:block}
.tema .tg{font-size:var(--fs-xs);color:var(--rose);font-weight:600}
.freq{display:flex;align-items:center;gap:8px;font-size:var(--fs-xs);color:var(--muted);margin-top:5px;flex-wrap:wrap}
.dots{display:inline-flex;gap:4px}.dots i{width:9px;height:9px;border-radius:50%;background:rgba(var(--fg),.15)}.dots i.on{background:var(--gold-l);box-shadow:0 0 8px rgba(var(--acc),.5)}
.siempre{font-size:var(--fs-xs);font-weight:700;color:var(--on-gold);background:var(--gold-l);border-radius:var(--r-full);padding:1px 8px}
.tema-a{display:flex;gap:8px}
.btn.sm{min-height:44px;padding:8px 14px;font-size:var(--fs-sm);background:transparent;color:var(--ink);border:1px solid var(--line-2);box-shadow:none}
.btn.sm:hover{background:rgba(var(--fg),.06)}
.btn.sm.gold{background:var(--gold);color:var(--on-gold);border-color:transparent}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.hl{border-radius:var(--r-m);padding:13px 15px;background:var(--well);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.hl small{color:var(--muted);font-size:var(--fs-xs);font-weight:600} .hl b{font-weight:600;line-height:1.25}
.hl.up small{color:var(--ok-t)} .hl.down small{color:var(--bad-t)}
.csum{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
.csum .bignum{font-size:clamp(3.4rem,8vw,4.8rem)}
@media (max-width:700px){
  .tema{grid-template-columns:1fr;gap:10px}.tema-a .btn{flex:1}
  .crs{grid-template-columns:minmax(0,1fr) auto 18px;gap:6px 12px}.crs .lv{grid-column:1/-1;grid-row:2}
  .csum{grid-template-columns:1fr}
}
/* biblioteca: unidades */
.ulist{display:flex;flex-direction:column;gap:2px}
.un{display:grid;grid-template-columns:34px minmax(0,1fr) auto 18px;gap:14px;align-items:center;padding:12px 8px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;border-radius:var(--r-s);transition:background .2s}
.un:first-child{border-top:0}
.un:hover{background:rgba(var(--fg),.06)}
.un .nu{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:var(--fs-sm);border:1px solid var(--line-2);color:var(--ink-2);font-variant-numeric:tabular-nums}
.un.ok .nu{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.un.sig{background:rgba(192,169,43,.12);border:1px solid rgba(var(--acc),.4)}
.un b{font-weight:600;line-height:1.25}
.un small{display:block;color:var(--muted);font-size:var(--fs-xs);margin-top:2px;line-height:1.35}
.un>svg{width:18px;height:18px;color:var(--muted)}
.un .lvl{text-align:right}
.stars{color:var(--accent);font-size:var(--fs-xs);letter-spacing:1px;margin-left:6px;white-space:nowrap}
.sigue{display:inline-block;font-size:var(--fs-xs);font-weight:700;color:var(--on-gold);background:var(--gold-l);border-radius:var(--r-full);padding:1px 8px;margin-left:6px;vertical-align:2px}
.aviso{display:block;color:var(--bad-t);font-size:var(--fs-xs);margin-top:3px;font-weight:600}
.lecd{display:inline-block;font-size:var(--fs-xs);font-weight:700;color:var(--accent);margin-top:4px}
.subs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.subs span{font-size:var(--fs-xs);padding:5px 11px;border-radius:var(--r-full);background:var(--well);border:1px solid var(--line)}
.fuentes a{color:var(--accent);font-weight:600}
@media (max-width:700px){.un{grid-template-columns:30px minmax(0,1fr) 16px;gap:4px 10px;padding:12px 4px}.un .nu{width:30px;height:30px;grid-row:1/3}.un .lvl{grid-column:2;grid-row:2;text-align:left}.un>svg{grid-column:3;grid-row:1/3}}

/* ---------- sesión de preguntas ---------- */
.lesson-top{display:flex;align-items:center;gap:10px;padding-top:14px}
.x{background:rgba(var(--fg),.06);border:1px solid var(--line);color:var(--ink-2);min-width:44px;min-height:44px;display:grid;place-items:center;border-radius:var(--r-s)}
.x svg{width:22px;height:22px}
.prog{flex:1;height:12px;background:rgba(var(--fg),.1);border-radius:var(--r-full);overflow:hidden}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold-l));border-radius:var(--r-full);transition:width .45s var(--ease)}
.count{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:var(--fs-xs);font-weight:700;color:var(--rose);border:1.5px solid rgba(251,228,230,.55);border-radius:var(--r-full);padding:2px 11px}
details.ctx{background:rgba(var(--fg),.06);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 18px}
details.ctx summary{font-weight:600;cursor:pointer;font-family:var(--serif);font-size:var(--fs-md)}
details.ctx p{margin-top:10px;white-space:pre-line;max-width:68ch;color:var(--ink-2)}
.q{font-size:var(--fs-read);font-weight:500;white-space:pre-line;max-width:68ch}
.fig{margin:0;max-width:620px;background:#fff;border-radius:var(--r-s);padding:12px}
.fig img{display:block;width:100%;height:auto;max-height:62vh;object-fit:contain}
.fig.qimg,.fig.rimg{padding:10px 12px}.fig.qimg img,.fig.rimg img{max-height:none}
details.ctx .fig{margin-top:12px}
.opts{display:flex;flex-direction:column;gap:10px;max-width:760px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--line-2);border-radius:var(--r-m);padding:12px 14px;min-height:56px;transition:transform .12s var(--ease),background .2s,border-color .2s;}
.opt:hover:not([disabled]){background:rgba(var(--fg),.1);transform:translateX(3px)}
.opt:active:not([disabled]){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.opt .l{flex:none;width:32px;height:32px;border-radius:var(--r-s);border:1.5px solid var(--line-2);display:grid;place-items:center;font-weight:700;font-size:var(--fs-sm)}
.opt.sel{border-color:var(--gold);background:rgba(var(--acc),.1);font-weight:600} .opt.sel .l{background:var(--gold-l);color:var(--on-gold);border-color:var(--gold)}
.opt.ok{border-color:var(--ok-t);background:var(--ok-bg);font-weight:600;animation:okpulse .6s var(--ease)} .opt.ok .l{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad-t);background:var(--bad-bg);animation:shake .45s} .opt.bad .l{background:var(--bad);color:#fff;border-color:var(--bad)} .opt.bad .t{text-decoration:line-through}
.opt[disabled]{cursor:default}
@keyframes okpulse{40%{transform:scale(1.025);box-shadow:0 0 0 6px rgba(95,211,160,.18)}}
@keyframes shake{25%,75%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
.reloj{font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);padding:4px 10px;border-radius:var(--r-full);background:rgba(var(--acc),.12);white-space:nowrap}
.reloj.poco{color:var(--bad-t);background:var(--bad-bg)}
.codigo{width:100%;min-height:96px;resize:vertical;border-radius:var(--r-s);border:1px solid var(--line-2);background:var(--well);color:var(--ink);font:500 var(--fs-xs)/1.4 ui-monospace,monospace;padding:10px;word-break:break-all}
.diag-res .big{font-family:var(--serif);font-weight:800;font-size:clamp(3rem,12vw,4.6rem);line-height:1;font-variant-numeric:tabular-nums}
.diag-res .big small{font-size:var(--fs-lg);color:var(--muted);font-weight:600}
.estado{font-size:var(--fs-sm);color:var(--ok-t)}
.fb{border-radius:var(--r-m);padding:16px 18px;display:flex;flex-direction:column;gap:6px;max-width:760px;animation:pop .35s var(--ease)}
.fb.ok{background:var(--ok-bg);border:1.5px solid var(--ok-t)} .fb.bad{background:var(--bad-bg);border:1.5px solid var(--bad-t)}
.fb h3{color:var(--ok-t);font-family:var(--sans);font-weight:700;font-size:var(--fs-lg)} .fb.bad h3{color:var(--bad-t)}
.dock{position:sticky;bottom:0;padding:20px 0 14px;display:flex;gap:10px;max-width:760px;background:linear-gradient(transparent,var(--bg) 30%)}
.dock .btn{flex:1}
.dock .btn.dash,.dock .btn.ghost{flex:none}
.insession .shell{max-width:840px}

/* ---------- tarjetas (flashcards) ---------- */
.fstage{perspective:1600px;max-width:720px;width:100%;align-self:center}
.fcard{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:pointer;border-radius:var(--r-m);transition:transform .26s var(--ease),opacity .26s}
.fcard.flipped{cursor:grab}
.fcard.dragging{transition:none;cursor:grabbing}
.fcard.deal{animation:deal .5s var(--ease)}
@keyframes deal{from{opacity:0;transform:translateY(26px) rotate(-2.5deg) scale(.96)}}
.fcard.fly-r{transform:translateX(120%) rotate(14deg)!important;opacity:0}
.fcard.fly-l{transform:translateX(-120%) rotate(-14deg)!important;opacity:0}
.fcard.fly-d{transform:translateY(60px) scale(.92)!important;opacity:0}
.fin{display:grid;transform-style:preserve-3d;transition:transform .7s var(--ease)}
.fcard.flipped .fin{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r-m);padding:24px;display:flex;flex-direction:column;gap:14px;min-height:340px;border:1px solid var(--line-2);
  background:var(--surface);box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.face.back{transform:rotateY(180deg);background:var(--surface-2);border-color:rgba(var(--acc),.45)}
.face .corner{position:absolute;right:18px;top:16px;width:46px;height:46px;border-radius:50%;background:linear-gradient(200deg,rgba(var(--acc),.85),rgba(143,26,46,.5));opacity:.8}
.face .tapnote{margin-top:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:var(--fs-sm)}
.face .tapnote svg{width:18px;height:18px}
@keyframes tapb{50%{transform:translateY(-3px)}}
.hint{display:none;list-style:none;margin:0;padding:0;flex-direction:column;gap:6px}
.fcard.pista .hint{display:flex;animation:pop .3s var(--ease)}
.hint li{display:flex;gap:10px;font-size:var(--fs-sm);color:var(--ink-2)}
.hint li b{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:var(--fs-xs);border:1px solid var(--line-2)}
.ans{display:flex;gap:14px;align-items:flex-start;font-family:var(--serif);font-size:var(--fs-lg);font-weight:600;line-height:1.2}
.ans .l{flex:none;width:46px;height:46px;border-radius:var(--r-s);display:grid;place-items:center;background:var(--gold-l);color:var(--on-gold);font-family:var(--sans);font-weight:700;font-size:var(--fs-lg)}
.face .exp{color:var(--ink-2);max-width:62ch}
.face .qmini{font-size:var(--fs-sm);color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:auto;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.stamp{position:absolute;top:22px;padding:6px 14px;border-radius:var(--r-s);font-weight:800;font-size:var(--fs-md);border:2.5px solid;opacity:0;pointer-events:none;z-index:3;transition:opacity .1s}
.stamp.r{left:22px;color:var(--ok-t);transform:rotate(-10deg)} .stamp.l{right:22px;color:var(--bad-t);transform:rotate(10deg)}
.fcard[data-dir="r"] .stamp.r,.fcard[data-dir="l"] .stamp.l{opacity:1}
.fctl{max-width:720px;width:100%;align-self:center;display:flex;flex-direction:column;gap:10px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;animation:pop .35s var(--ease)}
.rate .btn{flex-direction:column;gap:0;line-height:1.2;padding:10px 8px;min-height:62px}
.rate .btn small{font-weight:500;font-size:var(--fs-xs);opacity:.85}
.rate .r0{background:linear-gradient(180deg,#d9531c,#9a3412);box-shadow:0 4px 0 #5c1f0a}
.rate .r2{background:linear-gradient(180deg,#1f9a72,#167a5b);box-shadow:0 4px 0 #0b4634}
.fnote{text-align:center;color:var(--muted);font-size:var(--fs-xs)}
kbd{font-family:var(--sans);font-size:var(--fs-xs);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:6px;padding:0 6px}

/* banco */
.pill{display:inline-block;font-size:var(--fs-xs);font-weight:700;border-radius:var(--r-full);padding:3px 10px;white-space:nowrap}
.pill.on{background:var(--ok-bg);color:var(--ok-t)} .pill.wait{background:rgba(var(--acc),.16);color:var(--accent)} .pill.off{background:var(--bad-bg);color:var(--bad-t)}
.erow{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.erow:first-child{border-top:0}
.erow b{font-family:var(--serif);font-weight:600;font-variant-numeric:tabular-nums}
code{font-size:.85em;background:rgba(var(--fg),.1);padding:1px 6px;border-radius:6px}

/* fin de sesión */
.fin-card{position:relative;margin-top:28px;text-align:center;align-items:center;max-width:560px;align-self:center;width:100%;overflow:hidden}
.fin-card img{height:92px;width:auto;border-radius:var(--r-m);padding:12px 14px;background:rgba(110,20,35,.6);animation:popin .7s var(--ease)}
@keyframes popin{0%{transform:scale(.4) rotate(-12deg);opacity:0}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}
.burst{position:absolute;left:50%;top:70px;width:0;height:0;pointer-events:none}
.burst i{position:absolute;width:9px;height:9px;border-radius:2px;background:var(--c);animation:fly 1.3s var(--ease) both;animation-delay:var(--d)}
@keyframes fly{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1);opacity:0}}

/* pestañas del celular */
.tabs{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));border-radius:var(--r-m);display:flex;padding:6px 4px;z-index:5;
  background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 28px -10px rgba(0,0,0,.45)}
.tabs a{flex:1;text-align:center;padding:6px 2px;text-decoration:none;color:var(--muted);font-weight:600;font-size:var(--fs-xs);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;border-radius:var(--r-s);transition:color .2s}
.tabs a svg{width:23px;height:23px;transition:transform .25s var(--ease)}
.tabs a.on{color:var(--ink);background:rgba(var(--fg),.08)}
.tabs a.on svg{transform:translateY(-2px);color:var(--accent)}
.tabs .dot{position:absolute;top:1px;left:calc(50% + 8px);background:var(--gold);color:var(--on-gold);border-radius:var(--r-full);font-size:var(--fs-xs);padding:0 5px;font-weight:700}

/* entradas (solo al cambiar de vista) */
@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
/* cambio de vista: fundido corto (240 ms), escalonado leve */
@keyframes rise2{from{transform:translateY(6px);opacity:0}}
.enter>*{animation:rise2 var(--t-med) var(--ease) both}
.enter>*:nth-child(2){animation-delay:30ms}.enter>*:nth-child(3){animation-delay:60ms}.enter>*:nth-child(n+4){animation-delay:90ms}
.enter .mega span{animation:rise .8s var(--ease) both}
.enter .mega span:nth-of-type(2){animation-delay:.12s}

@media (max-width:899px){
  .hero{grid-template-columns:10px minmax(0,1fr)}
  .hero .photo{grid-column:2;min-height:270px}
  .hero .info{grid-column:1/-1;padding:20px}
  .hero .strip{grid-row:1}
  .plan{grid-template-columns:1fr;justify-items:center}
  .plan .steps{width:100%}
  .deckhero{grid-template-columns:1fr}
  .a-bulb{right:auto;left:6vw;top:auto;bottom:16vh;width:80px;opacity:.3}
  .a-book{display:none}
  .o2{left:auto;right:-40px;top:62vh;opacity:.55}
  .mega .frame{font-size:var(--fs-xs);top:-40px;white-space:nowrap}
}
@media (max-width:420px){.rate .btn{font-size:var(--fs-sm)}}
@media (hover:none){.kb{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.art path,.art line,.art circle{stroke-dashoffset:0}}

/* textos largos (URL, palabras sin espacio) no se salen de la tarjeta */
.ctx p,.q,.opt .t,.exp,.fb p,.fb h3,.small,.muted{overflow-wrap:anywhere;word-break:normal}
/* durante una pregunta: sin dibujos de fondo detrás del texto y superficies opacas */
.art{display:none}
body.insession .orb{opacity:.28}
body.insession .opt{background:var(--surface)}
body.insession .opt.sel{background:linear-gradient(rgba(var(--acc),.14),rgba(var(--acc),.14)),var(--surface)}
body.insession .ctx{background:var(--surface)}
.fig img{max-width:100%;height:auto}
.ctx .fig{background:#fff;border-radius:var(--r-s);padding:6px}
.fin-card img{height:92px;width:92px;padding:0;background:none;border-radius:50%}

/* ---- pantalla de inicio ---- */
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:radial-gradient(110% 70% at 50% 38%,#4a1220 0%,#24090f 48%,#110407 100%);transition:opacity .6s ease,transform .6s ease;cursor:pointer}
#splash.fuera{opacity:0;transform:scale(1.035);pointer-events:none}
.sp-emb{width:min(36vw,150px);height:auto;overflow:visible;filter:drop-shadow(0 10px 40px rgba(var(--acc),.18))}
.sp-foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:45% 50%;opacity:.22;filter:saturate(.6)}
.sp-frame{position:absolute;top:calc(28px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font:700 13px/1.2 'Instrument Sans',system-ui,sans-serif;letter-spacing:.06em;color:#fbe4e6;border:1.5px solid rgba(251,228,230,.6);padding:6px 10px;white-space:nowrap}
.sp-emb,.sp-words,.sp-line,.sp-sub{position:relative}
.sp-ring{stroke-dasharray:326.8;stroke-dashoffset:326.8;animation:spDraw .9s cubic-bezier(.65,.05,.25,1) .1s forwards}
.sp-r,.sp-tail{stroke-dasharray:1;stroke-dashoffset:1}
.sp-r{animation:spDraw .6s cubic-bezier(.4,0,.2,1) .45s forwards}
.sp-tail{animation:spDraw .45s cubic-bezier(.4,0,.2,1) .95s forwards}
.sp-dot{transform-origin:95px 55px;transform:scale(0);animation:spPop .4s cubic-bezier(.3,1.7,.5,1) 1.35s forwards}
.sp-words{display:flex;flex-direction:column;align-items:center;gap:8px}
.sp-mask{overflow:hidden;line-height:0;padding:2px 0}
.sp-w{height:clamp(36px,11vw,58px);width:auto;transform:translateY(110%);animation:spUp .8s cubic-bezier(.2,.8,.2,1) forwards}
.sp-w1{animation-delay:.75s} .sp-w2{animation-delay:.9s}
